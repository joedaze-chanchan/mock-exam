<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>투운사 1회 카드퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow study column; one exam card per screen, sticky progress strip on top */
:root{
  --bg:#F2F3EC; --surface:#FFFFFF; --sunk:#E8EBDF; --ink:#1D2217; --muted:#5D6553; --line:#D6DACB;
  --accent:#4E6A28; --accent-ink:#FFFFFF; --accent-soft:#E3EAD3;
  --ok:#2C7A4B; --ok-bg:#E2F2E7; --bad:#B23E2C; --bad-bg:#F8E4E0; --warn:#8A5A00;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13160F; --surface:#1C2016; --sunk:#252A1E; --ink:#E7EADF; --muted:#A2A995; --line:#343B2B;
  --accent:#A3C267; --accent-ink:#13160F; --accent-soft:#2B3520;
  --ok:#6CC28E; --ok-bg:#1B3325; --bad:#F08B78; --bad-bg:#3A211C; --warn:#E3B45A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13160F; --surface:#1C2016; --sunk:#252A1E; --ink:#E7EADF; --muted:#A2A995; --line:#343B2B;
  --accent:#A3C267; --accent-ink:#13160F; --accent-soft:#2B3520;
  --ok:#6CC28E; --ok-bg:#1B3325; --bad:#F08B78; --bad-bg:#3A211C; --warn:#E3B45A; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:600;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.local i{background:var(--warn)} .sync.err i{background:var(--bad)}

/* start */
.hero{padding-block:40px 20px;display:grid;gap:10px}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.namebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.namebox input{flex:1 1 200px;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.chip b{font-weight:600}
.chip span{color:var(--muted);margin-left:6px;font-size:13px}
.sect{display:grid;gap:10px;margin-top:28px}
.sect h2{font-size:15px;font-weight:600;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.facts div{padding:12px 14px;display:grid;gap:2px}
.facts div+div{border-left:1px solid var(--line)}
.facts b{font-size:20px}
.facts small{font-size:12px;color:var(--muted)}

/* home */
.menu{display:grid;gap:8px}
.menu .btn{display:flex;justify-content:space-between;align-items:center;gap:12px}
.menu .btn small{font-weight:400;color:inherit;opacity:.8;font-size:13px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 .btn{text-align:center;padding:10px 8px;font-size:14px}
.row3 .btn small{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
.bar .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.track{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.meta .s{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:2px 8px;font-weight:600}
.qno{font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--accent)}
.qtext{font-size:17px;font-weight:600;line-height:1.55;margin:0}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--sunk);display:grid;gap:4px;font-size:15px}
.box p{margin:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{color:var(--bad)}
.mk{display:grid;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--sunk)}
.mk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mk-h b{font-size:15px}
.mk-h small{color:var(--muted);font-size:12px}
.mk-q{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-q button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 8px;font-size:14px;font-weight:600;line-height:1.35}
.mk-q button.on.know{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.mk-q button.on.dunno{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.orow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 9px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.k{background:var(--ok-bg);color:var(--ok)}
.seg button.on.u{background:var(--bad-bg);color:var(--bad)}
.tagline{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
.tag.k{background:var(--ok-bg);color:var(--ok)} .tag.u{background:var(--bad-bg);color:var(--bad)}
@media (max-width:420px){.orow{grid-template-columns:1fr}.seg{justify-self:end;margin-top:-4px}.seg button{padding:5px 10px}}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.exp{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px;font-size:15px}
.exp p{margin:0}
.exp .xh b{color:var(--accent);margin-right:4px}
.exp .xs{font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--muted);margin-top:8px}
.exp .xk{font-weight:600;display:flex;gap:8px;align-items:baseline;margin-top:4px}
.exp .xk span{font-family:var(--f-num);font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 6px;flex:none}
.exp .xb{padding-left:16px;position:relative}
.exp .xb::before{content:"·";position:absolute;left:4px;color:var(--muted);font-weight:700}
.exp .xb2{padding-left:32px;color:var(--muted);position:relative}
.exp .xb2::before{content:"–";position:absolute;left:18px}
.exp .xf{font-family:var(--f-num);font-size:14px;background:var(--sunk);border-radius:6px;padding:6px 10px;overflow-x:auto;white-space:pre-wrap}
.exp .xn{color:var(--muted);font-size:14px}
.exp .xc{color:var(--bad);font-size:14px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.nav .btn{flex:1;text-align:center}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

/* grid overlay */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:80%;overflow:auto;display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-num);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.off{opacity:.25}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* result & records */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-size:44px;font-family:var(--f-num);line-height:1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.n{background:var(--sunk);color:var(--muted)}
.subj{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.subj div{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 14px}
.subj div+div{border-top:1px solid var(--line)}
.subj small{color:var(--muted);display:block;font-size:12px}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wlist button{border:1px solid var(--bad);color:var(--bad);background:var(--bad-bg);border-radius:6px;font-family:var(--f-num);font-size:13px;padding:2px 8px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.person .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.person h3{font-size:18px}
.hist{display:grid;gap:4px;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
@media (max-width:420px){.qtext{font-size:16px}.card{padding:16px}.facts b{font-size:18px}}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <section id="v-start">
    <div class="hero">
      <div class="eyebrow">고시넷 최신기출유형 모의고사 · 1회</div>
      <h1>투자자산운용사 1회 카드퀴즈</h1>
      <p>100문항을 한 장씩 풀고, 고르는 즉시 채점과 해설을 봅니다. 푼 기록은 이름별로 따로 저장되어 중간에 나가도 이어서 풀 수 있습니다.</p>
    </div>
    <form id="f-name" class="namebox" autocomplete="off">
      <label for="in-name" class="eyebrow" style="flex-basis:100%">푸는 사람 이름</label>
      <input id="in-name" maxlength="20" placeholder="예: 윤지혜" required>
      <button class="btn primary" type="submit">시작하기</button>
    </form>
    <div class="sect">
      <h2>기록이 있는 사람</h2>
      <div class="chips" id="people"><span class="muted" style="font-size:14px">기록을 불러오는 중…</span></div>
    </div>
    <div class="sect">
      <h2>시험 구성</h2>
      <div class="facts">
        <div><small>1과목 · 금융상품 및 세제</small><b class="num">20</b><small>과락 8 미만</small></div>
        <div><small>2과목 · 투자운용·투자분석</small><b class="num">30</b><small>과락 12 미만</small></div>
        <div><small>3과목 · 직무윤리·법규 등</small><b class="num">50</b><small>과락 20 미만</small></div>
      </div>
      <p class="muted" style="margin:0;font-size:14px">합격 기준: 전체 60문항 이상 정답, 과목별 40% 이상.</p>
    </div>
    <div class="sect"><span class="sync" id="sync-start"><i></i><span>기록 불러오는 중</span></span></div>
  </section>

  <section id="v-home" hidden></section>
  <section id="v-quiz" hidden></section>
  <section id="v-result" hidden></section>
  <section id="v-records" hidden></section>
</div>
<div class="sheet" id="sheet" hidden></div>

<script>
const QS = [{"n":1,"s":"1과목","u":"세제관련 법규/세무전략","t":"36회 기출","q":"다음 중 세금 납부의무가 소멸되는 것이 아닌 것은?","x":"","o":["국세부과의 제척기간이 만료된 때","납부고지 혹은 독촉을 한 때","국세가 충당된 때","국세징수권의 소멸시효가 완성된 때"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 납부고지, 독촉 혹은 교부청구, 압류의 경우에는 이미 경과한 시효기간의 효력이 중단되는 것이며 납부의무가 소멸되는 것은 아니다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>납부의무의 소멸<\/p><p class=\"xb\">납부 혹은 충당(국세환급금을 납부할 국세 등과 상계시키는 것)되거나 부과가 취소된 때<\/p><p class=\"xb\">국세 부과의 제척기간이 끝난 때<\/p><p class=\"xb\">국세징수권의 소멸시효가 완성된 때<\/p><p class=\"xk\"><span>2<\/span>국세 부과 제척기간<\/p><div class=\"tw\"><table><tr><th>내용<\/th><th>일반조세<\/th><th>상속·증여세<\/th><\/tr><tr><td>사기 등 부정하게 국세를 포탈 또는 환급받는 경우<\/td><td>10년<\/td><td>15년<\/td><\/tr><tr><td>법정신고기한까지 과세표준 신고서를 제출하지 않은 경우<\/td><td>7년(역외거래의 경우 10년)<\/td><td>15년<\/td><\/tr><tr><td>역외거래가 수반된 부정행위<\/td><td>15년<\/td><td>15년<\/td><\/tr><tr><td>법정신고기한까지 상속, 증여세 과세표준신고서를 제출하였으나 허위, 누락신고한 경우<\/td><td>해당사항 없음.<\/td><td>15년<\/td><\/tr><tr><td>부정행위로 상속, 증여세를 포탈한 경우로서 상속인이 명의 이전 없이 재산가액 50억 원 초과분을 취득하는 경우<\/td><td>해당사항 없음.<\/td><td>안 날로부터 1년<\/td><\/tr><tr><td>기타<\/td><td>5년<\/td><td>10년<\/td><\/tr><\/table><\/div><p class=\"xk\"><span>3<\/span>국세징수권의 소멸시효<\/p><p class=\"xb\">국세징수권은 국가가 권리를 행사할 수 있는 때부터 5년(5억 원 이상의 국세채권은 10년)간 행사하지 않으면 소멸시효가 완성하고 납세의무도 소멸한다. 단, 납부고지, 독촉, 또는 교부청구, 압류의 경우에는 이미 경과한 시효기간의 효력이 중단된다.<\/p>"},{"n":2,"s":"1과목","u":"세제관련 법규/세무전략","t":"33회 기출","q":"다음은 A의 소득이다. 다음 소득 중에 종합과세신고 대상 소득은 얼마인가? (단, 모든 소득은 원천징수가 완료되었다고 가정한다)","x":"<div class=\"box\"><p>• 근로소득 2,100만 원<\/p><p>• 직장공제회 초과반환금 500만 원<\/p><p>• 비영업대금 이익 1,500만 원<\/p><p>• 채권의 이자와 할인액 2,500만 원<\/p><\/div>","o":["2,500만 원","4,100만 원","6,100만 원","6,600만 원"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 종합소득 과세대상 소득은 이자소득, 배당소득, 사업소득, 근로소득, 연금소득, 기타소득이다. 그러나 근로소득만 있는 경우 원천징수를 했다면 연말정산대상이다. 직장공제회 초과반환금은 분리과세한다. 따라서 A의 종합소득 과세대상 소득은 2,100만 원(근로소득)+1,500만 원(비영업대금 이익)+2,500만 원(채권의 이자와 할인액)=6,100만 원이다.<\/p>"},{"n":3,"s":"1과목","u":"세제관련 법규/세무전략","t":"37회 기출","q":"다음 중 국세기본법에 대한 설명으로 잘못된 것은?","x":"","o":["서류를 송달받을 자가 정보통신망을 이용한 서류송달을 신청하는 경우 전자송달이 가능하다.","송달장소가 분명하지 아니한 경우에는 서류의 주요 내용을 공고한 날부터 14일이 경과하면 서류가 송달된 것으로 본다.","세법에서 규정한 납부기한이 근로자의 날에 해당하면 그 전날을 납부기한으로 한다.","우편으로 서류를 제출하는 경우에는 통신날짜 도장이 찍힌 날에 신고된 것으로 본다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 납부기한이 근로자의 날에 해당하면 그 다음날을 납부기한으로 한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>세법의 기간 계산은 원칙적으로 민법의 일반 원칙을 따르나 기한에 대한 특례가 존재한다.<\/p><p>① 세법에서 정한 기한이 공휴일, 토요일, 근로자의 날이면 그 다음날을 기한으로 한다.<\/p><p>② 우편으로 서류를 제출하는 경우는 통신날짜 도장이 찍힌 날에 신고된 것으로 본다.<\/p><p>③ 국세정보통신망이 장애로 가동이 정지된 경우 그 장애가 복구되어 신고 혹은 납부할 수 있게 된 날의 다음날을 기한으로 한다.<\/p><p class=\"xk\"><span>2<\/span>서류의 송달<\/p><p>① 교부송달 : 당해 행정기관의 소속 공무원이 송달할 장소에서 송달받아야 할 자에게 서류를 교부하는 것<\/p><p>② 우편송달 : 서류의 송달을 우편으로 할 때에는 등기우편으로 해야 한다.<\/p><p>③ 전자송달 : 정보통신망을 이용한 송달은 서류의 송달을 받아야 할 자가 신청한 경우에 한한다.<\/p><p>④ 공시송달 : 아래의 경우에는 서류의 주요 내용을 공고한 날부터 14일이 경과하면 서류가 송달된 것으로 본다.<\/p><p class=\"xb\">송달 장소가 국외에 있고 송달이 곤란한 경우<\/p><p class=\"xb\">송달 장소가 분명하지 않은 경우<\/p><p class=\"xb\">등기송달 혹은 2회 이상 교부송달하였으나 수취인 부재로 확인되어 납부기한 내에 송달이 곤란한 경우<\/p>"},{"n":4,"s":"1과목","u":"세제관련 법규/세무전략","t":"32회 기출","q":"다음 중 제2차 납세의무자에 대한 설명으로 잘못된 것은?","x":"","o":["잔여재산을 분배받은자 혹은 청산인은 해산법인의 국세 등에 대해서 제2차 납세의무를 진다.","법인의 재산으로 국세를 충당하고도 부족한 금액은 납세의무 성립일 현재의 무한책임사원이 진다.","법인의 무한책임사원이 당사자의 재산으로 국세를 충당한 후에도 그 금액이 부족한 경우, 무한책임사원의 출자지분 매각이 어려울 경우에는 당해 법인이 제2차 납세의무를 진다.","양도, 양수한 사업과 관련하여 양도일 이전에 양도인의 납세의무가 확정된 사업에 대한 국세는 사업양도인이 제2차 납세의무를 진다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 양도, 양수한 사업과 관련하여 사업양수인이 제2차 납세의무를 가진다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>제2차 납세의무자<\/p><p>① 납세의무자의 재산을 처분하여 체납세액을 납부해도 그 금액에 미달하는 경우 이를 납부할 의무를 갖는 것을 제2차 납세의무라고 한다.<\/p><p class=\"xb\">청산인 등 : 청산인 또는 잔여재산을 분배받은 자는 그 해산법인의 국세 등에 대하여 제2차 납세의무를 진다.<\/p><p class=\"xb\">출자자 : 법인(증권시장에 주권이 상장된 법인 제외)의 재산으로 국세 등을 충당하고 부족한 금액은 납세의무 성립일 현재의 무한책임사원과 과점주주가 제2차 납세의무를 진다.<\/p><p class=\"xb\">법인 : 국세의 납부기간 만료일 현재 법인의 무한책임사원과 과점주주가 당사자의 재산으로 국세 등을 충당한 후에도 부족한 금액은 무한책임사원과 과점주주의 소유주식 또는 출자지분의 매각이 어려운 경우 당해 법인이 제2차 납세의무를 진다.<\/p><p class=\"xb\">사업양수인 : 양도·양수한 사업과 관련하여 양도일 이전에 양도인의 납세의무가 확정된 그 사업에 관한 국세 등은 사업양수인이 제2차 납세의무를 진다.<\/p><p class=\"xb\">과점주주 : 주주 또는 유한책임사원 1명과 그의 특수관계인 중에서 소유주식 합계 또는 출자액 합계가 해당 법인의 발행주식 총수 또는 출자총액의 100분의 50을 초과하면서 그 법인의 경영에 대하여 지배적인 영향력을 행사하는 자들을 의미한다.<\/p>"},{"n":5,"s":"1과목","u":"세제관련 법규/세무전략","t":"38회 기출","q":"다음 빈칸에 들어갈 내용으로 알맞은 것은?","x":"<div class=\"box\"><p>종합소득세에 합산되지 않는 소득 중에 기타소득금액은 (          ) 이내이다. 단 원칙적으로 분류과세되는 소득은 제외한다.<\/p><\/div>","o":["100만 원","300만 원","500만 원","2,000만 원"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 기타소득이 300만 원 이하인 경우 종합소득세 신고가 필요 없다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>소득세법상 소득의 종류<\/p><p class=\"xb\">종합소득 : 이자, 배당, 사업, 근로, 연금, 기타소득<\/p><p class=\"xb\">종합소득 외의 소득 : 양도소득, 퇴직소득<\/p><p class=\"xk\"><span>2<\/span>종합소득세 신고납부<\/p><div class=\"tw\"><table><tr><th>소득내역<\/th><th>종합소득세 신고납부 필요성<\/th><\/tr><tr><td>종합과세대상 금융소득 2,000만 원 초과<\/td><td>종합소득세 신고 및 납부<\/td><\/tr><tr><td>사업소득, 기타소득(300만 원 초과시)<\/td><td>금융소득 여부와 관계없이 종합소득세 신고 및 납부<\/td><\/tr><tr><td>기타소득(300만 원 이하)<\/td><td>기타소득만 300만 원 이하인 경우 종합소득세 신고 납부의무 없음.<\/td><\/tr><tr><td>근로소득만 있는 경우<\/td><td>종합과세대상 금융소득이 2,000만 원 이하인 경우 종합소득세 신고 납부의무가 없음.<\/td><\/tr><tr><td>다른 소득이 없는 경우<\/td><td>종합과세대상 금융소득이 2,000만 원 이하인 경우 종합소득세 신고 납부의무가 없음.<\/td><\/tr><\/table><\/div>"},{"n":6,"s":"1과목","u":"세제관련 법규/세무전략","t":"37회 기출","q":"증권거래세와 관련된 설명 중 옳지 않은 것은?","x":"","o":["뉴욕증권거래소에서 양도한 주권은 증권거래세가 부과되지 않는다.","비거주자인 외국인 투자자가 국내 증권시장을 통해 주식을 양도할 경우에는 증권거래세가 부과되지 않는다.","코넥스시장에서 거래되는 주권을 매매시에는 증권거래세를 납부해야 한다.","예탁결제원은 증권거래세를 징수한 후 다음 달 10일까지 납부한다."],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 비거주자가 한 거래라 할지라도 국내 증권시장을 통해 주식을 양도한 경우에는 증권거래세를 납부해야 한다. 예탁결제원은 증권거래세를 원천징수하여 다음 달 10일까지 납부한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>증권거래세 부과되지 않는 증권<\/p><p class=\"xb\">외국 증권시장에 상장된 주권의 양도(뉴욕증권거래소, 전미증권협회중개시장, 동경증권거래소, 런던증권거래소, 도이치증권거래소, 기타 자본시장법에 따른 외국거래소)<\/p><p class=\"xb\">자본시장법에 따라 채무인수한 거래소가 주권을 양도하는 경우<\/p><p class=\"xk\"><span>2<\/span>증권거래세 비과세 양도<\/p><p class=\"xb\">국가 또는 지방자치단체가 주권 등을 양도하는 경우(단, 국가재정법에 따른 기금이 주권을 양도하는 경우 및 우정사업 총괄기관이 주권을 양도하는 경우는 제외한다)<\/p><p class=\"xb\">자본시장법 제119조에 따라 주권을 매출하는 경우(발행매출)<\/p><p class=\"xb\">주권을 목적물로 하는 소비대차의 경우<\/p><p class=\"xk\"><span>3<\/span>증권거래세 납세의무자<\/p><p class=\"xf\">㉠ 장내 또는 금융투자협회를 통한 장외거래에서 양도되는 주권을 계좌간 대체로 매매결제하는 경우에는 해당 대체결제를 하는 회사(예탁결제원)<\/p><p class=\"xf\">㉡ ㉠을 제외한 경우 금융투자업자를 통하여 주권 등을 양도하는 경우에는 해당 금융투자업자<\/p><p class=\"xf\">㉢ ㉠, ㉡을 제외한 경우 주권 등을 양도하는 경우에는 당해 양도자. 만약 국내 사업장을 갖고 있지 않는 비거주자(외국법인포함)가 주권 등을 금융투자업자를 통하지 않고 양도하는 경우에는 당해 주권의 양수인<\/p>"},{"n":7,"s":"1과목","u":"세제관련 법규/세무전략","t":"35회 기출","q":"다음 중 양도세가 부과되지 않는 거래는 어느 것인가?","x":"","o":["비상장채권 매도로 소득이 발생하는 경우","등기된 부동산임차권 매도를 통해 소득이 발생하는 경우","비상장주식에 대한 대주주의 양도로 인한 소득","상장주식에 대한 대주주의 양도로 인한 소득"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 주식양도차익(주권상장법인 및 코스닥상장법인의 소액주주분)과 채권양도차익은 비열거소득으로 소득세가 과세되지 않는다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>양도소득세 과세대상 자산의 범위<\/p><p>① 토지와 건물<\/p><p>② 부동산에 관한 권리<\/p><p class=\"xb\">부동산을 취득할 수 있는 권리 : 아파트 당첨권, 토지상환채권, 주택상환채권 등<\/p><p class=\"xb\">지상권, 전세권과 등기된 부동산임차권<\/p><p>③ 주식 및 출자지분<\/p><p class=\"xb\">대주주 : 유가증권시장, 코스닥, 코넥스, 비상장법인 모두 과세됨.<\/p><p class=\"xb\">그 외 주주<\/p><p class=\"xb2\">유가증권시장, 코스닥, 코넥스 시장 내 : 양도세 과세 되지 않음.<\/p><p class=\"xb2\">비상장법인주식 : 원칙적으로 과세되나 금융투자협회가 행하는 장외매매거래(K-OTC)에 의하여 양도하는 중소기업 및 중견기업 주식, 다자간매매체결회사를 통해서 양도하는 벤처기업 주식에 대해서는 양도소득세 과세하지 않음.<\/p><p>④ 기타자산<\/p><p class=\"xb\">특정시설물 이용권<\/p><p class=\"xb\">영업권(사업용 고정자산과 함께 양도하는 영업권)<\/p><p class=\"xb\">특정주식(A) : 과점주주가 소유하는 부동산 과다보유 법인 주식<\/p><p class=\"xb\">특정주식(B) : 특수업종을 영위하는 부동산 과다보유 법인의 주식(골프장, 스키장 등)<\/p><p>⑤ 파생상품 : 파생결합증권, 파생상품 중 주가지수 관련 파생상품, 해외시장에서 거래되는 장내파생상품, 주가지수 관련 장외파생상품, 주식 관련 차액결제거래 등<\/p>"},{"n":8,"s":"1과목","u":"금융상품","t":"33회 기출","q":"다음 중 금융투자상품에 대한 설명으로 올바른 것은?","x":"","o":["스톡옵션은 금융투자상품으로 분류한다.","금융투자상품 중 증권은 원본을 초과하여 손실 발생 가능성이 있다.","ELS(주가연계증권)은 파생결합증권으로 분류한다.","ELW는 매수만 하기 때문에 기초자산가격이 상승해야만 수익이 발생한다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 스톡옵션은 금융투자상품이 아니며 금융투자상품의 최대 손실은 원본금액이며, 이를 초과할 경우 파생상품으로 분류된다. ELW는 콜과 풋이 존재하기 때문에 양방향 투자가 가능하여, 기초자산 가격이 하락하더라도 수익이 발생할 수 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>금융투자상품<\/p><p class=\"xb\">개념 : 이익을 얻거나 손실을 회피할 목적으로 현재 또는 장래의 특정 시점에 금전, 그 밖의 재산적 가치가 있는 것을 지급하기로 약정함으로써 취득하는 권리로, 그 권리를 취득하기 위하여 지급하였거나 지급해야 할 금전 등의 총액(판매수수료 등은 제외함)이 그 권리로부터 회수하였거나 회수할 수 있는 금전 등의 총액(해지수수료 등은 포함함)을 초과하게 될 위험이 있는 상품<\/p><p class=\"xb\">종류 : 증권, 파생상품으로 구분되며, 증권의 최대손실금액이 투자한 원본이며, 투자한 원본보다 손실액이 클 경우에는 파생상품으로 분류한다.<\/p><p class=\"xb\">증권의 종류 : 채무증권, 지분증권, 수익증권, 투자계약증권, 파생결합증권, 증권예탁증권이 있다.<\/p>"},{"n":9,"s":"1과목","u":"금융상품","t":"32회 기출","q":"다음 빈칸에 공통으로 들어갈 용어로 가장 적절한 것은?","x":"<div class=\"box\"><p>(          )는 기준 가격 산정이 적정한지를 확인해야 하며, 이를 확인할 때 투자신탁의 집합투자업자 또는 투자회사 등이 산정한 기준가격과 (          )가 산정한 기준가격의 편차가 1,000분의 3 이내인 경우에는 적정하게 산정된 것으로 본다.<\/p><\/div>","o":["신탁업자","집합투자기구평가회사","채권평가회사","일반사무관리회사"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 신탁업자의 업무이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>집합투자기구 관계회사<\/p><p>① 신탁업자 : 집합투자재산을 선량한 관리자의 주의로써 보관·관리하며 투자자의 이익을 보호하며, 신탁업자의 업무제한은 다음과 같다.<\/p><p class=\"xb\">해당 집합투자기구 또는 그 집합투자재산을 운용하는 집합투자업자의 계열회사여서는 안된다.<\/p><p class=\"xb\">집합투자재산을 자신의 고유재산, 다른 집합투자재산 또는 제3자로부터 보관을 위탁받은 재산과 구분하여 관리해야 한다.<\/p><p class=\"xb\">집합투자재산 중 증권, 원화표시 양도성예금증서, 어음, 그 밖에 증권과 유사하고 집중 예탁과 계좌간 대체에 적합한 것으로서 예탁결제원이 따로 정하는 것을 자신의 고유재산과 구분하여 집합투자기구별로 예탁결제원에 예탁해야 한다.<\/p><p class=\"xb\">집합투자재산을 운용하는 집합투자업자가 자산의 취득·처분 등의 운용지시를 하는 경우 이를 각각의 집합투자기구별로 이행해야 한다.<\/p><p>② 일반사무관리회사 : 투자회사의 위탁을 받아 투자회사 주식의 발행 및 명의개서, 투자회사재산의 계산, 법령 또는 정관에 의한 통지 및 공고, 이사회 및 주주총회의 소집, 개최, 의사록 작성 등에 관한 업무<\/p><p>③ 집합투자기구 평가회사 : 집합투자기구를 평가하고 이를 투자자에게 제공하는 업무를 영위하는 자<\/p><p>④ 채권평가회사 : 집합투자기구에 속하는 채권 등 자산의 가격을 평가하고 이를 집합투자기구에게 제공하는 업무를 영위하는 자<\/p>"},{"n":10,"s":"1과목","u":"금융상품","t":"35회 기출","q":"자산유동화증권을 발행할 경우 내부 신용보강에 해당하지 않는 것은?","x":"","o":["지불의 우선순위를 달리하는 후순위증권 발행","수익률 차이에 따른 초과 스프레드","예치금","보증"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 외부기관이 보증하는 신용보강은 외부 신용보강방법 중의 하나이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>자산유동화증권 신용보강 방법<\/p><p>① 내부 신용보강 : 자산의 현금흐름 조정을 통한 신용보강 방법<\/p><p class=\"xb\">후순위증권 발행 : 지불의 우선순위를 달리함.<\/p><p class=\"xb\">초과 스프레드 : 자산의 수익률과 발행증권의 수익률 차이<\/p><p class=\"xb\">예치금 : 유동화기업이 현금을 보유함.<\/p><p>② 외부 신용보강 : 외부의 신용보강기관에 의한 신용보강 방법<\/p><p class=\"xb\">보증 및 신용공여 : 신용도 높은 외부기관이 보증 혹은 신용보강을 하여 상환 가능성을 제고시키는 방법<\/p>"},{"n":11,"s":"1과목","u":"금융상품","t":"32회 기출","q":"다음 중 피보험자가 사망할 때까지 보장하는 보험은 어느 것인가?","x":"","o":["종신보험","생존보험","양로보험","정기보험"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 종신보험에 대한 설명이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>보험사고에 따른 생명보험 분류<\/p><p>① 사망보험 : 피보험자가 사망 또는 제1급 장해시 약정한 보험금이 지급되는 보험<\/p><p class=\"xb\">사망보험을 보장하는 기간에 따라 정기보험과 종신보험으로 구분됨.<\/p><p class=\"xb\">정기보험 : 1년, 5년, 10년, 20년 등 일정한 기간 동안 보장함.<\/p><p class=\"xb\">종신보험 : 피보험자가 사망할 때까지 종신토록 보장함.<\/p><p>② 생존보험 : 피보험자가 일정 기간 생존시 보험금을 지급하는 보험으로 일정 기간 도달 전 사망 시에는 사망자의 몫은 모두 생존자의 몫으로 귀속되기 때문에 사망자에게는 아무런 보장이 없다. 즉, 생존자는 사망자가 불입한 보험료 지분을 획득하게 된다.<\/p><p>③ 양로보험(생사혼합보험) : 피보험자가 일정 기간 도달 전 사망하거나 중도 또는 만기 생존시 보험금이 지급되는 보험으로 정기보험과 생존보험이 결합된 것이다.<\/p>"},{"n":12,"s":"1과목","u":"금융상품","t":"31회 기출","q":"ELW에 대한 설명으로 올바른 것은?","x":"<div class=\"box\"><p>㉠ 개별기업의 주가 혹은 주가지수를 기초자산으로 한다.<\/p><p>㉡ 기본 거래단위는 10단위이며 단주거래는 불가능하다.<\/p><p>㉢ 가격제한폭이 존재하지 않는다.<\/p><\/div>","o":["㉠, ㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> ㉠~㉢ 모두 올바른 설명이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>주식워런트증권(ELW) : 특정 대상물을 사전에 정한 미래의 시기에 미리 정한 가격으로 살 수 있거나 팔 수 있는 권리가 부여된 증권<\/p><p>① 콜 워런트 : 기초자산을 행사가격으로 구입할 수 있는 권리<\/p><p>② 풋 워런트 : 기초자산을 행사가격으로 매도할 수 있는 권리<\/p><p class=\"xk\"><span>2<\/span>ELW와 주식의 비교<\/p><div class=\"tw\"><table><tr><th>구분<\/th><th>주식<\/th><th>ELW<\/th><\/tr><tr><td>법적 형태<\/td><td>증권(지분증권)<\/td><td>증권(파생결합증권)<\/td><\/tr><tr><td>거래단위<\/td><td>1주<\/td><td>10주(단주거래 불가능)<\/td><\/tr><tr><td>가격제한폭<\/td><td>30% 상한과 하한<\/td><td>가격제한폭 없음.<\/td><\/tr><tr><td>호가주문<\/td><td>시장가/조건부지정가/지정호가<\/td><td>지정가호가주문만 허용함.<\/td><\/tr><tr><td>신용거래<\/td><td>가능<\/td><td>현금거래만 가능<\/td><\/tr><tr><td>만기여부<\/td><td>만기 없음.<\/td><td>만기 있음.<\/td><\/tr><tr><td>권리행사<\/td><td>해당 사항 없음.<\/td><td>만기일에 행사가치가 있으면 자동 권리 행사됨.<\/td><\/tr><\/table><\/div><p class=\"xk\"><span>3<\/span>ELW 발행조건<\/p><p>① 기초자산 : 코스피 200 구성종목 중 거래소가 분기별로 발표하는 50종목, 코스닥 150 구성종목 중 거래소가 월별로 공표하는 5종목, 코스피 200 주가지수, 코스닥 150 주가지수, 니케이 225, 항셍지수<\/p><p>② 권리행사방식 : 유럽형(만기에만 권리행사 가능)<\/p><p>③ 만기평가가격<\/p><p class=\"xb\">주식 : 최종 거래일을 포함한 직전 5거래일 종가의 산술평균가격<\/p><p class=\"xb\">주가지수 : 최종 거래일의 주가지수 종가<\/p>"},{"n":13,"s":"1과목","u":"금융상품","t":"31회 기출","q":"다음 중 개인형 퇴직연금제도(IRP)에 대한 설명으로 올바르지 않은 것은?","x":"","o":["확정기여형은 기업이 부담할 부담금 수준이 사전에 확정되어 있는 제도이다.","확정급여형은 IRP를 통해 추가납입이 연간 1,800만 원 한도에서 가능하다.","확정기여형은 IRP를 통해 추가납입이 불가능하다.","상시근로자가 10인 미만을 사용하는 특례 사업장에서 근로자대표 동의를 얻어 가입자의 개인퇴직계좌를 설정하는 기업형 IRP도 있다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 확정기여형도 IRP를 통해 연간 1,800만 원 한도에서 추가납입이 가능하다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>개인형 퇴직연금제도(IRP)<\/p><p class=\"xb\">근로자가 이직시 퇴직연금제도에서 수령한 퇴직급여 등에 대해서 과세를 유예받으면서 계속 적립, 운용한 후 은퇴시 노후자금으로 활용할 수 있는 제도<\/p><p class=\"xb\">상시근로자 10인 미만을 사용하는 특례 사업장에서 근로자대표 동의를 얻어 가입자의 개인퇴직계좌를 설정하는 기업형 IRP도 있음.<\/p>"},{"n":14,"s":"1과목","u":"금융상품","t":"34회 기출","q":"다음 중 금융위원회가 정하는 MMF 운용기준으로 틀린 것은?","x":"","o":["신용등급이 상위 2개 등급인 채권 매매","일반사무관리회사가 인정하는 상위 2개 등급 채권 매매","신용평가회사가 인정하는 상위 2개 등급 채권 매매","집합투자기구위원회가 인정하는 상위 2개 등급 채권 매매"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 일반사무관리회사는 MMF 운용에 해당하는 채권의 등급을 평가할 수 없으므로 일반사무관리회사가 인정하는 상위 2개 등급의 채무증권은 MMF 운용기준이 아니다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>금융위원회가 정하는 MMF 운용규정<\/p><p class=\"xb\">자산의 원리금 또는 거래 금액이 환율, 증권의 가치 혹은 증권지수의 변동에 따라 변동하거나 계약 시점에 미리 정한 특정한 신용사건 발생에 따라 확대 또는 축소되도록 설계된 것이나, 원리금 또는 거래금액, 만기 또는 거래기간 등이 확정되지 않은 것에 자산을 운용하면 안 됨.<\/p><p class=\"xb\">채무증권에는 취득시점을 기준으로 신용평가업자의 신용등급이 최상위등급 혹은 최상위등급의 차하위등급 이내이어야 하며, 둘 이상의 신용평가업자로부터 신용평가등급을 받은 경우에는 그 중에서 낮은 신용평가등급을 적용함.<\/p><p class=\"xb\">최상위등급 채무증권은 각 집합투자기구 자산총액의 100분의 5, 차하위등급 채무증권은 각 집합투자기구의 자산총액의 100분의 2의 한도를 초과하여 동일인이 발행한 채무증권에 운용해서는 안 된다. 그러나 국채증권, 정부가 원리금의 상환을 보증한 채무증권, 지방채증권, 특수채증권은 예외로 함.<\/p>"},{"n":15,"s":"1과목","u":"금융상품","t":"34회 기출","q":"다음 중 퇴직연금에 대한 설명으로 올바르지 않은 것은?","x":"","o":["확정급여형(DB)은 사용자부담금 계산시 연금계리방식에 따라 계산한다.","확정급여형(DB)은 사용자가 적립금을 운용하고 그 운용손익은 기업에 귀속된다.","확정기여형(DC)은 근로자가 적립금을 운용하고 그 운용손익은 근로자에게 귀속된다.","확정기여형(DC)은 근로자가 수령할 퇴직금 수준이 사전에 확정되어 있다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 확정급여형은 근로자가 수령할 퇴직금 수준이 확정되어 있으며, 확정기여형은 기업이 부담할 부담금 수준이 사전에 확정되어 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>확정급여형과 확정기여형의 비교<\/p><div class=\"tw\"><table><tr><th>구분<\/th><th>확정급여형(DB형)<\/th><th>확정기여형(DC형)<\/th><\/tr><tr><td>개요<\/td><td>근로자가 수령할 퇴직금 수준이 사전에 확정되어 있는 제도<\/td><td>기업이 부담할 부담금 수준이 사전에 확정되어 있는 제도<\/td><\/tr><tr><td>적립금 운용주체<\/td><td>사용자(퇴직연금 운용과 관련한 모든 수익과 손실이 사용자에게 귀속됨)<\/td><td>근로자(퇴직연금 운용과 관련한 모든 수익과 손실이 근로자에게 귀속됨)<\/td><\/tr><tr><td>추가납입 여부<\/td><td>개인형 IRP를 통해 가능<\/td><td>제도 내에서 혹은 개인형 IRP를 통해서 가능<\/td><\/tr><tr><td>연금계리<\/td><td>필요<\/td><td>불필요<\/td><\/tr><tr><td>비고<\/td><td>임금상승률이 높은 기업에 유리, 장기근속을 유도할 수 있음, 경영이 안정적이고 영속적인 기업에 유리<\/td><td>재무구조 변동이 큰 기업, 근로자들이 재테크 관심이 높은 기업<\/td><\/tr><\/table><\/div>"},{"n":16,"s":"1과목","u":"부동산관련 상품","t":"32회 기출","q":"부동산 개발할 때 자연경관과 도시를 고려하여 체계적인 개발, 정비, 보전이 필요한 지역은?","x":"","o":["도시지역","관리지역","농림지역","자연환경보전지역"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 도시지역은 인구와 산업이 밀집되어 있거나 밀집이 예상되어 해당 지역에 대해서 체계적인 개발, 정비, 관리, 보전 등이 필요한 지역이다.<\/p>"},{"n":17,"s":"1과목","u":"부동산관련 상품","t":"32회 기출","q":"다음 중 부동산투자회사에 대한 설명으로 올바른 것은?","x":"","o":["부동산투자회사는 금융위원회의 인가를 받아 설립한다.","자기관리부동산 투자회사는 직원을 채용할 수 없다.","부동산투자회사에는 자기관리 부동산투자회사, 위탁관리 부동산투자회사, 기업구조조정 부동산투자회사만 있다.","부동산투자회사를 설립할 때 원칙적으로 현금출자와 현물출자 모두 가능하다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 자기관리 부동산투자회사, 위탁관리 부동산투자회사, 기업구조조정 부동산투자회사만이 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>부동산펀드와 부동산투자회사(REITs)<\/p><div class=\"tw\"><table><tr><th>구분<\/th><th>부동산펀드(투자신탁)<\/th><th>부동산투자회사(REITs)<\/th><\/tr><tr><td>근거법<\/td><td>자본시장법<\/td><td>부동산투자회사법<\/td><\/tr><tr><td>설립<\/td><td>금융감독원 등록<\/td><td>국토교통부 영업인가(발기설립)<\/td><\/tr><tr><td>법적성격<\/td><td>법인격 없음.<\/td><td>주식회사<\/td><\/tr><tr><td>최소자본금<\/td><td>제한 없음.<\/td><td>50억(자기관리형 : 70억 원)<\/td><\/tr><tr><td>자산운용<\/td><td>부동산 등에 50% 이상 투자<\/td><td>부동산에 70% 이상 투자<\/td><\/tr><tr><td>자금차입<\/td><td>순자산의 2배 이내(원칙)<\/td><td>자기자본의 2배 이내(원칙), 주총 특별결의 시 10배까지 가능<\/td><\/tr><tr><td>자금대여<\/td><td>순자산의 100% 이내<\/td><td>금지<\/td><\/tr><\/table><\/div><p class=\"xk\"><span>2<\/span>부동산투자회사의 종류<\/p><p class=\"xb\">설립방법 : 발기설립으로 하며, 현물출자에 의한 설립은 할 수 없다.<\/p><div class=\"tw\"><table><tr><th>부동산투자회사 종류<\/th><th>내용<\/th><\/tr><tr><td>자기관리 부동산투자회사<\/td><td>자산운용 전문인력을 포함한 상근하는 임직원이 있으며, 자산의 투자, 운용을 직접 수행함.<\/td><\/tr><tr><td>위탁관리 부동산투자회사<\/td><td>자산의 투자, 운용을 자산관리회사에 위탁함.<\/td><\/tr><tr><td>기업구조조정 부동산투자회사<\/td><td>법에서 정하는 기업구조조정 부동산을 투자대상으로 하며, 자산의 투자, 운용을 자산관리회사에 위탁함.<\/td><\/tr><\/table><\/div><p class=\"xb\">영업인가 혹은 등록일로부터 6개월(최저자본금 준비기간)이 지난 부동산투자회사의 자본금은 자기관리 부동산투자회사는 70억 원, 위탁관리 부동산투자회사 및 기업구조조정 부동산투자회사는 50억 원 이상이 되어야 한다. 그러나 설립시 자본금은 자기관리부동산 투자회사 5억 원 이상, 위탁관리 부동산투자회사 및 기업구조조정 부동산투자회사의 경우는 3억 원 이상이어야 한다.<\/p>"},{"n":18,"s":"1과목","u":"부동산관련 상품","t":"35회 기출","q":"미래의 현금흐름의 현재가치를 고려하여 NPV를 이용하여 부동산가치를 평가하는 방법은 무엇인가?","x":"","o":["원가법","수익성지수법","현금흐름법","비교평가법"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 현금흐름을 추정하고 이에 대한 적절한 할인율을 계산하여 순현재가치(NPV)를 계산하여 부동산가치를 평가하는 방법은 현금흐름법이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>부동산의 평가에 있어 투자타당성분석과 가치평가방법이 있다.<\/p><p class=\"xk\"><span>2<\/span>투자타당성분석<\/p><p>① 간편법 : 투자의사결정을 위해 첫 단계에서 개략적으로 투자안을 판단하는 방법<\/p><p class=\"xb\">순소득승수 : 총투자액/순운용소득으로 자본회수기간의 의미이다. 이 기간이 짧을수록 투자의 타당성이 높아진다.<\/p><p class=\"xb\">투자이율 : 투자이율=순운용소득/총투자액<\/p><p class=\"xb\">자기자본수익률=납세 전 현금흐름/자기자본투자액<\/p><p>② 현금흐름할인법<\/p><p class=\"xb\">순현재가치 : 현금유입의 현재가치에서 현금유출의 현재가치를 차감한 값으로, NPV≥0이면 투자안을 채택하고, NPV&lt;0이면 투자안을 기각한다. 여러 투자안이 있을 경우 NPV≥0인 대안 중에 가장 큰 대안부터 순차적으로 투자한다.<\/p><p class=\"xb\">내부수익률 : 투자안의 현금유입의 현재가치와 현금유출의 현재가치를 일치시키는 할인율이다. 내부수익률(IRR)≥k(요구수익률)이면 투자를 실행하고, IRR&lt;k이면 투자를 기각한다. 여러 투자안이 있을 경우 IRR≥k인 투자안 중에 IRR이 가장 높은 투자안부터 실행한다.<\/p><p class=\"xb\">수익성지수 : 투자로부터 얻게 되는 미래의 현금흐름의 현재가치를 최초의 부동산투자액으로 나누어서 계산한 값이다. 수익성지수(PI)≥1이면 투자를 실행하고, PI&lt;1이면 투자를 기각한다. 여러 투자안이 있을 경우 PI≥1인 투자안 중에 가장 높은 투자안부터 실행한다. 그러나 투자안의 규모가 다를 경우 수익성지수는 적절한 투자안 결정기준이 될 수 없다.<\/p><p class=\"xk\"><span>3<\/span>부동산 가치평가방식<\/p><div class=\"tw\"><table><tr><th>가치평가방식<\/th><th>내용<\/th><\/tr><tr><td>원가방식<\/td><td>원가법 및 적산법 등 비용성의 원리에 의한 평가방식<\/td><\/tr><tr><td>비교방식<\/td><td>거래사례비교법, 임대사례비교법 등 시장성에 기초한 평가방식 및 공시지가기준법<\/td><\/tr><tr><td>수익방식<\/td><td>수익환원법 및 수익분석법 등의 수익성의 원리에 기초한 평가방식<\/td><\/tr><\/table><\/div><p>① 비교방식(거래사례비교법) : 평가하려는 대상 부동산과 동일성 혹은 유사성이 있는 부동산의 거래 사례와 비교하여 대상 부동산의 현황에 맞게 사정보정, 시점수정 등을 하여 부동산의 가격을 산정하는 방법<\/p><p class=\"xb\">거래사례 자료의 선택시 고려사항 : 위치의 유사성, 물적 유사성, 시점수정의 가능성, 사정보정의 가능성을 고려하여 거래사례를 선택해야 한다.<\/p><p>② 원가방식(원가법) : 대상 물건의 재조달원가에 감가수정을 하여 대상 물건의 가액을 산정하는 방식으로 주로 건물 감정평가에 사용된다.<\/p><p class=\"xb\">적산가격=토지가치+건물가치(재조달원가-감가수정액)<\/p><p class=\"xb\">재조달원가 : 현재 시점의 평가대상 부동산과 동일한 효용을 갖는 부동산을 새로 공급하는데 소요되는 원가<\/p><p>③ 수익방식(수익환원법) : 대상 물건이 미래 산출할 것으로 기대되는 순수익이나 미래의 현금흐름을 현재가치로 할인하여 대상 물건의 가액을 산정하는 방법<\/p><p class=\"xb\">수익가격=순수익/환원이율=(총수익-총비용)/환원이율<\/p><p>④ 순영업소득(NOI)의 환원방법 : 1년간 순영업소득과 자본환원율만으로 수익형 부동산의 가치를 신속하게 계산할 수 있어 실무적으로 자주 이용됨.<\/p><p class=\"xb\">수익가격=순영업소득/자본환원율<\/p>"},{"n":19,"s":"1과목","u":"부동산관련 상품","t":"32회 기출","q":"다음 중 부동산투자와 관련한 위험에 대한 설명으로 틀린 것은?","x":"","o":["자산간의 상관계수값이 0이면 분산투자효과는 없다.","투자위험은 체계적 위험과 비체계적 위험으로 구성되어 있다.","포트폴리오에 투자대상부동산의 숫자를 지속적으로 증가시키면 비체계적 위험은 0으로 수렴한다.","부동산은 주식 혹은 채권과 같이 투자할 때 포트폴리오의 전체적인 위험을 감소시키는 효과가 있다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 자산간의 상관계수값이 1이면 분산투자효과가 없으며, 자산간의 상관계수값이 1만 아니라면 분산투자효과가 있다. 자산간의 상관계수값이 가질 수 있는 범위는 +1에서 -1 사이의 값이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>포트폴리오의 수익률과 위험<\/p><p>① 포트폴리오 : 서로 다른 두 개 이상의 자산의 집합<\/p><p>② 두 부동산으로 구성된 포트폴리오 수익률과 위험<\/p><p class=\"xf\">Rp = w1·R1 + w2·R2<\/p><p class=\"xf\">분산(σp²) = w1²σ1² + w2²σ2² + 2·w1·w2·σ12   (σ12 = σ1·σ2·ρ12)<\/p><p>③ 상관계수(ρ12)값은 -1에서 1 사이의 값을 가지며, 이 값이 -1에 가까울수록 분산투자효과가 증가한다. 상관계수값이 1이면 분산투자효과는 발생하지 않는다.<\/p><p class=\"xn\">[그림] 구성 자산의 수(n)가 늘어날수록 총위험이 줄어들어 체계적 위험 수준에 수렴 — 총위험 = 체계적 위험 + 비체계적 위험<\/p><p>④ 포트폴리오에 포함되는 자산의 수가 증가할수록 포트폴리오 총위험 중 비체계적 위험은 감소하나, 체계적 위험은 감소하지 않는다.<\/p><p class=\"xb\">체계적 위험 : 분산투자를 통해서도 제거할 수 없는 위험으로 시장 전체의 변동으로 인해 발생하는 위험이고, 이는 피할 수 없는 위험, 분산불가능한 위험이라고도 한다.<\/p><p class=\"xb\">비체계적 위험 : 분산투자를 통해서 제거할 수 있는 위험으로 부동산의 고유한 특성에 의해 발생하는 위험으로 이는 분산가능위험, 피할 수 있는 위험이라고도 한다.<\/p>"},{"n":20,"s":"1과목","u":"부동산관련 상품","t":"33회 기출","q":"다음 부동산 용어 중 틀린 것은?","x":"","o":["용적률은 대지면적에 건축물의 지상층과 지하층의 연면적에 대한 비율이다.","건폐율은 대지면적에 대한 건축면적의 비율이다.","신축은 건축물이 없는 대지에 새로이 건축물을 축조하는 것이다.","재축은 건축물이 천재지변 기타 재해에 의하여 건축물의 전부 또는 일부가 멸실된 경우에 그 대지 안에 종전과 동일한 규모의 범위 안에서 다시 축조하는 것이다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 용적률은 대지면적에 건축물의 지상층의 연면적에 대한 비율이다. 즉 지하층은 용적률 계산에 포함되지 않는다.<\/p>"},{"n":21,"s":"2과목","u":"대안투자운용/투자전략","t":"33회 기출","q":"글로벌 매크로 펀드에 대한 설명으로 잘못된 것은?","x":"","o":["레버리지, 공매도, 파생상품 등 다양한 투자수단을 사용한다.","시장분석은 Bottom-up 방식을 사용하여 불균형된 경제가 균형으로 회귀한다고 가정한다.","채권, 국채, 원자재 등에 대한 투자를 선호한다.","방향성 투자전략 중의 하나이다."],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 글로벌 매크로 전략은 Top-down 방식을 사용하여 투자한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>글로벌 매크로 전략<\/p><p class=\"xb\">거시경제 분석을 바탕으로 특정 국가나 시장에 제한되지 않고 전세계를 대상으로 자본을 운용하는 전략으로 헤지펀드 투자전략(공매도, 레버리지, 파생상품 등 사용) 중 가장 광범위한 자산에 다양한 투자수단을 사용하여 제약없이 투자한다.<\/p><p class=\"xb\">투자결정시 경제상황에 대한 분석방법으로 전형적인 Top-down 방식을 사용한다.<\/p><p class=\"xb\">거시경제측면에서 불균형 상태를 찾고 이러한 불균형이 균형으로 회귀한다는 가정하에 관련된 금융변수를 찾아 방향성을 갖고 투자하는 전략이다.<\/p><p class=\"xb\">유동성이 풍부한 외환, 국채, 원자재 등에 대한 투자를 선호한다.<\/p>"},{"n":22,"s":"2과목","u":"대안투자운용/투자전략","t":"32회 기출","q":"다음 중 원래의 자산의 수익률과 유동화 증권의 수익률 간의 차이에서 발생하는 차익을 취할 목적으로 발행되는 CDO는 어느 것인가?","x":"","o":["Synthetic CDO","Arbitrage CDO","Cash Flow CDO","Balance Sheet CDO"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> Arbitrage CDO에 대한 설명이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>CDO 구분<\/p><div class=\"tw\"><table><tr><th>이름<\/th><th>내용<\/th><\/tr><tr><td>Arbitrage CDO<\/td><td>• 기초자산의 수익률과 유동화증권의 수익률 간의 차이에서 발생하는 차익을 취할 목적으로 발행되는 CDO<br>• SPC는 신용도가 높은 선순위 CDO 트랜치를 발행함으로써 낮은 이자비용을 발생시키고, 기초자산으로부터 얻는 높은 수익과의 차익을 남긴다.<\/td><\/tr><tr><td>Balance Sheet CDO<\/td><td>• 위험전가 목적으로 거래하고, 거래를 통해 대차대조표에서 신용위험 자산이 감소하여 재무비율이 개선되는 효과를 가지고 있음.<br>• CDO를 통한 위험 전가의 결과로 자산보유자는 위험관리, 감독규정상의 최저 요구자본 요건 충족 및 대출여력 확충 등과 같은 효과를 얻을 수 있음.<\/td><\/tr><tr><td>Cash Flow CDO<\/td><td>자산을 양도하여 SPV를 구성하며, SPV에서 발행한 트랜치에 매각 대금으로 자본 조달<\/td><\/tr><tr><td>Synthetic CDO<\/td><td>CDS를 활용하여 위험 전가<\/td><\/tr><\/table><\/div>"},{"n":23,"s":"2과목","u":"대안투자운용/투자전략","t":"32회 기출","q":"다음 중 부동산 개발사업의 위험관리 방안으로 잘못된 것은?","x":"","o":["지주수가 많은 토지는 개별적으로 토지매입을 통해 토지 매입대금 상승위험을 줄일 수 있다.","분양수입금의 관리위험은 에스크로우 계좌를 통해 관리하여 분양수입금 관리 위험을 줄일 수 있다.","시공사의 책임준공과 신용도가 양호한 시공사를 선정하여 시공위험을 줄일 수 있다.","사업부지에 대한 채권확보를 통해 사업부지 안정성 위험을 줄일 수 있다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 지주수가 많은 토지는 일괄 계약 및 동시자금 집행을 통해 토지 매입대금 상승위험을 축소한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>부동산 개발사업 관련 주요 위험 및 관리방안<\/p><div class=\"tw\"><table><tr><th>위험<\/th><th>주요 위험요인<\/th><th>위험관리방안<\/th><\/tr><tr><td>토지확보 위험<\/td><td>지주수가 많은 토지<\/td><td>사업부지 전체 지주와 일괄 계약 및 동시자금 집행을 통해 토지 매입대금 상승위험 축소<\/td><\/tr><tr><td>사업위험<\/td><td>사업부지 안정성 확보<br>분양수입금 관리<\/td><td>사업부지에 대한 채권확보<br>분양수입금의 에스크로우 계좌를 통한 관리<\/td><\/tr><tr><td>인허가 위험<\/td><td>금융기관이 파악하고 통제하기 어려운 위험<\/td><td>시공사에게 인허가 위험을 부담<br>일정 기간까지 인허가 미승인시 시공사 채무 인수 등 트리거 조건 설정<\/td><\/tr><tr><td>시공위험<\/td><td>시공사의 책임준공<\/td><td>신용도 양호한 시공사 선정<\/td><\/tr><tr><td>분양성 검토<\/td><td>프로젝트 금융 의뢰 시 사업성 검토자료 제출 의무화<\/td><td>분양 저조시 대처방안 강구 등<\/td><\/tr><\/table><\/div>"},{"n":24,"s":"2과목","u":"대안투자운용/투자전략","t":"35회 기출","q":"다음 중 PEF에 대한 설명으로 잘못된 것은?","x":"","o":["무한책임사원과 유한책임사원간의 파트너십 관계를 통해 PEF가 형성된다.","법으로 정한 연고자, 전문가 외에는 50인 이상의 일반투자자에 대하여 사모펀드의 청약을 권유하는 행위는 금지된다.","PEF의 등기, 등록사항에서 유한책임사원의 내역은 제외된다.","PEF의 투자자는 최대 49인까지이어야 한다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> PEF의 사원 총수는 100인 이하이어야 하기 때문에 최대 100인까지 PEF의 투자자가 될 수 있으며, 100인 이하의 투자자로부터 PEF의 자금모집을 허용하고 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>PEF 설립요건<\/p><p class=\"xb\">신문, 잡지, 방송 등을 통한 광고를 금지하며, 100인 이하의 투자자로부터 자금을 모집해야 한다.<\/p><p class=\"xb\">법으로 정한 연고자, 전문가 외에는 50인 이상의 일반투자자에 대하여 사모펀드의 청약을 권유하는 행위는 금지된다.<\/p><p class=\"xk\"><span>2<\/span>PEF 정관에 포함될 사항<\/p><p>목적, 상호, 회사의 소재지, 각 사원의 출자의 목적과 가격 또는 평가의 기준, 사원의 성명, 주민등록번호 및 주소, 무한책임사원 및 유한책임사원의 구분, 정관의 작성연월일<\/p><p class=\"xk\"><span>3<\/span>PEF 등기사항<\/p><p>목적, 상호, 회사의 소재지, 무한책임사원의 상호 또는 명칭, 회사의 해산 사유를 정한 경우 그 내용<\/p><p class=\"xk\"><span>4<\/span>금융위원회 등록사항<\/p><p>등기사항과 함께 업무집행사원에 관한 사항, PEF 운용에 관한 사항, 종합금융투자사업자로부터 전담중개업무를 제공받는 경우 서비스를 제공하는 종합금융투자사업자에 대한 사항<\/p><p class=\"xk\"><span>5<\/span>기타 : 등기·등록사항에서 유한책임사원의 내역을 제외하고 있음.<\/p>"},{"n":25,"s":"2과목","u":"대안투자운용/투자전략","t":"36회 기출","q":"다음 중 헤지펀드의 방향성 투자전략으로 모두 묶인 것은 어느 것인가?","x":"<div class=\"box\"><p>㉠ 주식의 롱숏전략          ㉡ 이머징마켓 헤지펀드<\/p><p>㉢ 선물거래          ㉣ 차익거래전략<\/p><\/div>","o":["㉠, ㉡","㉠, ㉡, ㉢","㉠, ㉡, ㉣","㉡, ㉢, ㉣"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 차익거래전략은 방향성 전략이 아니다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>헤지펀드 운용전략<\/p><p class=\"xb\">차익거래전략 : 공매도와 차입을 일반적으로 사용하며, 시장의 비효율성을 이용하여 가격 불일치에 기초한 차익거래기회를 통해서 수익을 추구하고, 시장 전체에 대한 노출을 회피함으로써 시장 변동성에 중립화하는 투자전략이다. 대표적으로 전환사채 차익거래전략, 채권차익거래전략, 주식시장중립형 전략 등이 있다.<\/p><p class=\"xb\">Event Driven 전략 : 위험을 적극적으로 취하고, 상황에 따라 공매도와 차입을 사용한다. 이 전략은 기업의 합병, 사업개편, 청산 및 파산 등 기업상황에 영향이 큰 사건을 예측하고 이에 따라 발생하는 가격 변동을 이용하여 수익을 창출하는 전략이다. 대표적으로 부실채권투자전략, 위험차익, 합병 차익거래가 있다.<\/p><p class=\"xb\">방향성전략 : 위험을 적극적으로 취하고 상황에 따라 차입과 공매도를 사용한다. 특정 주가 또는 시장의 방향성에 근거하는 전략으로 시장 위험을 헤지한 종목 선택으로 수익을 극대화하기보다 증권이나 시장의 방향성에 따라서 매매 기회를 포착하는 기법이다. 대표적으로 주식의 롱숏, 글로벌 매크로, 이머징마켓 헤지펀드, 선물거래 등이 있다.<\/p><p class=\"xb\">펀드 오브 헤지펀드 전략 : 자금을 여러 개의 헤지펀드에 배분하여 투자하는 전략으로 분산투자 효과를 높인다. 그러나 여러 펀드에 투자하기 때문에 수수료가 이중으로 부과되는 단점이 있다.<\/p>"},{"n":26,"s":"2과목","u":"해외증권투자운용/투자전략","t":"35회 기출","q":"다음 중 국제주가지수에 대한 설명으로 올바르지 않은 것은?","x":"","o":["한국은 MSCI World Index에 포함되어 있다.","FTSE 100은 런던거래소에 상장된 주요한 100개의 종목으로 구성되어 있다.","MSCI 신흥국지수는 환율의 변동에 따라 지수의 변동이 가능하다.","MSCI지수는 유동주식방식을 채택하여 주가지수를 산출하고 있다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> MSCI지수는 MSCI World Index(선진국시장)와 MSCI EM(Emerging Market Index)로 구분되어 있고 우리나라는 MSCI EM지수에 포함되어 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>MSCI지수<\/p><p class=\"xb\">주로 미국계 투자자들이 벤치마크로 많이 사용함.<\/p><p class=\"xb\">시가총액 방식이 아닌 유동주식 방식으로 계산된다. 즉 시장에서 유통되지 않는 주식은 제외하여 지수를 계산한다.<\/p><div class=\"tw\"><table><tr><th>선진시장(MSCI World Index)<\/th><th>신흥시장(MSCI EM)<\/th><\/tr><tr><td>23개국<\/td><td>24개국 (한국포함)<\/td><\/tr><\/table><\/div><p class=\"xb\">한국시장은 신흥시장에 속해 있으며 주가등락과 환율변동에 따라 국가별 편입비중도 매일 바뀐다. 주가가 상승하더라도 원화가치가 하락하면 지수는 하락할 수 있다. 달러로 환산한 주가지수로 이해할 수 있다.<\/p><p class=\"xb\">외국인 투자자의 매매를 제한하는 경우 지수에 반영비율이 줄어든다.<\/p><p class=\"xb\">MSCI지수에 특정 국가의 비중이 높아지면 그 만큼 외국인 투자가 확대될 가능성이 커진다.<\/p><p class=\"xb\">한국지수는 MSCI지수를 제외하고 주요 지수에는 선진지수로 편입되어 있다.<\/p><p class=\"xk\"><span>2<\/span>FTSE지수<\/p><p class=\"xb\">주로 유럽계 투자자의 벤치마크 역할을 한다.<\/p><p class=\"xb\">전세계 49개 국가를 선진국시장, 준선진국시장, 신흥시장으로 분류하고 있다.<\/p><p class=\"xb\">FTSE 100 : 런던증권거래소에 상장된 100개의 우량주식으로 구성된 지수<\/p>"},{"n":27,"s":"2과목","u":"해외증권투자운용/투자전략","t":"37회 기출","q":"다음 중 국제분산투자와 관련한 설명 중 가장 올바른 것으로 묶인 것은?","x":"<div class=\"box\"><p>㉠ 국제분산투자를 할 경우, 국내분산투자로 낮출 수 없는 체계적 위험을 낮출 수 있다.<\/p><p>㉡ 국가 간 상관계수가 높으면 국제분산투자효과는 낮아진다.<\/p><p>㉢ 국제시장간의 동조화로 인해 국제분산투자효과가 증가한다.<\/p><\/div>","o":["㉠, ㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 국제분산투자를 할 경우 효율적 투자선이 확대된다. 즉 동일한 위험하에 기대수익률을 높일 수 있고, 동일한 기대수익률이면 예상되는 위험을 줄일 수 있다. 또한 국내에서 제거하지 못하는 체계적 위험을 낮출 수 있다. 예를들어 한국은행의 기준금리변동은 국내 투자자에게는 체계적 위험으로 이해될 수 있으나 국제투자자에게는 한국에서만 발생된 현상으로 비체계적 위험으로 인식될 수 있다. 국가간의 자산수익률의 상관관계가 높으면 국제분산투자효과는 낮아진다. 국제시장간의 동조화는 전세계 시장이 하나의 단일화된 시장으로 향하는 것을 의미하며, 이는 곧 국가간의 자산의 수익률의 상관관계가 높아지는 것을 의미한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>국제분산투자<\/p><p class=\"xn\">[그림] 주식수(1~50개)에 따른 위험(%) — 총위험이 주식수가 늘수록 낮아지며, 국제분산투자 시의 국제체계적 위험이 국내체계적 위험보다 낮은 수준에 수렴<\/p><p class=\"xb\">국가간 자산의 수익률의 상관관계가 낮을수록 국제분산투자효과는 증가한다.<\/p><p class=\"xb\">국제분산투자로 인해 국내에서 투자했을 경우 부담하는 체계적 위험보다 더 낮은 체계적 위험을 부담한다.<\/p><p class=\"xb\">국제분산투자는 효율적 투자선을 좌상향으로 확대시켜 투자자의 기대효용을 높여준다.<\/p><p class=\"xb\">정보통신의 발달, 국가간 투자에 대한 장벽 제거 등으로 인해 국가간 동조화가 더 많이 진행되고 있어 국제분산투자효과를 약화시킬 수 있다.<\/p>"},{"n":28,"s":"2과목","u":"해외증권투자운용/투자전략","t":"35회 기출","q":"다음 중 미국국채에 투자할 경우 고려대상으로 가장 적절하지 않은 것은?","x":"","o":["Yield curve 분석","미국연방준비기금의 금리정책","미국의 실업률, GDP성장률","무위험채권에 가산할 가산금리 수준"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 미국국채가 무위험채권으로 취급되기 때문에 미국국채에 가산된 가산금리 수준은 미국국채 투자시 고려대상으로 적절하지 않다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>미국국채 투자시 유의사항<\/p><p class=\"xb\">Yield curve 분석, 수요와 공급, 달러움직임, 안전자산선호도, 미국 연준의 금리정책, 물가, 실업률, GDP 등 경제상황 분석을 고려해야 한다.<\/p>"},{"n":29,"s":"2과목","u":"해외증권투자운용/투자전략","t":"36회 기출","q":"다음 중 유로채에 대한 설명으로 올바르지 않은 것은?","x":"","o":["유로채는 무기명식으로 발행되며 대체로 이자는 1년에 한 번만 지급한다.","유로채발행시장의 자율규제기구는 AIBD이다.","딤섬본드는 홍콩에서 위안화 외의 통화로 발행되는 채권으로 유로채이다.","판다본드는 중국 본토에서 위안화로 외국인에 의해 발행되는 채권이다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 딤섬본드는 홍콩에서 위안화로 외국인에 의해 발행되는 유로채이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>유로채<\/p><p class=\"xb\">발행국가에서 발행국외의 통화로 발행한 채권을 말한다. 현실에서는 유로본드(유로채)발행국은 증권발행과 관련된 감독이나 규제가 없는 역외 금융시장이기 때문에 발행국의 규제대신 관련 업자들간의 자율적 규제가 있다. 이를 규제하는 자율규제기관으로 AIBD(Association of International Bond Dealer)가 있다.<\/p><p class=\"xb\">딤섬본드 : 홍콩에서 외국기업이 발행하는 위안화 표시 채권이다. 대체로 신용등급이 높은 회사채가 발행되며, 만기가 2~3년 정도의 단기채가 많아서 매매차익보다는 만기보유 전략이 선호된다. 딤섬본드는 액면이자율이 낮아 대부분의 수익이 환차익에서 발생되기 때문에 위안화 가치의 방향성이 중요하다.<\/p><p class=\"xb\">쇼군본드(일본에서 발행하는 유로채), 김치본드(한국에서 발행하는 유로채)등이 있다.<\/p><p class=\"xk\"><span>2<\/span>외국채<\/p><p class=\"xb\">발행국에서 발행국의 통화로 외국기업이 발행하는 채권이며, 발행국의 규제에 맞춰 발행해야 한다.<\/p><p class=\"xb\">판다본드 : 중국 본토에서 외국기업이 위안화로 발행하는 채권이다.<\/p><p class=\"xb\">대표적인 외국채는 양키본드(미국), 사무라이본드(일본), 아리랑본드(한국), 불독본드(영국) 등이 있다.<\/p>"},{"n":30,"s":"2과목","u":"해외증권투자운용/투자전략","t":"37회 기출","q":"다음 중 국제투자시 환위험 헤지방법에 대한 설명으로 올바르지 않은 것은?","x":"","o":["여러 통화에 분산투자한다.","롤링헤지는 서로 다른 여러 통화자산을 보유하고 있다가 동시에 매도하는 것이다.","헤지를 하지 않는 것도 환위험을 헤지하는 방법 중의 하나이다.","선물환을 이용하여 현물과 반대포지션을 취하여 헤지를 할 수 있다."],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 롤링헤지는 만기가 다른 선물환 계약을 반복적으로 갱신하여 환위험을 관리하는 방법이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>환위험 헤지전략<\/p><p>① 파생상품을 이용한 헤지 : 선물환, 통화선물, 통화옵션 등의 수단을 이용할 수 있다.<\/p><p class=\"xb\">주요 통화 이외에는 파생상품시장의 유동성이 적다.<\/p><p class=\"xb\">투자하고자 하는 현물자산을 기초자산으로 하는 파생상품에 투자할 수 있다.<\/p><p>② 롤링헤지 : 만기가 짧은 경우 만기를 연장해 가며 지속적으로 헤지를 하는 방법<\/p><p>③ 통화구성의 분산 : 다양한 통화에 투자하여 통화위험을 줄이는 방법<\/p><p>④ 기타 방법<\/p><p class=\"xb\">외국 주식시장과 개별 주식들에 대해 미 달러화의 가치 변화에 대한 민감도를 분석하고 미 달러화 가치 변동에 따라 매입과 매도를 실행하여 내재적 헤지를 할 수 있다. 내재적 헤지는 미 달러화의 하락기에는 불리하다(미국 투자자 관점).<\/p><p class=\"xb\">환위험을 헤지하지 않는 것도 하나의 방법이다. 환율의 변동위험을 수익의 원천으로 보고 이를 적극적으로 투자에 이용하기도 한다.<\/p>"},{"n":31,"s":"2과목","u":"투자분석기법","t":"37회 기출","q":"다음 중 결합레버리지도가 가장 큰 것은 어느 것인가? (단, 기업의 규모, 이익은 동일하다고 가정한다)","x":"","o":["영업고정비 200, 재무고정비 100","영업고정비 150, 재무고정비 150","영업고정비 300, 재무고정비 50","영업고정비 200, 재무고정비 200"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 총고정비가 가장 클 때 결합레버리지도가 가장 큰 값을 갖는다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>결합레버리지 : 매출액 변화율에 대한 1주당 순이익의 변화율<\/p><p class=\"xk\"><span>2<\/span>결합레버리지도(DCL)=영업레버리지도(DOL)×재무레버리지도(DFL)<\/p><p class=\"xk\"><span>3<\/span>고정영업비, 이자비용이 존재하지 않으면 결합레버리지도는 1이다.<\/p><p class=\"xk\"><span>4<\/span>영업고정비도 높고 타인자본의존도도 높다면 결합레버리지도 높다.<\/p>"},{"n":32,"s":"2과목","u":"투자분석기법","t":"37회 기출","q":"다음 중 현금흐름표의 영업활동현금흐름에 가산되지 않는 항목은 어느 것인가?","x":"","o":["감가상각비","전기 대비 매입채무증가금액","전기 대비 매출채권증가금액","재고자산평가손실"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 매출채권이 전기 대비 증가한 것은 자산이 증가한 것이므로 현금의 유출이므로 영업활동현금흐름에서 차감해야 한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>현금흐름 변동에 영향을 주는 항목<\/p><div class=\"tw\"><table><tr><th>항목<\/th><th>현금흐름 차감항목<\/th><th>현금흐름 가산항목<\/th><\/tr><tr><td>영업활동 현금흐름<\/td><td>• 비현금 수익 : 재고자산 평가이익<br>• 운전자산의 증가 : 매출채권 증가, 재고자산 증가, 매입채무 감소<br>• 당기순손실<\/td><td>• 비현금 비용 : 감가상각비, 재고자산평가손실, 대손상각비<br>• 운전자산 감소 : 매출채권 감소, 재고자산 감소, 매입채무 증가<br>• 당기순이익<\/td><\/tr><tr><td>투자활동 현금흐름<\/td><td>• 자산의 구입<br>• 투자유가증권 구입<\/td><td>• 자산의 처분<br>• 투자유가증권처분<\/td><\/tr><tr><td>재무활동 현금흐름<\/td><td>차입금 상환, 자기주식 취득, 신주, 사채의 발행 비용<\/td><td>차입금 차입, 유상증자, 자기주식처분<\/td><\/tr><\/table><\/div>"},{"n":33,"s":"2과목","u":"투자분석기법","t":"37회 기출","q":"다음 중 엘리어트 파동이론에 대한 설명으로 잘못된 것은?","x":"","o":["주가는 상승 5파와 하락 3파에 의해 끝없이 순환한다.","1번 파동은 추세가 전환되는 시점에서 새로운 추세의 출발점이다.","3번 파동에서 일반적으로 거래량이 최고에 이르며 갭이 나타나는 경우도 많다.","4번 파동은 5개의 상승파동 중 가장 강력한 파동이다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 상승파동 중 가장 강력하고 가격변동이 활발하게 발생하는 파동은 3번 파동이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>엘리어트 파동이론 : 주가는 상승 5파와 하락 3파에 의해 지속적으로 순환한다. 각 파동은 상승 3파와 하락 2파의 총 5개의 파동으로 구성되어 있다.<\/p><p class=\"xb\">상승파동 : 1번, 3번, 5번이며 주가의 방향과 파동의 방향이 같다.<\/p><p class=\"xb\">충격파동(조정파동) : 2번, 4번 파동이며, 주가의 진행방향과 파동의 진행방향이 반대이다.<\/p><p class=\"xb\">하락 3파 : 3개의 파동으로 구성되며, A번, B번, C번 파동이 있다.<\/p><p class=\"xk\"><span>2<\/span>상승 5파<\/p><p class=\"xb\">1번 파동 : 추세의 시작을 알리는 파동, 출발점의 역할을 한다.<\/p><p class=\"xb\">2번 파동 : 1번 파동과 반대방향으로 형성된다.<\/p><p class=\"xb\">3번 파동 : 상승파동 중에 가장 강력하고 가격변동도 활발하게 일어나며, 거래량도 최고에 이르게 된다.<\/p><p class=\"xb\">4번 파동 : 3번 파동을 38.2% 되돌리는 경우가 많다.<\/p><p class=\"xb\">5번 파동 : 추세의 마지막 국면에 발생하여 3번 파동과 비교하여 가격움직임이 활발하지 못하다.<\/p><p class=\"xk\"><span>3<\/span>하락 3파<\/p><p class=\"xb\">A 파동 : 추세와 반대의 방향으로 새로운 추세가 생긴다.<\/p><p class=\"xb\">B 파동 : 하락 추세에 반발하는 것으로 잠깐의 주가 상승이 발생하여, 보유하고 있는 매입포지션을 정리할 마지막 기회이다.<\/p><p class=\"xb\">C 파동 : 거래가 활발하고, 갭이 나타나며, 가격변동폭도 크다. 투매가 나타나며 가격하락폭이 빨라지게 된다.<\/p><p class=\"xk\"><span>4<\/span>엘리어트 파동법칙의 절대불가침 법칙<\/p><p class=\"xb\">2번 파동의 저점이 1번 파동의 저점보다 반드시 높아야 한다.<\/p><p class=\"xb\">3번 파동이 상승 파동 중에 가장 짧은 파동이 될 수 없다.<\/p><p class=\"xb\">4번 파동의 저점은 1번 파동의 고점과 겹칠 수 없다.<\/p><p class=\"xk\"><span>5<\/span>한계<\/p><p class=\"xb\">해석의 여지가 너무 많고 예외가 많아 분석하는 사람에 따라 해석이 달라진다.<\/p><p class=\"xb\">파동에 대한 명확한 정의가 없다.<\/p>"},{"n":34,"s":"2과목","u":"투자분석기법","t":"32회 기출","q":"다음 중 ESG경영에 대한 설명으로 올바른 것은?","x":"","o":["국제적으로 표준화된 지침이 존재한다.","시간이 흐를수록 그 중요성이 점차 감소하고 있다.","연기금은 수익률 제고를 위해 ESG경영을 하는 곳에 투자하지 않는다.","ESG는 Environment, Social, Governance의 약자이다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> ESG에 대한 국제표준은 없으며, 시간이 흐를수록 그 중요성이 증가하고 있다. 연기금은 사회적 투자를 하고 특히 ESG경영을 하는 곳에 대한 투자를 한다.<\/p><p class=\"xn\">※ 2026년 협회교재 개정으로 ESG 관련 내용이 제외되었으나 ESG에 대한 내용은 상식으로 알아둘 필요가 있으며, 2026년 협회교재에서 삭제되었더라도 시험에 나올 수 있으니 개념정도의 수준에서 학습하는 것이 필요하다.<\/p>"},{"n":35,"s":"2과목","u":"투자분석기법","t":"37회 기출","q":"다음 정보를 이용하여 PER를 계산하면 얼마인가? (단, PER = P0 / EPS1 으로 가정한다)","x":"<div class=\"box\"><p>주주의 자본비용 20%, 유보율 40%, ROE=20%<\/p><\/div>","o":["5","8","10","15"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> g = 40% × 20% = 8%<\/p><p class=\"xf\">PER = (1-b)/(k-g) = (1-40%)/(20%-8%) = 5<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>PER = P0 / EPS1<\/p><p class=\"xb\">1주당 순이익 대비 현재 주가를 나타내며, PER가 비교 대상 기업에 비해 높을수록 주가는 고평가, 반대로 비교 대상 기업에 비해 낮을수록 저평가 되었다고 본다.<\/p><p class=\"xf\">P0/EPS1 = (1-b)/(k-g),   g = b × ROE<\/p><p class=\"xb\">성장률 g와는 양의 관계, 자본비용과는 음의 관계에 있음.<\/p><p class=\"xb\">ROE&gt;k일 경우 배당을 증가시키면 주가는 하락하고, ROE&lt;k일 경우 배당을 증가시키면 주가는 상승한다.<\/p>"},{"n":36,"s":"2과목","u":"투자분석기법","t":"34회 기출","q":"다음에 해당하는 것은 제품수명주기의 어느 단계인가?","x":"<div class=\"box\"><p>• 안정적인 시장점유율을 갖고 있으나 기업간 영업실적에 차이가 크게 발생한다.<\/p><p>• 원가절감 등으로 이익 하락추세를 방어하려고 한다.<\/p><p>• 제품수명 주기 연장을 위해 투자한다.<\/p><\/div>","o":["도입기","성장기","성숙기","쇠퇴기"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 성숙기에 대한 설명이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>도입기 : 제품이 처음 시장에 도입되는 단계<\/p><p class=\"xb\">신제품이 수요를 일으키기까지 상당한 시간이 소요된다.<\/p><p class=\"xb\">매출증가율은 낮으며, 이익은 적자를 시현하거나 낮은 것이 보통이다.<\/p><p class=\"xb\">적자를 견디지 못하는 기업들은 시장에서 이탈하기도 하며, 사업 성공여부가 불투명하여 우수한 판매능력이 필요한 시기이다.<\/p><p class=\"xk\"><span>2<\/span>성장기 : 매출액과 이익이 급격히 증가하는 단계<\/p><p class=\"xb\">매출액이 급격히 증가하며, 시장경쟁이 약하여 이익의 증가가 매출액의 증가보다 빨라 수익성이 높아진다.<\/p><p class=\"xb\">성장기 후반에는 경쟁이 격화되어 이익이 증가하더라도 이익률은 정점에 도달한 이후 하락하게 된다.<\/p><p class=\"xk\"><span>3<\/span>성숙기 : 산업내 기업들이 안정적인 시장점유율을 유지하면서 매출이 완만하게 증가하는 단계<\/p><p class=\"xb\">이익률은 경쟁으로 다소 하락하며, 기업간 경영능력에 따라 영업실적의 차이가 크게 나타난다.<\/p><p class=\"xb\">원가절감 혹은 생산관리로 이익의 하락 추세를 방어하려고 한다.<\/p><p class=\"xb\">제품수명주기 연장을 위해 노력하기 때문에 신제품 개발에 대한 연구개발비 지출이 증가한다.<\/p><p class=\"xk\"><span>4<\/span>쇠퇴기 : 수요감소 등의 매출액증가율이 시장 평균보다 낮거나 감소하게 되는 시기<\/p><p class=\"xb\">이익률이 하락하여 적자기업이 다수 발생한다.<\/p><p class=\"xb\">기업들은 산업 내에서 철수하거나 다각화를 실시하며, 이 시기의 산업을 사양산업이라고 부른다.<\/p>"},{"n":37,"s":"2과목","u":"투자분석기법","t":"35회 기출","q":"다음 중 재무상태표와 손익계산서의 자료를 모두 이용하여 산출되는 지표는 무엇인가?","x":"","o":["총자산회전율","부채비율","당좌비율","이자보상비율"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 총자산회전율=순매출액/총자산으로 손익계산서의 항목인 순매출액, 재무상태표 항목인 총자산을 이용하여 산출한다.<\/p><p class=\"xs\">오답풀이<\/p><p>②, ③ 부채비율과 당좌비율은 재무상태표만의 항목으로 산출이 가능하다.<\/p><p>④ 이자보상비율은 손익계산서 항목만으로 산출이 가능하다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>주요 재무비율<\/p><p class=\"xb\">비유동자산회전율=순매출/비유동자산<\/p><p class=\"xb\">재고자산회전율=순매출/재고자산 혹은 매출원가/재고자산<\/p><p class=\"xb\">매출채권회전율=순매출/매출채권<\/p><p class=\"xb\">총자산회전율=순매출/총자산<\/p><p class=\"xb\">이자보상비율=영업이익/이자비용<\/p><p class=\"xb\">부채비율=부채/자기자본<\/p><p class=\"xb\">당좌비율=(유동자산-재고자산-선급금)/유동부채<\/p>"},{"n":38,"s":"2과목","u":"투자분석기법","t":"35회 기출","q":"다음 주가패턴 중 반전형에 해당하지 않는 것은?","x":"","o":["깃발형","역 헤드 앤 숄더형","이중 천장형","원형 바닥형"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 깃발형은 지속형 패턴에 해당되며, 나머지는 반전형 패턴이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>반전형 패턴 : 상승 → 하락 혹은 하락 → 상승으로 바뀌는 패턴<\/p><p class=\"xb\">헤드 앤 숄더 : 주가가 상승추세에서 하락추세로 전환이 예상된다.<\/p><p class=\"xb\">역 헤드 앤 숄더 : 주가가 하락추세에서 상승추세로 전환이 예상된다.<\/p><p class=\"xb\">이중천장형 : 주가 상승추세에서 하락추세로 전환시 자주 발생한다.<\/p><p class=\"xb\">이중바닥형 : 주가 하락추세에서 상승추세로 전환이 예상된다.<\/p><p class=\"xb\">선형 : 장기간 보합권을 유지하며 횡보 후 주가 상승이 예상된다.<\/p><p class=\"xb\">원형바닥형 : 주가 횡보 후 상승이 예상된다.<\/p><p class=\"xb\">원형천장형 : 주가 상승추세가 하락추세로 전환이 예상된다.<\/p><p class=\"xb\">확대형 : 좁은 등락폭으로 움직이는 주가의 등락폭이 확대되는 형태이며, 주가의 예측이 어렵다.<\/p><p class=\"xk\"><span>2<\/span>지속형 패턴 : 횡보하는 주가가 지속되는 패턴<\/p><p class=\"xb\">삼각형, 깃발형, 패넌트형, 쐐기형, 직사각형<\/p><p class=\"xb\">다이아몬드형(확대형과 대칭 삼각형이 합쳐진 모양)<\/p>"},{"n":39,"s":"2과목","u":"투자분석기법","t":"34회 기출","q":"다음 중 기술적 분석에 대한 설명으로 잘못된 것은?","x":"","o":["시장의 수요와 공급이 변동하는 근본 원인을 알려 준다.","장기간에 걸쳐 형성된 추세선은 완만하며 신뢰도가 높다.","저항선은 주가의 고점을 이은 선이다.","추세는 한번 형성되면 상당기간 지속된다고 가정한다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 기술적 분석은 시장의 수요와 공급에 따라 변하는 주가를 알려주지만 그 수요와 공급을 변동하게 하는 근본원인에 대해서 알려주지 못한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>기술적 분석 가정<\/p><p class=\"xb\">증권의 가격은 수요와 공급에 의해서만 결정된다.<\/p><p class=\"xb\">주가의 추세는 상당기간 동안 지속하는 경향이 있다.<\/p><p class=\"xb\">추세의 변화는 수요와 공급의 변동에 의해 발생한다.<\/p><p class=\"xb\">수요, 공급의 변동은 그 발생원인과 관계없이 도표에 의해 나타내며, 주가 모형은 반복하는 경향이 있다.<\/p><p class=\"xk\"><span>2<\/span>지지선과 저항선<\/p><p class=\"xb\">저항선 : 주가의 고점과 고점을 수평으로 이은선<\/p><p class=\"xb\">지지선 : 주가의 저점과 저점을 수평으로 이은선<\/p><p class=\"xb\">현재 주가의 최소, 최대 목표치를 설정하는데 유용하다.<\/p>"},{"n":40,"s":"2과목","u":"투자분석기법","t":"32회 기출","q":"다음 중 시장집중도에 대한 설명으로 올바른 것은?","x":"","o":["개별기업의 경쟁률이 동일한 상황에서 시장 내 경쟁기업의 숫자가 증가하면 할수록 HHI지수는 0으로 수렴한다.","시장집중도가 변하더라도 허핀달지수는 일정하다.","HHI지수의 값은 가상적인 동등 규모의 기업체의 시장점유율을 나타낸다.","HHI지수값이 1에 가까울수록 시장의 경쟁은 치열하다고 판단한다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 시장 내 경쟁기업의 수가 증가할수록 HHI지수 값은 0으로 수렴한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xf\">HHI = Σ(i=1~N) si²   (N : 시장에 있는 전체 기업의 수, si : 기업 i의 시장 점유율(0에서 1 사이의 값))<\/p><p class=\"xk\"><span>1<\/span>만약에 한 시장 내 모든 기업의 시장점유율이 같다면 하핀달지수(HHI)=1/N(단, N은 시장 내에 존재하는 동등한 점유율을 가진 기업의 숫자)로 표현할 수 있다.<\/p><p class=\"xk\"><span>2<\/span>시장집중률은 시장에 존재하는 k개 기업의 시장점유율을 측정한다. 시장에 존재하는 모든 기업을 포함하지 않는다.<\/p>"},{"n":41,"s":"2과목","u":"투자분석기법","t":"32회 기출","q":"다음 지표에 대한 설명으로 잘못된 것은?","x":"","o":["VR값이 100% 이상이면 강력한 매수신호이다.","OBV선은 주가가 정체되어 있을 때 거래량 동향에 의하여 주가의 방향을 예측하는데 유용하게 활용되는 지표이다.","소형주식의 거래량이 많을 경우 OBV분석의 유용성이 줄어들 수 있다.","대체로 OBV선이 상승함에도 불구하고 주가가 하락하면 조만간 주가 상승이 예상된다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> VR 기준 450% 이상이면 단기 과열신호이고, 70% 이하이면 단기매수 신호이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>OBV(On Balance Volume)<\/p><p class=\"xb\">주가가 전일에 비해 상승한 날의 거래량 누계에서 하락한 날의 거래량 누계를 차감하여 이를 매일 누적적으로 집계한 것이며, 소형주 혹은 저가주의 거래량이 많을 경우 시장 전체의 거래량을 왜곡할 수 있다. 이에 대한 보조적인 방법으로 거래대금기준 OBV를 산출하여 활용할 수 있다.<\/p><p class=\"xk\"><span>2<\/span>VR(Volume Ratio)<\/p><p class=\"xb\">OBV를 보완한 것으로 거래량의 누적차이 대신 거래량의 비율로 분석한 것, 일반적인 수준에서 VR은 150%이며, 450%를 초과하면 단기적인 과열신호, 70% 이하이면 단기적인 매입시점으로 본다.<\/p>"},{"n":42,"s":"2과목","u":"투자분석기법","t":"35회 기출","q":"다음 정보를 이용하여 총자산투자수익률을 계산하면 얼마인가?","x":"<div class=\"box\"><p>매출액 순이익률 : 20%, 총자산회전율 : 2<\/p><\/div>","o":["0.2","0.4","0.6","0.8"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 총자산투자수익률=당기순이익/총자산=(당기순이익/매출액)×(매출액/총자산)=당기순이익률×총자산회전율=20%×2=0.4<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>ROA<\/p><p class=\"xb\">ROA=(당기순이익/매출액)×(매출액/총자산)<\/p><p class=\"xb\">ROE=ROA×(총자산/자기자본)=ROA×(1+부채비율)<\/p>"},{"n":43,"s":"2과목","u":"리스크관리","t":"33회 기출","q":"부도모형(Default mode)을 활용하여 주어진 정보를 이용하여 부도시 기대손실과 가장 가까운 값은 얼마인가? (단, 기대손실의 변동성은 없다고 가정한다)","x":"<div class=\"box\"><p>• 총채권금액 : 100억 원<\/p><p>• 부도율 10%<\/p><p>• 부도시 손실률 50%<\/p><\/div>","o":["2.5억 원","5억 원","7.5억 원","10억 원"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 기대손실=부도로 인한 기대손실=부도에 노출된 자산×부도확률×부도시 손실률=100억 원×10%×50%=5억 원<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>부도모형(Default Mode) : 부도가 발생한 경우에만 신용손실이 발생한 것으로 간주하여 리스크를 추정하는 모형<\/p><p class=\"xk\"><span>2<\/span>부도로 인한 예상손실(EL, Expected Loss)=EAD×부도율×LGD<\/p><p class=\"xb\">신용위험에 노출된 금액(EAD, Exposure At Default)<\/p><p class=\"xb\">부도율(부도가능성)<\/p><p class=\"xb\">부도시 손실률(LGD, Loss Given Default). 이는 전체금액-부도시 손실률=부도 후 회수가능액으로 표현이 가능하다.<\/p>"},{"n":44,"s":"2과목","u":"리스크관리","t":"35회 기출","q":"두 자산이 있으며 첫 번째 자산의 VaR는 9억 원이고, 다른 자산의 VaR는 6억 원이며, 두 자산의 상관계수가 -1일 때 두 자산으로 구성된 포트폴리오의 VaR와 가장 가까운 값은?","x":"","o":["3억 원","6억 원","8억 원","9억 원"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 포트폴리오 VaR = √(9²+6²+2×9×6×(-1)) = 3(억 원)<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>두 자산으로 구성되어 있는 포트폴리오 VaR<\/p><p class=\"xf\">포트폴리오 VaR = √(VaR1² + VaR2² + 2·VaR1·VaR2·ρ12)   (ρ12 : 두 자산간의 상관계수)<\/p><p class=\"xk\"><span>2<\/span>1일 VaR를 N일 VaR로 확장하는 방법<\/p><p class=\"xf\">N일 VaR = 1일 VaR × √N<\/p>"},{"n":45,"s":"2과목","u":"리스크관리","t":"32회 기출","q":"KOSPI 200 주가지수 옵션이 현재 350Point이며, 옵션 델타는 0.6이다. 옵션의 가격변동의 표준편차가 2.5%일 때 델타-노말 방법으로 계산한 VaR와 가장 가까운 값은? (단, 신뢰구간은 99%이며, Z값은 2.33이다)","x":"","o":["10.3Point","11.2Point","12.2Point","13.5Point"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> VaR=코스피 200지수×주가지수 1일 수익률 표준편차×신뢰구간의 Z값×Delta=350×2.5%×2.33×0.6=12.22(Point)<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>옵션의 VaR(델타-노말방식)<\/p><p class=\"xf\">VaR = S × σ(ΔS/S) × Z × Delta(옵션델타)<\/p><p class=\"xn\">(S : 기초자산가격, σ(ΔS/S) : 기초자산가격의 변화율에 따른 표준편차, Z : 표준정규분포의 가격(신뢰구간) 계산시 필요, Delta(옵션델타) : 기초자산가격 변동시 옵션가격 변동 정도)<\/p>"},{"n":46,"s":"2과목","u":"리스크관리","t":"32회 기출","q":"다음 중 스트레스 검증법에 대한 설명으로 가장 올바른 것으로 묶은 것은?","x":"<div class=\"box\"><p>㉠ 부분가치평가법이다.<\/p><p>㉡ 예외적인 상황을 가정하여 VaR를 계산할 수 있다.<\/p><p>㉢ 과거 자료가 없어도 VaR 계산이 가능하다.<\/p><\/div>","o":["㉠, ㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 스트레스 검증 혹은 시나리오 분석이라고 불리는 VaR 계산방법은 과거 자료가 없어도 극단적인 상황을 가정하여 포트폴리오 가치변화를 계산할 수 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>스트레스 검증<\/p><p class=\"xb\">포트폴리오의 주요 변수들에게 큰 변화가 발생했을 때 포트폴리오 가치가 변하는 정도를 측정하는 것으로 시나리오 분석이라고도 한다.<\/p><p class=\"xb\">스트레스 검증은 최악의 경우 혹은 극단적인 경우를 전제로 포트폴리오 가치변화를 측정하기도 한다.<\/p><p class=\"xb\">시나리오를 여러 개 만들어서 각 시나리오별 포트폴리오 가치를 계산하고 포트폴리오의 확률분포를 계산하여 VaR를 측정할 수 있다.<\/p><p class=\"xb\">가정하는 시나리오가 주관적이기 때문에 시나리오 설정이 잘못되면 측정된 VaR도 잘못된 정보를 제공하며, 다른 방법에 비해 과학적으로 VaR를 계산하지 못한다.<\/p><p class=\"xb\">포트폴리오가 단 한 개의 리스크 요소에 주로 의존하는 경우에는 적절하게 사용할 수 있다.<\/p><p class=\"xb\">다른 VaR 측정법의 보완적인 방법으로 사용하기에 유용하다.<\/p>"},{"n":47,"s":"2과목","u":"리스크관리","t":"32회 기출","q":"A 은행은 부도에 노출된 자산금액이 100억 원이다. 부도율은 10%이며, 부도시 손실률은 40%이다. 부도시 예상손실의 표준편차와 가장 가까운 값은? (단, 부도율은 베르누이 분포를 갖는다)","x":"","o":["5억 원","7억 원","12억 원","15억 원"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> √(10%×90%) × 100 × 40% = 12(억 원)<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>부도시 예상손실의 변동성<\/p><p class=\"xf\">σ = √(p(1-p)) × EAD × LGD<\/p><p class=\"xb\">부도는 발생 혹은 발생하지 않는 확률(이항모형) 베르누이 분포를 하고 있다. 단, p : 부도율이다.<\/p>"},{"n":48,"s":"2과목","u":"리스크관리","t":"32회 기출","q":"다음 중 VaR에 대한 설명으로 올바르지 않은 것은?","x":"","o":["VaR는 회계자료가 제공하지 못한 리스크에 대한 정보를 제공한다.","VaR는 하나의 수치로 표시되기 때문에 기업의 리스크에 대한 측정이 구체적이며, 다른 회사간 비교를 할 수 있다.","성격이 다른 금융상품간의 포지션 리스크를 동일한 척도로 나타내기 때문에 리스크 비교가 가능하여 각 거래부문의 거래 한도를 설정할 때 총량규제보다 효율적이다.","자산의 보유기간이 다르더라도 VaR의 값은 일정하다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 보유기간이 증가하면 VaR의 값도 증가한다. 보유기간은 VaR를 계산하는 기간이기 때문이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>VaR의 유용성<\/p><p class=\"xb\">기존 회계정보가 제공하지 못하는 리스크에 대한 정보를 제공한다.<\/p><p class=\"xb\">위험을 하나의 숫자로 표시하여 위험에 대한 측정이 구체적이다.<\/p><p class=\"xb\">서로 다른 기업간에 위험을 비교할 수 있다.<\/p><p class=\"xb\">한계 VaR(Marginal VaR)를 이용하면 투자 대상 선정시 투자수익과 부담하는 리스크와의 관계를 고려한 의사결정을 할 수 있다.<\/p><p class=\"xb\">기업의 사업부서의 위험한도 관리에 효과적으로 활용될 수 있다.<\/p><p class=\"xb\">서로 다른 상품이 하나의 포트폴리오로 운영될 경우 VaR를 통한 분산효과를 계산할 수 있다.<\/p><p class=\"xk\"><span>2<\/span>VaR의 한계점<\/p><p class=\"xb\">사용하는 VaR의 모델에 따라 VaR값이 다르게 나타난다.<\/p><p class=\"xb\">과거 데이터를 활용하여 VaR를 계산할 경우 구조적인 변화가 발생하면 계산된 VaR의 신뢰성이 낮아질 수 있다.<\/p><p class=\"xb\">보유기간에 따라 VaR의 값이 달라지며, 1일 VaR를 계산하고 단순히 계산된 1일 VaR에 √보유기간을 곱해서 사용할 경우 그 해석에 유의해야 한다.<\/p>"},{"n":49,"s":"2과목","u":"리스크관리","t":"32회 기출","q":"채권투자금액 100억 원, 채권만기수익률의 증감의 표준편차 1%, 채권의 수정듀레이션 4년일 때 신뢰구간 99%의 1일 VaR의 값과 가장 가까운 것은? (단, Z값은 2.33이다)","x":"","o":["4.66억 원","6.56억 원","9.32억 원","10.11억 원"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 채권 VaR=채권가치×만기수익률 변동의 표준편차×Z×수정듀레이션=100억 원×1%×4년×2.33=9.32(억 원)<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>채권의 VaR 계산<\/p><p class=\"xf\">채권의 VaR = B × σ(Δy) × Z × DM<\/p><p class=\"xn\">(B : 채권투자금액, y : 만기수익률, Z : 표준정규분포 값, DM : 수정듀레이션, σ(Δy) : 만기수익률 변화의 표준편차)<\/p><p class=\"xb\">채권의 VaR=채권가치×만기수익률 변동의 표준편차×Z×수정듀레이션<\/p>"},{"n":50,"s":"2과목","u":"리스크관리","t":"35회 기출","q":"신뢰구간 95%의 1일 VaR가 10억 원일 때, 동일한 신뢰구간의 4일 VaR는 얼마인가?","x":"","o":["10억 원","16.5억 원","20억 원","23.3억 원"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 4일 VaR = 1일 VaR × √4일 = 10억 원 × 2 = 20(억 원)<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>1일 VaR를 N일 VaR로 확장하는 방법<\/p><p class=\"xf\">N일 VaR = 1일 VaR × √N<\/p>"},{"n":51,"s":"3과목","u":"직무윤리","t":"31회 기출","q":"다음 중 금융투자회사의 내부통제기준 위반시 부과하는 조치 중 과태료 최대금액 1억 원의 조치에 해당하지 않는 것은?","x":"","o":["준법감시인의 자산운용업무 겸직","내부통제 기준을 마련하지 않은 경우","준법감시인을 두지 않은 경우","이사회 결의를 거치지 않고 준법감시인을 임면한 경우"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 준법감시인의 자산운용 겸직업무에 대한 과태료는 3천만 원이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>내부통제기준 위반시 회사에 대한 조치<\/p><div class=\"tw\"><table><tr><th>과태료 금액<\/th><th>위반 사항<\/th><\/tr><tr><td>1억 원 이하의 과태료 부과<\/td><td>① 내부통제기준을 마련하지 아니한 경우<br>② 준법감시인을 두지 아니한 경우<br>③ 사내이사 또는 업무집행자 중에서 준법감시인을 선임하지 않는 경우<br>④ 이사회 결의를 거치지 않고 준법감시인을 임면한 경우<br>⑤ 금융위원회가 위법·부당한 행위를 한 회사 또는 임직원에게 내리는 제재조치를 이행하지 않은 경우<\/td><\/tr><tr><td>3천만 원 이하의 과태료 부과<\/td><td>① 준법감시인에 대한 별도의 보수지급 및 평가기준을 마련·운영하지 않은 경우<br>② 준법감시인이 아래 업무를 겸직하거나 이를 겸직하게 하는 경우<br>- 자산운용에 관한 업무, 해당 금융회사의 본질적 업무 및 그 부수업무, 해당 금융회사의 겸영업무, 자회사등의 업무(단 위험관리업무는 제외한다), 그 밖에 이해상충 우려가 있거나 내부통제 및 위험관리업무에 전념하기 어려운 경우 등<br>③ 준법감시인의 임면 사실을 금융위원회에 보고하지 않은 경우<\/td><\/tr><\/table><\/div><p class=\"xn\">※ 2026년 협회 기본교재 개정으로 2천만 원 이하 과태료 부과사항이 3천만 원 이하 과태료 부과사항으로 이동하여 2천만 원 이하 과태료 부과대상은 삭제되었다.<\/p>"},{"n":52,"s":"3과목","u":"직무윤리","t":"35회 기출","q":"다음 중 임직원의 대외활동과 관련하여 가장 올바른 것은?","x":"","o":["금융투자회사의 임직원은 외부강연, 연설, 교육, 기고 등의 활동을 할 수 없다.","임직원 본인이 업무시간에 만든 자료는 자신의 홍보를 위해 배포하며 사용할 수 있다.","인터넷 게시판이나 웹사이트에 금융투자상품에 대한 분석이나 권유에 대한 내용을 게시할 수 있다.","회사와 공식의견이 아닌 자신의 의견을 표현할 경우 사견임을 명백히 표현해야 한다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 회사의 공식의견이 아닌 경우 사견임을 명백히 표현해야 한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>금융투자업 종사자가 대외활동을 하기 위해서는 해당 활동의 성격, 목적, 기대효과 등에 따라 소속 부점장, 준법감시인 혹은 대표이사의 사전승인을 받아야 한다. 부득이한 경우에는 사후에 즉시 보고해야 한다.<\/p><p class=\"xk\"><span>2<\/span>임직원이 외부강연이나 기고 등을 할 때 주의사항<\/p><p class=\"xb\">회사의 공식의견이 아닌 경우 사견임을 명백히 표현해야 한다.<\/p><p class=\"xb\">대외활동으로 인하여 회사의 주된 업무 수행에 지장을 주어서는 아니 된다.<\/p><p class=\"xb\">대외활동으로 인하여 금전적인 보상을 받게 되는 경우 회사에 신고하여야 한다.<\/p><p class=\"xb\">불확실한 사항을 단정적으로 표현하거나 다른 금융투자회사를 비방하여서는 아니 된다.<\/p><p class=\"xk\"><span>3<\/span>주요 금지사항<\/p><p class=\"xb\">회사가 승인하지 않은 중요자료나 홍보물 등을 배포하거나 사용하는 행위<\/p><p class=\"xb\">불확실한 사항을 단정적으로 표현하는 행위 또는 오해를 유발할 수 있는 주장이나 예측이 담긴 내용을 제공하는 행위<\/p>"},{"n":53,"s":"3과목","u":"직무윤리","t":"37회 기출","q":"다음 중 금융소비자보호 총괄책임자(CCO)의 업무에 해당하지 않는 것은?","x":"","o":["금융투자회사의 위험관리 통제에 관한 규정의 제정 및 개정","상품설명서, 금융상품 계약서류 등 사전 심의","금융상품 각 단계별 소비자보호체계에 관한 관리, 감독 및 검토","민원발생과 연계한 관련 부서, 직원 평가기준의 수립 및 평가 총괄"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 금융소비자보호 총괄책임자는 금융투자회사의 위험관리 통제업무를 하지 않는다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>금융소비자보호 총괄책임자(CCO, Chief Consumer Officer) : 금융소비자보호 업무를 총괄하는 임원이며, 대표이사 직속으로 준법감시인에 준하는 독립적 지위를 보장받으며, 적법한 직무수행과 관련하여 부당한 인사상 불이익을 받지 않는다.<\/p><p class=\"xk\"><span>2<\/span>주요 업무<\/p><p class=\"xb\">상품설명서, 금융상품 계약서류 등 사전 심의(단, 준법감시인이 수행시 제외함)<\/p><p class=\"xb\">금융상품 각 단계별 소비자보호체계에 관한 관리, 감독 및 검토<\/p><p class=\"xb\">민원접수 및 처리에 관한 관리, 감독 업무<\/p><p class=\"xb\">금융소비자보호 관련 부서간 업무협조 및 업무조정 등 업무 총괄<\/p><p class=\"xb\">대내외 금융소비자보호 관련 교육 프로그램 개발 및 운영 업무 총괄<\/p><p class=\"xb\">민원발생과 연계한 관련 부서, 직원 평가기준의 수립 및 평가 총괄<\/p><p class=\"xb\">금융소비자보호 표준내부통제기준 준수 여부에 대한 점검, 조치, 평가 업무 총괄<\/p>"},{"n":54,"s":"3과목","u":"직무윤리","t":"32회 기출","q":"다음 중 과당매매에 대한 판단으로 잘못된 것은?","x":"","o":["고객의 매매횟수를 고려하여 과당매매인지 아닌지 판단한다.","고객의 투자성향을 고려하여 과당매매인지 아닌지 판단한다.","고객이 매매를 통해 얼마나 많은 수익이 발생했는지 고려하여 판단한다.","고객의 수수료 총액을 고려하여 과당매매 여부를 판단한다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 과당매매 판단에 있어 수익률 혹은 손실률은 판단기준이 아니다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>과당매매<\/p><p class=\"xb\">금융투자회사의 임직원이 자신 혹은 회사의 영업실적을 증대시키기 위해 금융소비자의 투자경험 등을 고려하지 않고 지나치게 자주 투자권유를 하여 매매가 발생하는 것으로 고객과 금융투자업자와의 대표적인 이해상충 사례이다.<\/p><p class=\"xk\"><span>2<\/span>과당매매인지 판단기준 : 아래 사항들을 종합적으로 고려하여 판단한다.<\/p><p class=\"xb\">투자자가 부담하는 수수료의 총액<\/p><p class=\"xb\">투자자의 재산상태 및 투자목적에 적합한지 여부<\/p><p class=\"xb\">투자자의 투자지식이나 경험에 비추어 당해 거래에 수반되는 위험을 잘 이해하고 있는지 여부<\/p><p class=\"xb\">개별 매매거래시 권유내용의 타당성 여부<\/p>"},{"n":55,"s":"3과목","u":"직무윤리","t":"32회 기출","q":"영업관리자에 대한 설명으로 가장 올바르지 않은 것은?","x":"","o":["영업관리자는 업무성과를 기준으로 성과평가를 하면 안된다.","영업관리자는 1년 이상 해당 영업점에서 근무한 경력이 있어야 한다.","준법감시인은 영업관리자에게 1년에 1회 이상 법규 및 윤리관련 교육을 실시해야 한다.","영업관리자는 준법감시 업무로 인하여 업무상 불이익을 받으면 안 된다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 영업관리자는 자신의 업무의 업무성과를 기준으로 성과평가를 받는다. 그러므로 본인이 수행하는 업무가 과다하거나 수행하는 업무의 성격으로 인하여 준법감시 업무에 곤란을 받지 않아야 영업관리자의 자격이 될 수 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>영업관리자 : 준법감시인이 영업점에 대한 내부통제를 위하여 권한을 영업관리자에게 위임한다.<\/p><p class=\"xb\">준법감시인은 영업관리자에 대하여 연간 1회 이상 법규 및 윤리 관련 교육을 실시해야 한다.<\/p><p class=\"xb\">영업관리자의 임기를 1년 이상으로 해야 한다.<\/p><p class=\"xb\">영업관리자가 준법감시업무로 인하여 인사, 급여 등에서 불이익을 받지 않아야 한다.<\/p><p class=\"xb\">영업관리자에게 업무수행 결과에 따라 적절한 보상을 지급할 수 있다.<\/p><p class=\"xk\"><span>2<\/span>영업관리자 자격<\/p><p class=\"xb\">영업점에서 1년 이상 근무한 경력이 있거나 준법감시·감사업무를 1년 이상 수행한 경력이 있는 자로서 당해 영업점에 상근하고 있을 것<\/p><p class=\"xb\">본인이 수행하는 업무가 과다하거나 수행하는 업무의 성격으로 인하여 준법감시 업무에 곤란을 받지 않을 것<\/p><p class=\"xb\">영업점장이 아닌 책임자급일 것. 단 당해 영업점의 직원 수가 적어 영업점장을 제외한 책임자급이 없는 경우에는 고려하지 않는다.<\/p><p class=\"xb\">준법감시업무를 효과적으로 수행할 수 있는 충분한 경험과 능력, 윤리성을 갖출 것<\/p><p class=\"xk\"><span>3<\/span>다음 요건을 모두 충족하는 경우 예외적으로 1명의 영업관리자가 2 이상의 영업점을 묶어 영업관리 업무를 수행할 수 있다.<\/p><p class=\"xb\">영업규모와 내용, 점포의 지역적 분포가 단일 영업관리자만으로 감시, 감독하는데 어려움이 없을 것<\/p><p class=\"xb\">해당 영업관리자가 대상 영업점 중 1개의 영업점에 상근하고 있을 것<\/p><p class=\"xb\">해당 영업관리자가 수행할 업무의 양과 질이 감독업무 수행에 지장을 주지 아니할 것<\/p>"},{"n":56,"s":"3과목","u":"자본시장 관련 법규","t":"32회 기출","q":"다음 중 장외거래 방법에 대한 설명으로 잘못된 것은?","x":"","o":["협회, 채권중개전문회사 등을 제외한 장외거래는 단일의 매수자와 매도자간 매매이어야 한다.","전문투자자만을 대상으로 하는 채무증권의 매매는 전문투자자, 체신관서에 해당하는자 간의 매매이어야 한다.","채권전문중개매매업자는 매수자와 매도자를 중개하여 매매를 성사시킨다.","투자매매업자가 일반투자자에게 원칙적으로 환매조건부매수를 할 수 있다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 투자매매업자는 일반투자자에게 환매조건부매수를 할 수 없다.<\/p>"},{"n":57,"s":"3과목","u":"자본시장 관련 법규","t":"33회 기출","q":"투자매매업자의 신용공여에 대해서 잘못 설명한 것은?","x":"","o":["청약주식에 대해서는 청약주식을 담보로 징구해야 한다.","관리지정종목에 대해서 신규대출을 하지 않는다.","신용거래를 하기 위해서는 신용공여약정을 체결해야 한다.","총신용규모 한도는 자기자본의 140%이다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 총신용공여 규모 한도는 자기자본의 범위 이내이어야 하고, 담보를 징구할 경우 신용공여금액의 100분의 140 이상에 상당하는 담보를 징구해야 한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>신용공여 방법<\/p><p class=\"xb\">해당 투자매매업자 또는 투자중개업자에게 증권 매매거래계좌를 개설하고 있는자에 대하여 증권의 매매를 위한 매수자금을 융자하거나 매도하려는 증권을 대여하는 방법<\/p><p class=\"xb\">전자등록주식 등을 보유하고 있거나 증권을 예탁하고 있는자에 대하여 그 전자등록주식 또는 증권을 담보로 금전을 융자하는 방법<\/p><p class=\"xb\">신용공여약정의 체결<\/p><p class=\"xb\">신용공여의 회사별 한도 : 총신용공여 규모는 자기자본의 범위 이내로 함.<\/p><p class=\"xk\"><span>2<\/span>담보의 징구<\/p><p class=\"xb\">청약자금대출 : 청약하여 배정받은 증권을 담보로 징구해야 함.<\/p><p class=\"xb\">신용거래융자 및 신용거래대주 : 매수한 주권 또는 상장지수집합투자기구의 집합투자증권, 신용거래대주인 경우에는 매도대금을 담보로 징구해야 함.<\/p><p class=\"xb\">예탁증권담보융자 : 예탁증권을 담보로 징구하되, 가치 산정이 곤란하거나 담보권의 행사를 통한 대출금의 회수가 곤란한 경우 담보로 징구할 수 없음.<\/p><p class=\"xb\">담보비율 : 신용공여금액의 100분의 140 이상<\/p><p class=\"xk\"><span>3<\/span>담보로 제공된 증권의 평가<\/p><p class=\"xb\">청약주식 : 취득가액, 단 당해 주식이 상장된 후에는 당일 종가<\/p><p class=\"xb\">상장주권 또는 상장지수집합투자기구의 집합투자증권 : 당일종가<\/p><p class=\"xb\">상장채권 및 공모 파생결합증권 : 2개 이상의 채권평가회사가 제공하는 가격정보를 기초로 투자매매업자 또는 투자중개업자가 산정한 가격<\/p><p class=\"xb\">집합투자증권 : 당일에 고시된 기준가격<\/p><p class=\"xk\"><span>4<\/span>신용거래 제한<\/p><p class=\"xb\">거래소가 투자경고종목, 투자위험종목, 관리종목으로 지정한 증권<\/p><p class=\"xb\">거래소가 매매호가전 예납조치 또는 결제전 예납조치를 취한 증권에 대해서는 신규의 신용거래를 할 수 없음.<\/p>"},{"n":58,"s":"3과목","u":"자본시장 관련 법규","t":"32회 기출","q":"다음 중 지분증권을 발행할 수 없는 주체는?","x":"","o":["투자익명조합","투자유한회사","신탁회사","출자조합"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 신탁회사는 수익증권을 발행한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>지분증권 발행기업<\/p><p class=\"xb\">투자회사, 투자유한회사, 투자합자회사, 투자유한책임회사, 투자합자조합, 투자익명조합<\/p>"},{"n":59,"s":"3과목","u":"자본시장 관련 법규","t":"32회 기출","q":"다음 중 MMF가 투자하여 운용할 수 있는 채권운용 기준으로 틀린 것은?","x":"","o":["채무증권은 취득시점을 기준으로 상위 2개 등급 채권이어야 한다.","신용등급이 불분명한 경우 일반사무관리회사가 인정하는 상위 2개 등급의 채권이어야 한다.","신용등급이 불분명한 경우 신용평가회사가 인정하는 상위 2개 등급 채무증권이어야 한다.","신용등급이 불분명한 경우 집합투자기구위원회가 인정하는 상위 2개 등급의 채무증권이어야 한다."],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 일반사무관리회사는 MMF에서 운용하는 채권의 등급평가를 할 수 없다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>신용평가등급의 제한<\/p><p>① 단기금융집합투자기구의 집합투자재산으로 운용할 수 있는 채무증권은 취득 시점을 기준으로 신용평가업자의 신용평가등급이 최상위 등급 또는 최상위 등급의 차하위 등급(상위 2개 등급) 이내이어야 함.<\/p><p>② 신용평가등급이 상위 2개 등급에 미달하거나 신용평가등급이 없는 경우 예외적으로 운용할 수 있는 채무증권<\/p><p class=\"xb\">보증인의 신용평가등급이 상위 2개 등급 이내인 채무증권<\/p><p class=\"xb\">담보 또는 처분 옵션을 감안하여 집합투자재산평가위원회가 상위 2개 등급에 상응한다고 인정하는 채무증권<\/p><p class=\"xb\">신용평가등급이 없는 채무증권으로서 집합투자재산평가위원회가 상위 2개 등급에 상응한다고 인정하는 채무증권<\/p><p class=\"xk\"><span>2<\/span>단기금융집합투자기구(MMF)<\/p><p>① 집합투자재산 전부를 원화로 표시된 단기금융상품에 투자하는 집합투자기구(외화로 표시된 단기금융상품에 투자하는 외화MMF도 있음)<\/p><p>② 단기금융상품<\/p><p class=\"xb\">남은 만기가 6개월 이내인 양도성예금증서<\/p><p class=\"xb\">남은 만기가 5년 이내인 국채증권, 남은 만기가 1년 이내인 지방채증권, 특수채증권, 사채권, 기업어음증권 단 환매조건부매수의 경우에는 남은 만기의 제한을 받지 않음.<\/p><p class=\"xb\">남은 만기가 1년 이내인 금융기관이 발행, 할인, 매매, 중개, 인수, 보증하는 어음(기업어음증권은 제외)<\/p><p class=\"xb\">단기대출<\/p><p class=\"xb\">만기가 6개월 이내인 금융기관 또는 우체국에 예치<\/p><p class=\"xb\">다른 단기금융 집합투자기구의 집합투자증권<\/p><p class=\"xb\">전자단기사채 등<\/p>"},{"n":60,"s":"3과목","u":"자본시장 관련 법규","t":"32회 기출","q":"집합투자증권 환매가격 평가에 대한 설명으로 올바르지 않은 것은?","x":"","o":["신뢰할만한 시가가 없는 경우 환매가격은 신용평가업자의 평가가격으로 할 수 있다.","환매가격을 잘 모르면 집합투자평가위원회 평가에 따라 평가할 수 있다.","신탁업자는 집합투자업자의 집합투자재산평가가 공정하게 이루어졌는지 확인해야 한다.","신뢰할만한 시가가 없는 경우 일반사무관리회사가 환매가격을 평가할 수 있다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 일반사무관리회사는 집합투자증권 환매가격 평가를 할 수 없다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>집합투자증권의 환매<\/p><p class=\"xb\">환매청구 순서 : 해당 집합투자증권을 판매한 투자매매 혹은 투자중개업자 → 집합투자업자 → 신탁업자<\/p><p class=\"xk\"><span>2<\/span>집합투자재산평가<\/p><p class=\"xb\">신뢰할 만한 시가가 있는 경우 시가로 평가함.<\/p><p class=\"xb\">신뢰할 만한 시가가 없는 경우 공정가액으로 평가함 : 집합투자재산평가위원회가 채권평가회사, 회계법인, 신용평가법인, 감정평가업자, 인수업 영위 투자매매업자 등이 제공한 가격 등을 고려하여 평가함.<\/p><p class=\"xb\">신탁업자는 집합투자업자의 집합투자재산에 대한 평가가 공정하게 이루어 졌는지 확인해야 함.<\/p>"},{"n":61,"s":"3과목","u":"자본시장 관련 법규","t":"33회 기출","q":"기초자산의 가격, 이자율, 지표, 단위 또는 이를 기초로 하는 지수 등의 변동과 연계하여 정하여진 방법에 따라 지급금액 또는 회수금액이 결정되는 권리가 표시된 증권은 무엇인가?","x":"","o":["수익증권","파생결합증권","옵션 및 선물","채무증권"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 파생결합증권에 대한 설명이다. 최대손실이 투자원금까지면 증권, 투자원금보다 더 큰 손실이 발생할 수 있으면 파생상품으로 분류한다.<\/p>"},{"n":62,"s":"3과목","u":"자본시장 관련 법규","t":"33회 기출","q":"다음에서 순자본비율의 산정시 총위험액을 계산할 때 포함되는 위험은 어느 것인가?","x":"<div class=\"box\"><p>시장위험, 신용위험, 운영위험, 유동성위험<\/p><\/div>","o":["시장위험, 신용위험","시장위험, 신용위험, 유동성위험","시장위험, 신용위험, 운영위험","시장위험, 운영위험, 유동성위험"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 유동성위험은 총위험액 계산시 고려하지 않는다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>총위험액 : 금융투자업자가 영업을 영위함에 있어 직면하게 되는 손실을 미리 예측하여 계량화한 것<\/p><p class=\"xb\">총위험액=시장위험액+신용위험액+운영위험액<\/p><p class=\"xb\">시장위험액 : 주식위험액, 금리위험액, 외환위험액, 집합투자증권 등 위험액, 일반상품위험액, 옵션위험액<\/p><p class=\"xb\">운영위험액 : 운영위험액+집합투자재산 위험액<\/p>"},{"n":63,"s":"3과목","u":"자본시장 관련 법규","t":"32회 기출","q":"다음 빈칸에 들어갈 단어가 순서대로 올바르게 되어 있는 것은?","x":"<div class=\"box\"><p>집합투자재산을 평가할 때는 원칙적으로 (          )(으)로 평가하고, 예외적인 경우 (          )(으)로 평가할 수 있다.<\/p><\/div>","o":["시가, 공정가액","시가, 장부가액","공정가액, 장부가액","공정가액, 시가"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 원칙은 시가로 평가하고, 시가평가가 어려운 경우에는 공정가액으로 평가한다.<\/p>"},{"n":64,"s":"3과목","u":"자본시장 관련 법규","t":"31회 기출","q":"다음 중 투자일임업자의 금지행위가 아닌 것은?","x":"","o":["정당한 사유 없이 투자자의 운용방법의 변경 또는 계약의 해지요구에 응하지 않는 행위는 금지된다.","자기 또는 관계인수인이 발행인 또는 매출인으로부터 직접 증권의 인수를 의뢰받아 인수조건 등을 정하는 업무를 담당한 법인의 특정 증권 등에 대하여 인위적인 시세를 형성하기 위하여 투자일임재산으로 그 특정 증권 등을 매매하는 행위는 금지된다.","원칙적으로 투자일임재산을 각각의 투자자별로 운용하지 아니하고 여러 투자자의 자산을 집합하여 운용하는 행위는 금지된다.","투자일임재산으로 투자일임업자 또는 그 이해관계인의 고유재산과 거래하는 행위는 금지되나, 이해관계인이 되기 3개월 이전에 체결한 계약에 따른 경우는 거래할 수 있다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 이해관계인이 되기 6개월 이전에 체결한 계약에 따른 경우는 예외적으로 거래할 수 있다.<\/p>"},{"n":65,"s":"3과목","u":"자본시장 관련 법규","t":"38회 기출","q":"집합투자기구의 관계회사 중에 투자회사의 위탁을 받아 투자회사 주식의 발행, 명의개서, 투자회사재산의 계산 등 업무를 영위하는 곳은 어디인가?","x":"","o":["일반사무관리회사","신용평가업자","투자매매업자","증권금융회사"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 일반사무관리회사에 대한 설명이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>일반사무관리회사<\/p><p class=\"xb\">투자회사 주식의 발행 및 명의개서<\/p><p class=\"xb\">투자회사재산의 계산<\/p><p class=\"xb\">법령 또는 정관에 의한 통지 및 공고<\/p><p class=\"xb\">이사회 및 주주총회의 소집, 개최, 의사록 작성 등에 관한 업무<\/p><p class=\"xb\">기타 투자회사의 사무를 처리하기 위하여 필요한 업무로 금융위로부터 위탁 받은 기준가격 산정업무, 투자회사의 운영에 관한 업무를 함.<\/p>"},{"n":66,"s":"3과목","u":"자본시장 관련 법규","t":"37회 기출","q":"금융투자업의 적용배제에 대한 설명으로 틀린 것은?","x":"","o":["투자권유대행인이 투자권유를 대행하는 것은 투자중개업 적용이 배제된다.","역외영업 특례 적용에 해당하는 역외투자자문업은 투자자문업 적용이 배제된다.","종합금융회사가 어음관리계좌(CMA)를 운용하기 위해서는 집합투자업 인가를 받아야 한다.","특정 전문투자자간에 환매조건부매매를 하는 경우 투자매매업 적용이 배제된다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 종합금융회사가 어음관리계좌를 운용하는데 있어서 집합투자업 적용을 하지 않는다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>집합투자업 적용배제<\/p><p class=\"xb\">다른 법률에 의한 펀드 중 사모펀드<\/p><p class=\"xb\">종합금융투자사업자의 종합금융계좌 업무<\/p><p class=\"xb\">종합금융회사 어음관리계좌(CMA)<\/p><p class=\"xb\">법인세법에 따른 프로젝트 파이낸싱 법인<\/p><p class=\"xk\"><span>2<\/span>투자매매업 적용배제<\/p><p class=\"xb\">투자신탁 수익증권, 투자성 있는 예금, 보험 및 특정 파생결합증권을 발행하는 경우를 제외하고 자기가 증권을 발행하는 경우<\/p><p class=\"xb\">투자매매업자를 상대방으로 하거나 투자중개업자를 통하여 금융투자상품을 매매하는 경우<\/p><p class=\"xb\">특정 전문투자자 간에 환매조건부매매를 하는 경우<\/p><p class=\"xk\"><span>3<\/span>투자중개업 적용배제<\/p><p class=\"xb\">투자권유대행인이 투자권유를 대행하는 경우<\/p><p class=\"xb\">거래소가 증권시장 및 파생상품시장을 개설·운영하는 경우<\/p><p class=\"xb\">협회가 장외주식시장(K-OTC)을 개설·운영하는 경우<\/p><p class=\"xk\"><span>4<\/span>투자자문업 적용배제<\/p><p class=\"xb\">불특정 다수인을 대상으로 발행, 송신되고, 불특정 다수인이 수시로 구입·수신할 수 있는 간행물, 출판물, 통신물, 방송 등을 통하여 조언을 하는 경우(유사투자자문업)<\/p><p class=\"xb\">역외영업 특례 적용에 해당하는 역외투자자문업<\/p>"},{"n":67,"s":"3과목","u":"한국금융투자협회규정","t":"35회 기출","q":"집합투자증권 투자광고시 의무적으로 표시해야 하는 사항으로 올바른 것은?","x":"<div class=\"box\"><p>㉠ 운용보수 및 수수료<\/p><p>㉡ 환매대금 수령의 구체적인 시기<\/p><p>㉢ 증권거래수수료가 부과될 수 있다는 사실<\/p><\/div>","o":["㉠, ㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 모든 사항을 의무적으로 표시해야 한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>펀드 투자광고시 주요 의무표시 사항<\/p><p class=\"xb\">금융상품판매업자 등의 명칭, 금융상품의 내용<\/p><p class=\"xb\">일반금융소비자는 금융회사로부터 설명을 받을 권리가 있다는 사실<\/p><p class=\"xb\">환매수수료 및 환매신청 후 환매금액의 수령이 가능한 구체적인 시기<\/p><p class=\"xb\">증권거래비용이 발생할 수 있다는 사실과 투자자가 직·간접적으로 부담하게 되는 각종 보수 및 수수료<\/p><p class=\"xb\">광고의 유효기간이 있는 경우 해당 유효기간, 통계수치나 도표 등을 이용하는 경우 해당 자료의 출처 등<\/p><p class=\"xb\">수수료 부과기준 및 절차, 손실이 발생할 수 있는 상황 및 그에 따른 손실 추정액, 과거의 실적을 표시하는 경우 투자광고 시점 및 미래에는 이와 다를 수 있다는 내용, 최소비용을 표기하는 경우 그 최대비용, 최대수익을 표기하는 경우 그 최소수익 등<\/p>"},{"n":68,"s":"3과목","u":"한국금융투자협회규정","t":"32회 기출","q":"금융투자전문인력 등록요건 중 투자자산운용사의 등록요건으로 잘못된 것은?","x":"","o":["증권운용전문인력은 해외자원개발 투자운용업무를 수행할 수 있다.","부동산 투자운용업무를 하는 투자자산운용사는 사모집합투자재산 투자운용업무를 추가로 수행할 수 있다.","투자자산운용사는 집합투자재산 운용업무만 할 수 있다.","사회기반시설운용전문인력은 사회기반시설 투자운용업무를 할 수 있다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 투자자산운용사(투자운용인력)는 집합투자재산, 신탁재산 또는 투자일임재산을 운용하는 업무를 수행하는 인력이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>투자자산운용사(투자운용인력)<\/p><p class=\"xb\">집합투자재산, 신탁재산 또는 투자일임재산을 운용하는 업무를 수행하는 인력<\/p><p class=\"xb\">해당 업무를 수행하기 위해서는 일정한 등록요건을 갖추고 협회에 등록해야 한다.<\/p><p class=\"xk\"><span>2<\/span>다음 중 ①의 요건을 갖춘 자는 해외자원개발 투자운용업무를 수행할 수 있으며, ①부터 ④ 중 어느 하나의 요건을 충족하여 등록된 자는 일반 사모집합투자재산 운용업무를 추가로 수행할 수 있음.<\/p><p class=\"xf\">① 금융투자상품 투자운용업무 : 증권운용전문인력에 해당하는 자<\/p><p class=\"xf\">② 부동산 투자운용업무 : 부동산 운용전문인력에 해당하는 자<\/p><p class=\"xf\">③ 사회기반시설 투자운용업무 : 사회기반시설운용전문인력에 해당하는 자<\/p><p class=\"xf\">④ 해외자원개발 투자운용업무 : 해외자원개발운용전문인력에 해당하는 자<\/p><p class=\"xf\">⑤ 일반사모집합투자재산 운용업무 : 일반사모집합투자기구 운용전문인력에 해당하는 자<\/p>"},{"n":69,"s":"3과목","u":"한국금융투자협회규정","t":"30회 기출","q":"다음 중 조사분석자료 작성 및 공표에 대한 내용으로 잘못 설명한 것은?","x":"","o":["조사분석자료의 작성, 심사 및 승인 등의 업무를 수행하기 위해서는 협회가 인정하는 금융투자분석사 자격을 취득해야 한다.","금융투자회사는 조사분석자료를 공표하기 전에 내부기준에 따른 승인 절차를 거치지 않고는 제3자에게 그 주된 내용을 제공할 수 없다.","기업금융 관련 부서와 조사담당부서의 금융투자분석사와의 의견교류는 항상 금지된다.","임원수의 제한 등으로 겸직이 불가피한 경우를 제외하고는 금융투자회사는 조사분석 담당부서의 임원이 기업금융, 법인영업, 고유계정 운용업무를 겸직하게 하면 안 된다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 원칙적으로 기업금융업무부서와 금융투자분석사간의 의견교류는 금지되지만, 준법감시부서의 통제하에서는 예외적으로 허용된다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>조사분석의 주요 원칙<\/p><p class=\"xb\">선량한 관리자로서의 주의의무를 다해야 한다.<\/p><p class=\"xb\">조사분석의 대가로 조사분석 대상법인 등의 이해관계인으로부터 재산적 이득을 제공받아서는 안 된다.<\/p><p class=\"xb\">외부로부터 취득한 자료를 이용하는 경우 해당 자료의 신뢰도를 철저히 검증해야 한다.<\/p><p class=\"xk\"><span>2<\/span>금융투자분석사의 확인<\/p><p class=\"xb\">금융투자회사는 금융투자분석사의 확인없이 조사분석자료를 공표하거나 제3자에게 제공해서는 안된다.<\/p><p class=\"xb\">금융투자회사는 해당 금융투자회사의 임직원이 아닌 제3자가 작성한 조사분석자료를 공표하는 경우 해당 제3자의 성명(법인의 경우 법인명)을 조사분석자료에 기재해야 한다.<\/p><p class=\"xk\"><span>3<\/span>조사분석업무의 독립성<\/p><p class=\"xb\">조사분석업무의 독립적 수행을 위한 내부통제기준 제정 등 필요조치를 해야 한다.<\/p><p class=\"xb\">조사분석자료를 공표하기 전에 조사분석대상법인 및 조사분석자료의 작성·심의에 관여하지 않은 임직원에게 조사분석자료 또는 그 주된 내용을 제공해서는 안 된다.<\/p><p class=\"xb\">금융투자분석사와 기업금융업무부서와 의견교류는 원칙적으로 제한하지만 준법감시부서의 통제하에서는 예외적으로 허용하고, 그 회의 내용은 서면으로 기록하고 보관한다.<\/p>"},{"n":70,"s":"3과목","u":"주식투자운용/투자전략","t":"30회 기출","q":"다음 중 기대수익률 추정방법에 해당하지 않는 것은?","x":"","o":["추세분석","시나리오 분석","GARCH","시장공통예측치 사용"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> GARCH는 금융시계열 데이터의 변동성을 추정하는 모형이다.<\/p>"},{"n":71,"s":"3과목","u":"주식투자운용/투자전략","t":"32회 기출","q":"다음 중 전술적 자산배분의 특징에 해당하지 않는 것은?","x":"","o":["자산의 가격이 오르면 매수하고, 자산의 가격이 하락하면 매도하는 전략을 따른다.","시장이 비효율적임을 가정한다.","평균반전현상을 이용하여 투자한다.","펀드매니저의 개입이 요구된다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 전술적 자산배분전략은 시장이 비효율적이라고 가정하여, 저평가된 자산을 매입하고 고평가된 자산을 매도하는 투자전략이다. 즉 가격이 낮은 자산을 매입하고 가격이 높은 자산을 매도하는 역투자전략이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>전술적 자산배분<\/p><p class=\"xb\">자산시장이 평균반전과정을 따른다고 가정한다. 즉 단기적으로는 내재가치에서 벗어나지만 장기적으로는 내재가치로 돌아오는 것을 전제로 한다. 이는 전술적 자산배분전략이 본질적으로 역투자전략이라는 것을 의미한다. 저평가된 자산을 매수하고, 고평가된 자산을 매도하여 펀드 투자성과를 높이는 전략이다.<\/p><p class=\"xb\">증권시장이 비효율적이라는 것을 전제로 한다.<\/p><p class=\"xb\">증권시장의 과잉반응을 활용하는 전략이다.<\/p>"},{"n":72,"s":"3과목","u":"주식투자운용/투자전략","t":"32회 기출","q":"다음 중 시장이상현상을 활용한 방법에서 수익률 역전그룹으로 올바르게 선택한 것은?","x":"<div class=\"box\"><p>㉠ 장기수익률 역전현상<\/p><p>㉡ 저 β효과<\/p><p>㉢ 저 PER효과<\/p><\/div>","o":["㉠, ㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 수익률 역전그룹은 장기수익률 역전현상(Winner-Loser효과), 저 β효과, 잔차수익률 역전현상, 고유수익률 역전현상이 있으며 저 PER효과는 상대적 저가주 효과그룹이
