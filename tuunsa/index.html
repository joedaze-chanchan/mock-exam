다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>이상현상을 이용한 종목선정<\/p><p class=\"xb\">정보비효율 그룹 : 수익예상 수정효과, 수익예상 추세효과, 무시된 기업효과, 소형주 효과, 1월 효과<\/p><p class=\"xb\">상대적 저가주 효과그룹 : 저 PER효과, 저 PBR효과<\/p><p class=\"xb\">수익률 역전그룹 : 장기수익률 역전현상(Winner-Loser효과), 저 β효과, 잔차수익률 역전현상, 고유수익률 역전현상<\/p>"},{"n":73,"s":"3과목","u":"주식투자운용/투자전략","t":"34회 기출","q":"대기업 등은 모두 포함시키고, 중소기업은 투자성격과 부합하는 일부만 편입하는 주식운용방법에 해당하는 것은?","x":"","o":["최적화법","표본추출법","완전복제법","계량분석방법"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 표본추출법에 대한 설명이다. 계량분석방법은 준액티브 운용의 한 방법이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>인덱스 펀드 구성방법<\/p><p class=\"xb\">완전복제법 : 벤치마크를 구성하는 모든 종목을 벤치마크의 구성비율대로 매입하여 보유하는 것으로 가장 단순하고 직접적인 방법으로 벤치마크를 거의 완벽하게 추종할 수 있음.<\/p><p class=\"xb\">표본추출법 : 벤치마크에 포함된 대형주는 모두 포함하고 중소형주들은 펀드의 성격이 벤치마크와 유사하게 되도록 일부의 종목만을 포함하는 방식<\/p><p class=\"xb\">최적화법 : 포트폴리오 모형을 이용하여 주어진 벤치마크에 대비한 잔차위험이 허용수준 이하인 포트폴리오를 만드는 방식<\/p>"},{"n":74,"s":"3과목","u":"주식투자운용/투자전략","t":"32회 기출","q":"다음 중 주가지수에 대한 설명으로 올바르지 않은 것은?","x":"","o":["Nikkei 225는 주가가중 주가지수이다.","KOSPI와 KOSPI 200은 유동시가 가중방식을 채택하고 있다.","동일가중 방식은 모든 종목을 동일하게 취급한다.","DJIA는 시가가중방식으로 산출된다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> DJIA(Dow Jones Industrial Average)는 주가가중 방식으로 산출된 지수이다. DJIA는 주가가 높은 종목이 더 큰 영향을 미치는 방식으로 구성된다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>주가가중 주가지수 : 절대적인 주당 가격이 가중치가 된다. 대표적으로 DJIA, Nikkei 225가 있다. 주가가 높은 종목의 가중치가 커지는 문제점이 있다.<\/p><p class=\"xk\"><span>2<\/span>시가가중 주가지수 : 주식의 시가총액이 가중치가 되어 지수를 구성한다. 주식분할, 주식병합 등의 별도 조정작업은 필요하지 않으나 새로운 종목의 상장이나 유상증자가 발생하면 조정이 필요하다.<\/p><p class=\"xb\">정부, 지배주주 등이 보유하고 있는 주식을 제외하고 실제로 거래 가능한 주식만으로 가중치를 두어 구성한 주가지수를 유동시가가중방식이라고 한다. KOSPI와 KOSPI 200은 유동시가가중방식을 채택하였다.<\/p><p class=\"xb\">시가총액이 큰 종목의 가격변화를 잘 반영하지만, 이러한 종목은 성숙기에 있는 기업이거나 주가가 최고로 상승하여 과대평가된 종목일 가능성이 있어, 과대평가됨에 따라 가중치가 높아지는 문제점이 있다.<\/p><p class=\"xb\">인덱스 포트폴리오를 위한 표준으로 인식되고 있다.<\/p><p class=\"xk\"><span>3<\/span>동일가중 주가지수 : 각 종목의 가중치를 동일하게 적용한다.<\/p>"},{"n":75,"s":"3과목","u":"주식투자운용/투자전략","t":"33회 기출","q":"다음 괄호에 들어갈 단어의 순서로 올바른 것은?","x":"<div class=\"box\"><p>전략적 자산배분에 있어 평균-분산기준에 의해 도출된 포트폴리오 집합을 (          )(이)라고 하며, 이러한 자산들의 집합을 수익률과 위험의 공간에서 연속적으로 연결한 선을 (          )(이)라고 한다.<\/p><\/div>","o":["효율적 포트폴리오, 효율적 투자선","최적포트폴리오, 퍼지투자기회선","효율적 포트폴리오, 최적포트폴리오","효율적 투자선, 최적포트폴리오"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 평균-분산 지배원리에 의해 다른 자산에 지배당하지 않는 자산의 집합을 효율적 포트폴리오라고 하며, 이들을 연결한 선을 효율적 투자선이라고 한다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>효율적 포트폴리오 : 평균-분산 지배원리에 의해 지배당하지 않는 효율적인 자산<\/p><p class=\"xk\"><span>2<\/span>효율적 투자선 : 효율적 포트폴리오를 수익률과 위험의 공간에서 연결한 선<\/p><p class=\"xk\"><span>3<\/span>평균-분산 지배원리 : 투자대상자산을 선택할 때 수익률(평균)이 동일하면 위험이 낮은 자산을 선택하고, 위험(분산)이 동일하면 수익률이 높은 자산을 선택하는 자산선택의 기본원리<\/p><p class=\"xk\"><span>4<\/span>최적포트폴리오 : 효율적 투자선과 투자자의 효용(무차별곡선)이 만나는 점에서 선택되는 자산, 투자자의 위험에 대한 태도가 반영되어 있는 최적포트폴리오이다.<\/p><p class=\"xk\"><span>5<\/span>퍼지투자기회선 : 위험과 수익률의 추정에 있어 현실적으로 발생할 수 있는 오차를 고려하여 만든 투자기회선이며, 진정한 효율적 포트폴리오는 이 영역 내에 존재하게 된다.<\/p>"},{"n":76,"s":"3과목","u":"채권투자운용/투자전략","t":"37회 기출","q":"주가를 전환가격으로 나눈 것은?","x":"","o":["패리티","전환비율","괴리율","전환가치"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 패리티=주가/전환가격이다.<\/p><p class=\"xs\">오답풀이<\/p><p>② 전환비율은 전환사채 액면가를 주식으로 전환할 수 있는 비율이다.<\/p><p>④ 전환가치는 전환된 주식수×1주당 주가를 나타낸다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>전환사채용어<\/p><p class=\"xb\">전환가격 : 보유채권을 주식 1주로 전환할 때의 금액<\/p><p class=\"xb\">전환비율 : 전환사채 액면의 몇 %를 주식으로 전환할 수 있는지의 정도<\/p><p class=\"xb\">패리티 : (주가/전환가격)×100%<\/p><p class=\"xb\">전환가치 : 전환된 주식의 시장가치, 전환된 주식수×1주당 주가<\/p><p class=\"xb\">괴리=전환사채시장가격-패리티가격, 괴리값이 양수면 투자자는 채권자로 남아 있는 것이 유리하고, 괴리값이 음수면 주식으로 전환하는 것이 유리하다. 괴리는 전환프리미엄이라고도 한다.<\/p><p class=\"xb\">전환사채가치=모든 조건이 동일한 일반사채가치+전환권가치(콜옵션 매수와 성격이 같음)<\/p>"},{"n":77,"s":"3과목","u":"채권투자운용/투자전략","t":"32회 기출","q":"다음 중 우리나라의 채권거래에 대한 내용으로 올바른 것은?","x":"","o":["거래량 측면에서 장외거래가 장내거래보다 더 크다.","장내거래는 금융투자협회를 통해 거래한다.","채권거래에 있어 대체로 개인투자비중이 기관투자비중보다 높다.","장외매매는 당일결제를 원칙으로 한다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 채권은 장외시장 규모가 장내시장 규모보다 더 큰 시장이다. 장내거래는 거래소를 통해서 거래하며, 장외거래는 대부분 익일결제를 한다. 채권은 그 규모가 크기 때문에 기관투자자의 비중이 개인투자자의 비중보다 높다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>채권유통시장 특징<\/p><p class=\"xb\">채권의 유통시장은 장내시장과 장외시장이 있으며 장외시장이 더 발달되어 있어 장외시장 중심으로 유통시장이 형성되어 있다.<\/p><p class=\"xb\">채권 유통시장은 대부분 금융기관, 법인과 같은 기관투자자 중심의 시장이며, 주로 상대매매에 의해서 거래가 이루어진다.<\/p><p class=\"xk\"><span>2<\/span>채권장내거래와 장외거래 비교<\/p><div class=\"tw\"><table><tr><th>구분<\/th><th>장내거래<\/th><th>장외거래<\/th><\/tr><tr><td>거래장소<\/td><td>거래소<\/td><td>증권회사 장외시장 브로커 창구 혹은 IDB 회사창구<\/td><\/tr><tr><td>거래방법<\/td><td>경쟁매매, 전산매매<\/td><td>상대매매<\/td><\/tr><tr><td>매매수량 단위<\/td><td>국고채 : 10억 원<br>주식관련사채 : 10만 원<br>소액채권 : 1천 원<\/td><td>제한 없음.<\/td><\/tr><tr><td>결제방법<\/td><td>당일결제 및 익일결제<\/td><td>대부분 익일결제(단, RP, MMF편입채권, 소매채권은 당일결제)<\/td><\/tr><\/table><\/div>"},{"n":78,"s":"3과목","u":"채권투자운용/투자전략","t":"37회 기출","q":"만기가 2년이며 액면가는 10,000원, 표면이자율은 3%이며 이자는 후급으로 연말에 지급하는 이표채이다. 만기시점에 유입되는 현금흐름은 얼마인가?","x":"","o":["10,000원","10,300원","10,600원","10,609원"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 현금흐름은 t=1년 말에 액면이자 300원, t=2년 말에 액면이자 300원과 원금 10,000원을 지급하기 때문에 만기시 투자자에게 유입되는 현금흐름은 10,300원이다. 이표채이고 이자를 후급으로 지불하기 때문에 만기에는 2년차에 해당하는 액면이자와 원금이 지급된다.<\/p><p class=\"xn\">주의사항 : 만약 해당 문제가 복리채이고, 액면이자율로 재투자 된다고 가정하면 만기에 얼마의 현금유입이 발생하는 문제와 혼동하면 안 된다. 만약 액면이자율로 재투자되는 복리채라면 만기에는 10,000원×(1+3%)²=10,609원이 유입된다.<\/p>"},{"n":79,"s":"3과목","u":"채권투자운용/투자전략","t":"31회 기출","q":"다음 중 채권펀드운용과 관련하여 적극적 운용전략이 아닌 것은?","x":"","o":["수익률곡선타기 전략","스프레드전략","금리예측전략","현금흐름일치전략"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 현금흐름일치전략은 채권포트폴리오에서 유입되는 현금흐름이 향후 예상되는 현금유출액 보다 크도록 채권포트폴리오를 구성하여 부채 상환을 보장하고, 이자율 변동 위험을 제거하여 자본조달비용을 최소화하는 소극적 채권운용 전략이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>채권운용전략 : 적극적 채권운용전략과 소극적 채권운용전략이 있다.<\/p><p class=\"xk\"><span>2<\/span>적극적 채권운용전략(금리예측전략, 채권교체전략, 스프레드 운용전략, 수익률곡선타기 전략, 수익률곡선전략)<\/p><p>① 시장이 비효율적이라는 가정하여 미래 금리 등을 예측하여 위험보다 더 높은 기대수익률을 얻으려는 채권운용전략이다.<\/p><p>② 금리예측전략 : 금리가 변동될 것을 예측하여 이에 대응하여 장·단기 채권의 교체를 통해 포트폴리오 수익률을 높이려는 전략<\/p><p>③ 채권교체전략 : 동종채권교체, 이종채권교체<\/p><p>④ 스프레드 운용전략 : 채권간의 스프레드가 확대되거나 축소되는 것을 예상하여 채권을 매매하는 전략이다.<\/p><p>⑤ 수익률곡선타기 전략 : 수익률곡선이 우상향인 상태에서 만기가 감소하면서 만기수익률이 하락하여 채권가치가 상승하는 것을 이용하는 매매전략이다. 단, 우상향하는 수익률곡선의 형태에 변화가 없다는 것을 전제해야 한다.<\/p><p>⑥ 수익률곡선전략<\/p><p class=\"xb\">바벨(Barbell)형 채권운용 : 단기채권과 장기채권만을 보유하는 전략이다. 단기채와 장기채에 비해서 중기채의 수익률이 더 오르거나 덜 하락할 것으로 예상될 때 사용한다.<\/p><p class=\"xb\">불릿(Bullet)형 채권운용 : 중기채 중심으로 채권을 보유하는 전략이다. 단기채와 장기채에 비해 중기채 수익률이 상대적으로 덜 오르거나 더 하락할 것으로 예상될 때 사용한다.<\/p><p class=\"xk\"><span>3<\/span>소극적 채권운용전략(만기보유전략, 사다리형 만기전략, 채권면역전략, 현금흐름일치전략, 채권인덱싱전략)<\/p><p>① 시장이 효율적이라고 가정하며, 모든 투자정보는 채권가격에 이미 반영이 되어 있다고 본다. 금리변동에 대한 예측을 하지 않고, 유동성관리 등을 통해 위험에 상응하는 기대수익률을 얻으려는 운용전략이다.<\/p><p>② 만기보유전략 : 채권을 매입하여 만기까지 보유하는 전략<\/p><p>③ 사다리형 만기전략 : 총 투자자금을 잔존만기마다 동일한 비율로 투자하여 금리변동에 대한 채권포트폴리오 변동성을 유지하며, 유동성을 유지하기 위한 전략<\/p><p>④ 채권면역전략 : 채권의 듀레이션과 투자기간을 일치시켜 금리변동에 따른 채권가치 변동을 최소화하려는 전략<\/p><p class=\"xb\">금리가 상승하면 만기 이전에 수령하는 이자의 재투자수익률이 증가하나, 미래에 수령할 이자 등의 현재가치가 하락하여 금리변동의 효과를 상쇄한다.<\/p><p class=\"xb\">금리가 하락하면 만기 이전에 수령하는 이자의 재투자수익률은 하락하나, 미래에 수령할 이자 등의 현재가치가 상승하여 금리변동의 효과를 상쇄한다.<\/p><p class=\"xb\">시간, 시장이자율 등이 변하면 투자기간과 듀레이션이 일치하지 않기 때문에 주기적으로 듀레이션과 투자기간을 일치시키는 조정작업이 필요하다.<\/p><p>⑤ 채권인덱싱전략 : 채권시장 전체를 나타낼 수 있는 인덱스(지수)를 모방하여 투자하면 채권시장의 평균적인 수익률을 기대할 수 있다.<\/p><p>⑥ 현금흐름일치전략 : 채권포트폴리오에서 유입되는 현금흐름이 향후 예상되는 현금유출액보다 크도록 채권포트폴리오를 구성하여 부채 상환을 보장하고, 이자율 변동 위험을 제거하여 자본조달비용을 최소화하는 방법이다.<\/p>"},{"n":80,"s":"3과목","u":"채권투자운용/투자전략","t":"32회 기출","q":"다음 중 면역전략에 대한 것으로 올바르지 않은 것은?","x":"","o":["투자기간과 듀레이션을 일치시킨다.","이자율변동 등 외부환경이 변동할 경우 채권포트폴리오를 재조정해야 한다.","이자율변동에 대한 채권포트폴리오 가치변동을 헤지하려는 목적으로 개발된 투자전략이다.","이자율이 하락하면 채권가격이 오르고 재투자수익률도 증가하는 것을 이용하여 채권의 가치를 보존하는 투자전략이다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 이자율이 하락하면 채권으로부터 미래에 수령할 현금흐름의 현재가치가 증가하는 가격효과가 존재하나, 이미 수령한 현금흐름에 대한 재투자수익률이 낮아진다. 면역전략은 가격효과와 재투자수익효과의 크기를 같게 하여 채권의 가치를 보존하는 투자전략이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>전통적 면역전략 : 금리변화에 따른 채권의 재투자변동과 가격변동을 일치시켜 채권포트폴리오의 가치변화가 발생하지 않도록 하는 소극적 채권투자전략 중의 하나이다. 구체적으로 목표투자기간과 듀레이션을 일치시켜 금리변동에 따라 채권가치가 변하지 않도록 면역시키는 전략이다.<\/p><p class=\"xb\">금리 상승시 : 재투자수익은 증가하고 미래 수령할 현금흐름의 현재가치는 감소하여 전체적인 채권포트폴리오의 가치는 변동이 없다.<\/p><p class=\"xb\">금리 하락시 : 재투자수익은 감소하고 미래 수령할 현금흐름의 현재가치는 증가하여 전체적인 채권포트폴리오의 가치는 변동이 없다.<\/p><p class=\"xk\"><span>2<\/span>듀레이션과 목표투자기간에 따른 재투자수익효과와 가격효과<\/p><div class=\"tw\"><table><tr><th>듀레이션과 목표투자기간<\/th><th>효과<\/th><\/tr><tr><td>듀레이션&gt;목표투자기간<\/td><td>재투자수익효과&lt;가격효과<\/td><\/tr><tr><td>듀레이션&lt;목표투자기간<\/td><td>재투자수익효과&gt;가격효과<\/td><\/tr><tr><td>듀레이션=목표투자기간<\/td><td>재투자효과=가격효과<\/td><\/tr><\/table><\/div><p class=\"xk\"><span>3<\/span>자산부채 연계면역전략(순자산가치 면역전략)<\/p><p class=\"xb\">자산과 부채의 듀레이션 갭을 최소화하여 순자산가치 변동성을 최소화하는 방법이다.<\/p><p class=\"xb\">자산의 금액듀레이션과 부채의 금액듀레이션을 일치시키면 이자율변동에 면역효과가 발생한다.<\/p>"},{"n":81,"s":"3과목","u":"채권투자운용/투자전략","t":"33회 기출","q":"채권에 대한 다음 설명 중 잘못된 것은?","x":"","o":["통화안정채권은 할인채로 발행한다.","복리채는 만기 이전에는 현금흐름이 투자자에게 발생하지 않는다.","이자율이 하락하면 할인채는 재투자위험에 노출된다.","국채는 경쟁입찰, 첨가소화, 교부발행의 방식으로 채권을 발행한다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 할인채는 만기 이전에 현금흐름이 발생하지 않기 때문에 재투자위험에 노출되지 않는다. 다만 이자율변동에 따른 만기현금흐름의 현재가치변동에 따른 가격위험에 노출된다. 복리채는 만기에 복리로 재투자한 액면이자와 원금을 같이 지급하기 때문에 만기 이전에 현금흐름이 발생하지 않는다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>국채 발행절차<\/p><p class=\"xb\">채권발행계획안 기획재정부에 제출 → 기획재정부 계획안 확정 → 국무회의 심의 및 결정 → 대통령 재가 → 국회의결 → 채권발행 확정(기획재정부는 채권발행을 담당하고, 원금상환, 이자지급 등의 발행 및 관리업무는 한국은행이 대행함)<\/p><p class=\"xk\"><span>2<\/span>국채발행방법<\/p><p class=\"xb\">경쟁입찰 : 외평채권, 국고채권 등의 국채 발행시 주로 사용함.<\/p><p class=\"xb\">첨가소화 : 법령에 의해 첨가소화되는 방법으로 국민주택채권이 해당됨.<\/p><p class=\"xb\">교부발행 : 공공용지 보상채권의 발행방법으로 사용<\/p><p class=\"xk\"><span>3<\/span>통화안정증권발행(할인채)<\/p><p class=\"xb\">한국은행이 공개시장조작의 일환으로 시중 통화량 조절을 목적으로 발행하는 채권<\/p><p class=\"xb\">중앙은행이 발행하기 때문에 국채에 준한다.<\/p><p class=\"xk\"><span>4<\/span>지방채 발행방법 : 공모발행, 매출발행<\/p>"},{"n":82,"s":"3과목","u":"파생상품투자운용/투자전략","t":"38회 기출","q":"현재 주가는 100이다. 1기간 후 주가는 110이 되거나 90이 된다. 1기간 무위험수익률은 2%이다. 1기간 이항모형이 성립할 경우 행사가격이 100이고 이 주식을 기초자산으로 하는 콜옵션의 가치는 얼마인가?","x":"","o":["5.55","5.88","6.66","7.22"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 현재주가와 미래주가를 통해 위험중립확률을 계산하고, 위험중립확률을 통해 주가 상승시 콜옵션의 가치와 주가 하락시 콜옵션의 가치를 계산한 후 무위험이자율로 할인하면 현재 시점의 콜옵션가치를 계산할 수 있다.<\/p><p class=\"xf\">100 = [110×p + 90×(1-p)] / (1+2%),   p = 60%<\/p><p class=\"xb\">주가 상승시 콜옵션가치=상승시 주가-행사가격=110-100=10원<\/p><p class=\"xb\">주가 하락시 콜옵션가치는 행사가격 100보다 낮은 90이기 때문에 콜옵션은 행사되지 않아 그 값은 0이다.<\/p><p class=\"xf\">현재 콜옵션가치 = (10×60% + 0×40%) / (1+2%) = 5.88(원)<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>위험중립확률 접근법<\/p><p class=\"xf\">주가가 상승할 위험중립확률 : p<\/p><p class=\"xf\">현재주가 = [상승시 주가×p + 하락시 주가×(1-p)] / (1+Rf)<\/p><p class=\"xf\">C = [p×Cu + (1-p)×Cd] / (1+Rf)<\/p><p class=\"xn\">(p : 주가 상승 확률(위험중립확률), 1-p : 주가 하락 확률(위험중립확률), Rf : 무위험이자율)<\/p>"},{"n":83,"s":"3과목","u":"파생상품투자운용/투자전략","t":"34회 기출","q":"다음 중 콜옵션, 풋옵션 모두 매수포지션에서 두 부호가 양(+)의 값으로 동일한 것은?","x":"","o":["로우(Rho)","쎄타(theta)","델타(delta)","감마(gamma)"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 매수포지션일 경우 콜옵션과 풋옵션의 감마는 둘 다 양수이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>옵션 변수 변화에 따른 옵션가치 변화(매수포지션을 가정함)<\/p><div class=\"tw\"><table><tr><th>옵션변수<\/th><th>콜옵션<\/th><th>풋옵션<\/th><\/tr><tr><td>델타<\/td><td>+<\/td><td>-<\/td><\/tr><tr><td>감마<\/td><td>+<\/td><td>+<\/td><\/tr><tr><td>세타*<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>베가<\/td><td>+<\/td><td>+<\/td><\/tr><tr><td>로우<\/td><td>+<\/td><td>-<\/td><\/tr><\/table><\/div><p class=\"xn\">* 콜옵션의 경우 만기가 감소할 경우 옵션가치도 감소하기 때문에 시간변화에 대한 옵션가치변화는 같은 방향으로 움직인다. 즉 세타는 양수이어야 한다. 유러피안 풋옵션의 경우 시간가치가 음수인 구간도 존재하여 만기변화에 대한 옵션가치변동은 같은 방향(+), 반대방향(-) 모두 가능하다. 그러나 협회 기본서에서는 이러한 세부적인 구분 없이 시간이 감소시 옵션가치가 대체로 감소하는 것만을 고려하여, 관행적 표현인 만기변동에 대한 옵션가치 변동을 음수로 표현하였다. 협회시험의 채점은 협회기본서를 기준으로 채점하기 때문에 수험목적으로 콜옵션과 풋옵션의 세타는 음수로 받아들이고 시험을 준비하는 것이 타당하다.<\/p>"},{"n":84,"s":"3과목","u":"파생상품투자운용/투자전략","t":"32회 기출","q":"현재 KOSPI 200 지수선물의 9월물 가격은 250pt이고 12월물 가격은 254pt이다. 두 선물의 스프레드가 줄어들 것으로 예상한다. 수익을 얻기 위한 거래전략은 무엇인가?","x":"","o":["9월물 매도, 12월물 매수","9월물 매수, 12월물 매도","9월물 매도, 12월물 매도","9월물 매수, 12월물 매수"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 스프레드는 한 개는 매수, 다른 한 개는 매도 포지션을 동시에 갖고 있는 것을 의미한다. 현재 스프레드는 4pt(12월물-9월물)이다. 스프레드가 줄어든다는 것은 9월물의 가격이 상승하고, 12월물의 가격이 하락한다는 의미이다. 그러므로 가격이 상승할 것은 매입하고, 가격이 하락할 것은 매도해야 한다. 가격이 상승하는 9월물은 매수하고 가격이 하락할 것으로 예상되는 12월물은 매도해야 한다.<\/p>"},{"n":85,"s":"3과목","u":"파생상품투자운용/투자전략","t":"31회 기출","q":"다음 중 주가가 100원에서 200원으로 증가했다. 동시에 이 주식을 기초자산으로 하는 콜옵션의 가치가 8원에서 10원으로 증가하였다면 이 콜옵션의 델타는 얼마인가?","x":"","o":["0.02","0.1","1.0","100"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 옵션델타=옵션가격변동/기초자산가격변동=2원/100원=0.02이다. 콜옵션은 기초자산 가격이 증가할 때 콜옵션의 가격도 증가하므로 옵션 델타는 양수이다. 반면에 풋옵션은 기초자산가격이 증가할 때 풋옵션 가격이 하락하므로 풋옵션 델타는 음수이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>옵션델타(헤지비율)<\/p><p class=\"xf\">P + S = C + PV(X)  → 양변을 주가 S로 편미분한다.<\/p><p class=\"xf\">ΔP/ΔS + 1 = ΔC/ΔS  → Δp + 1 = Δc  (풋옵션 델타 + 1 = 콜옵션 델타)<\/p>"},{"n":86,"s":"3과목","u":"파생상품투자운용/투자전략","t":"32회 기출","q":"다음 중 기초자산가격이 하락할 경우에만 수익이 발생하는 포지션은?","x":"","o":["콜옵션 매수","풋옵션 매수","콜불스프레드 매수","스트래들 매수"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 풋옵션을 매수하면 Max(X-S, 0)이므로 기초자산가격 S가 하락하면 수익이 발생한다. 스트래들의 경우 기초자산가격이 하락하거나 상승할 때 모두 수익이 발생할 수 있다. 스트래들은 동일한 행사가격의 콜옵션 1개와 풋옵션 1개를 각각 매수한 포지션이고, 기초자산가격이 큰 폭으로 하락하거나 큰 폭으로 상승하면 수익이 발생한다. 문제에 가장 적합한 것은 풋옵션 매수포지션이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>콜옵션 매입자의 손익<\/p><p class=\"xn\">[그림 ①] 콜옵션 매입 — 만기주가(ST)가 행사가격 X보다 높으면 (S0-X)만큼 이익, X 이하면 0<\/p><p class=\"xn\">[그림 ②] 풋옵션 매입 — 만기주가(ST)가 행사가격 X보다 낮으면 (X-S1)만큼 이익, X 이상이면 0<\/p><p class=\"xn\">[그림 ③] 강세 스프레드 — 행사가격 X1 콜매입(c1) + 행사가격 X2 콜매도(c2). X1 아래에서는 손실 고정, X2 위에서는 이익 고정<\/p><p class=\"xk\"><span>2<\/span>스트래들 매수<\/p><p class=\"xn\">[그림] 풋 1계약 매수 + 콜 1계약 매수 — 손익이 행사가격 X에서 가장 낮은 V자 모양(최저점 X-C0-P0 표시). 주가가 X에서 크게 오르거나 크게 내리면 이익<\/p>"},{"n":87,"s":"3과목","u":"파생상품투자운용/투자전략","t":"32회 기출","q":"방어적 풋에 대한 설명으로 올바른 것으로만 짝지어진 것은?","x":"<div class=\"box\"><p>㉠ 풋옵션을 매수하고 기초자산을 매수하여 포지션을 구성한다.<\/p><p>㉡ 풋옵션을 매수하고 기초자산을 매도하여 포지션을 구성한다.<\/p><p>㉢ 방어적 풋을 만들기 위한 초기에는 현금유출이 발생한다.<\/p><\/div>","o":["㉠, ㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 방어적 풋은 기초자산을 보유한 상태에서 풋옵션을 매수하여 기초자산가격이 하락하면 풋옵션에서 이익이 발생하여 기초자산가격 하락위험을 제거하고, 기초자산가격이 상승하면 풋옵션의 가치는 0이 되지만, 기초자산가격 상승에서 수익이 발생하는 포지션으로 포트폴리오 보험이라고도 한다. 보호적 풋을 구축하기 위해서는 풋옵션을 매입해야 하기 때문에 초기에 풋옵션 매입으로 인한 현금유출이 발생한다. 보호적 풋은 보험효과가 크지만, 풋옵션 매입비용(보험료와 같은 개념)이 크다는 단점이 있다.<\/p>"},{"n":88,"s":"3과목","u":"투자운용결과분석","t":"33회 기출","q":"기준지표에 대한 설명 중 올바른 것으로 짝지어진 것은?","x":"<div class=\"box\"><p>㉠ 포트폴리오 운영전에 결정되어야 한다.<\/p><p>㉡ 측정하길 원하는 기간마다 기준지표의 수익률을 계산할 수 있어야 한다.<\/p><p>㉢ 기준지표에 편입된 종목과 해당 종목의 구성비율이 미리 공개되어야 한다.<\/p><\/div>","o":["㉠, ㉡","㉡, ㉢","㉠, ㉢","㉠, ㉡, ㉢"],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> 모든 보기가 기준지표가 가져야 할 특성이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>기준지표의 바람직한 속성<\/p><p class=\"xb\">명확성 : 기준 지표를 구성하는 종목과 비중을 정확하게 표시해야 하고, 원칙이 있는 객관적인 방법으로 구성해야 한다.<\/p><p class=\"xb\">투자가능성 : 실행 가능한 투자대안이 되어야 한다. 즉, 기준지표 구성 종목에 투자해서 보유할 수 있어야 한다.<\/p><p class=\"xb\">측정가능성 : 일반에게 공개된 정보이어야 하며, 원하는 기간마다 기준지표의 수익률을 계산할 수 있어야 한다.<\/p><p class=\"xb\">적합성 : 펀드매니저의 운용스타일이나 성향에 적합해야 한다.<\/p><p class=\"xb\">투자의견 반영 : 펀드매니저가 기준지표를 구성하는 종목에 대한 투자지식과 의견을 가져야 한다.<\/p><p class=\"xb\">사전적으로 결정 : 펀드의 평가 혹은 운용이 되기전에 사전에 미리 정해져야 한다.<\/p>"},{"n":89,"s":"3과목","u":"투자운용결과분석","t":"32회 기출","q":"다음 중 금액가중수익률에 대한 설명으로 올바른 것만을 고른 것은?","x":"<div class=\"box\"><p>㉠ 펀드의 현금유출입을 반영한다.<\/p><p>㉡ 투자자 입장에서 펀드투자의 성과평가가 가능하다.<\/p><p>㉢ 펀드운용사의 공정한 성과비교가 가능하다.<\/p><p>㉣ 펀드매니저의 운용능력을 측정하는데 적합하다.<\/p><\/div>","o":["㉠, ㉡","㉠, ㉢, ㉣","㉠, ㉡, ㉢","㉠, ㉡, ㉢, ㉣"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> 금액가중수익률은 투자자 입장에서 자금의 유출과 유입을 반영하여 투자자의 성과평가에 적합한 수익률이다. 펀드운용사간의 공정한 성과비교와 펀드매니저의 펀드 운용능력을 측정하는 데에는 부적합하다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>기하평균수익률(펀드매니저 운용수익률, 시간가중수익률)<\/p><p class=\"xb\">투자 중간에 발생한 수익이 복리로 재투자되는 것을 반영한다.<\/p><p class=\"xb\">최초 투자 이후 중도 투자금액이나 회수금액을 반영하지 못하여, 펀드매니저의 투자금액의 회수 등에 대한 재량권이 없는 경우 이들의 투자성과 계산에 적합한 수익률이다.<\/p><p class=\"xb\">과거 일정 기간의 투자수익률 계산에는 적합하나 미래 기대수익률 계산에는 적합하지 못하다.<\/p><p class=\"xk\"><span>2<\/span>내부수익률(투자자 운용수익률, 금액가중수익률)<\/p><p class=\"xb\">서로 상이한 시점에서 발생하는 현금흐름의 크기와 화폐의 시간가치를 고려한 평균 투자수익률<\/p><p class=\"xb\">현금유입액과 유출액의 현재가치를 일치시켜 주는 할인율 혹은 수익률<\/p><p class=\"xb\">금액가중수익률이라고도 하며, 펀드 투자자의 투자성과 평가에 적절한 수익률<\/p>"},{"n":90,"s":"3과목","u":"투자운용결과분석","t":"32회 기출","q":"다음 정보를 이용하여 젠센의 알파를 올바르게 계산한 것은?","x":"<div class=\"box\"><p>• 포트폴리오의 베타 1, 무위험수익률 3%<\/p><p>• 기준지표수익률 5%, 펀드의 실현된 수익률 8%<\/p><\/div>","o":["1%","3%","5%","8%"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 젠센의 알파=포트폴리오 수익률-CAPM으로 계산한 포트폴리오 기대수익률=8%-5%=3%<\/p><p class=\"xf\">CAPM으로 계산한 포트폴리오 기대수익률 = 무위험수익률 + 포트폴리오 베타×(기준지표수익률-무위험수익률) = 3% + 1×(5%-3%) = 5%<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>젠센의 알파=포트폴리오 수익률-CAPM으로 계산한 포트폴리오 요구수익률<\/p><p class=\"xk\"><span>2<\/span>주의사항<\/p><p class=\"xb\">펀드의 기준지표수익률을 시장포트폴리오 수익률 대신 사용한다. 만약 펀드가 시장 전체에 투자한다면 시장포트폴리오 수익률도 기준지표수익률로 사용할 수 있다.<\/p><p class=\"xb\">젠센의 알파는 펀드매니저의 펀드 운용에 대한 절대적인 초과수익률을 측정한다.<\/p><p class=\"xb\">펀드매니저의 젠센의 알파가 지속적으로 양의 수익률을 달성했다면 유능한 펀드매니저라고 볼 수 있고, 반대로 지속적으로 젠센의 알파가 음의 값이 나왔다면 유능한 펀드매니저라고 말할 수 없다.<\/p><p class=\"xb\">미래에 대한 예측력 없이 증권을 단순 매입후 보유할 경우 펀드의 수익률이 기준지표의 수익률과 동일하면 젠센의 알파값은 0이 된다.<\/p><p class=\"xk\"><span>3<\/span>젠센의 알파 사용시 고려사항<\/p><p class=\"xb\">수익률 추정구간 : 월간기간 이상에 대한 수익률을 이용<\/p><p class=\"xb\">분석기간 : 최소 30개 이상의 수익률을 대상으로 한다. 월간 수익률을 이용하기 때문에 약 3년간의 관측기간이 필요하다.<\/p><p class=\"xb\">무위험수익률 : 미국의 경우 T-Bill의 수익률, 우리나라는 CD수익률 등이 주로 활용된다.<\/p><p class=\"xb\">기준 포트폴리오 수익률(기준지표수익률) : 운용하는 펀드의 투자 목적에 부합되는 지표의 수익률을 사용한다.<\/p><p class=\"xb\">유의점 : 회귀분석을 이용하여 젠센의 알파를 계산하기 때문에 회귀분석의 통계적인 유의성이 충족되지 않을 때는 젠센의 알파값의 크기나 부호의 해석을 할 수 없다.<\/p>"},{"n":91,"s":"3과목","u":"투자운용결과분석","t":"35회 기출","q":"다음 중 RAROC 기준으로 투자성과가 가장 높은 것은 어느 것인가? (단, 투자금액은 모두 100억 원이다)","x":"","o":["3% 수익, VaR 2억 원","3% 수익, VaR 3억 원","5% 수익, VaR 6억 원","6% 수익, VaR 6억 원"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> RAROC(위험조정수익률=투자수익/VaR)은 투자금액을 기준으로 계산할 수 있고, 초과투자수익률을 기준으로 계산할 수 있다. 문제에서 투자금액이 동일하고, 무위험자산에 대한 정보가 주어지지 않았으므로 투자수익률을 기준으로 RAROC를 계산하여 정답에 접근하면 된다.<\/p><div class=\"tw\"><table><tr><th>투자수익<\/th><th>VaR<\/th><th>RAROC<\/th><\/tr><tr><td>3억 원<\/td><td>2억 원<\/td><td>3/2 = 1.5<\/td><\/tr><tr><td>3억 원<\/td><td>3억 원<\/td><td>3/3 = 1.0<\/td><\/tr><tr><td>5억 원<\/td><td>6억 원<\/td><td>5/6 = 0.83<\/td><\/tr><tr><td>6억 원<\/td><td>6억 원<\/td><td>6/6 = 1.0<\/td><\/tr><\/table><\/div><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>RAROC(Risk-Adjusted Return On Capital)<\/p><p class=\"xf\">RAROC = Rp / VaR   (Rp : 펀드의 평균수익률, VaR : 최대 손실액)<\/p><p class=\"xb\">위험관리와 관련해서 금융기관에서 제한적으로 사용되고 있다.<\/p>"},{"n":92,"s":"3과목","u":"거시경제","t":"32회 기출","q":"다음 중 IS-LM곡선에 대한 설명으로 틀린 것은? (단, IS곡선은 우하향을 가정한다)","x":"","o":["세금을 감소시키면 IS곡선은 우측으로 이동한다.","물가가 상승하면 LM곡선은 좌측으로 이동한다.","화폐수요함수는 국민소득과 양의 관계, 이자율과는 음의 관계에 있다.","LM곡선이 수평이면 구축효과가 발생한다."],"a":4,"e":"<p class=\"xh\"><b>해설<\/b> LM곡선이 수평인 상태는 유동성함정상태이며, 구축효과는 발생하지 않는다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>구축효과 : 정부지출의 증가는 시장의 자금 수요를 증가시켜 시장이자율이 상승하고 이로 인해 민간 투자가 감소하여 정부지출금액보다 적은 수준의 국민소득이 증가하는 효과이며, 케인즈 학파는 구축효과가 사실상 없다고 주장하며, 고전학파는 완전구축효과가 존재하여 재정정책의 무용성을 주장한다.<\/p><p class=\"xk\"><span>2<\/span>유동성함정 : 경기가 극심한 불경기일 때 시장이자율이 임계이자율 보다 낮아서, 모든 사람은 채권보유를 하지 않고 현금보유를 하려는 상황이며, 이자율이 추가로 하락하지 않는 상황. 정부지출을 증가시켜도 추가적인 이자율이 상승하지 않아 구축효과가 발생하지 않는다.<\/p><p class=\"xk\"><span>3<\/span>IS-LM모형은 이자율과 국민소득간의 관계를 나타낸다.<\/p><p class=\"xk\"><span>4<\/span>IS곡선이 우하향하고 LM곡선이 우상향<\/p><p class=\"xb\">물가하락, 통화량 증가는 LM곡선을 우측으로 이동 → 시장이자율 하락<\/p><p class=\"xb\">조세감소, 정부지출 증가는 IS곡선을 우측으로 이동 → 시장이자율 하락<\/p><p class=\"xk\"><span>5<\/span>IS곡선이 우하향하고 LM곡선이 수직(구축효과 100% 발생)<\/p><p class=\"xb\">물가하락, 통화량 증가는 LM곡선을 우측으로 이동 → 시장이자율 하락<\/p><p class=\"xb\">조세감소, 정부지출 증가는 IS곡선을 우측으로 이동 → 시장이자율 불변<\/p><p class=\"xk\"><span>6<\/span>IS곡선이 우하향하고 LM곡선이 수평(유동성함정)<\/p><p class=\"xb\">물가하락, 통화량 증가는 LM곡선을 우측으로 이동 → 시장이자율 불변<\/p><p class=\"xb\">조세감소, 정부지출 증가는 IS곡선을 우측으로 이동 → 시장이자율 불변<\/p><p class=\"xc\">[확인 필요] 4번·5번의 &quot;IS곡선 우측 이동&quot;은 일반 이론상 시장이자율이 상승하는 경우입니다. 사진대로 옮겼으니 교재 표기를 확인해 주세요.<\/p>"},{"n":93,"s":"3과목","u":"거시경제","t":"32회 기출","q":"다음에서 설명하는 것은 무엇인가?","x":"<div class=\"box\"><p>경기가 극심한 불황을 겪으면 물가가 하락하여 자산의 가치가 증가하여 소비도 증가하는 현상<\/p><\/div>","o":["유동성함정","피구효과","구축효과","깁슨의 역설"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 피구효과에 대한 설명이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>피구효과(실질잔액효과) : 경기불황이 심해지면 물가가 하락하여 경제주체들이 보유한 화폐의 실질가치가 증가하고 이로 인해 부의 증가가 발생하고, 이는 소비 및 총수요가 추가로 발생하여 정부의 개입 없이 경기불황을 탈출이 가능하다고 주장한다. 그러나 피셔 등은 물가하락은 실질부채의 증가를 가져올 수 있고 경기주체의 소비가 위축되어 그 결과 경기불황이 가속화 될 수도 있다고 주장하였다(부채-디플레이션 이론).<\/p><p class=\"xk\"><span>2<\/span>리카르도 불변정리 : 항상소득에 의해서만 항상소비가 의존하기 때문에 일시적 세금감소는 항상소득에 영향을 줄 수 없어 소비에 변동이 없다. 소비에 영향을 주기 위해서는 영구적 세금감소가 필요하다. 일시적인 세금감소를 통한 정부의 확대재정정책은 총수요에 영향을 주지 못한다.<\/p><p class=\"xk\"><span>3<\/span>정책무용성 정리 : 합리적 기대학파에 따르면 예상된 화폐공급 증가는 물가만을 상승시키고 국민소득에 영향을 줄 수 없다.<\/p><p class=\"xk\"><span>4<\/span>깁슨의 역설 : 고전학파는 금리수준과 물가와는 관계가 없다고 하였으나, 관찰에 따르면 명목금리가 높을 때 물가도 높았고, 명목금리가 낮을 때 물가도 낮았다. 고전학파의 기존 믿음과 관찰된 현상이 다름을 설명하려는 것이다.<\/p>"},{"n":94,"s":"3과목","u":"거시경제","t":"32회 기출","q":"다음 경제지표에 대한 설명으로 올바른 것은?","x":"","o":["BSI지수가 80이면 경기 수축기이다.","CSI를 통해 경기의 방향과 폭을 알 수 있다.","GDP 디플레이터는 실질 GDP를 명목 GDP로 나눈 비율이다.","화폐유통속도는 화폐량을 명목 GDP로 나눈 값이다."],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> BSI가 100보다 크면 경기확장기, 100보다 작으면 경기수축기를 의미한다.<\/p><p class=\"xs\">오답풀이<\/p><p>② CSI(소비자태도지수)를 통해 경기의 방향은 알 수 있으나 그 폭을 알 수는 없다.<\/p><p>③, ④ GDP 디플레이터=명목 GDP/실질 GDP이며 화폐유통속도 V=명목 GDP/화폐량이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>기업경기실사지수(BSI, Business Survey Index)<\/p><p class=\"xf\">BSI = (X - Y) + 100   (X : 증가를 예상한 업체수의 비율, Y : 감소를 예상한 업체수의 비율)<\/p><p class=\"xb\">BSI가 100 이상이면 확장국면, 100 이하이면 수축국면으로 판단함.<\/p><p class=\"xb\">기업의 활동 및 경기동향 등에 대한 기업가의 판단, 전망 및 이에 대비한 계획을 설문서를 통해 조사분석하여 전반적인 경기동향을 파악하는 방법<\/p><p class=\"xb\">단기 경기예측수단임.<\/p><p class=\"xb\">경기지표 및 계량경제 모델에 의한 경기분석과 예측을 보완하는 수단으로 활용됨.<\/p><p class=\"xb\">경기 변화방향을 조사하며, 전기를 기준으로 증가, 동일, 감소 등의 변화방향을 조사함.<\/p><p class=\"xk\"><span>2<\/span>소비자태도지수(CSI, Consumer Sentiment Index)<\/p><p class=\"xb\">경기수축기에 있어 기업실사지수보다 일정 기간 선행하는 경향이 있어 경기국면 변화 예측에 유용함.<\/p><p class=\"xb\">CSI가 100 이상이면 확장국면, 100 이하이면 수축국면으로 판단함.<\/p><p class=\"xk\"><span>3<\/span>화폐유통속도(V)=명목 GDP/통화량(M), 명목 GDP=물가×실질 GDP<\/p><p class=\"xf\">화폐수량방정식 MV = PY   (M : 통화량, V : 화폐유통속도, P : GDP 디플레이터, Y : 실질 GDP)<\/p><p class=\"xk\"><span>4<\/span>물가지수<\/p><p class=\"xb\">소비자물가(CPI) : 가계의 주요한 소비지출 품목의 가격 변동을 가중평균하여 추계함.<\/p><p class=\"xb\">생산자물가(PPI) : 국내시장에서 거래되는 생산품의 생산자 판매가격을 가중평균하여 추계함.<\/p><p class=\"xb\">GDP 디플레이터 : 명목 GDP와 실질 GDP간의 비율이며 국민경제 전체의 물가압력을 측정하는 지수로 사용됨.<\/p>"},{"n":95,"s":"3과목","u":"거시경제","t":"35회 기출","q":"이자율기간구조에 대한 것으로 틀린 것은?","x":"","o":["시장분할이론은 전반적인 수익률곡선의 이동에 대해서 설명력이 낮다.","유동성프리미엄이론에서는 장기채권과 단기채권의 불완전 대체가 존재한다.","특정시장선호이론에서는 단기채권의 금리에 유동성프리미엄을 가산하여 장기채권금리를 도출한다.","불편기대이론에 따르면 장기채권과 단기채권간에는 완전 대체관계가 존재하기 때문에 장기채권에 투자하는 것과 동일한 기간동안 단기채권에 투자하는 것은 그 기대수익률이 같다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 특정시장선호이론은 투자자마다 자신이 선호하는 특정 만기가 존재하며, 선호하지 않는 만기영역이라도 충분한 기간 프리미엄이 주어지면 다른 만기에도 투자할 수 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>이자율 기간구조이론<\/p><p>① 불편기대이론<\/p><p class=\"xb\">미래의 기대이자율과 선도이자율이 같다.<\/p><p class=\"xb\">장·단기 채권간의 완전한 대체관계를 가정함. 투자기간이 동일하다면 장기채권에 투자할 경우와 단기채권에 여러 번 투자할 경우 기대수익률이 동일하다.<\/p><p>② 시장분할이론<\/p><p class=\"xb\">만기에 따라 시장이 분할되어 있으며, 각 만기별 자금의 수요와 공급에 의해 이자율이 결정됨.<\/p><p class=\"xb\">장단기 채권간의 대체관계가 없다고 가정함.<\/p><p class=\"xb\">수익률곡선이 대체로 우상향하는 것을 잘 설명하나 수익률곡선의 이동은 잘 설명하지 못함.<\/p><p>③ 유동성프리미엄이론<\/p><p class=\"xb\">기대이자율에 유동성프리미엄을 가산하여 금리가 결정됨.<\/p><p class=\"xb\">장·단기 채권간의 불완전한 대체관계가 존재한다.<\/p><p class=\"xb\">유동성프리미엄은 항상 양의 값을 갖으며, 만기가 길어질수록 그 값은 커진다.<\/p><p class=\"xb\">우상향하는 수익률곡선에 대해서 잘 설명하고, 수익률 곡선의 이동도 잘 설명함.<\/p><p>④ 특정 시장선호이론<\/p><p class=\"xb\">투자자들은 만기에 따라 자신이 특히 선호하는 시장이 존재함.<\/p><p class=\"xb\">장기채권의 금리는 만기까지 예상된 평균단기이자율과 기간프리미엄의 합으로 표현됨.<\/p>"},{"n":96,"s":"3과목","u":"분산투자기법","t":"30회 기출","q":"평균-분산 기준에 의해 지배당하지 않는 자산들의 수익률과 위험을 연결한 선은 무엇인가?","x":"","o":["자본시장선","증권시장선","효율적 투자선","증권특성선"],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> 효율적 투자선에 대한 설명이다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>자본시장선(CML, Capital Market Line)<\/p><p class=\"xb\">무위험자산이 존재할 때, 평균-분산기준에 의해 도출된 효율적자산과 무위험자산을 결합하여 만든 포트폴리오 중에 위험대비 보상이 가장 큰 점을 연결한 직선<\/p><p class=\"xb\">총위험(표준편차)과 효율적 자산의 기대수익률간의 관계를 나타내기 때문에 비효율적 자산의 기대수익률과 위험의 관계는 알 수 없다.<\/p><p class=\"xk\"><span>2<\/span>증권시장선(SML, Security Market Line)<\/p><p class=\"xb\">개별주식의 베타와 기대수익률간의 관계를 나타낸 직선<\/p><p class=\"xk\"><span>3<\/span>효율적 투자선<\/p><p class=\"xb\">평균-분산 지배원리에 의해 지배당하지 않는 효율적 자산들을 연결한 선<\/p><p class=\"xk\"><span>4<\/span>증권특성선<\/p><p class=\"xb\">시장포트폴리오의 수익률과 개별자산의 수익률과의 관계를 나타낸 선<\/p>"},{"n":97,"s":"3과목","u":"분산투자기법","t":"38회 기출","q":"CAPM을 이용하여 계산한 다음 A 주식의 요구수익률은?","x":"<div class=\"box\"><p>• 무위험수익률 4%<\/p><p>• 시장포트폴리오 수익률 6%<\/p><p>• 시장포트폴리오 수익률의 표준편차 0.4<\/p><p>• 시장포트폴리오 수익률과 A 주식 수익률과의 공분산 0.16<\/p><\/div>","o":["6%","6.5%","7.0%","8.0%"],"a":1,"e":"<p class=\"xh\"><b>해설<\/b> SML수식을 이용하여 주식 A의 요구수익률을 계산한다.<\/p><p class=\"xf\">βi = σiM / σM² = ρiM·σi·σM / σM² = ρiM·σi / σM<\/p><p class=\"xf\">주식 A의 베타 = 주식 A와 시장포트폴리오와의 공분산 / 시장포트폴리오 분산 = 0.16 / 0.4² = 1<\/p><p class=\"xn\">※ 베타를 변형하는 방법을 익혀서 주어진 자료에 맞게 문제를 풀 수 있어야 한다.<\/p><p class=\"xb\">주어지는 자료 : 공분산, 상관계수, 시장포트폴리오 표준편차, 시장포트폴리오 분산 등<\/p><p class=\"xf\">E(RA) = Rf + βA[E(RM) - Rf] = 4% + 1×(6% - 4%) = 6%<\/p>"},{"n":98,"s":"3과목","u":"분산투자기법","t":"32회 기출","q":"다음 두 주식에 대한 설명으로 올바른 것은? (단, 무위험이자율은 2%이며, 시장포트폴리오의 기대수익률은 10%이다)","x":"<div class=\"box\"><p>• A 주식은 시장에서 거래되는 수익률이 7%이고, 베타는 0.50이다.<\/p><p>• B 주식은 시장에서 거래되는 수익률이 8%이며, 베타는 1.00이다.<\/p><\/div>","o":["A 주식과 B 주식 모두 적정하게 평가되어 있다.","A 주식은 고평가되어 있고, B 주식은 저평가되어 있다.","A 주식은 저평가되어 있고, B 주식은 고평가되어 있다.","A 주식과 B 주식 모두 저평가되어 있다."],"a":3,"e":"<p class=\"xh\"><b>해설<\/b> A 주식의 기대수익률=2%+0.5×(10%-2%)=6%, 시장에서 7%에 거래되기 때문에 A 주식은 저평가되어 있다. B 주식 기대수익률=2%+1×(10%-2%)=10%이며, B 주식은 고평가되어 있다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>균형수익률보다 높은 자산은 저평가되어 있다. 자산의 기대수익률은 자산의 할인율이다. 현금흐름의 변동 없이 자산의 할인율이 균형할인율보다 높으면 자산은 저평가되어 있으며, 반대로 현금흐름의 변동 없이 자산의 할인율이 균형할인율보다 낮으면 자산은 고평가되어 있다.<\/p><p class=\"xk\"><span>2<\/span>고평가된 자산은 해당 자산의 공매도가 증가하여 가격이 하락하고, 이 과정에서 자산의 기대수익률이 증가하여 균형으로 회복된다. 저평가된 자산은 해당 자산의 매입 수요가 증가하여 가격이 상승하고, 그 과정에서 자산의 기대수익률이 하락하여 균형으로 회복된다.<\/p><p class=\"xn\">[그림] 가로축 βi, 세로축 E(R) — SML(균형수익률) 직선 위쪽은 저평가영역(A, B), 아래쪽은 고평가영역(X, Y). A 자산과 B 자산은 저평가되어 있고, X 자산과 Y 자산은 고평가되어 있다.<\/p>"},{"n":99,"s":"3과목","u":"분산투자기법","t":"33회 기출","q":"아래 표는 각 주식의 상관계수이다. 분산투자효과가 가장 큰 것은 어느 것인가? (단, 모든 주식의 기대수익률과 표준편차는 동일하다)","x":"<div class=\"tw\"><table><tr><th>구분<\/th><th>A 주식<\/th><th>B 주식<\/th><th>C 주식<\/th><\/tr><tr><td>A 주식<\/td><td>1.0<\/td><td>0.5<\/td><td>-0.3<\/td><\/tr><tr><td>B 주식<\/td><td>0.5<\/td><td>1.0<\/td><td>0.2<\/td><\/tr><tr><td>C 주식<\/td><td>-0.3<\/td><td>0.2<\/td><td>1.0<\/td><\/tr><\/table><\/div>","o":["C 주식에 100% 투자한다.","A 주식에 50%, C 주식에 50% 투자한다.","A 주식에 50%, B 주식에 50% 투자한다.","B 주식에 50%, C 주식에 50% 투자한다."],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 분산투자효과가 크기 위해서는 자산간의 상관계수가 낮아야 한다. 자산간의 상관계수가 가장 작은 자산에 투자한다. A와 B의 상관계수는 0.5이고, A와 C의 상관계수는 -0.3, B와 C의 상관계수는 0.2이므로 A와 C에 투자하는 것이 분산투자효과가 가장 크다.<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>N개의 자산으로 구성된 포트폴리오의 수익률과 위험<\/p><p class=\"xb\">포트폴리오 기대수익률은 각 자산을 자산의 투자비중으로 가중평균하여 계산한다.<\/p><p class=\"xb\">포트폴리오의 분산은 개별자산의 분산과 자산간의 공분산의 합으로 결정한다.<\/p><p class=\"xb\">자산간의 상관계수가 -1에 가까울수록 분산투자효과가 증가하여 포트폴리오의 분산은 낮아진다.<\/p>"},{"n":100,"s":"3과목","u":"분산투자기법","t":"33회 기출","q":"총자산을 무위험자산에 30%를 투자하고 위험자산 A에 70%를 투자하였다. 자산 A의 수익률이 7%이고 무위험이자율이 4%이고 자산 A의 표준편차가 2%인 경우 포트폴리오의 변동성보상비율은 얼마인가?","x":"","o":["1.4","1.5","1.6","1.7"],"a":2,"e":"<p class=\"xh\"><b>해설<\/b> 포트폴리오의 변동성보상비율을 계산해야 하기 때문에 포트폴리오의 무위험자산 대비 초과수익률을 포트폴리오의 표준편차로 나누어 줘야 한다. 즉 포트폴리오의 샤프비율을 계산해야 한다.<\/p><p class=\"xb\">포트폴리오의 기대수익률=30%×4%+70%×7%=1.2%+4.9%=6.1%<\/p><p class=\"xb\">포트폴리오 위험=70%×2%=1.4%<\/p><p class=\"xb\">변동성보상비율=포트폴리오 초과수익률/포트폴리오 표준편차=(6.1%-4%)/1.4%=1.5<\/p><p class=\"xs\">개념정리<\/p><p class=\"xk\"><span>1<\/span>위험자산과 무위험자산으로 구성된 포트폴리오<\/p><p class=\"xb\">포트폴리오 기대수익률은 위험자산과 무위험자산에 투자한 비율로 가중평균하여 계산한다.<\/p><p class=\"xf\">E(Rp) = E[(1-w)Rf + wRi]<\/p><p class=\"xf\">       = E(Rf - wRf) + E(wRi)<\/p><p class=\"xf\">       = E(Rf) - wE(Rf) + wE(Ri)<\/p><p class=\"xf\">       = Rf + w[E(Ri) - Rf]<\/p><p class=\"xb\">포트폴리오의 위험은 위험자산의 표준편차에 위험자산의 투자비율을 곱하여 계산한다(위험자산과 무위험자산의 공분산은 0이기 때문이다).<\/p><p class=\"xf\">σp² = Var([(1-w)Rf + wRi])<\/p><p class=\"xf\">    = (1-w)²Var(Rf) + w²Var(Ri) + 2Cov[(1-w)Rf, wRi]<\/p><p class=\"xf\">    = w²σi²<\/p><p class=\"xf\">σp = wσi<\/p>"}];

let pending=[], retried=false;
function setSync(state){
  const t={ok:'저장됨 · 인터넷 기록에 반영',err:'인터넷 저장 실패 · 이 기기에는 남아 있음 (다음 답을 고를 때 다시 보냄)',busy:'저장 중…',wait:'기록 불러오는 중',off:'인터넷 기록 연결 전 · 이 기기에만 저장'}[state];
  document.querySelectorAll('.sync').forEach(el=>{el.className='sync '+(state==='off'?'local':state);el.querySelector('span').textContent=t});
}
async function fetchPeople(){
  if(!API||API.indexOf('http')) return false;
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(API,{signal:ctl.signal}); clearTimeout(tm);
    const j=await r.json(); if(!j.ok) return false;
    people={}; (j.people||[]).forEach(p=>{ if(p&&p.name) people[keyOf(p.name)]=p });
    return true;
  }catch(e){ return false }
}
const dbReady=(async()=>{ setSync('wait'); const ok=await fetchPeople(); setSync(ok?'ok':(API.indexOf('http')?'off':'err')); renderPeople(ok?'':'slow') })();
function localNames(){return LS.get('tq1:names')||[]}
function remember(name){const a=localNames().filter(x=>x!==name);a.unshift(name);LS.set('tq1:names',a.slice(0,12));LS.set('tq1:last',name)}
async function pushRemote(){
  if(!me||!rec||API.indexOf('http')) return;
  if(saving){dirty=true;return}
  saving=true;
  do{
    dirty=false; setSync('busy');
    const evs=pending.slice();
    try{
      const r=await fetch(API,{method:'POST',body:JSON.stringify({key:me.key,rec,events:evs})});
      const j=await r.json(); if(!j||!j.ok) throw new Error('save');
      pending.splice(0,evs.length); LS.set('tq1:pend:'+me.key,pending); retried=false; setSync('ok');
    }catch(e){
      setSync('err');
      if(!retried){retried=true;await sleep(1500+Math.random()*1500);dirty=true}
    }
  }while(dirty);
  saving=false;
}
window.addEventListener('online',()=>{retried=false;pushRemote()});
function save(){ if(!rec) return; rec.updatedAt=now(); LS.set('tq1:rec:'+me.key,rec); pushRemote() }

/* ---------- people & start ---------- */
function summary(r){
  const st=r&&r.stats||{}; let c=0,w=0,seen=0,last=0;
  for(const k in st){seen++;c+=st[k].c||0;w+=st[k].w||0;if(st[k].last==='c')last++}
  const run=r&&r.run; const done=run?Object.keys(run.picks||{}).length:0;
  return {seen,c,w,last,rate:(c+w)?Math.round(c/(c+w)*100):null,run,done};
}
function allPeople(){
  const map={};
  for(const k in people) map[k]=people[k];
  localNames().forEach(n=>{const k=keyOf(n);if(!map[k]){const r=LS.get('tq1:rec:'+k);if(r)map[k]=r}});
  return map;
}
function renderPeople(state){
  const el=$('#people'); const map=allPeople(); const keys=Object.keys(map);
  if(!keys.length){el.innerHTML=`<span class="muted" style="font-size:14px">${state==='slow'?'공유 기록을 아직 불러오지 못했습니다. 이름을 입력해 시작할 수 있습니다.':'아직 기록이 없습니다. 이름을 입력해 첫 기록을 시작하세요.'}</span>`;return}
  keys.sort((a,b)=>(map[b].updatedAt||'').localeCompare(map[a].updatedAt||''));
  el.innerHTML=keys.map(k=>{const r=map[k],s=summary(r);
    const sub=s.run&&!s.run.done?`${s.done}/${s.run.list.length} 진행 중`:(s.rate!==null?`정답률 ${s.rate}%`:'시작 전');
    return `<button class="chip" data-name="${esc(r.name)}"><b>${esc(r.name)}</b><span>${sub}</span></button>`}).join('');
}
$('#people').addEventListener('click',e=>{const b=e.target.closest('[data-name]');if(b)loadPlayer(b.dataset.name)});
$('#f-name').addEventListener('submit',e=>{e.preventDefault();const n=$('#in-name').value.trim().replace(/\s+/g,' ');if(n)loadPlayer(n)});
try{const last=LS.get('tq1:last');if(last)$('#in-name').value=last}catch(e){}

function newRec(name){return {name,createdAt:now(),updatedAt:now(),run:null,stats:{},history:[]}}
async function loadPlayer(name){
  name=name.slice(0,20); me={name,key:keyOf(name)}; remember(name);
  const btn=$('#f-name button'); btn.disabled=true; btn.textContent='불러오는 중…';
  const local=LS.get('tq1:rec:'+me.key);
  await Promise.race([dbReady,sleep(10000)]);
  let remote=people[me.key]||null;
  if(!remote&&!API.indexOf('http')){ await fetchPeople(); remote=people[me.key]||null }
  let pick=remote; if(local&&(!remote||(local.updatedAt||'')>(remote.updatedAt||''))) pick=local;
  rec=pick?JSON.parse(JSON.stringify(pick)):newRec(name);
  rec.name=name; rec.stats=rec.stats||{}; rec.history=rec.history||[];
  LS.set('tq1:rec:'+me.key,rec);
  pending=LS.get('tq1:pend:'+me.key)||[];
  if(pick!==remote||pending.length) pushRemote();
  btn.disabled=false; btn.textContent='시작하기';
  renderHome(); show('home');
}

/* ---------- home ---------- */
const MODES={
  all:{label:'전체 100문항',list:()=>QS.map(q=>q.n)},
  s1:{label:'1과목 20문항',list:()=>QS.filter(q=>q.n<=20).map(q=>q.n)},
  s2:{label:'2과목 30문항',list:()=>QS.filter(q=>q.n>20&&q.n<=50).map(q=>q.n)},
  s3:{label:'3과목 50문항',list:()=>QS.filter(q=>q.n>50).map(q=>q.n)},
  wrong:{label:'최근에 틀린 문제',list:()=>QS.filter(q=>rec.stats[q.n]&&rec.stats[q.n].last==='w').map(q=>q.n)},
  dunno:{label:'모르겠다고 표시한 문제',list:()=>QS.filter(q=>isDunno(rec,q.n)).map(q=>q.n)},
};
function isDunno(r,n){const m=(r.marks||{})[n];return !!m&&(m.q==='dunno'||Object.values(m.o||{}).includes('u'))}
function renderHome(){
  const s=summary(rec); const run=rec.run; const wrongN=MODES.wrong.list().length; const dunnoN=MODES.dunno.list().length;
  const active=run&&!run.done&&run.list.length;
  $('#v-home').innerHTML=`
  <div class="hero" style="padding-block:28px 8px">
    <div class="eyebrow">투자자산운용사 1회 카드퀴즈</div>
    <h1>${esc(rec.name)}님</h1>
    <span class="sync"><i></i><span></span></span>
  </div>
  <div class="facts">
    <div><small>풀어 본 문항</small><b class="num">${s.seen}<span class="muted" style="font-size:14px">/100</span></b></div>
    <div><small>누적 정답률</small><b class="num">${s.rate===null?'–':s.rate+'%'}</b></div>
    <div><small>최근에 틀린 문제</small><b class="num">${wrongN}</b></div>
  </div>
  <div class="sect menu">
    ${active?`<button class="btn primary" data-act="resume"><span>이어 풀기 · ${esc(run.label)}</span><small class="num">${s.done}/${run.list.length}</small></button>`:''}
    ${run&&run.done?`<button class="btn" data-act="lastresult"><span>지난 결과 보기 · ${esc(run.label)}</span><small class="num">${run.score}/${run.list.length}</small></button>`:''}
    <button class="btn ${active?'':'primary'}" data-mode="all"><span>${active?'전체 100문항 처음부터':'전체 100문항 풀기'}</span><small>실전처럼 · 과락 판정</small></button>
    <button class="btn" data-mode="wrong" ${wrongN?'':'disabled'}><span>틀린 문제만 다시 풀기</span><small class="num">${wrongN}문항</small></button>
    <button class="btn" data-mode="dunno" ${dunnoN?'':'disabled'}><span>모르겠다고 표시한 문제 다시 보기</span><small class="num">${dunnoN}문항</small></button>
  </div>
  <div class="sect">
    <h2>과목별로 풀기</h2>
    <div class="row3">${['s1','s2','s3'].map((m,i)=>`<button class="btn" data-mode="${m}">${SUBJ[i].k}<small>${SUBJ[i].to-SUBJ[i].from+1}문항</small></button>`).join('')}</div>
  </div>
  <div class="sect" style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" data-act="records">모든 사람의 기록 보기</button>
    <button class="btn ghost" data-act="switch">다른 사람으로 바꾸기</button>
  </div>
  ${active?'<p class="hint">진행 중인 풀이가 있을 때 새로 시작하려면 버튼을 한 번 더 누르세요. 지난 풀이의 정오답 기록은 그대로 남습니다.</p>':''}`;
  setSync(API.indexOf('http')?'off':'ok');
}
$('#v-home').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  const act=b.dataset.act, mode=b.dataset.mode;
  if(act==='resume'){renderQuiz();show('quiz');return}
  if(act==='lastresult'){renderResult();show('result');return}
  if(act==='records'){renderRecords();show('records');fetchPeople().then(ok=>{if(ok&&!$('#v-records').hidden)renderRecords()});return}
  if(act==='switch'){me=null;rec=null;renderPeople();show('start');return}
  if(mode){
    const active=rec.run&&!rec.run.done&&Object.keys(rec.run.picks||{}).length;
    if(active&&!b.classList.contains('armed')){b.classList.add('armed');b.querySelector('span').textContent='한 번 더 누르면 새로 시작';setTimeout(()=>{if(b.isConnected)renderHome()},4000);return}
    startRun(mode);
  }
});
function closeRun(){
  const r=rec.run; if(!r) return; const n=Object.keys(r.picks||{}).length; if(!n||r.logged) return;
  rec.history.unshift({label:r.label,mode:r.mode,startedAt:r.startedAt,endedAt:now(),answered:n,correct:countCorrect(r),total:r.list.length,done:!!r.done});
  rec.history=rec.history.slice(0,40); r.logged=true;
}
function startRun(mode){
  closeRun();
  const list=MODES[mode].list(); if(!list.length) return;
  rec.run={mode,label:MODES[mode].label,list,pos:0,picks:{},startedAt:now(),done:false};
  save(); renderQuiz(); show('quiz');
}
const countCorrect=r=>Object.entries(r.picks||{}).filter(([n,p])=>QS[n-1].a===p).length;

/* ---------- quiz ---------- */
function renderQuiz(){
  const r=rec.run; const n=r.list[r.pos]; const q=QS[n-1]; const pick=r.picks[n]; rec.marks=rec.marks||{}; const mk=rec.marks[n]||{};
  const answered=Object.keys(r.picks).length; const correct=countCorrect(r);
  const e=q.e; const cut=e.indexOf('<p class="xs">개념정리'); const main=cut<0?e:e.slice(0,cut); const more=cut<0?'':e.slice(cut);
  const isLast=r.pos===r.list.length-1;
  $('#v-quiz').innerHTML=`
  <div class="bar">
    <div class="top">
      <button class="btn ghost" data-act="exit">← 나가기</button>
      <span class="num" style="font-weight:600">${r.pos+1} <span class="muted">/ ${r.list.length}</span></span>
      <button class="btn ghost" data-act="grid">문항표</button>
    </div>
    <div class="track"><i style="width:${answered/r.list.length*100}%"></i></div>
    <div class="top" style="font-size:13px"><span class="muted">${esc(r.label)} · 푼 문항 <span class="num">${answered}</span></span><span class="muted">맞힘 <span class="num" style="color:var(--ok);font-weight:600">${correct}</span> · 틀림 <span class="num" style="color:var(--bad);font-weight:600">${answered-correct}</span></span></div>
  </div>
  <article class="card">
    <div class="meta"><span class="qno">Q.${String(n).padStart(2,'0')}</span><span class="s">${q.s}</span><span>${esc(q.u)}</span><span>${esc(q.t)}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${q.x}
    <div class="opts">${q.o.map((t,i)=>{const k=i+1;let cls='';if(pick){if(k===q.a)cls='right';else if(k===pick)cls='wrong'}
      const ob=`<button class="opt ${cls}" data-pick="${k}" ${pick?'disabled':''}><span class="k">${MARK[k]}</span><span>${esc(t)}</span></button>`;
      const v=(mk.o||{})[k];
      return `<div class="orow">${ob}<span class="seg" role="group" aria-label="${MARK[k]} 보기 이해도"><button class="${v==='k'?'on k':''}" data-om="${k}:k">잘 안다</button><button class="${v==='u'?'on u':''}" data-om="${k}:u">모르겠다</button></span></div>`}).join('')}</div>
    <div class="mk">
      <div class="mk-h"><b>이 문제, 나는?</b><small>보기마다 「잘 안다 / 모르겠다」도 따로 누를 수 있어요</small></div>
      <div class="mk-q"><button class="know ${mk.q==='know'?'on':''}" data-qm="know">이 문제는 확실히 안다</button><button class="dunno ${mk.q==='dunno'?'on':''}" data-qm="dunno">이 문제 자체를 잘 모르겠다</button></div>
    </div>
    ${pick?`<div class="verdict ${pick===q.a?'ok':'bad'}">${pick===q.a?'정답입니다':'틀렸습니다 · 정답 '+MARK[q.a]}</div>
      <div class="exp">${main}${more?`<details><summary>개념정리 펼치기</summary><div style="display:grid;gap:6px">${more}</div></details>`:''}</div>`:''}
  </article>
  <div class="nav">
    <button class="btn" data-act="prev" ${r.pos===0?'disabled':''}>← 이전</button>
    ${isLast?`<button class="btn primary" data-act="finish">채점 결과 보기</button>`:`<button class="btn ${pick?'primary':''}" data-act="next">${pick?'다음 문제 →':'건너뛰기 →'}</button>`}
  </div>
  <p class="hint">키보드: 1~4로 답 고르기 · ←/→ 이동 · 고른 답은 바로 저장됩니다</p>`;
}
function choose(k){
  const r=rec.run; const n=r.list[r.pos]; if(r.picks[n]) return;
  r.picks[n]=k; const ok=QS[n-1].a===k;
  const st=rec.stats[n]||{c:0,w:0}; ok?st.c++:st.w++; st.last=ok?'c':'w'; st.at=now(); rec.stats[n]=st;
  pending.push({at:st.at,n,pick:k,ans:QS[n-1].a,ok,label:r.label}); LS.set('tq1:pend:'+me.key,pending);
  save(); renderQuiz();
}
function curN(){return rec.run.list[rec.run.pos]}
function markSave(n){
  rec.marks=rec.marks||{}; const m=rec.marks[n]||{};
  const o=m.o||{}; const unk=Object.keys(o).filter(k=>o[k]==='u').sort().map(k=>MARK[k]).join(' '); const kn=Object.keys(o).filter(k=>o[k]==='k').sort().map(k=>MARK[k]).join(' ');
  if(!m.q&&!Object.keys(o).length) delete rec.marks[n]; else { m.at=now(); rec.marks[n]=m }
  const q=QS[n-1];
  pending.push({type:'mark',at:now(),n,s:q.s,u:q.u,q:m.q==='know'?'확실히 안다':m.q==='dunno'?'문제 자체를 잘 모르겠다':'',unknown:unk,known:kn});
  LS.set('tq1:pend:'+me.key,pending); save(); renderQuiz();
}
function markQ(v){const n=curN();rec.marks=rec.marks||{};const m=rec.marks[n]||{o:{}};m.o=m.o||{};m.q=m.q===v?'':v;if(!m.q)delete m.q;rec.marks[n]=m;markSave(n)}
function markO(k,v){const n=curN();rec.marks=rec.marks||{};const m=rec.marks[n]||{o:{}};m.o=m.o||{};if(m.o[k]===v)delete m.o[k];else m.o[k]=v;rec.marks[n]=m;markSave(n)}
function go(d){const r=rec.run;const p=r.pos+d;if(p<0||p>=r.list.length)return;r.pos=p;save();renderQuiz();window.scrollTo(0,0)}
function finish(){
  const r=rec.run; r.done=true; r.score=countCorrect(r); r.finishedAt=now();
  closeRun(); save(); renderResult(); show('result');
}
$('#v-quiz').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.pick){choose(+b.dataset.pick);return}
  if(b.dataset.qm){markQ(b.dataset.qm);return}
  if(b.dataset.om){const [k,v]=b.dataset.om.split(':');markO(+k,v);return}
  const a=b.dataset.act;
  if(a==='prev')go(-1); else if(a==='next')go(1); else if(a==='finish')finish();
  else if(a==='exit'){renderHome();show('home')} else if(a==='grid')openGrid();
});
document.addEventListener('keydown',e=>{
  if($('#v-quiz').hidden||!$('#sheet').hidden||e.target.tagName==='INPUT') return;
  if(/^[1-4]$/.test(e.key))choose(+e.key); else if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1);
});
function openGrid(){
  const r=rec.run; const inRun=new Set(r.list);
  const sh=$('#sheet');
  sh.innerHTML=`<div class="in" role="dialog" aria-label="문항표">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>문항표</b><button class="btn ghost" data-close>닫기</button></div>
    <div class="legend"><span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>맞힘</span><span><i style="background:var(--bad-bg);border-color:var(--bad)"></i>틀림</span><span><i></i>안 푼 문항</span></div>
    <div class="grid">${QS.map(q=>{const p=r.picks[q.n];const cls=!inRun.has(q.n)?'off':p?(p===q.a?'ok':'bad'):'';const cur=r.list[r.pos]===q.n?' cur':'';
      return `<button class="cell num ${cls}${cur}" data-jump="${q.n}" ${inRun.has(q.n)?'':'disabled'}>${q.n}</button>`}).join('')}</div>
  </div>`;
  sh.hidden=false;
}
$('#sheet').addEventListener('click',e=>{
  if(e.target.id==='sheet'||e.target.closest('[data-close]')){$('#sheet').hidden=true;return}
  const b=e.target.closest('[data-jump]'); if(!b) return;
  const r=rec.run; r.pos=r.list.indexOf(+b.dataset.jump); $('#sheet').hidden=true; save(); renderQuiz(); window.scrollTo(0,0);
});

/* ---------- result ---------- */
function renderResult(){
  const r=rec.run; const score=countCorrect(r); const tot=r.list.length; const full=r.mode==='all';
  const rows=SUBJ.map(s=>{const ns=r.list.filter(n=>n>=s.from&&n<=s.to);if(!ns.length)return null;
    const c=ns.filter(n=>r.picks[n]===QS[n-1].a).length;const pass=c>=Math.ceil(ns.length*0.4);return {s,c,len:ns.length,pass}}).filter(Boolean);
  const passAll=full&&score>=60&&rows.every(x=>x.pass);
  const wrong=r.list.filter(n=>r.picks[n]&&r.picks[n]!==QS[n-1].a); const skipped=r.list.filter(n=>!r.picks[n]);
  $('#v-result').innerHTML=`
  <div class="hero" style="padding-block:28px 8px"><div class="eyebrow">${esc(rec.name)} · ${esc(r.label)}</div><h1>채점 결과</h1></div>
  <div class="card">
    <div class="score"><b>${score}</b><span class="muted num">/ ${tot}문항 · ${Math.round(score/tot*100)}%</span>
      ${full?`<span class="pill ${passAll?'ok':'bad'}">${passAll?'합격권':'불합격권'}</span>`:''}</div>
    <div class="subj">${rows.map(x=>`<div><span>${x.s.k}<small>${x.s.name}</small></span><span class="num">${x.c}/${x.len}</span><span class="pill ${x.pass?'ok':'bad'}">${x.pass?'통과':'과락'}</span></div>`).join('')}</div>
    ${full?'<p class="muted" style="margin:0;font-size:14px">합격 기준: 전체 60문항 이상, 과목별 40% 이상</p>':''}
    ${wrong.length?`<div style="display:grid;gap:8px"><b style="font-size:15px">틀린 문항 <span class="num">${wrong.length}</span></b><div class="wlist">${wrong.map(n=>`<button data-review="${n}">${n}</button>`).join('')}</div></div>`:''}
    ${skipped.length?`<p class="muted" style="margin:0;font-size:14px">안 푼 문항 ${skipped.length}개: <span class="num">${skipped.join(', ')}</span></p>`:''}
  </div>
  <div class="sect menu">
    ${wrong.length?`<button class="btn primary" data-mode="wrong"><span>틀린 문제만 다시 풀기</span><small class="num">${MODES.wrong.list().length}문항</small></button>`:''}
    <button class="btn" data-act="review"><span>문항별로 다시 보기</span><small>해설 포함</small></button>
    <button class="btn ghost" data-act="home">처음 화면으로</button>
  </div>`;
}
$('#v-result').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.review){rec.run.pos=rec.run.list.indexOf(+b.dataset.review);renderQuiz();show('quiz');return}
  if(b.dataset.mode){startRun(b.dataset.mode);return}
  if(b.dataset.act==='review'){rec.run.pos=0;renderQuiz();show('quiz')}
  if(b.dataset.act==='home'){renderHome();show('home')}
});

/* ---------- records ---------- */
function renderRecords(){
  const map=allPeople(); if(me&&rec) map[me.key]=rec;
  const keys=Object.keys(map).sort((a,b)=>(map[b].updatedAt||'').localeCompare(map[a].updatedAt||''));
  $('#v-records').innerHTML=`
  <div class="bar"><div class="top"><button class="btn ghost" data-act="back">← 돌아가기</button><span class="muted" style="font-size:13px">사람별 기록 · 문항 칸은 마지막 결과</span></div></div>
  <div style="display:grid;gap:12px;margin-top:6px">
  ${!keys.length?'<div class="empty">아직 저장된 기록이 없습니다.</div>':keys.map(k=>{const r=map[k],s=summary(r),st=r.stats||{};
    const top=Object.entries(st).filter(([n,v])=>v.w>0).sort((a,b)=>b[1].w-a[1].w||a[0]-b[0]).slice(0,8);
    return `<div class="person">
      <div class="h"><h3>${esc(r.name)}</h3><span class="muted" style="font-size:13px">마지막 기록 ${fmtDate(r.updatedAt)}</span></div>
      <div class="facts"><div><small>풀어 본 문항</small><b class="num">${s.seen}</b></div><div><small>누적 정답률</small><b class="num">${s.rate===null?'–':s.rate+'%'}</b></div><div><small>최근 틀린 문제</small><b class="num">${s.seen-s.last}</b></div></div>
      <div class="grid">${QS.map(q=>{const v=st[q.n];const cls=v?(v.last==='c'?'ok':'bad'):'';return `<span class="cell num ${cls}" title="${q.n}번 · 맞힘 ${v?v.c:0} · 틀림 ${v?v.w:0}">${q.n}</span>`}).join('')}</div>
      ${(()=>{const mk=r.marks||{};const kn=[],dn=[],ou=[];Object.keys(mk).map(Number).sort((a,b)=>a-b).forEach(n=>{const m=mk[n];if(m.q==='know')kn.push(n);if(m.q==='dunno')dn.push(n);const us=Object.keys(m.o||{}).filter(k=>m.o[k]==='u');if(us.length)ou.push(n+'번 '+us.map(k=>MARK[k]).join(''))});
        return (kn.length||dn.length||ou.length)?`<div style="display:grid;gap:6px">${dn.length?`<div class="tagline"><span class="tag u">문제 자체를 모르겠다</span><span class="num">${dn.join(', ')}</span></div>`:''}${ou.length?`<div class="tagline"><span class="tag u">모르는 보기</span><span class="num">${ou.join(' · ')}</span></div>`:''}${kn.length?`<div class="tagline"><span class="tag k">확실히 안다</span><span class="num">${kn.join(', ')}</span></div>`:''}</div>`:''})()}
      ${top.length?`<div style="font-size:14px"><b>많이 틀린 문항</b> <span class="num">${top.map(([n,v])=>`${n}번(${v.w})`).join(' · ')}</span></div>`:''}
      ${(r.history||[]).length?`<div class="hist">${r.history.slice(0,5).map(h=>`<div><span>${esc(h.label)} <span class="muted" style="font-size:12px">${fmtDate(h.endedAt)}${h.done?'':' · 중단'}</span></span><span class="num">${h.correct}/${h.answered}${h.answered<h.total?` <span class="muted">(총 ${h.total})</span>`:''}</span></div>`).join('')}</div>`:''}
    </div>`}).join('')}
  </div>`;
}
$('#v-records').addEventListener('click',e=>{const b=e.target.closest('[data-act="back"]');if(!b)return;if(rec){renderHome();show('home')}else show('start')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&rec)LS.set('tq1:rec:'+me.key,rec)});
renderPeople();
</script>

</body>
</html>
