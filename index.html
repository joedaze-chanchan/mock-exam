 금지하나, 조사분석자료가 새로운 내용을 담고 있지 않은 경우 등에 대해서는 예외적으로 매매를 허용하고 있으므로, 협회 규정에서도 법상 고유계정(회사의 계산)에 적용되는 24시간 매매제한의 예외사항을 금융투자분석사의 자기계산 매매에 대해서도 허용하고 있다."}, {"no": 89, "subject": "법규 및 세제", "detail": "한국금융투자협회규정", "stem": "협회의 영업 및 업무 규정상 '재산상의 이익의 가치 산정' 방법으로 옳지 않은 것은?", "extra": [], "choices": ["금전의 경우 해당 금액", "물품의 경우 구입비용", "금융투자회사 임직원과 거래상대방이 공동참석한 접대의 경우 해당 접대에 소요된 비용", "연수·기업설명회·기업탐방·세미나의 경우 거래상대방에게 직접적으로 제공되었거나 제공받은 비용"], "answer": 3, "explain": "재산상 이익의 가치는 다음과 같이 산정한다.\n1. 금전의 경우 해당 금액\n2. 물품의 경우 구입비용\n3. 접대의 경우 해당 접대에 소요된 비용. 다만, 금융투자회사 임직원과 거래상대방이 공동으로 참석한 경우 해당 비용은 전체 소요경비 중 거래상대방이 점유한 비율에 따라 산정된 금액으로 한다.\n4. 연수·기업설명회·기업탐방·세미나의 경우 거래상대방에게 직접적으로 제공되었거나 제공받은 비용\n5. 제1호부터 제4호까지에 해당하지 아니하는 재산상 이익의 경우 해당 재산상 이익의 구입 또는 제공에 소요된 실비"}, {"no": 90, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 상법상 주식회사의 자본충실의 원칙과 거리가 먼 것은?", "extra": [], "choices": ["이익배당의 제한", "주식의 액면미달발행의 제한", "회사설립 시 발기인의 인수가액의 전액 납입의무", "법정준비금 제도"], "answer": 3, "explain": "주식회사의 자본원칙에는 자본확정의 원칙, 자본충실·구속의 원칙 그리고 자본불변(불감)의 원칙으로 나눈다. 이 중 회사설립 시 발기인의 인수가액의 전액 납입의무는 '자본확정의 원칙'이다.\n※ 상법 제295조(발기설립의 경우의 납입과 현물출자의 이행)\n① 발기인이 회사의 설립 시에 발행하는 주식의 총수를 인수한 때에는 지체없이 각 주식에 대하여 그 인수가액의 전액을 납입하여야 한다. 이 경우 발기인은 납입을 맡을 은행 기타 금융기관과 납입장소를 지정하여야 한다."}, {"no": 91, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 주식회사의 정관의 변태적 설립사항에 속하는 것은 모두 몇 개인가?", "extra": ["\u003c보기\u003e", "가. 회사가 발행할 주식의 총수", "나. 회사가 설립 시 발행하는 주식의 총수", "다. 회사가 공고하는 방법", "라. 액면주식을 발행하는 경우 1주의 금액"], "choices": ["0개", "1개", "2개", "3개"], "answer": 1, "explain": "모두 정관의 절대적 기재사항이다.\n※ 상법 제289조(주식회사 정관의 작성, 절대적 기재사항)\n① 발기인은 정관을 작성하여 다음의 사항을 적고 각 발기인이 기명날인 또는 서명하여야 한다.\n1. 목적\n2. 상호\n3. 회사가 발행할 주식의 총수\n4. 액면주식을 발행하는 경우 1주의 금액(→ 100원 이상이어야 한다. 그러나 무액면주식일 경우에는 1주의 금액이 있을 수 없으므로 1주의 금액은 액면주식을 발행하는 경우에만 이를 절대적 기재사항으로 하고 있다.) (기출지문)\n5. 회사의 설립 시에 발행하는 주식의 총수\n6. 본점의 소재지\n7. 회사가 공고를 하는 방법\n8. 발기인의 성명·주민등록번호 및 주소\n※ 상법 제290조(변태설립사항 or 상대적 기재사항)\n다음의 사항은 정관에 기재함으로써 그 효력이 있다.\n1. 발기인이 받을 특별이익과 이를 받을 자의 성명\n2. 현물출자를 하는 자의 성명과 그 목적인 재산의 종류, 수량, 가격과 이에 대하여 부여할 주식의 종류와 수\n3. 회사성립 후에 양수할 것을 약정한 재산의 종류, 수량, 가격과 그 양도인의 성명\n4. 회사가 부담할 설립비용과 발기인이 받을 보수액\n상법 제290조(변태설립사항)은 정관에 기재함으로써 그 효력이 있다. 변태설립사항(變態設立事項)이란 회사설립과 관련된 사항들 가운데 회사의 자본적 기초를 약화시킬 우려가 있는 것을 말한다. 상법은 회사의 자본을 충실하게 하기 위해 변태설립사항의 정관 기재를 강행규정으로 하고 있으며 이를 위반한 경우 원칙적으로 무효이다. 변태설립사항에는 발기인의 특별이익, 현물출자, 재산인수, 설립비용과 발기인의 보수 등이 있다.\n주식회사 설립 시 발기인이 받을 특별이익은 변태설립사항으로서 상대적 기재사항이다.\n상대적 기재사항이란 기재하지 않더라도 정관 자체의 효력에는 영향을 미치지 않지만, 해당사항이 정관에 기재되어야만 비로소 회사와의 관계에서 그 효력이 발생되는 사항이며 상법의 규정 중에 산재(散在)되어 있다."}, {"no": 92, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 상법상 주식회사 주주의 의결권에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["주주의 의결권의 대리행사는 정관으로도 금지할 수 없다.", "주주는 정관이 정한 바에 따라 총회에 출석하지 아니하고 서면에 의하여 의결권을 행사할 수 있다.", "주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이에 대하여 회사는 주주의 의결권 불통일 행사를 거부할 수 있으나 주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우에는 거부할 수 없다.", "감사의 선임 시 의결권 없는 주식을 제외한 발행주식의 총수의 100분의 3을 초과하는 수의 주식을 가진 주주는 감사의 선임에 있어서는 의결권을 행사하지 못한다."], "answer": 4, "explain": "감사는 주주총회에서 선임한다. 의결권 없는 주식을 제외한 발행주식의 총수의 100분의 3(정관에서 더 낮은 주식 보유비율을 정할 수 있으며, 정관에서 더 낮은 주식 보유비율을 정한 경우에는 그 비율로 한다)을 초과하는 수의 주식을 가진 주주는 그 초과하는 주식에 관하여 제1항의 감사의 선임에 있어서는 의결권을 행사하지 못한다.\n주주는 대리인으로 하여금 그 의결권을 행사하게 할 수 있다. 이 경우에는 그 대리인은 대리권을 증명하는 서면을 총회에 제출하여야 한다. 즉, 주주의 의결권의 대리행사는 정관으로도 금지할 수 없다.\n• 의결권의 불통일행사\n주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이 경우 주주총회일의 3일 전에 회사에 대하여 서면 또는 전자문서로 그 뜻과 이유를 통지하여야 한다. 또한 회사는 주주의 의결권 불통일 행사를 거부할 수 있으나 주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우에는 거부할 수 없다.\n※ 상법 제368조의2(의결권의 불통일행사)\n① 주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이 경우 주주총회일의 3일 전에 회사에 대하여 서면 또는 전자문서로 그 뜻과 이유를 통지하여야 한다.\n② 주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우 외에는 회사는 주주의 의결권의 불통일행사를 거부할 수 있다."}, {"no": 93, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 이사에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["이사는 3명 이상이어야 하고 임기는 3년을 초과하지 못한다. 다만, 자본금 총액이 10억원 미만인 회사는 1명 또는 2명으로 할 수 있다.", "이사의 경업금지의무로서 이사는 이사회의 승인이 없으면 자기 또는 제3자의 계산으로 회사의 영업부류에 속한 거래를 하거나 동종영업을 목적으로 하는 다른 회사의 무한책임사원이나 이사가 되지 못한다.", "이사가 고의 또는 중대한 과실로 그 임무를 게을리한 때에는 그 이사는 제3자에 대하여 연대하여 손해를 배상할 책임이 있다.", "이사의 충실의무로서 이사는 법령과 정관에 따라서 회사를 위하여 그 직무를 충실하게 수행하여야 한다."], "answer": 4, "explain": "2025년 7월, 상법 개정으로 과거 이사의 '회사에 대한' 충실의무에서 '회사 및 주주에 대한' 충실의무로 개정되었다.\n※ 상법 제382조의3(이사의 충실의무 등)\n① 이사는 법령과 정관의 규정에 따라 회사 및 주주를 위하여 그 직무를 충실하게 수행하여야 한다.\n② 이사는 그 직무를 수행함에 있어 총주주의 이익을 보호하여야 하고, 전체 주주의 이익을 공평하게 대우하여야 한다."}, {"no": 94, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 자본금과 주식에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["액면주식을 무액면주식으로 전환하거나 무액면주식을 액면주식으로 전환하더라도 회사의 자본금은 변경할 수 없다.", "회사는 정관으로 정한 경우에는 주식의 전부를 무액면주식으로 발행할 수 있다. 다만, 무액면주식을 발행하는 경우에는 액면주식을 발행할 수 없다.", "회사는 정관으로 정하는 바에 따라 발행된 액면주식을 무액면주식으로 전환하거나 무액면주식을 액면주식으로 전환할 수 있다.", "결손의 보전을 위한 자본금 감소의 경우에는 주주총회의 보통결의로 할 수 있고 채권자의 동의를 구하기 위한 채권자보호절차가 필요하다."], "answer": 4, "explain": "결손의 보전을 위한 자본금 감소의 경우에는 주주총회의 보통결의로 할 수 있고 채권자보호절차도 필요 없다. 결손전보는 실제로 회사 외로 자금이 유출되는 것이 아닌 회계상의 계정처리이기 때문이다.\n회사가 무액면주식을 발행하는 경우 회사의 자본금은 주식 발행가액의 2분의 1 이상의 금액으로서 이사회에서 자본금으로 계상하기로 한 금액의 총액으로 한다. 이 경우 주식의 발행가액 중 자본금으로 계상하지 아니하는 금액은 자본준비금으로 계상하여야 한다."}, {"no": 95, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 준비금에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["회사는 그 자본금의 2분의 1이 될 때까지 매 결산기 이익배당액의 10분의 1 이상을 이익준비금으로 적립하여야 한다. 다만, 주식배당의 경우에는 그러하지 아니하다.", "이익준비금과 자본준비금은 자본금의 결손 보전에 충당하는 경우 외에는 처분하지 못한다.", "적극 재산을 실가 이상으로 평가할 경우 비밀준비금이 발생하지만 재무상태표상에는 나타나지 않는다.", "회사는 적립된 자본준비금 및 이익준비금의 총액이 자본금의 1.5배를 초과하는 경우에 주주총회의 결의에 따라 그 초과한 금액 범위에서 자본준비금과 이익준비금을 감액할 수 있다."], "answer": 3, "explain": "적극 재산을 실가 이하로 과소평가하거나 채무를 실가 이상으로 과대평가할 경우에 실가와의 차액을 비밀준비금이라 한다. 이는 실질적으로는 준비금이 아니고 대차대조표에도 계상하지 아니하므로 부진정준비금 또는 위장준비금이라고 한다.\n회사는 이사회의 결의에 의하여 준비금의 전부 또는 일부를 자본금에 전입할 수 있다. 그러나 정관으로 주주총회에서 결정하기로 정한 경우에는 그러하지 아니하다."}, {"no": 96, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 지방세가 아닌 것은?", "extra": [], "choices": ["취득세", "상속세", "주민세", "담배소비세"], "answer": 2, "explain": "상속세는 국세이다. 지방세에는 '취득세, 등록면허세, 지방교육세, 주민세, 재산세, 자동차세, 담배소비세 등'이 있다.\n※ 우리나라 조세체계\n1) 국세(14개)\n개인이 얻은 소득에 부과하는 소득세, 법인에게 부과하는 법인세, 무상으로 이전되는 상속세, 재산이 무상으로 이전되는 증여세, 부동산에 대한 종합부동산세, 생산·유통과정에 대한 부가가치세, 특정한 물품에 대한 개별소비세, 주류에 대하여 부과되는 주세, 재산 권리 변동 증서에 대한 인지세, 주권·지분 양도에 대한 증권거래세, 교육재정 확충에 필요한 교육세, 사회간접자본투자를 위한 교통에너지환경세, 농어촌특별세, 외국물품 반입 및 물품에 대한 관세\n2) 지방세(11개)\n일정한 자산의 취득에 대한 취득세, 재산권·권리에 대한 등록면허세, 경륜·경정·경마 등에 대한 레저세, 담배에 과세되는 세금인 담배소비세, 지역경제 활성화를 위한 지방소비세, 거주하는 개인·법인에 대한 주민세, 납세자의 소득에 따른 지방소득세, 일정한 재산에 대하여 부과되는 재산세, 자동차 소유에 대한 자동차세, 지역균형개발·수질개선에 대한 지역자원시설세, 교육질적향상에 대한 지방교육세"}, {"no": 97, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 이자소득세 대상은 모두 몇 개인가?", "extra": ["\u003c보기\u003e", "가) 환매조건부 채권의 매매차익", "나) 보장성보험의 보험차익", "다) 비영업대금의 이익"], "choices": ["1개", "2개", "3개", "모두 해당없음"], "answer": 2, "explain": "10년 미만의 저축성보험의 보험차익은 이자소득세 대상이지만 보장성보험은 대상이 아니다."}, {"no": 98, "subject": "법규 및 세제", "detail": "증권세제", "stem": "납세의무에 대한 성립과 확정에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["증권거래세는 매매거래가 확정되는 때에 납세의무가 성립하고 신고확정 대상이다.", "소득세, 법인세, 부가가치세는 과세기간이 끝나는 때에 납세의무가 성립하며 신고확정 대상이다.", "인지세는 과세문서를 작성하는 때에 납세의무가 성립하고 자동확정 대상이다.", "상속세는 상속이 개시되는 때에 납세의무가 성립하며 신고확정 대상이다."], "answer": 4, "explain": "상속세와 증여세는 (국세청에 의한) 부과확정이다."}, {"no": 99, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 2차 납세의무자가 아닌 것은?", "extra": [], "choices": ["청산인", "출자자", "법 인", "사업양도인"], "answer": 4, "explain": "사업양도인이 아닌 사업양수인이 2차 납세의무자가 된다.\n※ 국세기본법 제41조(사업양수인의 제2차 납세의무)\n① 사업이 양도·양수된 경우에 양도일 이전에 양도인의 납세의무가 확정된 그 사업에 관한 국세 및 강제징수비를 양도인의 재산으로 충당하여도 부족할 때에는 대통령령으로 정하는 사업의 양수인은 그 부족한 금액에 대하여 양수한 재산의 가액을 한도로 제2차 납세의무를 진다."}, {"no": 100, "subject": "법규 및 세제", "detail": "증권세제", "stem": "증권거래세 부과와 관련된 설명 중 옳은 것은?", "extra": [], "choices": ["주권을 목적물로 하는 소비대차의 경우 증권거래세가 부과된다.", "코넥스시장에서 거래하는 주권에 대해서 증권거래세가 부과되지 않는다.", "뉴욕증권거래소에 상장된 주권을 양도할 경우 증권거래세가 부과된다.", "자본시장법에 따른 주권매출의 경우 증권거래세가 부과되지 않는다."], "answer": 4, "explain": "※ 증권거래세 과세대상(증권거래세법 제1조)\n1. 과세대상(증권거래세법 제1조, 제1조의2, 제2조)\n증권거래세는 주권 또는 지분의 유상양도에 대하여 부과하는 조세로 그 과세대상이 되는 주권이란 ① 상법 또는 특별법에 따라 설립된 법인의 주권, ② 외국법인이 발행한 주권으로서, 자본시장법에 의한 거래소의 유가증권시장이나 코스닥시장, 코넥스시장(이하 '증권시장')에 상장된 것을 말한다.\n다만, 외국 증권시장(뉴욕증권거래소, 동경거래소 등)에 상장된 주권을 양도하는 경우 또는 외국증권시장에 주권을 상장하기 위하여 인수자에게 주권을 양도하는 경우 및 자본시장법에 따라 채무인수를 한 거래소가 주권을 양도하는 경우에는 증권거래세를 부과하지 않는다.\n※ 비과세 양도(증권거래세법 제6조)\n아래의 경우에는 증권거래세를 부과하지 아니한다.\n(1) 국가 또는 지자체가 주권 등을 양도하는 경우(단, 국가재정법에 따른 각종 기금의 주권 양도 시는 과세함)\n(2) 자본시장법 제119조9 모집 및 매출)에 따라 주권을 매출하는 경우(발행매출)\n(3) 주권을 목적물로 하는 소비대차의 경우(예를 들어 공매도를 위한 주권 차입자에게 대여자가 주권을 대여하는 경우가 소비대차이므로 실제로 매도한 것이 아니고 빌려준 것이므로 증권거래세를 부과할 수 없다.)"}]}]}</script>

<div id="gate" class="wrap">

</div>

<div id="home" class="wrap" hidden></div>
<div id="exam" class="wrap"></div>
<div id="result" class="wrap"></div>
<div id="stats" class="wrap"></div>
<div id="modal"></div>
<aside id="chat" aria-label="질문 패널"></aside>

<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('examdata').textContent);
const PW = '1028';
const TOTAL_SEC = DATA.minutes * 60;
const CIRC = ['①','②','③','④'];
const SUBJECTS = [
  {name:'증권분석 및 증권시장', from:1, to:35},
  {name:'금융상품 및 직무윤리', from:36, to:65},
  {name:'법규 및 세제', from:66, to:100}
];
const $ = (s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};

const store={
  get(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
  del(k){ try{localStorage.removeItem(k);}catch(e){} }
};
const K_PROG='sijeom.v2.progress', K_ATT='sijeom.v2.attempts';

let DB=null, SAMPLE=null, capsReady=false;
let ATTEMPTS = store.get(K_ATT, []);   // [{id,round,at,elapsed,correct,pass,answers}]
let S=null, tick=null;

/* ── 능력 연결 (없어도 동작) ── */
(async function caps(){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      DB = await window.claude.use('db').catch(()=>null);
      SAMPLE = await window.claude.use('sample').catch(()=>null);
    }
  }catch(e){}
  capsReady = true;
  if(SAMPLE) document.querySelectorAll('.qstem[data-ask]').forEach(armAsk);
  if(DB) loadAttempts();
})();

async function loadAttempts(){
  try{
    const snap = await DB.collection('attempts').orderBy('at','desc').limit(200).get();
    const rows = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    if(rows.length){
      const seen = new Set(rows.map(r=>r.id));
      ATTEMPTS = rows.concat(ATTEMPTS.filter(a=>!seen.has(a.id)));
      store.set(K_ATT, ATTEMPTS.slice(0,200));
      if(!$('#home').hidden) showHome();
      if($('#stats').classList.contains('on')) showStats();
    }
  }catch(e){}
}
async function saveAttempt(a){
  ATTEMPTS.unshift(a);
  store.set(K_ATT, ATTEMPTS.slice(0,200));
  if(!DB) return;
  try{ await DB.collection('attempts').doc(a.id).set({
    round:a.round, at:a.at, elapsed:a.elapsed, correct:a.correct, pass:a.pass, answers:a.answers
  }); }catch(e){}
}

/* ── 유틸 ── */
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const fmtLong=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+'시간 ':'')+m+'분 '+(s%60)+'초';};
const roundData=r=>DATA.rounds.find(x=>x.round===r);
const itemOf=(r,n)=>roundData(r).items.find(i=>i.no===n);
const answeredCount=()=>Object.keys(S.answers).length;
const remaining=()=> S.paused ? S.left : (S.endAt-Date.now())/1000;
function dstr(iso){ const d=new Date(iso); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function grade(round, answers){
  const items=roundData(round).items;
  const bySub=SUBJECTS.map(s=>({name:s.name,total:0,correct:0}));
  const byDet={}; let correct=0;
  items.forEach(it=>{
    const sub=bySub.find(s=>s.name===it.subject); sub.total++;
    if(!byDet[it.detail]) byDet[it.detail]={total:0,correct:0};
    byDet[it.detail].total++;
    if(answers[it.no]===it.answer){correct++;sub.correct++;byDet[it.detail].correct++;}
  });
  const cut=bySub.map(s=>({...s,need:Math.ceil(s.total*0.4),failed:s.correct<s.total*0.4}));
  return {correct,total:items.length,bySub:cut,byDet,pass:correct>=70&&cut.every(s=>!s.failed)};
}
/* 문항별 누적 기록 */
function questionLog(){
  const map={};
  ATTEMPTS.forEach(a=>{
    const items=roundData(a.round); if(!items) return;
    items.items.forEach(it=>{
      const k=a.round+'-'+it.no;
      if(!map[k]) map[k]={round:a.round,no:it.no,detail:it.detail,subject:it.subject,tries:0,wrong:0,blank:0,last:null};
      const mine=a.answers[it.no];
      map[k].tries++;
      if(!mine) map[k].blank++;
      if(mine!==it.answer) map[k].wrong++;
      if(!map[k].last) map[k].last={mine:mine||0, ok:mine===it.answer, at:a.at};
    });
  });
  return map;
}

/* ── 비밀번호 ── */

/* ── 시험 ── */
function startExam(round,resume){
  $('#home').hidden=true; $('#stats').className='';
  S = resume ? {round:resume.round,answers:resume.answers||{},flags:resume.flags||{},left:Math.max(0,resume.left),paused:true,startedAt:resume.startedAt||Date.now(),done:false}
             : {round,answers:{},flags:{},left:TOTAL_SEC,paused:true,startedAt:Date.now(),done:false};
  renderExam();
  if(resume) openModal({title:'이어서 풀기',body:'남은 시간 '+fmt(S.left)+'부터 다시 시작합니다.',ok:'시작',onOk:resumeTimer});
  else resumeTimer();
}
function resumeTimer(){ S.paused=false; S.endAt=Date.now()+S.left*1000; if(tick)clearInterval(tick); tick=setInterval(onTick,500); onTick(); }
function pauseTimer(){ S.left=Math.max(0,remaining()); S.paused=true; if(tick){clearInterval(tick);tick=null;} save(); paintClock(); }
function onTick(){ const l=remaining(); S.left=Math.max(0,l); paintClock(); if(l<=0){ if(tick){clearInterval(tick);tick=null;} submit(true); } }
function save(){ if(!S||S.done) return; store.set(K_PROG,{round:S.round,answers:S.answers,flags:S.flags,left:Math.max(0,S.paused?S.left:remaining()),startedAt:S.startedAt}); }

function renderExam(){
  const ex=$('#exam'); ex.className='on'; ex.innerHTML='';
  const mbar=el('div','mbar'); mbar.id='mbar';
  mbar.innerHTML='<span class="t mono" id="mtime">--:--</span><span class="pr" id="mprog"></span>';
  const mb=el('button','btn ghost sm','답안지'); mb.onclick=openOmrSheet; mbar.append(mb);
  ex.append(mbar);

  const layout=el('div','layout'); const qcol=el('div','qcol');
  SUBJECTS.forEach(sub=>{
    const h=el('div','subjhead');
    h.append(el('h2','',sub.name));
    h.append(el('span','',sub.from+'~'+sub.to+'번 · '+(sub.to-sub.from+1)+'문항'));
    qcol.append(h);
    roundData(S.round).items.filter(i=>i.no>=sub.from&&i.no<=sub.to).forEach(i=>qcol.append(qNode(i)));
  });
  layout.append(qcol); layout.append(consoleNode()); ex.append(layout);
  paintClock(); paintOmr();
}
function armAsk(stem){
  if(!SAMPLE || stem.dataset.armed) return;
  stem.dataset.armed='1';
  stem.classList.add('askable');
  stem.title='눌러서 이 문제 질문하기';
  const d=$('.qdetail',stem);
  if(d && !$('.hintq',d)){ const h=el('span','hintq',' · 눌러서 질문'); d.append(h); }
  stem.onclick=()=>openChat({round:Number(stem.dataset.round), no:Number(stem.dataset.no)});
}
function stemBlock(it,parent,round){
  const head=el('div','qhead');
  head.append(el('div','qno mono',String(it.no).padStart(2,'0')));
  const stem=el('div','qstem');
  stem.dataset.ask='1'; stem.dataset.round=String(round); stem.dataset.no=String(it.no);
  stem.append(el('div','qdetail',it.detail));
  stem.append(el('div','',it.stem));
  head.append(stem); parent.append(head);
  armAsk(stem);
  if(it.extra&&it.extra.length){ const b=el('div','box'); it.extra.forEach(l=>b.append(el('div','',l))); parent.append(b); }
  return head;
}
function qNode(it){
  const q=el('div','q'); q.id='q'+it.no;
  if(S.flags[it.no]) q.classList.add('flagged');
  const head=stemBlock(it,q,S.round);
  const tools=el('div','qtools');
  const f=el('button','iconbtn'+(S.flags[it.no]?' on':''),'★');
  f.type='button'; f.title='다시 볼 문제';
  f.onclick=()=>{ if(S.flags[it.no])delete S.flags[it.no]; else S.flags[it.no]=1; f.classList.toggle('on'); q.classList.toggle('flagged'); save(); paintOmr(); };
  tools.append(f); head.append(tools);

  const chs=el('div','choices');
  it.choices.forEach((c,i)=>{
    const n=i+1;
    const b=el('button','ch'+(S.answers[it.no]===n?' sel':'')); b.type='button';
    b.append(el('span','num mono',CIRC[i])); b.append(el('span','',c));
    b.onclick=()=>{
      if(S.answers[it.no]===n) delete S.answers[it.no]; else S.answers[it.no]=n;
      [...chs.children].forEach((x,j)=>x.classList.toggle('sel',S.answers[it.no]===j+1));
      save(); paintClock(); paintOmr();
    };
    chs.append(b);
  });
  q.append(chs);
  return q;
}
function consoleNode(){

  const sb=el('button','btn','답안 제출'); sb.onclick=confirmSubmit;

    onOk:()=>{save(); $('#exam').className=''; S=null; showHome();}, onCancel:resumeTimer}); };

const jump=i=>{const t=document.getElementById('q'+i); if(t)t.scrollIntoView({behavior:'smooth',block:'start'});};

function paintClock(){
  if(!S) return;
  const left=S.paused?S.left:remaining(), low=left<=600, t=fmt(left);
  const clock=$('#clock');
  if(clock){ clock.classList.toggle('low',low); $('.t',clock).textContent=t;
    $('.bar i',clock).style.width=Math.max(0,Math.min(100,left/TOTAL_SEC*100))+'%';
    $('.lab',clock).textContent=S.paused?'일시정지':'남은 시간'; }
  const mb=$('#mbar');
  if(mb){ mb.classList.toggle('low',low); $('#mtime').textContent=t; $('#mprog').textContent=answeredCount()+'/100'; }
  const pb=$('#pausebtn'); if(pb) pb.textContent=S.paused?'이어서 풀기':'일시정지';
  const st=$('#stats-live');
  if(st){
    const done=answeredCount(), elapsed=TOTAL_SEC-left;
    const should=Math.min(100,Math.floor(elapsed/TOTAL_SEC*100)), diff=done-should;
    st.innerHTML='';
    const mk=(k,v,cls)=>{const r=el('div','row'+(cls?' '+cls:'')); r.innerHTML='<span>'+k+'</span><b>'+v+'</b>'; st.append(r);};
    mk('푼 문항',done+' / 100');
    mk('다시 볼 문제',Object.keys(S.flags).length);
    mk('문항당 평균',done?Math.round(elapsed/done)+'초':'—');
    mk('진도',(diff>=0?'+':'')+diff+'문항','pace '+(diff>=0?'ahead':'behind'));
  }
}
function paintOmr(){
  const omr=$('#omr'); if(!omr||!S) return;
  [...omr.children].forEach((b,i)=>{const n=i+1; b.className=(S.answers[n]?'done ':'')+(S.flags[n]?'flag':'');});
}
function openOmrSheet(){
  const g=el('div','omr');
  for(let i=1;i<=100;i++){ const b=el('button','',String(i)); b.type='button';
    b.className=(S.answers[i]?'done ':'')+(S.flags[i]?'flag':'');
    b.onclick=()=>{closeModal();jump(i);}; g.append(b); }
  openModal({title:'답안지 · '+answeredCount()+'/100',node:g,ok:'닫기'});
}
function confirmSubmit(){
  const un=100-answeredCount(); pauseTimer();
  openModal({title:'답안을 제출할까요?',
    body:un?('아직 고르지 않은 문항이 '+un+'개 있습니다. 제출하면 채점되고 해설을 볼 수 있습니다.'):'100문항을 모두 풀었습니다.',
    ok:'제출',cancel:'더 풀기',onOk:()=>submit(false),onCancel:resumeTimer});
}
function submit(auto){
  closeModal();
  if(tick){clearInterval(tick);tick=null;}
  S.done=true;
  const elapsed=TOTAL_SEC-Math.max(0,S.paused?S.left:remaining());
  const res=grade(S.round,S.answers);
  const att={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    round:S.round,at:new Date().toISOString(),elapsed:Math.round(elapsed),correct:res.correct,pass:res.pass,answers:S.answers};
  saveAttempt(att);
  store.del(K_PROG);
  const round=S.round, answers=S.answers; S=null;
  $('#exam').className=''; $('#exam').innerHTML='';
  showResult(round,answers,elapsed,false,auto);
}

/* ── 결과 ── */
function showResult(round,answers,elapsed,fromHistory,auto){
  $('#home').hidden=true; $('#exam').className=''; $('#stats').className='';
  const res=grade(round,answers);
  const R=$('#result'); R.className='on'; R.innerHTML='';

  const head=el('div','home-head'); head.style.marginBottom='18px';
  head.append(el('div','eyebrow','제'+round+'회 결과'+(fromHistory?' · 지난 응시':'')));
  head.append(el('h1','','채점 결과'));
  if(auto) head.append(el('div','sub','시험 시간이 끝나 자동 제출되었습니다.'));
  R.append(head);

  const score=el('div','score');
  const sc=el('div','scorecard '+(res.pass?'pass':'fail'));
  sc.append(el('div','eyebrow','득점'));
  sc.append(el('div','big mono',String(res.correct)));
  sc.append(el('div','','100문항 중 '+res.correct+'개 정답'));
  sc.append(el('div','verdict',res.pass?'합격':'불합격'));
  sc.append(el('div','rbest','소요 시간 '+fmtLong(elapsed)));
  score.append(sc);

  const tw=el('div','tablewrap'); const tb=el('table');
  tb.innerHTML='<thead><tr><th>과목</th><th class="n">문항</th><th class="n">정답</th><th class="n">정답률</th><th>과락(40%)</th></tr></thead>';
  const tbody=el('tbody');
  res.bySub.forEach(s=>{ const tr=el('tr');
    tr.innerHTML='<td>'+s.name+'</td><td class="n">'+s.total+'</td><td class="n">'+s.correct+'</td><td class="n">'+Math.round(s.correct/s.total*100)+'%</td><td>'+
      (s.failed?'<span class="tag ng">과락 (최소 '+s.need+')</span>':'<span class="tag ok">통과</span>')+'</td>'; tbody.append(tr); });
  const tr=el('tr');
  tr.innerHTML='<td><b>합계</b></td><td class="n"><b>100</b></td><td class="n"><b>'+res.correct+'</b></td><td class="n"><b>'+res.correct+'%</b></td><td>'+
    (res.correct>=70?'<span class="tag ok">70문항 이상</span>':'<span class="tag ng">70문항 미달</span>')+'</td>';
  tbody.append(tr); tb.append(tbody); tw.append(tb);
  const right=el('div'); right.append(tw); score.append(right); R.append(score);

  R.append(sectHead('세부과목별 정답률'));
  R.append(detailTable(res.byDet));

  const sh=el('div','secthead'); sh.append(el('h2','','문항별 해설'));
  const filters=el('div','filters'); const list=el('div','qcol'); list.style.gap='12px';
  const items=roundData(round).items; let mode='wrong';

    list.innerHTML='';

    if(!sel.length){ list.append(el('div','note','해당하는 문항이 없습니다.')); return; }
    sel.forEach(it=>list.append(reviewNode(round,it,answers[it.no])));
  };
  [['wrong','틀린 문항 '+items.filter(it=>answers[it.no]!==it.answer).length],
   ['blank','미답 '+items.filter(it=>!answers[it.no]).length],

    c.onclick=()=>{mode=m;[...filters.children].forEach(x=>x.classList.remove('on'));c.classList.add('on');paint();};
    filters.append(c);
  });
  sh.append(filters); R.append(sh); R.append(list); paint();

  const fb=el('div','footerbtns');

  fb.append(b1,b2,b3); R.append(fb);

function sectHead(t){ const s=el('div','secthead'); s.append(el('h2','',t)); return s; }
function detailTable(byDet){
  const tw=el('div','tablewrap'); const t=el('table');
  t.innerHTML='<thead><tr><th>세부과목</th><th class="n">정답/문항</th><th style="width:42%">정답률</th></tr></thead>';
  const b=el('tbody');
  Object.keys(byDet).forEach(k=>{
    const d=byDet[k], p=Math.round(d.correct/d.total*100), tr=el('tr');
    tr.innerHTML='<td>'+k+'</td><td class="n">'+d.correct+' / '+d.total+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:9px"><div class="dbar"><i class="'+(p<40?'low':'')+'" style="width:'+p+'%"></i></div><span class="mono" style="font-size:12px">'+p+'%</span></div></td>';
    b.append(tr);
  });
  t.append(b); tw.append(t); return tw;
}
function reviewNode(round,it,mine,extraInfo){
  const q=el('div','q');
  stemBlock(it,q,round);
  const chs=el('div','choices');
  it.choices.forEach((c,i)=>{
    const n=i+1; let cls='ch';
    if(n===it.answer) cls+=' correct'; else if(mine===n) cls+=' wrong';
    const d=el('div',cls); d.append(el('span','num mono',CIRC[i])); d.append(el('span','',c)); chs.append(d);
  });
  q.append(chs);
  const ex=el('div','expl'); const vr=el('div');
  if(!mine) vr.innerHTML='<span class="vr x">미답</span> · 정답 '+CIRC[it.answer-1];
  else if(mine===it.answer) vr.innerHTML='<span class="vr o">정답</span> · '+CIRC[it.answer-1];
  else vr.innerHTML='<span class="vr x">오답</span> · 내 답 '+CIRC[mine-1]+' / 정답 '+CIRC[it.answer-1];
  ex.append(vr); ex.append(el('div','',it.explain)); q.append(ex);

  if(extraInfo){ const foot=el('div','qfoot'); foot.append(el('span','hit',extraInfo)); q.append(foot); }
  return q;
}

/* ── 오답 기록 ── */

  if(!ATTEMPTS.length){
    P.append(el('div','note','아직 응시 기록이 없습니다. 한 회차를 풀고 나면 틀린 문항이 여기에 쌓입니다.'));
    const fb=el('div','footerbtns'); const b=el('button','btn','회차 고르기'); b.onclick=()=>{P.className='';showHome();}; fb.append(b); P.append(fb);
    return;
  }

  /* 응시 이력 */
  P.append(sectHead('응시 이력'));
  const tw=el('div','tablewrap'); const t=el('table');
  t.innerHTML='<thead><tr><th>일시</th><th>회차</th><th class="n">점수</th><th>결과</th><th class="n">소요</th><th></th></tr></thead>';
  const tb=el('tbody');
  ATTEMPTS.slice(0,25).forEach(a=>{
    const tr=el('tr');
    tr.innerHTML='<td>'+dstr(a.at)+'</td><td>제'+a.round+'회</td><td class="n">'+a.correct+'</td>'+
      '<td>'+(a.pass?'<span class="tag ok">합격</span>':'<span class="tag ng">불합격</span>')+'</td>'+
      '<td class="n">'+Math.round(a.elapsed/60)+'분</td><td></td>';
    const btn=el('button','btn ghost sm','보기'); btn.onclick=()=>showResult(a.round,a.answers,a.elapsed,true);
    tr.lastElementChild.append(btn); tb.append(tr);
  });
  t.append(tb); tw.append(t); P.append(tw);

  /* 세부과목 누적 */
  const agg={};
  ATTEMPTS.forEach(a=>roundData(a.round).items.forEach(it=>{
    if(!agg[it.detail]) agg[it.detail]={total:0,correct:0};
    agg[it.detail].total++; if(a.answers[it.no]===it.answer) agg[it.detail].correct++;
  }));
  const sorted={}; Object.keys(agg).sort((x,y)=>(agg[x].correct/agg[x].total)-(agg[y].correct/agg[y].total)).forEach(k=>sorted[k]=agg[k]);
  P.append(sectHead('세부과목 누적 정답률 (약한 순)'));
  P.append(detailTable(sorted));

  /* 문항별 */
  const log=questionLog();
  const keys=Object.keys(log);
  const wrongOnce=keys.filter(k=>log[k].wrong>0);
  const repeat=keys.filter(k=>log[k].wrong>=2);
  const sh=el('div','secthead'); sh.append(el('h2','','문항별 기록'));
  const filters=el('div','filters'); const list=el('div','qcol'); list.style.gap='12px';
  let mode='repeat';
  const paint=()=>{
    list.innerHTML='';
    let sel = mode==='repeat'?repeat : mode==='wrong'?wrongOnce : keys.filter(k=>log[k].wrong===0);
    sel = sel.sort((a,b)=> (log[b].wrong-log[a].wrong) || (log[a].round-log[b].round) || (log[a].no-log[b].no)).slice(0,60);
    if(!sel.length){ list.append(el('div','note','해당하는 문항이 없습니다.')); return; }
    sel.forEach(k=>{
      const L=log[k], it=itemOf(L.round,L.no);
      const info='제'+L.round+'회 '+L.no+'번 · '+L.tries+'번 중 '+L.wrong+'번 오답'+(L.blank?' (미답 '+L.blank+')':'');
      list.append(reviewNode(L.round,it,L.last?L.last.mine:0,info));
    });
  };
  [['repeat','2번 이상 틀림 '+repeat.length],['wrong','틀린 적 있음 '+wrongOnce.length],['right','항상 맞힘 '+(keys.length-wrongOnce.length)]].forEach(([m,label])=>{
    const c=el('button','chip'+(m===mode?' on':''),label);
    c.onclick=()=>{mode=m;[...filters.children].forEach(x=>x.classList.remove('on'));c.classList.add('on');paint();};
    filters.append(c);
  });
  sh.append(filters); P.append(sh); P.append(list); paint();

  const fb=el('div','footerbtns');
  const b=el('button','btn','회차 고르기'); b.onclick=()=>{P.className='';showHome();window.scrollTo(0,0);};
  fb.append(b); P.append(fb);
  window.scrollTo(0,0);
}

/* ── 모달 ── */
function openModal(o){
  const m=$('#modal'); m.innerHTML='';
  const sheet=el('div','sheet'); const card=el('div','sheetcard');
  card.append(el('h3','',o.title));
  if(o.body) card.append(el('p','',o.body));
  if(o.node) card.append(o.node);
  const btns=el('div','sheetbtns');
  if(o.cancel){ const c=el('button','btn ghost',o.cancel); c.onclick=()=>{closeModal();o.onCancel&&o.onCancel();}; btns.append(c); }
  const k=el('button','btn',o.ok||'확인'); k.onclick=()=>{closeModal();o.onOk&&o.onOk();};
  btns.append(k); card.append(btns); sheet.append(card); m.append(sheet);
  setTimeout(()=>k.focus(),30);
}
const closeModal=()=>{$('#modal').innerHTML='';};

/* ── 질문(채팅) ── */
const RULES = '당신은 한국 「증권투자권유자문인력」 자격시험 강사입니다. 수험생의 질문에 한국어로 답합니다.\n'
 + '- 결론을 먼저 한 줄로 말하고, 근거를 짧게 덧붙입니다. 3~6문장으로 간결하게.\n'
 + '- 시험에 나오는 숫자·요건·헷갈리는 선지(함정)를 짚어 줍니다.\n'
 + '- 확실하지 않으면 모른다고 말하고 추측을 사실처럼 쓰지 않습니다.\n'
 + '- 시험은 금융투자협회 기본서 기준입니다. 법규가 개정된 부분은 개정 내용을 알려주되 "시험은 기본서 기준"임을 함께 적습니다.\n'
 + '- 마크다운 강조(**)는 쓰지 말고 평문으로 씁니다.';

let chatCtx=null, chatTurns=[], chatCtl=null;

function chatKey(){ return chatCtx ? ('r'+chatCtx.round+'-q'+chatCtx.no) : 'general'; }
function ctxText(){
  if(!chatCtx) return '';
  const it=itemOf(chatCtx.round,chatCtx.no);
  return '[문항] 제'+chatCtx.round+'회 '+it.no+'번 · '+it.detail+'\n'+it.stem+'\n'
    + (it.extra&&it.extra.length?it.extra.join('\n')+'\n':'')
    + it.choices.map((c,i)=>CIRC[i]+' '+c).join('\n')
    + '\n[정답] '+CIRC[it.answer-1]+'\n[교재 해설] '+String(it.explain).slice(0,2200);
}
async function openChat(ctx){
  if(!SAMPLE) return;
  chatCtx=ctx||null; chatTurns=[];
  const C=$('#chat'); C.classList.add('on'); C.innerHTML='';
  const head=el('div','chead');
  head.append(el('h3','', chatCtx?('제'+chatCtx.round+'회 '+chatCtx.no+'번'):'질문'));
  const x=el('button','iconbtn','닫기'); x.style.width='auto'; x.onclick=closeChat; head.append(x);
  C.append(head);

  const body=el('div','cbody'); body.id='cbody';
  if(chatCtx){
    const it=itemOf(chatCtx.round,chatCtx.no);
    const c=el('div','ctx');
    c.append(el('b','',it.detail));
    c.append(document.createTextNode(' · 정답 '+CIRC[it.answer-1]));
    c.append(el('div','',it.stem.slice(0,120)+(it.stem.length>120?'…':'')));
    body.append(c);
  }
  C.append(body);

  const foot=el('div','cfoot');
  const sugg=el('div','sugg');
  const qs = chatCtx
    ? ['왜 이게 정답이야?','다른 선지는 왜 틀렸어?','이 주제 핵심만 정리해줘','비슷한 함정 알려줘']
    : ['오늘 뭐부터 공부할까?','과락 나기 쉬운 과목은?','자주 틀리는 부분 정리해줘'];
  qs.forEach(t=>{ const b=el('button','',t); b.type='button'; b.onclick=()=>{ $('#chatinput').value=t; send(); }; sugg.append(b); });
  foot.append(sugg);
  const cin=el('div','cin');
  const ta=el('textarea'); ta.id='chatinput'; ta.rows=1; ta.placeholder='궁금한 점을 물어보세요';
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';});
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
  const sb=el('button','btn','보내기'); sb.id='csend'; sb.onclick=send;
  cin.append(ta,sb); foot.append(cin); C.append(foot);

  await loadChatLog();
  setTimeout(()=>ta.focus(),50);
}
function closeChat(){ if(chatCtl)chatCtl.abort(); $('#chat').classList.remove('on'); $('#chat').innerHTML=''; }

async function loadChatLog(){
  if(!DB) return;
  try{
    const d=await DB.collection('chats').doc(chatKey()).get();
    if(d.exists){
      const t=d.data().turns||[];
      chatTurns=t.map(x=>({role:x.role,content:x.content}));
      chatTurns.forEach(m=>bubble(m.role==='user'?'me':'ai', m.content));
    }
  }catch(e){}
}
async function saveChatLog(){
  if(!DB) return;
  try{
    await DB.collection('chats').doc(chatKey()).set({
      round: chatCtx?chatCtx.round:0, no: chatCtx?chatCtx.no:0,
      at: new Date().toISOString(),
      turns: chatTurns.slice(-30)
    });
  }catch(e){}
}
function bubble(who,text){
  const b=$('#cbody'); if(!b) return null;
  const m=el('div','msg '+who);
  m.append(el('div','who', who==='me'?'나':'Claude'));
  const d=el('div','bub',text); m.append(d);
  b.append(m); b.scrollTop=b.scrollHeight;
  return d;
}
async function send(){
  const ta=$('#chatinput'); if(!ta) return;
  const text=ta.value.trim(); if(!text) return;
  ta.value=''; ta.style.height='auto';
  const sb=$('#csend'); sb.disabled=true;
  bubble('me',text);
  chatTurns.push({role:'user',content:text});
  const out=bubble('ai','생각 중…');

  const lead = RULES + (chatCtx ? ('\n\n아래 문항에 대한 질문입니다.\n'+ctxText()) : '\n\n수험생의 전반적인 학습 질문입니다.');
  const input=[{role:'user',content:lead}].concat(chatTurns.slice(-12));
  chatCtl=new AbortController();
  try{
    const r=await SAMPLE(input,{
      cache:false, signal:chatCtl.signal, modelTier:'default',
      onText:({text})=>{ out.textContent=text; const b=$('#cbody'); if(b)b.scrollTop=b.scrollHeight; }
    });
    chatTurns.push({role:'assistant',content:r.text});
    saveChatLog();
  }catch(e){
    const msg = e && e.code==='not_granted' ? 'Claude 사용이 허용되지 않아 답할 수 없습니다. 페이지 권한에서 허용해 주세요.'
      : e && e.code==='rate_limited' ? '요청이 많아 잠시 뒤에 다시 물어봐 주세요.'
      : e && e.code==='cancelled' ? '답변을 멈췄습니다.'
      : '답변을 가져오지 못했습니다. 잠시 뒤 다시 시도해 주세요.';
    out.textContent = (e && e.text) ? e.text + '\n\n' + msg : msg;
  }finally{ sb.disabled=false; chatCtl=null; }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#chat').classList.contains('on')) closeChat(); });

window.addEventListener('beforeunload',()=>{ if(S&&!S.done) save(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S&&!S.done) save(); });

if(unlocked()) enter(); else setTimeout(()=>$('#pw').focus(),100);
})();
</script>
