관투자자가 아닌 일반청약자는 수요예측에 참여할 수 없다.\n※ 증권 인수업무 등에 관한 규정 제5조(주식의 공모가격 결정 등) 제1항\n① 기업공개를 위한 주식의 공모가격은 다음 각 호의 어느 하나에 해당하는 방법으로 결정한다.\n1. 인수회사와 발행회사가 협의하여 단일가격으로 정하는 방법\n2. 기관투자자를 대상으로 수요예측을 실시하고 그 결과를 감안하여 인수회사와 발행회사가 협의하여 정하는 방법\n3. 대표주관회사가 사전에 정한 방법에 따라 기관투자자로부터 경매의 방식으로 입찰가격과 수량을 제출받은 후 일정가격(이하 \"최저공모가격\"이라 한다) 이상의 입찰에 대해 해당 입찰자가 제출한 가격으로 정하는 방법\n4. 대표주관회사가 사전에 정한 방법에 따라 기관투자자로부터 경매의 방식으로 입찰가격과 수량을 제출받은 후 산정한 단일가격으로 정하는 방법\n※ 증권 인수업무 등에 관한 규정 제9조(주식의 배정) 제1항\n① 기업공개를 위한 대표주관회사는 공모주식을 다음 각 호에서 정하는 바에 따라 해당 청약자 유형군에 배정하여야 한다.\n1. 유가증권시장 상장을 위한 기업공개(외국법인등의 기업공개는 제외한다)의 경우 우리사주 조합원에게 「근로복지기본법」 제38조 제1항에 따라 공모주식의 20%를 배정한다.\n2. 코스닥시장 또는 코넥스시장 상장을 위한 기업공개의 경우 우리사주 조합원에게 「근로복지기본법」 제38조 제2항에 따라 공모주식의 20%를 배정할 수 있다(← 강행규정이 아님).\n3. 일반청약자에게 공모주식의 25% 이상을 배정한다."}, {"no": 90, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주주총회 의결권에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["의결권 행사를 위해서는 기명주는 명의개서, 무기명주는 공탁을 해야 한다.", "우리 상법상 의결권의 서면행사가 인정된다.", "특수결의란 의결권이 없는 주주를 제외한 총 주주의 동의를 요하는 결의를 말한다.", "회사가 가진 자기주식은 의결권이 없다."], "answer": 3, "explain": "특수결의란 의결권이 없는 주주를 포함한 총 주주의 동의를 요하는 결의를 말한다.\n※ 상법 제400조(회사에 대한 책임의 감면) 제1항\n① 제399조에 따른 이사의 책임은 주주 전원의 동의로 면제할 수 있다(← 특수결의에 대한 설명임).\n※ 상법 제399조(회사에 대한 책임) 제1항\n① 이사가 고의 또는 과실로 법령 또는 정관에 위반한 행위를 하거나 그 임무를 게을리 한 경우에는 그 이사는 회사에 대하여 연대하여 손해를 배상할 책임이 있다."}, {"no": 91, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 감사위원회에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["자산총액이 2조원 이상인 상장법인의 감사위원회는 법정 필요 상설기관이다.", "감사위원회를 설치한 경우에는 감사를 둘 수 없다.", "감사위원회의 대표는 사외이사로 하여야 한다.", "사외이사가 위원의 3분의 1 이상이어야 한다."], "answer": 4, "explain": "사외이사가 위원의 3분의 2 이상이어야 한다(이는 외부에서 회사 내부 견제를 위한 것임).\n※ 상법 제415조의2(감사위원회)\n① 회사는 정관이 정한 바에 따라 감사에 갈음하여 위원회로서 감사위원회를 설치할 수 있다. 감사위원회를 설치한 경우에는 감사를 둘 수 없다.\n② 감사위원회는 3명 이상의 이사로 구성한다. 다만, 사외이사가 위원의 3분의 2 이상이어야 한다.\n③ 감사위원회 위원의 해임에 관한 이사회의 결의는 이사총수의 3분의 2 이상의 결의로 하여야 한다.\n④ 감사위원회는 그 결의로 위원회를 대표할 자를 선정하여야 한다. 이 경우 수인의 위원이 공동으로 위원회를 대표할 것을 정할 수 있다.\n⑤ 감사위원회는 회사의 비용으로 전문가의 조력을 구할 수 있다."}, {"no": 92, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 단독주주권에 속하는 것은?", "extra": [], "choices": ["신주발행유지청구권", "회계장부열람청구권", "위법행위유지청구권", "주주제안권"], "answer": 1, "explain": "신주발행유지청구권은 단독주주권이며, 나머지(회계장부열람청구권, 위법행위유지청구권, 주주제안권)는 소수주주권이다.\n※ 상법 제424조(신주발행유지청구권)\n회사가 법령 또는 정관에 위반하거나 현저하게 불공정한 방법에 의하여 주식을 발행함으로써 주주가 불이익을 받을 염려가 있는 경우에는 그 주주는 회사에 대하여 그 발행을 유지(留止 ← 중단의 의미)할 것을 청구할 수 있다. (∵ 빈출문항)\n• 단독주주권에는 의결권, 설립무효판결청구권, 총회결의취소판결청구권, 감자무효판결청구권, 신주발행유지청구권, 정관, 재무제표 등의 열람권 등이 있다.\n※ 소수주주권\n소수주주권은 회사가 발행한 주식총수의 일정비율 이상의 주식을 가진 주주만이 행사할 수 있는 권리로서 일정한 요건과 구체적 사안에 따라 발행주식총수의 1/100, 3/100, 또는 10/100 이상의 주식수가 필요하다. 그러나 상법은 상장회사에 대해서는 그 행사요건을 완화하였으며(상법 제542조의6), 정관으로 더욱 완화할 수도 있도록 하였다.\n상법상으로는 발행주식총수의 10분의 1 이상을 요건으로 하는 소수주주권으로는 회사의 해산판결청구권이 있으며, 100분의 3 이상을 요건으로 하는 것에는 이사의 해임청구권, 총회소집청구권, 회계장부열람권, 회사의 업무와 재산상태의 검사청구권 등이 있으며, 100분의 1 이상을 요건으로 하는 것에는 대표소송제기권 등이 있다.\n1인 또는 수인의 보유주식수를 합산하여 법에서 정하는 일정의 주식수가 되어야 그 행사를 할 수 있다는 점에서 1주의 주주에게도 부여되는 단독주주권과 구별된다."}, {"no": 93, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 자본충실의 원칙과 거리가 먼 것은?", "extra": [], "choices": ["이익배당의 제한", "주주의 유한책임", "법정 준비금 제도", "변태설립에 의한 엄격한 조사와 감독"], "answer": 2, "explain": "주주(정확하게는 주식인수인)의 유한책임이란 주주는 회사에 대하여 그가 가지는 주식의 인수가액을 한도로 하여 출자의무만 질 뿐, 그 이상의 출연할 책임은 없다. 그러므로 회사가 채무초과 상태에 빠지더라도 주주는 회사채권자에 대하여 변제할 책임을 지지 않으므로 이를 주주유한책임의 원칙이라고 한다. 이는 자본확정의 원칙에 가깝다."}, {"no": 94, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 이사에 대한 설명으로 옳은 것을 모두 몇 개인가?", "extra": ["\u003c보기\u003e", "가. 이사는 이사회에서 선임하는 것을 원칙으로 한다.", "나. 이사의 보수는 정관에 그 액을 정하지 아니한 때에는 이사회의 결의로 이를 정한다.", "다. 이사가 경업금지 의무를 위반하여 거래한 경우 그 거래는 무효로 한다.", "라. 주주가 아닌 자는 이사로 선임될 수 없다고 정관으로 제한할 수 있다."], "choices": ["1개", "2개", "3개", "모두 옳다"], "answer": 1, "explain": "'라' 1개만 옳다. 주주가 아닌 자는 이사로 선임될 수 없다고 정관으로 제한할 수 있다. 정관으로 이사가 가질 주식(자격주)의 수를 정한 경우에 다른 규정이 없는 때에는 이사는 그 수의 주권을 감사에게 공탁하여야 한다.\n가. 이사는 주주총회에서 선임한다.\n나. 이사의 보수는 정관에 그 액을 정하지 아니한 때에는 주주총회의 결의로 이를 정한다.\n다. 이사가 경업금지의 규정에 위반하여 거래를 한 경우에 회사는 이사회의 결의로 그 이사의 거래가 자기의 계산으로 한 것인 때에는 이를 회사의 계산으로 한 것으로 볼 수 있고 제3자의 계산으로 한 것인 때에는 그 이사에 대하여 이로 인한 이득의 양도를 청구할 수 있다.\n※ 상법 관련 규정\n제382조 (이사의 선임, 회사와의 관계 및 사외이사)\n① 이사는 주주총회에서 선임한다.\n② 회사와 이사의 관계는 「민법」의 위임에 관한 규정을 준용한다.\n제383조 (원수, 임기)\n① 이사는 3명 이상이어야 한다. 다만, 자본금 총액이 10억원 미만인 회사는 1명 또는 2명으로 할 수 있다.\n② 이사의 임기는 3년을 초과하지 못한다. (그러나 연임에 대한 제한은 없다.)\n제387조 (자격주) 정관으로 이사가 가질 주식의 수를 정한 경우에 다른 규정이 없는 때에는 이사는 그 수의 주권을 감사에게 공탁하여야 한다.\n제388조 (이사의 보수) 이사의 보수는 정관에 그 액을 정하지 아니한 때에는 주주총회의 결의로 이를 정한다.\n제397조 (경업금지)\n① 이사는 이사회의 승인이 없으면 자기 또는 제3자의 계산으로 회사의 영업부류에 속한 거래를 하거나 동종영업을 목적으로 하는 다른 회사의 무한책임사원이나 이사가 되지 못한다.\n② 이사가 제1항의 규정에 위반하여 거래를 한 경우에 회사는 이사회의 결의로 그 이사의 거래가 자기의 계산으로 한 것인 때에는 이를 회사의 계산으로 한 것으로 볼 수 있고 제3자의 계산으로 한 것인 때에는 그 이사에 대하여 이로 인한 이득의 양도를 청구할 수 있다.\n③ 제2항의 권리는 거래가 있은 날로부터 1년을 경과하면 소멸한다."}, {"no": 95, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 상법상 주식회사의 감사에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["감사는 언제든지 이사에 대하여 영업에 관한 보고를 요구하거나 회사의 업무와 재산상태를 조사할 수 있다.", "자산 규모 2조원 이상 상장회사는 감사 대신 감사위원회를 설치하여야 한다.", "감사는 이사회에서 선임한다.", "모회사의 감사는 그 직무를 수행하기 위하여 필요한 때에는 자회사에 대하여 영업의 보고를 요구할 수 있다."], "answer": 3, "explain": "감사는 주주총회에서 선임한다. 회사는 정관이 정한 바에 따라 감사에 갈음하여 위원회로서 이사회 내에 감사위원회를 설치할 수 있다. 감사위원회는 감사의 법정대체기관이므로 감사위원회를 설치한 경우에는 감사를 둘 수 없다. 감사위원회는 3명 이상의 이사로 구성한다. 다만, 사외이사가 위원의 3분의 2 이상이어야 한다. 상장회사의 경우 감사위원회 위원을 선임하거나 해임하는 권한은 주주총회에 있으며 감사위원회 설치 의무가 있는 상장회사의 경우 주주총회에서 이사를 선임한 후 선임된 이사 중에서 감사위원회 임원을 선임하여야 한다."}, {"no": 96, "subject": "법규 및 세제", "detail": "증권세제", "stem": "우리나라 조세체계에서 국세에 해당하면서 간접세에 해당하는 것은?", "extra": [], "choices": ["증권거래세", "취득세", "증여세", "레저세"], "answer": 1, "explain": "증권거래세는 국세로서 간접세에 해당한다. 증권거래세 납세의무의 성립시기는 '해당 매매거래가 확정되는 때(주식매매의 경우 매도 시)'이다.\n※ 국세기본법 제21조(납세의무의 성립시기 : 기본서를 반영하여 일부만 발췌 게재함) (∵ 빈출문항)\n① 국세를 납부할 의무는 이 법 및 세법에서 정하는 과세요건이 충족되면 성립한다.\n② 제1항에 따른 국세를 납부할 의무의 성립시기는 다음 각 호의 구분에 따른다.\n1. 소득세·법인세 : 과세기간이 끝나는 때\n2. 상속세 : 상속이 개시되는 때\n3. 증여세 : 증여에 의하여 재산을 취득하는 때\n4. 부가가치세 : 과세기간이 끝나는 때\n6. 인지세 : 과세문서를 작성한 때\n7. 증권거래세 : 해당 매매거래가 확정되는 때\n10. 종합부동산세 : 과세기준일\n※ 우리나라 조세체계 (∵ 빈출문항)\n(1) 국세(14개)\n개인이 얻은 소득에 부과하는 소득세, 법인에게 부과하는 법인세, 무상으로 이전되는 '세율의 구조'로 분류한 것은?", "extra": [], "choices": ["보통세 - 목적세", "직접세 - 간접세", "종가세 - 종량세", "비례세 - 누진세"], "answer": 4, "explain": "① 지출의 목적성(보통세 - 목적세),\n② 조세의 전가성(직접세 - 간접세),\n③ 과세표준 단위(종가세 - 종량세),\n④ 세율의 구조(비례세 - 누진세)에 따른 분류이다."}, {"no": 100, "subject": "법규 및 세제", "detail": "증권세제", "stem": "상속세 또는 증여세의 납부세액이 1,400만원이다. 이를 분납한다면 납부기한 내 금액과 분납금액을 순서대로 연결한 것은?", "extra": [], "choices": ["400만원 - 1,000만원", "500만원 - 900만원", "1,000만원 - 400만원", "분납이 불가하다."], "answer": 3, "explain": "납부할 금액이 1천만원을 초과하는 경우에는 아래에서 정하는 바에 따라 그 납부할 금액의 일부를 납부기한이 지난 후 2개월 이내에 분할납부할 수 있다. 다만, 연부연납을 허가받은 경우에는 그러하지 아니하다.\n1. 납부할 세액이 2천만원 이하인 때에는 1천만원을 초과하는 금액\n2. 납부할 세액이 2천만원을 초과하는 때에는 그 세액의 100분의 50 이하의 금액\n따라서 납부세액이 1,400만원의 초과금액인 400만원은 납부기한 경과 후(즉 1,000만원은 정상적으로 납부 후) 2개월 이내에 분납 가능하다."}]}, {"round": 3, "items": [{"no": 1, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 통화유통속도에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["통화유통속도는 사전적으로 추계가 가능하므로 경기변화 및 인플레이션 압력 등을 예측하는 데에 유용하게 활용된다.", "통화유통속도(V)는 명목GDP(P×Y)를 통화량(M)으로 나눈 값이다.", "일정량의 통화량이 일정 기간 동안 몇 번을 회전하여 명목GDP에 해당하는 거래를 뒷받침하였는가를 반영한다.", "우리나라의 경우 통화유통속도는 장기적으로 하락하는 추세에 있다."], "answer": 1, "explain": "EC(European Community)에서 각 회원국에 권고하는 방식인 MV = PY에서 V(유통속도)를 구할 수 있다. 통화의 유통속도(V)는 사후적으로만 추계가 가능하므로 경기변화 및 인플레이션 압력 등을 예측하는 데에는 유용성이 높지 않다."}, {"no": 2, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 통화지표의 범위가 큰 순서대로 나열된 것은?", "extra": [], "choices": ["M1 ⊃ M2 ⊃ L ⊃ Lf", "M1 ⊃ M2 ⊃ Lf ⊃ L", "L ⊃ Lf ⊃ M2 ⊃ M1", "Lf ⊃ L ⊃ M2 ⊃ M1"], "answer": 3, "explain": "L(광의유동성) ⊃ Lf(금융기관유동성) ⊃ M2(광의통화) ⊃ M1(협의통화) 순이다.\n※ 통화지표별 포괄범위\nM1 : 현금통화 + 요구불예금 + 수시입출식 저축성예금\nM2 : M1 + 기간물 정기예적금 + 시장형 상품(CD, RP, CMA, 표지어음 등) + 실적배당형 상품 + 금융채 + 기타(투신증권저축 및 종금금융회사 발행어음)\n단, 유동성이 낮은 만기 2년 이상의 금융상품 제외\nLf : M2 + M2 포함 금융상품 중 만기 2년 이상 정기예적금 및 금융채 등 + 한국증권금융 예수금 + 생명보험회사의 보험계약준비금 등\nL : Lf + 정부 및 기업 등이 발행한 유동성 시장금융상품(국채, 지방채, 회사채, 기업어음, 자산유동화증권 등)"}, {"no": 3, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 경기변동이론에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["은행이 균형금리에서 결정되는 적정수준의 대출 수준보다 차입자에게 과소한 대출로 인해 발생하는 신용할당(credit rationing) 현상은 금리경로의 장애요인이다.", "경기조절을 위해서 총수요관리가 필요하다는 점에서 통화주의자들의 이론은 케인즈학파의 사고와 동일하나 통화주의자들은 경기순환의 원인을 불안정한 통화공급에서 찾았다.", "새고전학파의 루카스는 소비함수와 투자함수의 계수들이 변할 수 있는 가능성을 모형에 도입하여야 한다고 하면서 케인즈학파를 비판하였다.", "케인즈학파의 전통을 따르는 새케인즈학파는 임금·가격의 신축성을 계승하고자 했다."], "answer": 4, "explain": "케인즈학파의 전통을 따르는 새케인즈학파는 새고전학파의 방법론은 받아들이되, 임금·가격의 경직성과 승수효과의 아이디어를 계승하고자 했다.\n새케인즈학파의 경기변동논리는 케인즈학파와 동일하다. 케인즈는 '가격과 임금의 경직성을 전제'하였지만, 새케인즈학파인 맨큐는 메뉴비용(Menu Cost)을 통해 실제로도 가격과 임금이 경직적이라는 것을 증명하였다(새고전학파의 '루카스 비판'을 극복함)."}, {"no": 4, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 〈보기〉 중 경기선행종합지수에 속하는 것은 총 몇 개인가?", "extra": ["〈보 기〉", "ⓐ 재고순환지표 ⓑ 코스피 ⓒ 장단기금리차 ⓓ 취업자수"], "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explain": "취업자수는 후행종합지수에 포함된다.\n※ 경기종합지수(CI)의 구성지표\n선행종합지수 : 재고순환지표, 경제심리지수, 기계류내수출하지수, 건설수주액(실질), 수출입물가비율, 코스피, 장단기금리차\n동행종합지수 : 건설기성액, 서비스업생산지수, 소매판매액지수, 내수출하지수, 수입액, 비농림어업취업자수, 광공업생산지수\n후행종합지수 : 생산자제품재고지수, 소비자물가지수변화율, 소비재수입액, 취업자수, CP유통수익률"}, {"no": 5, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음의 괄호 안에 들어갈 말이 올바르게 연결된 것은?", "extra": ["통화량의 증가로 투자가 증가하여 그 결과 국민소득이 증가하지만, 이는 다시 화폐수요의 증가로 나타나 이자율이 ( )하게 된다. 이를 화폐공급의 이자율에 대한 ( )라고 한다."], "choices": ["상승 - 소득효과", "상승 - 피셔효과", "하락 - 소득효과", "하락 - 유동성효과"], "answer": 1, "explain": "차례대로 상승 - 소득효과이다. 그리고 화폐공급의 증가로 인플레이션이 발생하면 피셔 방정식에 의해 명목금리가 상승하는 효과를 피셔효과(Fisher Effect)라고 한다."}, {"no": 6, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "경기순환 및 경기예측 지표에 대한 내용이다. 옳은 것을 고르시오.", "extra": [], "choices": ["기준순환일이란 국민경제 전체의 순환변동에서 국면전환이 발생하는 경기전환점을 말한다.", "경기확산지수(DI)는 경기변동의 진폭과 속도를 측정할 수 있다.", "경기저점에서 경기정점까지의 기간을 순환주기라 한다.", "기업경기실사지수(BSI)가 80%이면 경기가 확장국면에 있음을 말한다."], "answer": 1, "explain": "② 경기변동의 진폭과 속도를 측정할 수 있는 것은 경기종합지수(CI : Composite Index)이다.\n(비교) 'DI·BSI·CSI'는 경기방향이나 전환점 파악에는 용이하지만 경기변동의 진폭이나 속도는 측정할 수 없다.\n③ '경기저점~경기저점'의 기간은 순환주기, '경기저점~경기정점'의 기간은 진폭이다(진폭은 심도라고도 함).\n④ BSI(0%~200%)는 100%를 균형점으로 하며, 100%를 상회하면 경기확장국면, 100%를 하회하면 경기수축국면으로 본다.\n(비교) DI(0%~100%)는 50%를 균형점으로 하며 50%를 상회하면 경기확장국면, 50%를 하회하면 경기수축국면으로 본다."}, {"no": 7, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음 중 기업경기실사지수(BSI)에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["단기 경기예측수단이다.", "경기동향 등에 대한 기업가의 판단, 전망 및 이에 대비한 계획을 설문지를 통하여 조사·분석한다.", "BSI가 100 이상인 경우 경기확장국면을, 100 이하는 경기수축국면을 의미한다.", "전체응답자 100명, 긍정적 응답자 70명, 부정적 응답자 30명일 경우 BSI 지수는 40이다."], "answer": 4, "explain": "BSI = (긍정응답수 - 부정응답수)/전체응답수 × 100 + 100\n= (70 - 30)/100 × 100 + 100 = 140 (0 ≤ BSI ≤ 200), BSI가 100을 초과하므로 경기상승(확장)국면으로 해석한다."}, {"no": 8, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음 중 부채항목으로만 묶은 것은?", "extra": [], "choices": ["선수금, 미수금", "선수수익, 미지급비용", "선급비용, 선수수익", "선급금, 미지급금"], "answer": 2, "explain": "선수수익, 미지급비용은 부채항목이다."}, {"no": 9, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "재무비율분석의 해석에 대한 다음 설명 중 가장 적합한 것은?", "extra": [], "choices": ["단기채무상환 능력을 알아보고서 측정하는 비율이 유동비율이며 이는 유동부채를 유동자산으로 나누어서 계산한다.", "부채비율이 높을수록 주주들의 기대수익률은 낮아진다.", "총자산회전율이 하락하고 있다면 이는 경영효율이 하락하고 있거나 기계설비가 노후화되고 있음을 의미한다.", "배당성향이 하락하고 있다면 해당 기업이 점차 성숙단계에 접어들고 있어 더 이상의 설비확장이나 운전자본이 필요하지 않음을 의미한다."], "answer": 3, "explain": "옳은 내용은 ③이다. 총자산회전율(매출액/총자산)이 하락하고 있다면 '기업매출의 둔화, 경영효율의 악화, 기계설비의 노후화가 진행되고 있음'을 의미한다.\n[정] 총자산회전율이 상승하고 있다면 '기업매출의 신장, 자산의 활용이 더욱 효율화되고 있음을 의미한다.\n② 부채비율이 높을수록 기업이익의 변동성이 더욱 커지고, 그 결과 위험도 더욱 커지면 또한 주주들의 기대수익률도 더욱 높아지게 된다. 부채비율(타인자본/자기자본 × 100)이 높을수록 기업의 재무적 위험이 큰 것을 의미하고, 따라서 해당 기업에 투자하는 주주의 입장에서는 'high risk high return'의 차원에서 더 높은 기대수익률을 요구하게 된다.\n④ 성숙단계에 접어든 기업은 성장기에 비해서 투자가 감소하고 따라서 배당성향이 상승한다."}, {"no": 10, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음 중 통상적으로 PBR 값이 1이 아닌 이유와 거리가 먼 것은?", "extra": [], "choices": ["분자의 주가는 미래 현금흐름을 나타내지만 분모의 순자산은 역사적 취득원가를 나타내기 때문이다.", "계속기업(Going Concern)을 가정하기 때문이다.", "분자의 주가는 기업의 총체적 가치이지만 분모의 BPS는 단순히 개별자산의 합에 불과하기 때문이다.", "회계 관습에 의하여 자산·부채의 장부가액 평가가 제약을 받기 때문이다."], "answer": 2, "explain": "②의 내용은 해당하지 않는다.\n① (시간성의 차이) 분자의 주가는 미래 현금흐름을 나타내지만 분모의 순자산은 역사적 취득원가를 나타내기 때문이다.\n③ (집합성의 차이) 분자의 주가는 기업의 총체적 가치이지만 분모의 BPS는 단순히 개별자산의 합에 불과하기 때문이다.\n④ (자산·부채의 인식기준의 차이) 회계 관습에 의하여 자산·부채의 장부가액의 평가가 제약을 받기 때문이다."}, {"no": 11, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "주당순이익의 성장률이 8%, 다음 기의 예상 주당순이익은 10,000원, 요구수익률은 10%, 배당성향이 20%일 때, 고든(Gordon) 배당평가모형으로 평가한 동 주식의 가격은?", "extra": [], "choices": ["100,000원", "80,000원", "50,000원", "25,000원"], "answer": 1, "explain": "평가모형 = D1/(k - g) = 2,000/(0.10 - 0.08) = 100,000원이다.\n► 주당순이익의 성장률 8%는 '배당성장률 8%'와 같은 의미이다. 배당은 주당순이익의 일정비율에 해당하므로 주당순이익의 성장률은 곧 배당성장률과 같다."}, {"no": 12, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "보기는 다우이론의 장기추세 6국면 중 어디에 속하는가?", "extra": ["· 전반적인 경제여건 및 기업의 영업수익이 호전됨으로써 일반투자자들의 관심이 고조되어 주가가 상승하고 거래량도 증가한다.", "· 기술적 분석을 이용하여 주식을 투자하는 사람이 가장 많은 수익을 올릴 수 있는 국면이다.", "· 투자전략으로는 점차 매도해야 하는 국면이다."], "choices": ["강세 1국면", "약세 2국면", "강세 2국면", "강세 3국면"], "answer": 3, "explain": "'강세 2국면(상승국면/기술적 추세 추종 단계)'에 해당한다. 투자전략으로서는 '점차 매도'하는 상승국면이다. '매도'는 강세 3국면(과열국면)에서 이루어져야 한다.\n※ 다우이론(Dow theory)의 장기추세 진행과정\n매집국면(강세 1국면) → 상승국면(강세 2국면) → 과열국면(강세 3국면) → 분산국면(약세 1국면) → 공포국면(약세 2국면) → 침체국면(약세 3국면)\n※ 다우이론의 장기추세 진행과정(6단계)\n(1) 매집국면 : 장래전망은 여전히 어두움, 초보자는 매도, 전문가는 매수한다.\n(2) 상승국면 : 경제여건의 호조, 상승추세의 강화가 나타나며 기술적 분석으로 가장 많은 수익을 올릴 수 있는 국면이다.\n(3) 과열국면 : 장래전망은 최고조, 초보자들이 적극 매수하여 과열기미를 보인다.\n(4) 분산국면 : 주가가 조금만 하락해도 거래량이 급증한다(전문투자자는 매도, 일반투자자는 조정 후 상승기대로 매수).\n(5) 공포국면 : 경제여건 악화, 주가의 수직 하락이 나타나며 거래량도 급감한다.\n(6) 침체국면 : 투매양상(지친 실망매물), 시간이 지날수록 낙폭은 완화된다."}, {"no": 13, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "엘리어트 파동에 대한 설명으로 틀린 것은?", "extra": [], "choices": ["3번 파동은 5개 파동 중에서 가장 강력하고 가격변동도 활발하게 일어나는 파동으로 5개 파동 중 가장 길게 나타나는 것이 일반적이다.", "1번 파동은 충격파동이므로 반드시 5개의 소파동으로 구성되어야 한다.", "2번 파동은 조정파동으로서 1번 파동을 38.2% 또는 61.8%만큼 되돌리는 경향이 높으며, 1번 파동을 100% 이상 되돌리는 경우는 없다.", "급진갭(계속갭)은 5번 파동에서 주로 나타난다."], "answer": 4, "explain": "④ 가장 강력한 파동인 3번 파동에서 '돌파갭(break away)이나 급진갭(계속갭 : run away)'이 나타나며, 3번 파동에서 소멸갭(exhaustion)은 나타나지 않는다. 갭이론에서 가장 강력한 국면에서 나타나는 갭은 급진갭(run away gap)인데, 이러한 급진갭이나 돌파갭(break away gap)은 3번 파동에서 나타난다. 소멸갭(exhaustion gap)은 상승국면 막바지에서 나타나므로 5번 파동에서 나타난다고 할 수 있다.\n※ 오답해설\n① 3번 파동은 가장 강력한 국면으로서 다우이론에서는 상승국면(마크업국면), 이동평균선 분석상에서는 정배열국면이라 할 수 있다. 따라서 파동의 길이가 가장 긴 것이 일반적인데 보통 1번 파동의 1.618배로 나타난다.\n② 엘리어트 파동은 상승5파와 하락3파 총 8개의 파동으로 구성되고, 이 중에서 충격파동(메인파동)은 '1번, 3번, 5번, a, c'파동이며 조정파동(서브파동)은 '2번, 4번, b'파동이다. 그리고 충격파동은 5개의 소파동으로, 조정파동은 3개의 소파동으로 구성된다.\n③ 2번 파동은 조정파동으로서 엘리어트 파동의 황금비율인 38.2% 또는 61.8%만큼 되돌리는 경향이 많다. 100% 이상 되돌리는 것은 엘리어트 파동의 절대불가침의 법칙 중 '2번 파동은 1번 파동의 저점보다 반드시 높아야 한다'에 위배되어 발생할 수 없다.\n※ 엘리어트 파동의 특징\n(1) [1번 파동 : 충격파동] 새로운 추세의 시작점, 일반적으로 상승파동 중에서 가장 짧다.\n(2) [2번 파동 : 조정파동] 1번 파동의 38.2% 혹은 61.8%만큼 조정, 반드시 3개의 소파동으로 구성되어 있다.\n(3) [3번 파동 : 충격파동] 가장 강력한 상승파동, 일반적으로 5개 파동 중 가장 길다(보통 1번 파동 × 1.618). 돌파갭이나 계속갭이 가능하다.\n(4) [4번 파동 : 조정파동] 3번 파동의 38.2%만큼 되돌리는(조정파동) 경우가 많다. 3번 파동 내의 4번 파동만큼 되돌아가는 경향이 높다.\n(5) [5번 파동 : 충격파동] 추세의 막바지 국면, 일반적으로 3번 파동에 비해 거래량도 적게 형성된다.\n(6) [a파동 : 충격파동] 이제까지와 다른 새로운 하락추세가 시작, 반드시 5개의 소파동으로 구성된다.\n(7) [b파동 : 조정파동] 일시적인 조정파동, 매입포지션을 정리할 마지막 기회이다.\n(8) [c파동 : 충격파동] 3번 파동과 유사할 정도의 강한 하락파동, 투매로 급락하는 경향이 있다."}, {"no": 14, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "패턴분석 중 지속형에 속하는 것은?", "extra": [], "choices": ["삼봉형", "깃대형", "확대형", "V자 모형"], "answer": 2, "explain": "깃대형은 지속형이다.\n※ 패턴분석의 종류\n[반전형 패턴]\n• 헤드 앤 쇼울더형(H\u0026S형)\n• 역 헤드 앤 쇼울더형(Reverse H\u0026S형)\n• 원형천정형 / 원형바닥형\n• V자형(바닥 V자, 천정 V자)\n• 확대형\n[지속형 패턴]\n• 삼각형(대칭, 직각)\n• 직사각형\n• 깃대형\n• 쐐기형\n• 다이아몬드형"}, {"no": 15, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "기술적 분석에 대한 설명이다. 가장 적절하지 않은 것은?", "extra": [], "choices": ["증권의 시장가치는 수요와 공급에 의해서만 결정된다고 전제한다.", "추세분석으로써 기업의 내재적 가치 변동의 원인분석을 할 수 있다.", "계량화가 어려운 심리적 요인까지 주가에 반영함으로써 기본적 분석의 한계점을 보완한다.", "도표에 나타나는 주가모형은 스스로 반복하는 경향이 있다고 전제한다."], "answer": 2, "explain": "증권시장 움직임의 근본원인을 알 수 있는 것은 펀더멘탈 분석(기본적 분석)이다. 기술적 분석은 시장의 변동에만 집착하기 때문에 시장변동의 근본원인은 파악할 수 없다.\n※ 기술적 분석의 기본 가정\n(1) 증권의 시장가치는 수요와 공급에 의해서 결정된다.\n(2) 시장의 사소한 변동을 고려하지 않는다면, 주가는 지속되는 추세에 따라 상당기간 동안 움직이는 경향이 있다.\n(3) 추세의 변화는 수요와 공급의 변동에 의해 일어난다.\n(4) 수요와 공급의 변동은 그  합계수량을 공개하고, 단일가매매의 경우 예상체결가격·수량 및 매도/매수별 3단계 우선 호가가격·수량을 공개한다."}, {"no": 24, "subject": "증권분석 및 증권시장", "detail": "코스닥시장", "stem": "호가와 관련하여 다음 〈보기〉의 내용에 해당하는 것은?", "extra": ["〈보 기〉", "상대방 최우선호가로 즉시 체결이 가능하도록 하기 위해 주문접수 시점의 상대방 최우선호가 가격으로 지정되는 주문형태이다. 즉, 매도의 경우 해당 주문의 접수시점에 가장 높은 매수주문의 가격, 매수의 경우 해당 주문의 접수시점에 가장 낮은 매도주문의 가격으로 지정한 것으로 보아 매매체결에 참여하는 주문이다."], "choices": ["지정가주문", "최우선지정가주문", "조건부지정가주문", "최유리지정가주문"], "answer": 4, "explain": "최유리지정가주문에 대한 설명이다. 최유리지정가주문이란 상대방 최우선호가로 즉시 체결이 가능하도록 하기 위해 주문접수 시점의 상대방 최우선호가 가격으로 지정되는 주문형태이다. 즉, 매도의 경우 해당 주문의 접수시점에 가장 높은 매수주문의 가격, 매수의 경우 해당 주문의 접수시점에 가장 낮은 매도주문의 가격으로 지정한 것으로 보아 매매체결에 참여하는 주문이다.\n※ 호가(주문)의 종류\n(1) 지정가주문\n종목, 수량, 가격을 투자자가 지정하는 가장 일반적인 주문형태로서 투자자가 지정한 가격 또는 그 가격보다 유리한 가격으로 매매거래를 하고자 하는 주문이다. 따라서 지정된 가격은 매매거래가 가능한 가격의 한도를 의미하므로 매수주문의 경우 지정된 가격이나 그보다 낮은 가격, 매도주문의 경우 지정한 가격이나 그보다 높은 가격이면 체결이 가능하다.\n(2) 시장가주문\n종목과 수량은 지정하되 가격은 지정하지 않는 주문유형으로, 현 시점에서 가장 유리한 가격조건 또는 시장에서 형성되는 가격으로 즉시 매매거래를 하고자 하는 주문을 말한다. 따라서 일반적인 경우 시장가주문은 지정가주문에 우선하여 매매체결되고 주문수량 전량이 해소될 때까지 가장 우선하는 상대방 주문부터 순차적으로 체결이 이루어진다.\n(3) 조건부지정가주문\n매매거래시간 중에는 지정가주문으로 매매거래에 참여하지만 매매체결이 이루어지지 않은 잔여수량은 종가결정(장 종료 전 10분간 단일가매매) 시에 시장가주문으로 자동 전환되는 주문이다.\n(4) 최유리지정가주문\n상대방 최우선호가로 즉시 체결이 가능하도록 하기 위해 주문접수 시점의 상대방 최우선호가 가격으로 지정되는 주문형태이다. 즉, 매도의 경우 해당 주문의 접수시점에 가장 높은 매수주문의 가격, 매수의 경우 해당 주문의 접수시점에 가장 낮은 매도주문의 가격으로 지정한 것으로 보아 매매체결에 참여하는 주문이다.\n(5) 최우선지정가주문\n최우선지정가주문은 해당 주문의 접수시점에 자기 주문 방향의 최우선호가 가격으로 지정되어 주문이 제출된다. 매도의 경우 해당 주문의 접수시점에 가장 낮은 매도주문의 가격, 매수의 경우 당해 주문의 접수시점에 가장 높은 매수주문의 가격으로 지정한 것으로 보아 매매체결에 참여하는 주문이다.\n(6) 목표가주문\n투자자가 특정 지정가격이 아닌 당일의 거래량가중평균가격(VWAP) 등 향후에 결정될 가격 또는 그와 근접한 가격으로 매매체결을 원하는 경우, 회원이 재량으로 투자자가 목표로 하는 가격에 최대한 근접하여 체결될 수 있도록 하는 주문유형이다. 다만, 목표가주문과 관련된 호가유형은 별도로 존재하지 않기 때문에 회원사가 목표가 달성을 위해 투자자 주문을 지정가호가 또는 시장가호가 등의 형태로 분할하여 제출하여야 한다.\n(7) 경쟁대량매매주문\n투자자가 종목 및 수량을 지정하되 당일의 거래량가중평균가격(VWAP)으로 매매거래를 하고자 하는 주문유형이다. 이는 시장충격을 최소화하는 대량매매제도의 한 유형으로서 최소수량요건 등이 적용되며 정규시장과는 별도의 시장에서 비공개로 매매체결이 이루어진다."}, {"no": 25, "subject": "증권분석 및 증권시장", "detail": "코스닥시장", "stem": "다음 〈보기〉 중 프로그램매매와 호가효력 일시정지제도(Side car)에 대한 설명으로 옳은 것만 모두 고른 것은?", "extra": ["〈보 기〉", "ⓐ 프로그램매매는 일반적으로 시장분석·투자시점 판단·주문제출 등의 과정을 컴퓨터로 처리하는 거래기법을 통칭하는 매매방법을 말한다. 한국 증권시장에서의 프로그램매매는 모든 지수차익거래와 동일인이 일시에 KOSPI 구성종목 중 15종목 이상을 거래하는 비차익거래를 의미한다.", "ⓑ Side car 제도는 프로그램매매를 규제하는 가장 대표적인 방법으로 시장상황이 급변할 경우 프로그램매매의 호가효력을 일시적으로 제한함으로써 프로그램매매가 주식시장에 미치는 충격을 완화하고자 하는 제도이다.", "ⓒ 동 제도에 따르면 코스피200지수선물 가격이 기준가 대비 5% 이상 상승 또는 하락하여 1분간 지속되는 경우, 상승의 경우에는 프로그램매수의 호가효력을, 하락의 경우에는 프로그램매도의 호가효력을 5분 동안 정지하며, 프로그램매매의 호가효력이 5분 동안 정지된 후에는 접수순서에 따라 매매를 체결시킨다.", "ⓓ 장 종료 40분전 이후, 그리고 프로그램매매호가의 효력정지시간 중 주식시장의 매매거래중단제도(Circuit Breaker)에 의하여 주식시장의 매매거래가 중단된 후 당해 매매거래가 재개된 때에도 Side car의 발동을 해제한다."], "choices": ["ⓐ, ⓑ, ⓒ, ⓓ", "ⓐ, ⓑ, ⓒ", "ⓐ, ⓑ", "ⓐ, ⓑ, ⓓ"], "answer": 1, "explain": "모두 옳은 표현이다.\n※ 프로그램매매\n프로그램매매는 일반적으로 시장분석·투자시점 판단·주문제출 등의 과정을 컴퓨터로 처리하는 거래기법을 통칭하는데, 시장상황별로 실행할 투자전략을 사전에 미리 수립하여 그 내용을 컴퓨터에 프로그래밍하고, 시장상황의 분석과 분석내용에 따른 주문 등을 프로그램에 따라 컴퓨터로 처리하는 매매방법이다.\n한국증권시장에서의 프로그램매매는 모든 지수차익거래*와 동일인이 일시에 KOSPI 구성종목 중 15종목 이상을 거래하는 비차익거래를 의미한다.\n(*지수차익거래란 KOSPI200 구성종목의 주식집단과 KOSPI200 선물 또는 옵션의 가격 차이를 이용하여 이익을 얻을 목적으로 주식집단과 선물 또는 옵션을 연계하여 거래하는 것이다.)"}, {"no": 26, "subject": "증권분석 및 증권시장", "detail": "코스닥시장", "stem": "다음 중 거래소 시장운영 등에 대한 설명이다. 옳은 항목의 개수는?", "extra": ["가. 경쟁대량매매주문이란 종목 및 수량은 지정하되 체결가격은 당일의 거래량 가중평균가격(VWAP)으로 매매하고자 하는 주문 유형이다.", "나. '기세'란 정규시장 종료 시까지 매매거래가 성립되지 아니한 종목 중 당일 기준가격 대비 낮은(높은) 매도(매수) 호가가 있는 경우 가장 낮은(높은) 매도(매수)호가의 가격을 그 날의 종가로 인정하는 제도이다.", "다. ELW는 가격제한폭이 없으므로 시장가 주문이 불가하다.", "라. '동시호가' 시 체결수량 배분방법은 순차적으로 6차 배분까지 한다."], "choices": ["1개", "2개", "3개", "모두 옳다."], "answer": 3, "explain": "옳은 것은 '가', '나', '다'의 3개이다. (시가(始價) 등이 상·하한가로 결정되는 상황인) 동시호가 시 체결수량 배분방법은 순차적으로 3차 배분까지 한다. 그 체결방식은 수량우선의 원칙에 따라 수량이 가장 많은 호가부터 수량이 적은 호가순으로 ① 매매수량단위의 100배(사실상 100주를 말함), ② 잔량의 2분의 1, 그리고 ③ 잔량의 순서로서 즉, 3차 배분까지 체결한다. 동시호가가 적용된 주문수량이 전량 체결될 때까지 장이 시작하는 정규시장에서도 동 배분방식을 계속 적용한다."}, {"no": 27, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "( )란, 채권시장에서 형성된 만기수익률에 의해 결정된 채권매매가격을 의미하며, 일반채권의 경우에는 ( ) 10,000원을 기준으로 산정·표시하는 것을 일컫는 용어이다.", "extra": [], "choices": ["단가 - 액면가", "액면가 - 단가", "단가 - 체결가", "액면가 - 지정가"], "answer": 1, "explain": "채권시장에서 형성된 만기수익률에 의해 결정된 채권매매가격을 의미하며, 일반채권의 경우에는 액면가 10,000원을 기준으로 산정·표시하는 것을 단가라고 한다."}, {"no": 28, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "'액면 1만원, 표면금리 6%, 만기 2년, 만기수익률 10%'인 연후급 이표채의 현금흐름과 만기별 가중현금흐름의 현재가치가 표와 같다.", "extra": ["[표]", "t | CFt | t(t+1)·CFt | t(t+1) × CFt/(1+r)^(t+2)", "1 | 600 | 1,200 | 901.58", "2 | 10,600 | 63,600 | 43,439.66", "(t : 현금흐름 발생기간, CFt : 채권에서 발생하는 각 기의 현금흐름, 단위 : 원)", "동 채권가격이 9,305.78원일 때, 동 채권의 볼록성(convexity) 값(근사치)과, 만기수익률이 10%에서 9%로 변동할 때 볼록성에만 기인한 동 채권가격의 변동률은 얼마인가? (근사치)"], "choices": ["볼록도 = 2.38, 변동률 = 0.0238%", "볼록도 = 4.76, 변동률 = 0.0238%", "볼록도 = 2.38, 변동률 = 0.0476%", "볼록도 = 4.76, 변동률 = 0.0476%"], "answer": 2, "explain": "채권가격(분모)이 9,305.78원이므로 볼록성은\n[t(t+1) × CFt/((1+r)(t+2))] / P = 44,341.24/9,305.78 = 4.76\n(시험대비, 계산상의 분자/분모 입력사항 암기요망)\n그리고, 볼록성(convexity)에 기인한 채권가격의 변동률은\nΔP/P = 1/2 × convexity × Δr^2 에서\nΔP/P = 1/2 × 4.76 × (-0.01)^2 = 1/2 × 4.76 × 0.0001 = 0.000238, 즉 0.0238%이다."}, {"no": 29, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "액면가 10,000원인 전환사채를 12,000원에 매수하였다. 전환사채 액면가 10,000원당 전환주식수가 2주이고 주식의 주당 시가는 5,500원이면 다음 내용 중 옳은 것은?", "extra": ["[표: 패리티(%) / 전환프리미엄(원) / 괴리율(%)]"], "choices": ["110 / 1,000 / 9.1", "120 / 2,000 / 10.1", "110 / 1,000 / 10.1", "120 / 2,000 / 9.1"], "answer": 1, "explain": "· 패리티(%) = 주식의 시장가격/전환가격 = 5,500/5,000 × 100 = 110%\n· 전환가치 = 패리티 가치 = 주식의 시장가격 × 전환주수 = 5,500 × 2 = 11,000(원)\n· 전환프리미엄 = 전환사채의 시장가격 - 전환가치 = 12,000 - 5,500 × 2 = 1,000원\n(전환사채의 전환권 가치로서 옵션 프리미엄의 성격을 지님)\n· 괴리율 = 전환프리미엄/전환가치 = 1,000/11,000 ≒ 9.1%\n(∴ 최근 출제경향은 상기 질문 중 1개를 물음)"}, {"no": 30, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "다음과 같은 네 종류의 채권이 있다. 채권의 만기수익률이 5%에서 6%로 변동했을 경우 채권가격 하락폭이 큰 순서대로 나열된 것은?", "extra": ["㉠ 수정듀레이션이 2.30인 이표채", "㉡ 수정듀레이션이 2.84인 이표채", "㉢ 잔존만기가 3년인 할인채", "㉣ 잔존만기가 5년인 복리채"], "choices": ["㉠ → ㉡ → ㉢ → ㉣", "㉠ → ㉢ → ㉡ → ㉣", "㉣ → ㉡ → ㉢ → ㉠", "㉣ → ㉢ → ㉡ → ㉠"], "answer": 4, "explain": "채권가격변동률은 (수정)듀레이션 순서대로이다. 만기일시상환채인 복리채의 듀레이션은 잔존만기와 일치한다.\n※ 듀레이션(Duration)의 특징\n(1) 듀레이션이 클수록, 금리변동에 따른 채권의 가격 변동폭은 증가한다.\n(2) 표면금리가 높을수록, 듀레이션은 짧아진다.\n(3) 만기수익률이 높을수록, 듀레이션은 짧아진다.\n(4) 잔존기간이 길수록, 듀레이션은 커진다.\n(5) 무이자할인채의 듀레이션은 만기와 동일하다.\n※ 듀레이션(Duration)의 개념\n채권의 특징으로서 만기, 수익률, 이표의 세 가지를 들 수 있다. 이 세 가지 요소는 채권을 서로 비교할 때 이용되는데, 이 중 한 가지 기준만으로 각 채권을 비교하는 데는 한계가 있다.\n(1) 만기(Maturity)는 최종 현금흐름이 발생하는 시점이라는 의미는 있으나 그 이전에 발생하는 이표지급의 빈도와 시간가치를 고려하지 못한다.\n(2) 만기수익률(YTM)의 경우 향후 지급되는 이표도 만기수익률로 재투자(과거 채권 매입시점에 정해진 YTM으로 매입시점 이후에 유입된 이자수입도 동일한 YTM으로 재투자할 수 있다)된다는 비현실적인 가정을 하고 있어 시장금리가 채권만기 이전에 변동하는 경우 그 의미가 축소된다.\n(3) 이표(Coupon)의 경우 채권의 발행시점마다 당시의 시장금리를 반영하여 각 채권에 따라 상이하게 결정되므로 이를 비교기준으로 이용하는 것도 적절치 않다.\n따라서 현실적으로는 이표와 만기가 상이한 채권들의 금리 리스크를 비교할 필요가 있으며, 이 경우 사용되는 대표적인 측정치가 바로 듀레이션(Duration)이다. 결론적으로 듀레이션은 표면금리, 채권수익률, 만기의 함수로 표현할 수 있다.\n즉, 듀레이션 = f(표면금리, 채권수익률, 만기)"}, {"no": 31, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "다음 중 금리 하락이 예상될 경우에 투자수익률을 극대화하는 적극적인 채권운용방식에 해당하는 것은?", "extra": [], "choices": ["현금 및 단기채의 비중을 늘린다.", "표면이자율이 낮은 장기채 비중을 늘린다.", "채권포트폴리오의 듀레이션을 줄인다.", "복리채보다는 이표채의 비중을 늘린다."], "answer": 2, "explain": "표면이자율이 낮은 장기채 비중을 늘리면 듀레이션이 증가한다."}, {"no": 32, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "채권운용전략에 대한 내용이다. 가장 적절하지 않은 것은?", "extra": [], "choices": ["시장이 효율적일 경우는 채권교체전략을 통해 초과수익을 얻을 수 없다.", "채권인덱싱전략은 채권시장 전체의 흐름을 그대로 따르는 포트폴리오를 구성하여 채권시장의 전체 수익률을 달성하려는 전략이며, 채권시장이 효율적이라고 전제한다.", "채권별 보유량을 각 잔존기간마다 동일하게 유지함으로써 시세변동위험을 평준화시키고 수익성도 적정수준을 확보하려는 전략은 사다리형 만기전략이다.", "장기채를 매입한 후 단기에 매각하고 또 다시 장기채를 매입해 나가면서 이자소득과 가격차익을 동시에 얻는 투자효과를 숄더효과라고 한다."], "answer": 4, "explain": "④는 롤링효과(rolling effect)를 말한다.\n※ 채권운용전략(액티브 운용)\n(1) 금리예측전략(듀레이션조절전략)\n· 시장수익률 하락 예상(채권가격 상승 예상) → 수익률극대화전략 → 듀레이션이 큰 채권매수\n· 시장수익률 상승 예상(채권가격 하락 예상) → 손실최소화전략 → 듀레이션이 적은 채권매수\n(2) 채권교체전략 : 시장의 일시적 불균형상태를 이용하여 초과수익을 내고자 하는 전략(시장이 효율적일 때는 불균형상태가 발생하지 않으므로 사용할 수 없는 전략)\n㉠ 동종채권교체전략\n㉡ 이종채권교체전략\n· 국채매수 \u0026 회사채매도 전략\n· 국채매도 \u0026 회사채매수 전략\n(3) 스프레드운용전략\n서로 다른 두 종목 간의 격차가 균형상태에서 벗어날 경우, 스프레드 확대 또는 축소전략을 통하여 초과수익을 얻고자 하는 전략\n(4) 수익률곡선타기전략\n㉠ 롤링효과 : 금리수준이 일정하더라도 잔존기간이 짧아지면 그만큼 수익률이 하락하여 채권가격이 상승하는데(장기채에서 나타나는 효과), 이를 통해 매매차익을 얻고자 하는 전략이다.\n㉡ 숄더효과 : 수익률 하락이 급격한 구간에 있는 채권(중·단기채)에 투자하면 동일기간 동안 장기채에 투자하는 경우보다 중·단기채의 수익률 하락으로 인한 채권가격 상승폭이 더 크게 나타나는 것을 이용하여 매매차익을 얻고자 하는 전략이다.\n(5) 수익률곡선전략\n㉠ 단기채와 장기채에 비해 '중기채의 수익률이 상대적으로 더 상승할 것으로 예상'될 경우 → 나비형 투자전략(Barbell형 포트폴리오)이라고 하며 단기채매수·중기채매도·장기채매수로 구성한다.\n㉡ 향후 중기채의 수익률은 하락하고 단기채와 장기채의 수익률은 상대적으로 상승함으로써 수익률곡선의 형태가 역나비형 형태를 띨 것으로 예측할 때 취하는 전략이다. → 역나비형 투자전략(Bullet형 포트폴리오)이라고 하며 단기채매도·중기채매수·장기채매도로 구성한다."}, {"no": 33, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "자산유동화증권에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["유통시장CBO는 금융기관이 투기등급 채권을 SPC에 매각하고 SPC는 신용을 보강하여 투자자에게 매각하는 구조이다.", "우리나라의 경우 일반CLO는 금융기관의 무수익채권(non-performing loan)을 기초자산으로 발행하는 NPL자산유동화증권이 대다수이다.", "합성CDO는 준거자산의 소유권을 SPC로 양도하면 이 SPC는 신용을 보강하여 투자자에게 매각하여 자금을 조달한다.", "CDO의 기초자산은 Debt로서 CLO와 CBO를 포함한 개념이다."], "answer": 3, "explain": "합성CDO는 CDO의 특수한 형태로서 준거자산을 양도하는 것이 아니라 자산보유자(originator : 금융기관)의 장부에 그대로 남아 있고 신용위험만 제3자(SPC)에게 이전하는 것이다. 따라서 자산보유자는 신용위험 이외에 대출과 관련된 금리위험, 통화위험 등 여타 위험에 대해서는 효과적으로 헤징이 가능하다는 장점이 있다. SPC는 계약담보자산(채권)에서 발생하는 원리금과 신용파생계약에 따라 수취하는 수수료를 투자자에게 원리금으로 지급하지만, 만약 신용사건이 발생할 경우에는 합성CDO의 원리금지급보다 우선하여 금융회사에 손실금을 지급한다(즉 투자자의 손실이 발생한다)."}, {"no": 34, "subject": "증권분석 및 증권시장", "detail": "기타 증권시장", "stem": "다음 중 코넥스시장의 불성실공시 지정사유가 아닌 것은?", "extra": [], "choices": ["공시내용의 일부사항을 일정 범위 내에서 변경하여 공시하는 경우", "거짓으로 또는 잘못 공시하거나 주요사항을 기재하지 아니하고 공시한 경우", "이미 공시한 내용을 전면 취소, 부인하는 공시를 하는 경우", "조회공시 부인 후 1월 이내에 기존 공시내용과 상반되는 내용을 결정하는 경우"], "answer": 1, "explain": "코넥스시장에서는 제도의 간소화를 위해 공시불이행 및 공시번복만 적용하고 있다. 따라서 공시변경은 적용하지 아니한다.\n② 거짓으로 또는 잘못 공시하거나 주요사항을 기재하지 아니하고 공시한 경우는 공시불이행에 속한다.\n③ 이미 공시한 내용을 전면 취소, 부인하는 공시를 하는 경우는 공시번복에 속한다.\n④ 조회공시 부인 후 1월 이내에 기존 공시내용과 상반되는 내용을 결정하는 경우는 공시번복에 속한다.\n※ 코넥스시장의 불성실공시 제도\n거래소는 상장법인이 공시의무를 이행하지 않는 경우, 불성실공시법인으로 지정하여 투자자에게 주의를 환기시키고 상장법인에게는 성실공시를 유도하고 있다. 현재 코스피 및 코스닥 nswer": 2, "explain": "적정성의 원칙·적합성의 원칙 위반은 3천만원 이하의 과태료 부과 대상이다. 즉, 두 개 원칙에 대한 위반은 과징금 부과 대상이 될 수 없다. 다만, 설명의무 위반, 불공정영업행위금지 위반, 부당권유행위금지 위반, 광고규제 위반 등은 사안의 경중에 따라 과징금 또는 과태료가 부과될 수 있다."}, {"no": 79, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자가 자료열람을 요구하려는 경우 금융투자업자가 열람의 제한 및 거절을 할 수 있는 사유가 아닌 것은?", "extra": [], "choices": ["「부정경쟁방지 및 영업비밀보호에 관한 법률」에 따른 영업비밀을 현저히 침해할 우려가 있는 경우", "개인정보의 공개로 인해 사생활의 비밀 또는 자유를 부당하게 침해할 우려가 있는 경우", "열람하려는 자료가 열람목적과의 관련성이 의심스러운 경우", "다른 사람의 생명·신체를 해칠 우려가 있거나 다른 사람의 재산과 그 밖의 이익을 부당하게 침해할 우려가 있는 경우"], "answer": 3, "explain": "열람하려는 자료가 열람목적과 관련이 없다는 사실이 명백한 경우이다(단순 의심으로는 거절하지 못한다)."}, {"no": 80, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자보호법상 적합성의 원칙을 적용하지 않아도 되는 것은?", "extra": [], "choices": ["투자성 상품", "증권담보대출", "변액보험", "온라인소액투자중개증권"], "answer": 4, "explain": "온라인투자연계금융업은 온라인으로 대출과 투자를 연결하는 핀테크 서비스로 P2P 금융 혹은 P2P 투자라고도 부른다. 취급하는 온라인소액투자중개증권, 연계투자상품(P2P투자)은 적합성의 원칙을 적용하지 않는다."}, {"no": 81, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 '청약의 철회(금융소비자보호법 제46조)'를 설명한 것으로 틀린 것은?", "extra": [], "choices": ["투자성 상품의 경우 청약철회권은 계약체결일 또는 계약서류를 제공받은 날로부터 7일까지 행사할 수 있으며, 그 청약의 철회의사를 서면등을 발송한 날로부터 철회의 효력이 발생한다.", "금융상품판매업자는 해당 금융소비자에 대해 청약철회에 따른 손해배상 또는 위약금의 지급을 청구할 수 없다.", "전문금융소비자는 청약철회권을 행사할 수 없다.", "금융상품판매업자의 고의나 과실 등 귀책사유가 없는 경우, 금융상품판매업자는 금융소비자의 청약철회권 행사에 응하지 않을 수 있다."], "answer": 4, "explain": "④ 청약철회권은 금융회사의 귀책사유(고의 또는 과실)가 없더라도 일반금융소비자가 행사할 수 있는 권리이다.\n[보충] 일반금융소비자는 '보장성 상품·투자성 상품(금융투자자문 포함)·대출성 상품'에 대해 청약철회권을 행사할 수 있다. 즉 '㉠ 전문금융소비자는 청약철회권을 행사할 수 없으며, ㉡ 일반금융소비자라 하더라도 예금성 상품에 대해서는 청약철회권을 행사할 수 없음'을 의미한다.\n※ 청약의 철회(금소법 제46조)\n(1) 일반금융소비자는 '보장성 상품·투자성 상품(금융투자자문 포함)·대출성 상품'에 대해 청약을 철회할 수 있다('서면등'으로 청약철회 의사를 '발송'한 때 효력이 발생한다).\n• 청약철회권은 금융회사의 귀책사유(고의 또는 과실)가 없더라도 일반금융소비자가 행사할 수 있는 권리이다.\n(2) '투자성 상품(금융투자자문 포함)'은 계약체결일로부터 7일, '대출성 상품'은 계약체결일로부터 14일까지 청약철회가 가능하다.\n(3) 청약철회의 효력발생시기\n㉠ 투자성 상품(금융투자자문 포함) : 청약철회의 의사표시를 위해 서면 등을 발송한 때\n㉡ 대출성 상품 : 청약철회 의사표시를 서면 등으로 발송하고 이미 공급받은 금전·재화 등을 반환한 때\n(4) 청약이 철회된 경우, 금융상품판매업자는 청약철회를 접수한 날로부터 3영업일 이내에 이미 받은 금전·재화 등을 반환하고, 반환이 늦어진 기간에 대해서는 지연이자를 가산하여 지급해야 한다.\n(5) 청약이 철회된 경우, 금융상품판매업자는 일반금융소비자에 대해 청약철회에 따른 손해배상 또는 위약금의 지급을 청구할 수 없다."}, {"no": 82, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 온라인소액투자중개업자에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["타인의 계산으로 채무증권, 지분증권, 투자계약증권의 모집 또는 사모에 관한 중개를 영업으로 하는 투자중개업자이다.", "자신의 인터넷 홈페이지를 통하여 온라인소액증권발행인에 대한 투자자들의 의견이 교환될 수 있도록 관리할 수 있다.", "자신이 개설한 홈페이지 이외의 수단을 통하여 투자광고를 할 수 없다.", "사모의 방식으로 증권의 청약을 권유하는 경우 온라인소액증권발행인이 게재하는 내용을 특정 투자자에게 전송하는 행위를 할 수 없다."], "answer": 4, "explain": "사모의 방식으로 증권의 청약을 권유하는 경우 온라인소액증권발행인이 게재하는 내용을 특정 투자자에게 전송하는 행위를 할 수 있다(사모는 불특정다수를 대상으로 하는 일반광고를 할 수 없으므로 1:1로 투자권유하여야 한다).\n(1) 자신이 온라인소액투자중개를 하는 증권을 자기의 계산으로 취득하거나, 증권의 발행 또는 그 청약을 주선 또는 대리하는 행위를 할 수 없다.\n(2) 온라인소액투자중개를 통하여 증권을 발행하는 자의 신용 또는 투자 여부에 대한 투자자의 판단에 영향을 미칠 수 있는 자문이나 온라인소액증권발행인의 경영에 관한 자문에 응할 수 없다.\n(3) 온라인소액투자중개업자 또는 온라인소액증권발행인은 온라인소액투자중개업자가 개설한 인터넷 홈페이지 이 외의 수단을 통해서 투자광고를 하여서는 아니 된다.\n※ 자본시장법 117조의7 : 영업행위의 규제 등(발췌·인용)\n온라인소액투자중개업자는 다음 각 호의 행위를 제외하고는 증권의 청약을 권유하는 일체의 행위를 하여서는 아니 된다.\n1. 투자광고를 자신의 인터넷 홈페이지에 게시하여야 한다.\n2. 자신의 인터넷 홈페이지를 통하여 자신이 중개하는 증권 또는 그 온라인소액증권발행인에 대한 투자자들의 의견이 교환될 수 있도록 관리하는 행위를 할 수 있다. 다만, 온라인소액투자중개업자는 자신의 인터넷 홈페이지를 통하여 공개되는 투자자들의 의견을 임의로 삭제하거나 수정하여서는 아니 된다.\n3. 사모의 방식으로 증권의 청약을 권유하는 경우에는 온라인소액증권발행인이 게재하는 내용을 특정 투자자에게 전송하는 행위는 할 수 있다."}, {"no": 83, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 투자매매업자 또는 투자중개업자의 '최선집행의무'에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["채무증권의 매매거래에도 적용한다.", "투자자가 청약 또는 주문의 처리에 관하여 별도의 지시를 하였을 경우에는 그에 따라 최선집행기준과 달리 처리할 수 있다.", "3개월마다 최선집행기준의 내용을 점검하여 청약 또는 주문을 집행하기에 적합하지 아니한 것으로 인정되는 때에는 이를 변경하고, 그 변경 사실을 공표하여야 한다.", "금융투자상품의 매매에 관한 청약 또는 주문을 받는 경우에는 미리 문서, 전자문서, 또는 팩스로 최선집행기준을 기재 또는 표시한 설명서를 투자자에게 교부하여야 한다."], "answer": 1, "explain": "최선집행기준이 적용되는 금융투자상품은 '상장주권'에 한해서 적용한다(※ 상장주권은 기출문항이므로 유의). 투자매매업자 또는 투자중개업자는 3개월마다 최선집행기준의 내용을 점검하여야 하는데, 이 경우 최선집행기준의 내용이 청약 또는 주문을 집행하기에 적합하지 아니한 것으로 인정되는 때에는 이를 변경하고, 변경의 이유를 포함하여 그 변경 사실을 공표하여야 한다.\n• 최선집행기준\n최선집행기준이 적용되지 않는 금융투자상품 : (i) 채무증권, (ii) 지분증권(주권은 제외), (iii) 수익증권, (iv) 투자계약증권, (v) 파생결합증권, (vi) 증권예탁증권(주권과 관련된 증권예탁증권은 제외), (vii) 장내파생상품\n최선집행기준에는 (i) 금융투자상품의 가격, (ii) 투자자가 매매체결과 관련하여 부담하는 수수료 및 그 밖의 비용, (iii) 그 밖에 청약 또는 주문의 규모 및 매매체결의 가능성 등을 고려하여 최선의 거래조건으로 집행하기 위한 방법 및 그 이유 등이 포함되어야 한다. 다만, 투자자가 청약 또는 주문의 처리에 관하여 별도의 지시를 하였을 때에는 그에 따라 최선집행기준과 달리 처리할 수 있다."}, {"no": 84, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자보호법상 방문판매원의 판매 등에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["사모펀드 대상 방문판매 목적으로 일반금융소비자에게 사전연락을 할 수 없다.", "전문금융소비자에게는 장외파생상품을 방문판매 목적으로 사전연락을 할 수 있다.", "방문판매인력은 사전안내 시 고객의 개인정보에 대한 취득 경로를 안내하여야 한다.", "연락금지를 요구한 일반금융소비자에게 금융상품을 소개하거나 계약체결을 권유할 목적으로 연락한 자는 1천만원 이하의 과태료를 부과한다."], "answer": 2, "explain": "장외파생상품은 일반 및 전문금융소비자에게 방문판매 목적으로 사전연락을 할 수 없다.\n상대방이 일반금융소비자인 경우에는 고난도금융투자상품(고난도투자일임계약, 고난도금전신탁계약 포함), 사모펀드, 장내 및 장외파생상품은 사전안내할 수 없다. 이들 투자상품 중에서 전문금융소비자에게는 '장외파생상품'을 사전안내할 수 없다. 따라서 장외파생상품은 일반금융소비자는 물론 전문금융소비자에게도 방문판매를 위한 사전안내를 할 수 없다.\n※ 방문판매등 사전안내\n① 방문판매인력은 고객에게 방문판매등을 하기 전에 사전에 전화, 문자메시지 등을 통해 고객에게 방문판매등을 실시할 예정이라는 계획을 안내하여야 한다.\n② 방문판매인력은 제1항에 따라 고객에게 안내할 때 다음 각 호의 사항을 포함하여 안내하여야 한다.\n1. 고객의 개인정보에 대한 취득 경로\n2. 방문판매인력의 소속과 성명, 판매하고자 하는 상품의 종류\n3. 방문판매등을 실시할 예정시간·장소\n4. 투자권유대행인인 경우 계약 체결의 권유만 가능하다는 사실\n③ 회사는 제2항 제2호에 따라 방문판매인력의 신원을 고객에게 안내하는 경우 회사 홈페이지 등을 통해 고객이 이를 확인할 수 있도록 하여야 한다.\n④ 제1항에 따라 사전안내를 받은 고객이 방문판매등을 거절하거나, 방문판매등을 실시할 시간·장소 등을 변경하고자 하는 경우 회사는 이를 따라야 한다."}, {"no": 85, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "집합투자증권의 판매회사 변경제도에 대한 설명이다. 틀린 것으로 연결한 것은?", "extra": ["\u003c보기\u003e", "가. 판매회사 변경에 대한 투자자 요청이 있을 경우는 고객보호차원에서 어떠한 경우에도 판매회사 변경절차를 이행해야 한다.", "나. 투자자의 요청으로 판매회사를 변경할 경우, 판매회사는 판매회사 변경 이행을 대가로 투자자에게 환매수수료를 징구할 수 없으나 별도의 비용은 징구할 수 있다.", "다. 판매회사를 변경한 펀드의 경우 환매수수료 면제를 위한 기산일은 해당 펀드의 최초가입일로부터 계산한다."], "choices": ["가, 나", "나, 다", "가, 다", "가, 나, 다"], "answer": 1, "explain": "틀린 내용은 '가, 나'이다.\n• 가 : 예외 있음. 전산상 관리 곤란 또는 세제상 문제가 있을 경우는 변경이 불가하다.\n• 나 : 환매수수료 징구 불가는 물론, 별도의 비용도 징구할 수 없다.\n※ 집합투자증권 판매회사 변경제도\n(1) 판매회사 변경제도의 취지 : 판매회사 간 서비스차별화 등을 통한 공정경쟁 유도와 투자자의 판매회사 선택권 확대 차원에서 도입되었다.\n(2) 판매회사 변경제도 적용대상 펀드 범위 : 원칙상 판매회사가 판매할 수 있는 모든 펀드를 대상으로 하지만 '전산상 관리가 곤란하거나 세제상 문제가 있는 경우'는 적용대상에서 제외된다.\n(3) 판매회사의 의무\n㉠ 위탁판매계약이 체결된 모든 펀드를 대상으로 판매회사 변경대상이 된다(변경 전 기존 판매회사를 '변경 판매회사'라고 하며, 변경 후의 판매회사를 '변경대상 판매회사'라고 칭함).\n㉡ 투자자 요청 시, 판매회사의 변경절차를 이행해야 한다.\n(4) 변경수수료 부과금지 : 판매회사는 판매회사 변경의 절차를 이행하는 대가로 투자자에게 별도의 비용을 청구할 수 없다.\n(5) 환매수수료 징구금지 : 판매회사의 변경효력이 발생하는 날이 집합투자규약에서 정하는 환매수수료 부과기간 이내라 하더라도 판매회사는 투자자로부터 환매수수료를 징구할 수 없다.\n• 판매회사를 변경한 경우 환매수수료 면제를 위한 기산일은 (변경일이 아닌) 해당 펀드의 최초가입일로부터 계산한다.\n(6) 판매회사 변경 및 변경에 따른 이동액을 조건으로 하는 재산상의 이익제공 행위를 부당한 재산상 이익제공 행위로 규정하여 이익제공 요건에 판매회사 변경이 수반되는 경우 금지된다."}, {"no": 86, "subject": "법규 및 세제", "detail": "한국금융투자협회규정", "stem": "금융투자업자의 집합투자기구(펀드)에 대한 투자광고에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["운용실적을 표시할 경우, 기준일로부터 과거 1개월 이상 수익률을 사용하되 과거 6개월 및 1년 수익률을 함께 표시하여야 하며, 3년 이상 경과된 펀드는 과거 1년 및 3년 그리고 설정·설립일로부터 기준일까지의 수익률을 함께 표시해야 한다.", "종류형 집합투자기구의 운용실적을 표시하는 경우 종류별 집합투자기구에 부과되는 보수나 수수료의 차이로 인해 운용실적이 달라질 수 있다는 사실을 표시해야 한다.", "TV방송광고에 집합투자기구의 운용수익률을 표시할 수 없다.", "상급자의 사전승인 후 협회에 심사를 청구하여야 한다."], "answer": 4, "explain": "금융투자회사가 투자광고를 하고자 하는 경우 준법감시인의 사전승인을 받아 협회에 심사를 청구하여야 한다. 다만, 단순한 이미지광고나 지점광고 등 일부의 경우에는 협회 심사 없이 준법감시인의 사전 승인만 받으면 투자광고를 할 수 있다. 금융투자회사는 영업점에서의 투자광고물 사용의 적정성을 확인하기 위하여 연 1회 이상 현장점검을 실시하여야 한다.\n※ 집합투자기구의 운용실적 표시(영업 및 업무규정 제2-40조 : 준수사항)\n① 금융투자회사가 투자광고에 집합투자기구의 운용실적을 표시하고자 하는 경우 다음 각 호의 사항을 준수하여야 한다. 다만, 단기금융집합투자기구에 대하여는 제3호를 적용하지 아니한다.\n1. \"투자광고계획신고서\"(\"신고서\"라 한다) 제출일이 속한 월의 직전월 마지막 영업일 현재 해당 집합투자기구가 설정일 또는 설립일부터 1년 이상 경과하고, 순자산총액이 100억원(세제펀드는 50억원) 이상일 것\n2. 집합투자증권의 가격으로 평가한 운용실적을 사용할 것. 다만, 종류형집합투자기구의 경우에는 보수가 차감되지 않은 운용실적을 병기할 수 있다.\n3. 기준일로부터 과거 1개월 이상의 수익률을 사용하되, 기준일로부터 과거 6개월 및 1년 수익률을 함께 표시할 것. 다만, 해당 집합투자기구가 설정일 또는 설립일로부터 3년 이상 경과한 경우에는 기준일로부터 과거 1년 및 3년 수익률과 설정일 또는 설립일로부터 기준일까지의 수익률을 함께 표시하여야 한다.\n4. 다음 각 목의 사항을 표시할 것\n가. 집합투자기구의 유형\n나. 기준일 및 기준일 현재의 순자산총액\n다. 설정일 또는 설립일\n라. 수익률 산출기간 및 산출기준\n마. 수익률의 세전·세후 여부\n5. 투자설명서상의 주된 운용대상자산의 비율 및 자산운용보고서상의 운용내역에 근거하여 벤치마크의 수익률을 객관적이고 공정하게 계산하여 병기할 것. 다만, 단기금융집합투자기구, 부동산집합투자기구 등 객관적인 벤치마크를 산정하기 어려운 집합투자기구의 경우에는 이를 생략할 수 있다.\n6. 「방송법」에 따른 방송을 이용하지 아니할 것\n② 종류형집합투자기구의 운용실적을 표시하는 경우에는 종류별 집합투자증권에 부과되는 보수·수수료의 차이로 운용실적이 달라질 수 있다는 사실을 표시하여야 한다.\n③ 금융투자회사가 투자광고에 집합투자기구의 유형별 운용실적을 표시하고자 하는 경우 다음 각 호의 사항을 준수하여야 한다.\n1. 기준일 현재 동일 유형 내 집합투자기구의 순자산총액이 500억원 이상일 것\n④ 금융투자회사가 투자광고에 집합투자기구의 유형별 판매실적, 유형별 판매펀드수익률을 표시하고자 하는 경우 다음 각 호의 사항을 준수하여야 한다.\n1. 기준일 현재 동일 유형 내 집합투자기구의 판매잔고가 500억원 이상일 것\n2. 협회 등 증권유관기관의 공시자료 또는 집합투자기구평가회사의 평가자료를 사용할 것\n3. 기준일에 판매회사의 집합투자기구별 판매잔고를 기준으로 가중평균한 수익률을 사용할 것\n4. 기준일로부터 과거 1년, 3년, 5년 수익률을 함께 표시할 것\n5. 기준일 및 기준일 현재의 판매잔고를 표시할 것\n⑤ 금융투자회사가 투자광고에 단기금융집합투자기구(MMF)의 운용실적을 표시하고자 하는 경우 다음 각 호의 사항을 준수하여야 한다.\n1. 기준일로부터 과거 1개월 수익률을 표시할 것. 이 경우 연으로 환산하여 표시할 수 있다.\n2. 다른 금융투자회사가 판매 또는 운용하는 단기금융집합투자기구와 운용실적 등에 관한 비교광고를 하지 아니할 것\n※ 영업 및 업무규정 제2-41조 : 비교광고\n금융투자회사가 투자광고에 집합투자기구의 운용실적 또는 유형별 판매실적 등을 비교하고자 하는 경우 다음 각 호의 사항을 준수하여야 한다.\n1. 비교대상이 동일한 유형의 집합투자기구일 것\n2. 협회 등 증권유관기관의 공시자료 또는 집합투자기구평가회사의 평가자료를 사용할 것\n3. 기준일로부터 과거 1년, 2년 및 3년 수익률과 설정일 또는 설립일로부터 기준일까지의 수익률(유형별 판매펀드수익률의 경우에는 기준일로부터 과거 1년, 3년, 5년 수익률)을 표시하되, 연 단위 비교대상 내의 백분위 순위 또는 서열 순위\n등을 병기할 것. 이 경우 평가자료에 포함된 전체 비교대상의 수를 근접 기재하여야 한다.\n4. 평가자료의 출처 및 공표일을 표시할 것\n※ 영업 및 업무규정 제2-39조의2(홈쇼핑 광고)\n금융투자회사는 텔레비전 홈쇼핑을 통하여 투자광고를 하는 경우 다음 각 호의 사항을 준수하여야 한다.\n1. 녹화방송의 형태로 제작·집행할 것\n2. 금융투자상품 및 금융투자업에 관한 설명은 해당 금융투자상품 또는 금융투자업과 관련된 자격을 보유하고 있는 해당 금융투자회사의 임직원이 직접 할 것\n3. 투자자의 전화문의에 대한 응대는 해당 금융투자상품 또는 금융투자업과 관련된 자격을 보유하고 있는 해당 금융투자회사의 임직원이 한다는 사실을 안내자막 및 안내음성을 통해 고지할 것\n4. 운용실적이나 수익률 등에 관한 사항은 포함하지 말 것\n5. 제2-37조 제6항에 따른 위험고지 사항을 총 광고시간의 3분의 1 이상의 시간 동안 안내자막 또는 안내음성을 통해 고지할 것"}, {"no": 87, "subject": "법규 및 세제", "detail": "한국금융투자협회규정", "stem": "불성실 수요예측의 참여행위 및 수요예측 참여제한 등에 대한 설명이다. 틀린 것으로 연결한 것은?", "extra": ["\u003c보기\u003e", "가. 수요예측에 참여하여 주식 또는 무보증사채를 배정받은 후 청약을 하지 아니하거나 청약 후 주금 또는 무보증사채의 납입금을 납입하지 않은 경우는, 불성실 수요예측참여 행위로 본다.", "나. 수요예측에 참여하여 공모주식을 배정받은 고위험고수익투자신탁의 신탁계약이 설정·설립일로부터 1년 이내 또는 공모주식을 배 당금(주식) 등의 출금(고)을 요청하는 경우 본인확인 절차를 거친 후 처리하여야 한다.)"}, {"no": 89, "subject": "법규 및 세제", "detail": "한국금융투자협회규정", "stem": "다음 중 금융투자회사의 약관에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["금융투자회사는 업무와 관련하여 협회가 정한 표준약관을 사용하거나, 이를 수정하여 사용할 수 있다.", "금융투자회사는 금융투자업의 영위와 관련하여 약관을 제정 또는 변경하는 경우에는 약관의 제정 또는 변경 후 10일 이내에 협회에 보고하여야 한다.", "금융투자회사는 일반투자자를 대상으로 한 외국집합투자증권 매매거래에 관한 표준약관은 수정하여 사용할 수 없다.", "약관내용 중 고객의 권리 또는 의무에 중대한 영향을 미칠 우려가 있는 경우에는 제정 또는 변경 시행예정일 10일 이전까지 협회에 신고하여야 한다."], "answer": 2, "explain": "금융투자업자는 금융투자업의 영위와 관련하여 약관을 제정 또는 변경하는 경우에는 약관의 제정 또는 변경 후 7일 이내에 협회에 보고하여야 한다. 다만, 투자자의 권리나 의무에 중대한 영향을 미칠 우려가 있는 경우에는 사전신고를 해야 하므로 이에 해당되는 경우에는 약관의 제정 또는 변경 시행 예정일 10영업일 전까지 협회에 신고하여야 한다.\n\"외국 집합투자증권 매매거래에 관한 표준약관\"은 수정하여 사용할 수 없다. 다만, 외국환거래규정 제1-2조 제4호의 투자자(기관투자자를 말함)만을 대상으로 외국집합투자증권을 판매하는 경우에는 그러하지 아니하다."}, {"no": 90, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 2인 이상의 무한책임사원으로만 구성된 회사 조직은?", "extra": [], "choices": ["유한회사", "유한책임회사", "합자회사", "합명회사"], "answer": 4, "explain": "합명회사는 인적결합이 강한 소수인의 공동기업이다. 사원이 직접 연대 무한책임을 진다. 지분의 양도는 무한책임사원 전원의 동의가 있어야 하며 주권은 발행할 수 없다. 회사대표는 '업무집행사원'이 한다."}, {"no": 91, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 단독주주권에 해당하는 것은?", "extra": [], "choices": ["위법행위유지청구권", "신주발행유지청구권", "주주제안권", "회계장부열람청구권"], "answer": 2, "explain": "신주발행유지청구권은 단독주주권이다.\n※ 상법 제424조(유지청구권)\n회사가 법령 또는 정관에 위반하거나 현저하게 불공정한 방법에 의하여 주식을 발행함으로써 주주가 불이익을 받을 염려가 있는 경우에는 그 주주는 회사에 대하여 그 발행을 유지할 것을 청구할 수 있다(그 주주란 단독 주주를 말한다)."}, {"no": 92, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 주식회사의 의결권 행사에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["회사는 자기주식을 취득한 경우 그 주식에 대하여는 의결권을 행사하지 못한다.", "회사는 정관으로 대리인에 의한 의결권의 행사를 금지할 수 있다.", "주주가 2개 이상의 의결권을 가진 경우 이를 불통일 행사할 수 있다.", "주주는 정관에 정하는 바에 따라 총회에 출석하지 아니하고 서면에 의한 의결권을 행사할 수 있다."], "answer": 2, "explain": "정관으로도 대리인에 의한 의결권의 행사를 금지하지 못한다. 주주는 대리인으로 하여금 그 의결권을 행사하게 할 수 있다. 이 경우에는 그 대리인은 대리권을 증명하는 서면을 총회에 제출하여야 한다.\n※ 의결권의 불통일행사\n주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이 경우 주주총회일의 3일 전에 회사에 대하여 서면 또는 전자문서로 그 뜻과 이유를 통지하여야 한다. 또한 회사는 주주의 의결권 불통일 행사를 거부할 수 있으나 주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우에는 거부할 수 없다.\n※ 상법 제368조의2(의결권의 불통일행사)\n① 주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이 경우 주주총회일의 3일 전에 회사에 대하여 서면 또는 전자문서로 그 뜻과 이유를 통지하여야 한다.\n② 주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우 외에는 회사는 주주의 의결권의 불통일행사를 거부할 수 있다."}, {"no": 93, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 주식회사의 변태설립사항에 속하는 것은?", "extra": [], "choices": ["발기인이 받을 특별이익", "회사가 발행할 주식의 총수", "본점 소재지", "액면주식을 발행할 경우 1주의 금액"], "answer": 1, "explain": "발기인이 받을 특별이익은 정관에 기재하여야만 효력이 발생한다(변태설립사항 = 상대적 기재사항).\n※ 상법 제290조(변태설립사항)\n다음의 사항은 정관에 기재함으로써 그 효력이 있다.\n1. 발기인이 받을 특별이익과 이를 받을 자의 성명\n2. 현물출자를 하는 자의 성명과 그 목적인 재산의 종류, 수량, 가격과 이에 대하여 부여할 주식의 종류와 수\n3. 회사성립 후에 양수할 것을 약정한 재산의 종류, 수량, 가격과 그 양도인의 성명\n4. 회사가 부담할 설립비용과 발기인이 받을 보수액"}, {"no": 94, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 자본금 총액이 10억원 미만인 주식회사의 설명으로 옳지 않은 것은?", "extra": [], "choices": ["자본금 총액이 10억원 미만인 회사의 경우에는 감사를 선임하지 아니할 수 있다.", "자본금 총액이 10억원 미만인 회사가 주주총회를 소집하는 경우에는 주주총회일의 10일 전에 각 주주에게 서면으로 통지를 발송하거나 각 주주의 동의를 받아 전자문서로 통지를 발송할 수 있다.", "자본금 총액이 10억원 미만인 회사의 정관은 공증인의 인증을 받음으로써 효력이 생긴다.", "자본금 총액이 10억원 미만인 회사는 1명 또는 2명으로 할 수 있다."], "answer": 3, "explain": "③ 정관은 공증인의 인증을 받음으로써 효력이 생긴다. 다만, 자본금 총액이 10억원 미만인 회사를 발기설립(發起設立)하는 경우에는 각 발기인이 정관에 기명날인 또는 서명함으로써 효력이 생긴다.\n① 자본금의 총액이 10억원 미만인 회사의 경우에는 감사를 선임하지 아니할 수 있다.\n② 자본금 총액이 10억원 미만인 회사가 주주총회를 소집하는 경우에는 주주총회일의 10일 전에 각 주주에게 서면으로 통지를 발송하거나 각 주주의 동의를 받아 전자문서로 통지를 발송할 수 있다.\n④ 이사는 3명 이상이어야 한다. 다만, 자본금 총액이 10억원 미만인 회사는 1명 또는 2명으로 할 수 있다.\n(저자 주 : 자본금 10억원 미만의 내용은 빈출문항으로, 관련내용이 기본서에 흩어져 있지만 위의 4개 사항만 암기하면 된다.)"}, {"no": 95, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음의 괄호 안에 들어갈 것은?", "extra": ["\u003c보기\u003e", "이사는 ( )의 승인이 없으면 자기 또는 제삼자의 계산으로 회사의 영업부류에 속한 거래를 하거나 동종영업을 목적으로 하는 다른 회사의 무한책임사원이나 이사가 되지 못한다."], "choices": ["주주총회", "이사회", "준법지원인", "감사 또는 감사위원회"], "answer": 2, "explain": "이사는 (이사회)의 승인이 없으면 자기 또는 제삼자의 계산으로 회사의 영업부류에 속한 거래를 하거나 동종영업을 목적으로 하는 다른 회사의 무한책임사원이나 이사가 되지 못한다.\n※ 상법 제397조(이사의 경업금지)\n① 이사는 이사회의 승인이 없으면 자기 또는 제삼자의 계산으로 회사의 영업부류에 속한 거래를 하거나 동종영업을 목적으로 하는 다른 회사의 무한책임사원이나 이사가 되지 못한다.\n② 이사가 제1항의 규정에 위반하여 거래를 한 경우에 회사는 이사회의 결의로 그 이사의 거래가 자기의 계산으로 한 것인 때에는 이를 회사의 계산으로 한 것으로 볼 수 있고 제삼자의 계산으로 한 것인 때에는 그 이사에 대하여 이로 인한 이득의 양도를 청구할 수 있다.\n③ 제2항의 권리는 거래가 있은 날로부터 1년을 경과하면 소멸한다."}, {"no": 96, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 직접세에 해당하는 것은?", "extra": [], "choices": ["증권거래세", "개별소비세", "인지세", "종합부동산세"], "answer": 4, "explain": "종합부동산세는 국세로서 직접세이다.\n내국세 중 직접세는 소득세·법인세·상속세·증여세·종합부동산세가 있으며, 간접세는 부가가치세·개별소비세·주세·인지세·증권거래세 등이 있다."}, {"no": 97, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 상속세 과세가액 산입 여부에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["피상속인이나 상속인이 공익신탁을 통하여 공익법인에 출연한 재산은 비과세된다.", "국가·지방자치단체 또는 공공단체에 유증한 재산은 비과세된다.", "상속개시일 전 10년 이내에 피상속인이 상속인에게 증여한 재산가액은 상속세 과세가액에 포함한다.", "피상속인의 재산에서 인출한 금액이 상속개시일 전 1년 이내에 재산종류별로 계산하여 2억원 이상인 경우와 2년 이내에 재산종류별로 5억원 이상인 경우로서 그 용도가 명백하지 아니한 것은 상속받은 것으로 추정한다."], "answer": 1, "explain": "(공익신탁재산의 과세가액 불산입) 피상속인이나 상속인이 공익신탁을 통하여 공익법인에 출연한 재산은 상속세 과세가액에 산입하지 아니한다. '과세가액 불산입'과 '비과세'는 전혀 다른 개념이다. 상속세를 줄이기 위하여 공익법인에 출연 후 이 재산을 악용할 경우 다시 과세가액에 산입할 수 있다.\n(1) 생전 재산처분 및 부채부담액\n피상속인이 재산을 처분하였거나 채무를 부담한 다음의 어느 하나에 해당하는 경우 상속받은 것으로 추정한다(상속세 과세가액에 포함한다는 의미).\n① 피상속인이 재산을 처분하여 받거나 피상속인의 재산에서 인출한 금액이 상속개시일 전 1년 이내에 재산종류별로 계산하여 2억원 이상인 경우와 2년 이내에 재산종류별로 5억원 이상인 경우로서 그 용도가 명백하지 아니한 것\n② 피상속인이 부담한 채무의 합계액이 상속개시일 전 1년 이내에 2억원 이상인 경우와 2년 이내에 5억원 이상인 경우로서 그 용도가 명백하지 아니한 것\n(저자 주 : 상기 규정이 생긴 이유는 피상속인이 될 자의 건강상태 등이 나빠져서 사망 가능성이 높을 경우 직계 존·비속 등이 상속세 부담을 줄이기 위하여 사망 전 미리 재산액을 감추는 행위를 근절하고자 하는 것이다. 따라서 실제 병원비 등으로 지출된 것을 '명백히' 증명하기 위하여 증빙서류를 갖추어 놓아야 한다.)\n• '생전 증여재산가액'으로 상속세 과세가액에 포함되는 것은 다음과 같다.\n－ 상속개시일 전 10년 이내에 피상속인이 상속인에게 증여한 재산가액\n－ 상속개시일 전 5년 이내에 피상속인이 상속인이 아닌 자에게 증여한 재산가액\n• 비과세 대상 항목\n－ 국가·지방자치단체 또는 공공단체에 유증한 재산\n－ 문화재보호법의 규정에 의한 국가지정문화재 및 시·도 지정문화재 및 보호구역 안의 토지\n－ 민법에 따른 제사를 주재하는 자가 승계한 금양임야와 묘토(2억원 한도), 족보와 제구\n－ 정당법의 규정에 따라 정당에 유증한 재산\n－ 사내근로복지기금법의 규정에 의한 사내근로복지기금에 유증한 금품재산\n－ 사회통념상 인정되는 이재구호금품, 치료비, 기타 이와 유사한 것\n－ 상속인이 상속세 신고기한 이내에 국가·지방자치단체 또는 공공단체에 증여한 재산"}, {"no": 98, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 '납부의무 소멸사유'에 해당하는 것은?", "extra": [], "choices": ["납세자가 사망하였을 때", "납부고지·독촉 또는 교부청구나 압류가 있는 때", "소멸시효가 완성된 때", "과세기간이 끝나는 때"], "answer": 3, "explain": "① 납세자가 사망한다면 상속인 등에 승계되어 납부의무를 가질 수 있다.\n② 납부고지, 독촉, 교부청구, 압류 등은 소멸시효의 중단사유이다. 소멸시효 '중단'은 소멸시효 '완성'과 다른 개념으로서, 이미 경과한 시효중단의 효력이 상실되고 새로운 소멸시효가 시작되는 것을 말한다.\n④ '과세기간이 끝나는 때'는 납세의무의 성립시기(소득세·법인세·부가가치세 등)이다. '납세의무 성립시기'와 '납부의무 소멸사유'는 개념 범주가 다르다.\n[보충] 납세의무가 '성립'되면 → '신고'확정 등을 통해서 납세금액이 확정되고 → '구체적인 납세'의무가 발생한다.\n※ 국세기본법상 납부의무의 소멸사유\n(1) 납부·충당되거나 부과가 취소된 때\n(2) 국세부과의 제척기간(除斥期間)이 끝난 때\n(3) 국세징수권의 소멸시효(消滅時效)가 완성된 때"}, {"no": 99, "subject": "법규 및 세제", "detail": "증권세제", "stem": "소득세법상 거주자가 종합소득 확정신고를 해야 하는 경우는?", "extra": [], "choices": ["근로소득과 퇴직소득만 있는 경우", "사업소득과 양도소득만 있는 경우", "원천징수 연말정산하는 사업소득만 있는 경우", "공적연금소득과 퇴직소득만 있는 경우"], "answer": 2, "explain": "• 사업소득이 있는 경우 원칙적으로 종합소득세 과세표준 확정신고를 하여야 한다. 다만, 간편장부대상자가 받는 일부 원천징수 대상 사업소득(예를 들어, 야쿠르트 판매원 등)에 대하여 이를 지급하는 원천징수의무자(판매 본사)가 해당 소득에 대한 연말정산을 함으로써 납세의무를 종결한다.\n• 종합소득 대상은 이자소득, 배당소득, 사업소득, 근로소득, 연금소득, 기타소득이다. (← '이·배·사·근·연·기'로 암기)\n• 퇴직소득과 양도소득은 '분류과세'로서 종합소득에 합산하지 않는다.\n※ 종합소득세 신고와 납부\n소득 납세의무의 성립 후 다음 연도의 5월 1일부터 31일까지 주소지 관할세무서에 종합소득 신고 및 납부하여야 한다.\n다만, 다음에 해당하는 거주자는 신고를 하지 않아도 된다(종합소득신고대상이 아님).\n❶ 근로소득만 있는 거주자 (← 이미 매 지급 시 원천징수되기 때문)\n❷ 퇴직소득만 있는 거주자 (← 지급 시 분류과세로 종결되기 때문)\n❸ 공적연금소득만 있는 자 (← 이미 매 지급 시 원천징수되기 때문)\n❹ 원천징수 연말정산하는 사업소득만 있는 자 (← 이미 매 지급 시 원천징수되기 때문이다. 예로, 특정회사 소속의 야쿠르트를 판매하시는 분들은 사실상 자영업자로서 사업소득 대상이지만 소속회사에서 수당 지급 시 연말정산을 함)\n❹의2. 원천징수되는 기타소득으로 종교인소득만 있는 자\n❺ 위 ❶, ❷ 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❻ 위 ❷, ❸ 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❼ 위 ❷, ❹ 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❼의 2. ❷, ❹의 2 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❽ 분리과세이자·배당·연금·기타소득만 있는 자 (← 예를 들어 타 소득이 없고, 이자와 배당소득의 합계가 2천만원 이하일 경우 15.4%의 원천징수로 종결됨. 그러나 2천만원이 초과할 경우 다음 해 5월 중 종합소득대상임)\n❾ 위 ❶~❼의 2에 해당하는 자로서 분리과세이자·배당·연금·기타소득이 있는 자 (← 타 소득이 있더라도 이자와 배당소득의 합계가 2천만원 이하일 경우 이를 타 소득과 합산하지 아니함)"}, {"no": 100, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음의 증권시장에서 주권을 양도할 때 농어촌특별세가 부과되는 시장은 무엇인가?", "extra": [], "choices": ["유가증권시장", "코스닥시장", "코넥스시장", "K-OTC시장"], "answer": 1, "explain": "유가증권시장에서 양도하는 주권에 대해서는 증권거래세 이외에 농어촌특별세 0.15%가 추가부과된다."}]}, {"round": 4, "items": [{"no": 1, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 불황이 심화될 경우 나타나는 일반적인 현상과 거리가 먼 것은?", "extra": [], "choices": ["가동률 저하", "고용감소", "생산감축", "재고증가"], "answer": 4, "explain": "불황의 초기에는 기업매출과 영업이익이 감소하고 재고가 증가하지만, 불황이 심화되면 생산량 조정을 통하여 재고는 줄어든다(재고감소). 이 단계에서는 생산감축으로 인한 고용감소와 가동률 저하 현상이 동시에 발생한다."}, {"no": 2, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "대표적인 물가지수로만 묶은 것은?", "extra": [], "choices": ["CPI, CI", "GDP디플레이터, 통화유통속도", "DI, CPI", "CPI, GDP디플레이터"], "answer": 4, "explain": "대표적인 물가지수로는 소비자물가지수(CPI), 생산자물가지수(PPI), GDP디플레이터의 3가지가 있다.\n※ GDP디플레이터 = 명목GDP/실질GDP × 100\n(계산문제 대비 이 공식을 반드시 외울 것)"}, {"no": 3, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "통화정책의 파급경로 중 금리경로의 장애요인인 신용할당(credit rationing)에 해당하는 설명은?", "extra": [], "choices": ["기업의 대차대조표 경로를 통한 가계의 내구재 소비 및 주택구입과 같은 소비지출에 영향을 미치는 상황을 말한다.", "부의 효과(wealth effect)가 발생하여 소비에 영향을 주는 상황을 말한다.", "신용도가 낮은 차입자가 대출을 받기가 더 힘든 상황을 말한다.", "금리인하가 기업의 실물대체비용(replacement cost of capital)에 영향을 미치는 상황을 말한다."], "answer": 3, "explain": "중앙은행이 공개시장조작을 통하여 통화공급을 확대하여 단기금리를 낮추면 장기금리와 은행의 대출금리도 하락하여 기업투자와 가계소비가 늘어나고 이는 총생산의 증대로 이어진다. 그러나 이러한 정책은 정작 은행에서는 차입자에 대한 정보의 비대칭성(information asymmetry)하에서 균형금리에서 결정되는 적정 수준의 대출보다 과소한 수준의 대출이 발생하는 차입자에 대한 신용할당(credit rationing) 현상이 일어난다. 이는 곧 통화정책상 금리경로의 장애요인이 된다.\n※ (추가 설명)\n(1) 신용경로의 '대차대조표 효과'\n신용경로는 은행의 대출에 영향을 미쳐서 실물경제에 파급되는 과정을 말한다. 이를 가계와 기업의 '대차대조표 효과'라고 한다. 신용경로는 금리변화와 관계없이 금융기관 고객(가계와 법인 등)의 자기신용이 취약할 경우(가계와 기업의 대차대조표상의 재무상태 악화 : 대차대조표 효과) 금융기관은 대출을 줄이게 되어 전반적인 경제활동이 위축됨으로써 신용경로가 작동하는 것이다(기출).\n(2) 자산가격경로의 replacement cost of capital\n토빈의 q란 자산가격경로의 설명이다. 주식시장에서 평가된 기업의 시장가치를 기업의 실물자본대체비용으로 나눈 값을 말한다. 금리인하로 주가가 상승하면(주가상승이라는 자산가격의 상승인 '자산가격경로'를 통하여) 기업의 시장가치가 커져서 기계나 공장과 같은 실물자본을 대체하는 데 소요되는 비용(replacement cost of capital)을 상회함으로써 q값이 증가한다. 이는 기업들이 높은 가격으로 주식을 발행하여 상대적으로 저렴한 비용으로 투자함으로써 이윤을 늘릴 수 있음을 의미한다."}, {"no": 4, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "새고전학파가 내세우는 내용과 거리가 먼 것은?", "extra": [], "choices": ["거시경제모델에 사용되는 개별함수의 계수는 경직성(rigidity)을 가진다.", "가계와 기업은 합리적 기대(rational expectation)를 한다.", "루카스는 '루카스 비판(Lucas critique)'을 통하여 케인즈학파의 경제이론을 비판하였다.", "개별경제주체는 최적화와 시장청산(market clearing)에 의해 도출된 결과로 행동한다."], "answer": 1, "explain": "새고전학파는 거시경제모델에 사용되는 개별함수의 계수는 시간이 지남에 따라 경직성(rigidity)이 아닌 가변성(time variant)을 가진다고 하여 경직성(rigidity)을 주장한 케인즈 이론을 비판하였다(예를 들어, 케인즈의 소비함수(C) = aY + b 에서 계수 a는 변하지 아니한다(경직성(rigidity))고 주장했으나, 새고전학파는 계수 a도 시간이 흐름에 따라 가변적이라고 주장한다). 케인즈는 투자지출(Y = C + I + G + (X − M)에서 I를 말함)은 투자자(기업가)의 동물적 감각(animal spirits) 등과 관련이 있다고 주장한다. 따라서 투자지출을 독립적으로 생각하여, 독립투자지출로 두었다. 1980년대 초 삼성전자의 이건희 회장의 갑작스런 반도체투자를 기업가(투자자)의 '동물적 감각'의 예로 들 수 있다.\n슘페터(Schumpeter)는 기술이나 생산성 변화와 같은 공급충격(supply shock)을 경기변동의 주원인으로 보면서, 경제순환과 경제발전의 원인을 생산요소의 새로운 결합 또는 기술혁신에 있다고 보았다."}, {"no": 5, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 설명 중 옳지 않은 것은?", "extra": [], "choices": ["통화유통속도(V)는 명목GDP를 통화량(M)으로 나눈 값이다.", "BSI가 80이면 경기확장국면이라고 할 수 있다.", "GDP디플레이터는 명목GDP를 실질GDP로 나눈 값에 100을 곱한 값이다.", "우리나라의 기준금리는 한국은행의 7일물 RP매각에 적용되는 RP금리이다."], "answer": 2, "explain": "BSI는 0~200의 값을 가지며 동 지수가 100을 초과한 경우 경기확장국면, 100 미만인 경우에는 경기수축국면으로, 그리고 100을 경기 전환점(정점 또는 저점)으로 본다.\n※ 보충설명\n①, ③ 명목GDP를 실질GDP로 나누어 구하는 것은 GDP디플레이터이다. 통화유통속도는 명목GDP를 통화량으로 나누어 구한다. ► GDP디플레이터와 화폐유통속도(MV = PY)에서 도출\n(1) GDP디플레이터(P) = MV/Y (단, Y는 실질GDP, M = 통화량)\n→ 명목GDP를 실질GDP로 나누어서 구한다.\n(2) 통화유통속도(V) = PY/M\n→ 명목GDP를 통화량으로 나누어서 구한다."}, {"no": 6, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "통화량 정책의 효과 등에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["우리나라는 통화관리를 위한 중심지표로 M2(광의통화)를 사용한다.", "통화량 증가에 따라 단기적으로 이자율이 하락하는 현상을 유동성 효과라고 한다.", "화폐공급의 증가로 인플레이션이 발생하면 피셔방정식에 의거해 명목금리가 하락하는 현상을 피셔효과(Fisher effect)라고 한다.", "투자의 증가가 국민소득의 증가로 이어지고 이는 다시 화폐수요의 증가로 나타나 이자율이 상승하게 되는데 이를 화폐공급의 이자율에 대한 소득효과라고 한다."], "answer": 3, "explain": "화폐공급의 증가로 인플레이션이 발생하면 피셔방정식에 의거해 명목금리가 상승하는 현상을 피셔효과라고 한다. 1920년대 미국의 경제학자 피셔(I. Fisher)가 제시한 이론으로, 명목이자율은 실질이자율과 기대 인플레이션율의 합과 같다는 피셔방정식을 경제 전체로 확대시킨 것이다. 이에 따르면 인플레이션이 예상되면 명목이자율이 그만큼 상승하기 때문에 실질이자율은 변하지 않는다."}, {"no": 7, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음의 재무비율 중에서, 재무상태표와 손익계산서를 같이 활용해서 산출하는 재무비율에 속하는 것은?", "extra": [], "choices": ["매출액영업이익률", "부채비율", "이자보상비율", "총자산회전율"], "answer": 4, "explain": "총자산회전율이다(분자인 매출액은 손익계산서, 분모인 총자산은 재무상태표).\n※ 재무비율의 구성방식에 따른 분류\n(1) 재무상태표 항목으로 산출되는 재무비율(안정성 비율) : 유동비율, 부채비율, 고정비율\n(2) 손익계산서 항목으로 산출되는 재무비율(수익성 비율) : 매출액영업이익률, 매출액순이익률, 이자보상비율 등\n(3) 재무상태표 항목과 손익계산서의 '매출액' 항목의 재무비율(활동성 비율) : 총자산회전율, 재고자산회전율, 고정자산회전율 등"}, {"no": 8, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "갑 주식회사는 내년에 10원의 배당을 예상하고 있다. 이 회사의 성장률이 연 6%이고 현재의 주가가 100원이면 요구수익률은?", "extra": [], "choices": ["10%", "14%", "16%", "18%"], "answer": 3, "explain": "내년에 10원의 배당(D1)을 예상하고 있고 이 회사의 성장률이 연 6%이며 현재의 주가(P)가 100원이므로,\n요구수익률(기대수익률) = 배당수익률 + 성장률 = D1/P + g\n= 10/100 + 6% = 10% + 6% = 16%\n[암기요망] g = 사내유보율 × 자기자본이익률\n사내유보율 = 1 − 배당성향"}, {"no": 9, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "EV/EBITDA비율과 관련하여 빈칸에 알맞은 것은?", "extra": ["\u003c보기\u003e", "상장기업인 A기업의 EBITDA는 50억원, 유사기업의 EV/EBITDA 비율은 20배, 채권자가치는 600억원, 발행주식수는 400만주이다. 이 경우 A기업의 주당가치는 ( )이다."], "choices": ["1만원", "2만원", "3만원", "4만원"], "answer": 1, "explain": "주당가치는 1만원이다.\n(시가총액 + 채권자 가치)/EBITDA = 20\n(시가총액 + 600억)/50억 = 20에서 시가총액은 400억원이다.\n따라서, 주당가치는 400억원/400만주 = 10,000원이다."}, {"no": 10, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음의 설명에 해당하는 지표의 용어는?", "extra": ["\u003c보기\u003e", "이 지표는 특정 주식의 PER이 그 기업의 성장성에 비해 높은지 낮은지를 판단하기 위해 고안된 지표이다. 이 지표는 특정주식의 PER을 당해 기업 주당순이익(EPS)의 성장률로 나누어 준 수치이다. 따라서 이 비율이 낮다면 그 기업의 이익 성장률에 비해 PER이 낮게 나온 것이므로 향후 성장성이 충분히 반영된다면 그것이 주가의 상승으로 이어질 가능성이 높다고 해석할 수 있을 것이다."], "choices": ["PEGR 모형", "PBR평가 모형", "EV/EBITDA 모형", "Gordon의 항상성장모형"], "answer": 1, "explain": "PEGR(Price Earnings to Growth Ratio)에 대한 설명이다(PEGR 공식 : PER/연평균EPS성장률). 흔히 'PER이 낮을수록 저평가되어 있으니 투자하기 좋다'고 하지만 반대로 PER이 낮다고 해서 무조건 저평가로 단정지을 수도 없다. 공식을 보면 PEGR값이 작은 기업이 더 저평가되어 있다고 하는 것이 맞다. PER이 높은 기업이라도 고평가되었다고 피할 것이 아니라 이익성장률(이 이익성장률은 과거의 수치보다는 미래의 성장률을 추정하는 것이 좋다)이 그만큼 높으면 매수할 가치가 있고, 아무리 PER이 낮은 기업이라도 저평가되었다고 생각할 것이 아니라 이익성장률이 너무 지체된다면(slow) 매수할 가치가 없으니 투자 시 PEGR을 참조하여야 한다. 즉, 투자의 관점에서 저PER주가 아닌 저PEGR주를 찾아야 한다."}, {"no": 11, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음 중 재무상태표상의 유동부채만으로 구성된 것은?", "extra": [], "choices": ["미수수익, 선급비용", "선급금, 선수금", "선급비용, 미지급금", "예수금, 선수수익"], "answer": 4, "explain": "예수금, 선수수익, 선수금은 유동부채이다. 미수수익, 선급비용, 선급금, 미수금은 자산계정이다. 참고로 배당건설이자는 자본조정항목이다.\n(자주 출제되므로 자산·부채를 확실히 구분할 수 있어야 한다.)\n※ 배당건설이자\n배당건설이자란 개업 전에 주주에게 배당한 건설이자를 말한다. 사업상 거대한 건설설비를 필요로 하는 철도·운하·전력 등과 같은 공공적 성격을 띤 사업은 개업하기 전까지는 장기간의 시간을 소요하게 되고 그 기간 동안은 이익배당도 할 수 없기 때문에 주주의 모집은 물론 회사의 설립도 곤란하게 된다. 따라서 상법은 회사가 목적으로 하는 사업의 성질에 따라 회사 설립 후 2년 이상 그 영업의 전부를 개업할 수 없다고 인정되는 때에는 정관에 규정하고 법원의 인가를 받음으로써 일정한 주식에 대하여 그 개업 전의 일정기간 내에 일정한 이자를 주주에게 배당할 수 있음을 규정하고 있다. 기업회계기준에서는 대차대조표상의 자본계정 중 자본조정계정에 표시하도록 되어 있으며 배당건설이자의 상각액은 이익잉여금처분항목으로 처리하도록 규정하고 있다."}, {"no": 12, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "주가이동평균선에 대한 설명이다. 옳은 것은?", "extra": [], "choices": ["주가와 이동평균선과의 괴리가 지나치게 클 때에는 더욱 괴리가 확대되는 방향으로 주가가 움직이는 경향이 있다.", "이동평균을 하는 분석기간이 길수록 이동평균선은 완만해진다.", "강세국면에서 주가가 이동평균선 위에서 움직일 경우 조만간 추세가 하락으로 전환될 가능성이 크다.", "크로스분석에서 골든크로스란 단기 이동평균선이 장기 이동평균선을 위에서 아래로 하향돌파하는 것을 말한다."], "answer": 2, "explain": "이동평균선의 기준기간(time span)이 길수록 이동평균선의 기울기는 완만해진다.\n① 주가와 이동평균선의 괴리가 지나치게 클 때에는 주가가 이동평균선으로 회귀하려는 경향이 있다(→ 이격도 분석).\n③ 강세국면에서 주가가 이동평균선 위에서 움직일 경우 상승세가 지속될 가능성이 크다(→ 배열도 분석으로서 정배열에 해당됨).\n④ 골든크로스는 단기이평선이 장기이평선을 아래에서 위로 상향돌파하는 것을 말하고, 데드크로스는 단기이평선이 장기이평선을 위에서 아래로 하향돌파하는 것을 말한다(→ 크로스 분석)."}, {"no": 13, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "주가 패턴(Pattern)에 대한 다음 설명 중 가장 거리가 먼 것은?", "extra": [], "choices": ["주가의 상승추세가 완만한 곡선을 그리면서 서서히 하락추세로 전환되는 패턴은 원형바닥형이다.", "삼봉천장형의 오른쪽 어깨에 해당하는 거래량은 왼쪽 어깨와 최고점인 머리부분을 형성할 때보다도 적은 거래량을 수반한다.", "다이아몬드형은 역삼각형과 대칭삼각형이 서로 합쳐진 모양으로, 주가의 큰 변동이 있은 후 많이 나타나는 패턴인데 상승추세가 가속화되는 막바지에 나타나 반전패턴의 역할을 수행하는 경우도 있다.", "직사각형은 주가가 수 주일에서 수 개월(통상 1개월에서 3개월)에 걸쳐서 매수와 매도 세력이 서로 균형을 이루면서 횡보하는 패턴으로서, 거래가 활발하지 못한 경우에 발생하며 저항선을 만드는 두 개의 산과 지지선을 형성하는 두 개의 골이 존재한다."], "answer": 1, "explain": "완만한 곡선을 그리면서 상승에서 하락추세로 전환하는 패턴(①)은 원형천장형이다. 원형천장형은 천장을 확인하고 하락으로 전환하는 패턴이며, 원형바닥형은 바닥을 확인하고 상승으로 전환하는 패턴이다."}, {"no": 14, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "OBV(On Balance Volume)지표에 대한 설명이다. 가장 적합한 것은?", "extra": [], "choices": ["전일대비 주가가 상승한 날의 누적거래량에 전일대비 주가가 하락한 날의 누적거래량을 나누어서 구한다.", "주가가 뚜렷한 등락을 보일 때 시장이 매집단계에 있는지 분산단계에 있는지를 판단하는 데 유용하다.", "기산일을 활황장세에서 잡을 경우 주가의 하락전환 시 매매신호가 뒤늦게 발생하여 정확한 분석이 어렵게 된다.", "약세장에서는 OBV선의 저점이 이전의 저점보다 높게 형성된다."], "answer": 3, "explain": "③만 옳은 내용이다.\n① 전일대비 상승한 날의 거래량을 더하고 전일대비 하락한 날의 거래량을 차감한 누적 차수로 산출한다.\n② 주가가 뚜렷한 등락을 보이고 있지 않을 때(즉 횡보국면에서) 유용한 지표이다.\n④ 강세장에서는 OBV고점이 이전의 고점보다 높게 형성되고(U마크로 표시하여 고점갱신을 의미), 약세장에서는 OBV저점이 이전의 저점보다 낮게 형성(D마크로 표시하여 저점갱신을 의미)된다.\n(참고) OBV는 자주 출제되고 수험생이 ADL과 쉽게 혼동하기 쉽다.\nADL과 ADR은 상승종목수와 하락종목수로 구한다. ADL(Advance Decline Line)은 등락주선이라고 하며 시장의 자금이 어느 정도 주식시장으로 유입되고 있는지 아니면 유출되고 있는지를 판단하는 지표이다. 상승종목수에서 하락종목수를 빼서 매일 누적할 경우 상승종목수가 상대적으로 많으면 시장 내부의 자금유입이 활발함을 의미하고, 하락종목수가 상대적으로 많으면 자금유출이 있다고 분석한다. ADR(Advance Decline Ratio)은 이를 비율로 전환한 것이다.\nOBV(On Balance Volume)선은 거래량 지표로서, 거래량은 주가에 선행한다는 전제하에 주가가 전일에 비하여 상승한 날의 거래량 누계에서 하락한 날의 누계를 차감하여 이를 매일 누적적으로 집계하여 도표화한 것이다."}, {"no": 15, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "다음 내용은 다우이론의 장기추세 6국면 중 어디에 해당하는 것인가?", "extra": ["\u003c보기\u003e", "- 전문투자자들이 투자수익을 취한 후 빠져나가는 단계이므로 분배단계라고 한다.", "- 주가가 조금만 하락해도 거래량이 늘어나지만 새로운 상승국면으로 진행되지 못한다."], "choices": ["공포국면", "매집국면", "분산국면", "침체국면"], "answer": 3, "explain": "매집국면(강세1국면) - 상승국면(강세2국면) - 과열국면(강세3국면) - 분산국면(약세1국면) - 공포국면(약세2국면) - 침체국면(약세3국면) 중에서 이 내용은 분산국면(약세1국면)을 설명한 것이다."}, {"no": 16, "subj 종목에 대한 가격안정화 장치로서, 주문실수, 수급 불균형 등에 의한 일시적 주가급변 시 단기간의 냉각기간(2분의 단일가매매)을 부여하여 시장참가자로 하여금 주가급변 상황에 대해 주의를 환기시킴으로써 가격급변을 완화하도록 하기 위한 제도이다.\n• 변동성완화장치 유형\n- 동적 VI : 특정 호가에 의한 순간적인 수급 불균형이나 주문착오 등으로 야기되는 일시적 변동성 완화\n- 정적 VI : 특정 단일호가 또는 여러 호가로 야기되는 누적적이고, 보다 장기간의 가격변동 완화\n• 발동 시 처리 방법\n동적 VI·정적 VI 모두 동일하게 발동 시 2분간 단일가매매 호가접수 및 체결(접속매매는 단일가매매로 전환, 단일가매매 시간대는 단일가매매 시간 연장)\n• 적용 시간\n- 동적VI : 접속매매, 종가단일가매매, 시간외단일가매매\n- 정적VI : 접속매매, 시가·종가단일가매매(참조가격 대비 10% 이상 변동 시 발동)\n• 적용배제 종목\n- 정리매매종목, 단기과열종목"}, {"no": 21, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "주식시장의 매매중단(Circuit Breaker)에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["1일 1회 발동하며 장 종료 40분 전 이후에는 발동하지 아니하지만, 3단계 매매거래 중단 요건 시에는 종료 40분 전 이후에도 발동한다.", "주가지수가 전일대비 15%(2단계) 이상 변동한 경우에는 1분간 지속되고, 동시에 1단계(8%) 서킷브레이커 발동시점 대비 1% 이상 추가 변동하여 1분간 지속되어야만 2단계가 발동된다.", "증권시장의 모든 종목이 매매거래가 중단되고, 주식관련 선물·옵션의 매매도 20분간 중단한다.", "매매거래 중단 후 20분이 경과한 때에는 10분간 단일가매매방법을 거친 후 접속매매로 전환된다."], "answer": 2, "explain": "주가지수가 전일대비 15% 이상 하락하여 1분간 지속되고, 동시에 1단계(8%) 서킷브레이커 발동 시점 대비 1% 이상 추가 하락하여 1분간 지속되어야만 2단계가 발동된다. (유가증권시장과 코스닥시장) 주가지수가 전일종가 대비 각각 8%, 15%, 20% 이상 하락하여 1분간 지속되는 경우 발동한다. 단, 20% 이상 하락하여 발동된 경우에는 당일 장을 종료한다.\n※ 주식시장의 매매거래중단제도(Circuit Breaker) (한국거래소의 용어해설 인용)\n주식시장의 매매거래중단제도(Circuit Breaker)는 증권시장의 내·외적인 요인에 의하여 주가가 급락하는 경우 투자자들에게 냉정한 투자판단의 시간을 제공하기 위해 시장에서의 모든 매매거래를 일시적으로 중단하는 제도로서 한국종합주가지수(KOSPI)가 직전거래일의 종가보다 8%·15%·20% 이상 하락한 경우 매매거래 중단의 발동을 예고할 수 있으며, 이 상태가 1분간 지속되는 경우 주식시장의 모든 종목의 매매거래를 중단하게 된다.\n한국종합주가지수가 최초로 전일종가 대비 8% 이상 하락한 경우 1단계 매매거래중단이 발동되며, 1단계 매매거래중단 발동 이후 한국종합주가지수가 전일종가 대비 15% 이상 하락하고 1단계 발동지수 대비 1% 이상 추가 하락한 경우 2단계 매매거래중단이 발동된다. 1·2단계 매매거래중단이 발동되면 20분 동안 시장 내 호가접수와 채권시장을 제외한 현물시장과 연계된 선물·옵션시장도 호가접수 및 매매거래를 중단한다. 매매거래 중단시간 중에는 신규호가의 제출은 불가능하나 매매거래 중단 전 접수한 호가에 대해 취소주문을 제출하는 것은 가능하다. 각 단계별로 발동은 1일 1회로 한정하고 당일종가결정시간 확보를 위해 장 종료 40분 전 이후에는 중단하지 않는다.\n한편, 2단계 매매거래중단 발동 이후 한국종합주가지수가 전일종가 대비 20% 이상 하락하고, 2단계 발동지수 대비 1% 이상 추가 하락한 경우 당일 발동 시점을 기준으로 유가증권시장의 모든 매매거래를 종료하게 된다. 20% 기준에 의한 당일 매매거래중단이 발동된 경우 취소호가를 포함한 모든 호가접수가 불가능하다. 3단계 매매거래중단은 40분 전 이후에도 발동이 가능하다."}, {"no": 22, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음은 호가의 정정 및 취소에 관한 설명이다. 다음 중 가장 옳지 않은 것은?", "extra": [], "choices": ["회원은 이미 제출한 호가 중 매매거래가 체결되기 전에는 수량(잔량)의 전부 또는 일부를 취소할 수 있다.", "회원이 수량의 일부를 취소하는 경우 시간상의 우선순위는 변경이 없다.", "회원은 이미 제출한 호가의 가격은 정정할 수 있지만 호가의 종류는 정정할 수 없다.", "수량이 증가하는 방식으로 호가를 정정할 경우 원하는 수량만큼 신규의 호가를 제출하여야 한다."], "answer": 3, "explain": "회원은 이미 제출한 호가의 가격 또는 호가의 종류(지정가, 시장가 등)를 정정할 수 있다."}, {"no": 23, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 중 거래소의 증권 결제방법이 아닌 것은?", "extra": [], "choices": ["차금결제방식", "실물결제방식", "집중결제방식", "전량결제방식"], "answer": 1, "explain": "증권의 결제는 '차금결제' 방식이 아닌 '차감결제' 방식이다. '차금결제' 방식은 파생상품시장의 결제방식으로서 매일 장이 종료되고 일일정산(Mark to Market)을 하는 경우 당일차금과 갱신차금이라는 제도가 있다.\n※ 우리나라의 주식결제방식은 원칙적으로 증권과 대금을 실질적으로 수수하는 '실물결제방식', 회원별·종목별로 매수·매도를 차감하여 잔액이나 잔량만 수수하는 '차감결제방식' 및 매매당사자 간 직접 결제하지 않고 결제기구에서 집중적으로 결제하는 '집중결제방식'을 택하고 있다. 다만, 거래소가 정하는 종목의 경우에는 차감하지 않고 매도증권과 매수대금을 납부하게 하는 '전량결제방식'도 예외적으로 운용할 수 있다."}, {"no": 24, "subject": "증권분석 및 증권시장", "detail": "코스닥시장", "stem": "위탁증거금의 징수에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["회원은 거래소가 산출한 대용가격 사정비율 이내에서 대용증권을 위탁증거금으로 징수할 수 있으며, 전체 위탁증거금 중 현금과 대용증권으로 징수할 수 있는 비율을 자율적으로 정할 수 있다.", "증권의 대용가격은 거래소가 발표하는 최대사정비율 이내에서 회사가 자율적으로 산정하여 적용한다.", "상장주식수가 5만주 미만인 종목의 매도주문을 수탁하는 경우에는 위탁증거금을 100% 징수하여야 한다.", "거래소는 천재지변 및 경제사정이 급격한 변동 등으로 결제가 정상적으로 이루어지지 아니하는 경우에는 일시적으로 위탁증거금의 최고징수율을 정할 수 있다."], "answer": 4, "explain": "거래소는 천재지변 및 경제사정이 급격한 변동 등으로 결제가 정상적으로 이루어지지 아니하는 경우에는 일시적으로 위탁증거금의 최저징수율을 정할 수 있다.\n③의 경우, 상장주식수가 5만주 미만인 종목의 '매도'주문을 수탁하는 경우에 위탁증거금을 100% 징수하는 이유는 유통주식이 너무 적으므로 실제 '매도'할 주식의 보유여부를 확인할 필요가 있기 때문이다. 위탁증거금(현금등이 아닌 증권을 말함)을 100% 징수한 후 매도할 수 있도록 해야 한다(무차입공매도 방지 효과도 있다)."}, {"no": 25, "subject": "증권분석 및 증권시장", "detail": "코스닥시장", "stem": "다음 중 코스닥시장의 특징으로 옳은 것은?", "extra": [], "choices": ["유가증권시장의 호가 가격단위와 다르다.", "코스닥시장의 재상장은 유가증권시장의 재상장과 내용상 다르다.", "사이드카(side car)제도는 코스닥150지수 가격이 기준가격 대비 6% 이상 상승(또는 하락)하고 코스닥150지수선물의 수치가 직전 매매거래일의 최 홍콩 / 위안화 / 딤섬본드 / 유로본드\n일본 / 엔화표시 / 사무라이본드 / 외국채\n일본 / 엔화제외 외화표시 / 쇼군본드(게이샤본드) / 유로본드\n영국 / 파운드 표시 / 불독본드 / 외국채"}, {"no": 28, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "채권가격과 채권수익률에 대한 설명이다. 가장 적절하지 않은 것은?", "extra": [], "choices": ["만기가 길어질수록 또는 이표율이 높을수록 재투자위험이 증가한다.", "이표채의 경우, 만기수익률은 채권을 만기까지 보유하고 중도에 지급된 이자를 만기수익률과 동일한 수익률로 만기까지 재투자될 때에만 실현될 수 있는 약속된 수익률이다.", "무이표채(zero-coupon bond)의 경우 만기까지 보유하지 아니하고 중도 매각 시에도 약속된 만기수익률을 실현할 수 있다.", "표면금리가 만기수익률보다 높은 경우 채권가격은 채권액면가보다 높게 거래된다."], "answer": 3, "explain": "무이표채의 경우 만기까지 보유하지 아니하고 중도 매각 시에는 시장금리변화로 인하여 약속된 만기수익률을 실현하지 못할 수도 있다.\n※ 채권가격의 특성 : 표면금리(이표채의 경우 이표율)와 만기수익률의 관계\n(1) 표면금리 = 만기수익률 : 채권가격은 채권액면가와 같다.\n(2) 표면금리 \u003e 만기수익률 : 채권가격은 채권액면가보다 높게 거래된다.\n(3) 표면금리 \u003c 만기수익률 : 채권가격은 채권액면가보다 낮게 거래된다.\n※ 만기수익률과 재투자위험\n(1) 만기수익률(YTM)은 채권을 만기까지 보유하고 지급된 이자가 만기수익률로 만기까지 재투자될 때만 실현될 수 있는 약속된 수익률이다. ► 이표채의 경우이다.\n(2) 만기가 길어질수록 또는 이표율이 높을수록 만기수익률을 실현하기 위해서는 더욱 더 이자에 대한 이자에 의존하게 되며 이는 곧 재투자위험이 증가함을 의미한다. ► '이표율(표면금리)이 높을수록/만기가 길수록' 재투자수익의 변동성이 커지므로 재투자위험이 증가한다.\n(3) 무이표채(zero-coupon bond)의 경우 만기까지 보유 시 약속된 만기수익률을 실현할 수 있으며 이는 재투자위험이 존재하지 않음을 의미한다. ► 무이표채의 경우 만기 중 지급되는 이표(이자)가 없으므로 만기까지 보유 시 재투자위험에 노출되지 않는다.\n※ 말킬의 정리\n표면이자율이 낮은 채권이 높은 채권보다 일정한 수익률 변동에 따른 가격변동률이 크다.\n표면이자율이 낮을수록(듀레이션이 길어지면서) 동일한 수익률 변동에 대한 채권가격 변동폭은 커진다. 이자를 포함한 현금흐름분포 중에서 장기 비중이 클수록, 이표이자가 낮을수록 할인의 승수효과 때문에 가격변동폭이 커진다. 이는 여타조건이 동일할 경우 표면이자율이 낮은 채권이 보다 높은 매매차익을 얻기에 유리함을 의미한다.\n예를 들어 표면이자율이 8%인 채권의 수익률이 12%에서 8%로 변할 때와, 표면이자율이 12%인 채권의 수익률이 역시 동일하게 12%에서 8%로 변할 때는, 낮은 이표채인 8% 이표채 채권의 가격변동(이 경우 채권가격의 상승) 비율이 12% 이표채보다 약간 더 높게(비싸게) 나온다."}, {"no": 29, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "투자자가 3년 만기 채권을 만기 시까지 보유할 경우 중도에 받은 이자는 무시한 채 3년 만기 시점에서 가장 큰 상환금액을 회수하는 순서대로 옳게 나열된 것은? (채권액면 1만원, 원 미만 절하)", "extra": ["\u003c보기\u003e", "가. 3년 만기의 8% 이율의 이표채", "나. 3년 만기의 5% 이율의 복리채", "다. 3년 만기의 5% 이율의 단리채"], "choices": ["가 \u003e 나 \u003e 다", "나 \u003e 다 \u003e 가", "나 \u003e 가 \u003e 다", "가 \u003e 다 \u003e 나"], "answer": 2, "explain": "금액크기는 '만기시점'에서만 따져야 한다. 이표채는 8%로서 이율이 크지만 제시문에서 중간 지급은 무시하므로 만기시점에는 원금 + 이표 = 10,800원이다. 복리채는 중도 이자지급이 없고 이자에 대한 복리로 만기 원리금 일시상환으로 10,000 × (1 + 5%)^3이면 만기지급액이 11,576원이다. 단리채는 중도이자지급이 없고 만기에 10,000 × (1 + 5% × 3년) = 11,500원이다. 따라서 만기 시의 금액이 큰 순서대로는 복리채(11,576) \u003e 단리채(11,500) \u003e 이표채(10,800)이다."}, {"no": 30, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "다음의 채권 중에서 채권에 내재된 옵션을 채권투자자가 행사하는 것이 아닌 것은?", "extra": [], "choices": ["교환사채", "신주인수권부사채", "전환사채", "수의상환채권"], "answer": 4, "explain": "'수의상환채권(callable bond)'의 상환권(옵션)이 채권발행자에게 부여된 것이다. 수의상환청구채권(putable bond)은 투자자에게 상환청구권(옵션)이 있다.\n수의상환청구채권의 수의상환청구권은 시중금리가 상승할수록 (옵션)행사 가능성이 커진다. 다른 조건이 같다면 수의상환청구채권의 가치는 일반 채권의 가치보다 크다. 금리가 하락할수록 수의상환권의 가치는 커진다."}, {"no": 31, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "채권의 만기수익률이 1%포인트 상승할 경우 채권가격은 3.14%만큼 하락하였다. 수정듀레이션이 3.22일 경우 동 채권의 볼록성(convexity)은 얼마인가?", "extra": [], "choices": ["14", "16", "18", "20"], "answer": 2, "explain": "채권의 만기수익률이 1%포인트 상승할 경우 채권가격은 3.14%로 하락하고 수정듀레이션이 3.22일 경우\n채권가격변동률 = -D × (이자의 변동률) + (1/2 × 볼록성 × 이자의 변동률의 제곱)이므로,\n-0.0314 = -3.22 × (+0.01) + 1/2 × 볼록성 × (0.01 × 0.01)\n위 식에서 볼록성을 구하면 16이 나온다."}, {"no": 32, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "빈칸을 옳게 연결한 것은? (순서대로)", "extra": ["\u003c보기\u003e", "• ( )은/는 주식적 측면에서 본 전환사채의 이론가치로서 현재의 주가가 전환가격을 몇 %를 상회하고 있는가를 나타낸다.", "• ( )은/는 전환사채의 시장가격에서 전환가치를 뺀 값을 전환가치로 나누어 구하는 것으로서, 양(+)의 값이 일반적이며 이는 옵션 프리미엄과 동일하다."], "choices": ["패리티가치(parity value), 괴리율", "패리티, 전환가치(conversion value)", "패리티, 괴리율", "패리티가치(parity value), 패리티"], "answer": 3, "explain": "차례대로 '패리티, 괴리율'이다.\n※ 전환사채 용어정리\n[표] 구분 / 공식 / 의미\n패리티(비율) / (전환대상 주식의 시장가격 / 전환가격) × 100% / 전환차익발생 여부의 판단 지표\n전환가치(패리티가치) / 전환대상 주식의 시장가격 × 전환주수 / 전환될 주식들의 시장가치\n괴리율(전환프리미엄율) / ((전환사채 시장가격 - 전환가치) / 전환가치) × 100% / 미래 주식상승에 대한 옵션 프리미엄의 지급비율\n• 괴리율 : 전환대상 주식을 직접 사는 것보다 전환사채를 통한 투자를 할 때 현재 주식가격에 일정한 프리미엄을 지불함을 의미하므로 계산식에서 일반적으로 양수(+) 값이 나오며 이는 마치 옵션의 프리미엄의 지불과 동일하다. 만약 계산식이 음수(-)가 나오면 전환사채에 투자하여 곧바로 전환하여 전환차익을 볼 수 있는 재정거래가 가능함을 의미한다. (이 문제를 숫자로 이해하려면 모의고사 3회의 '29번 문항'을 참조한다.)"}, {"no": 33, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "채권가격의 움직임에 대한 설명이다. 가장 적절하지 않은 것은?", "extra": [], "choices": ["채권가격은 채권수익률과 반대방향으로 움직인다.", "만기가 일정할 때 채권수익률 하락으로 인한 채권가격의 상승폭은 채권수익률 상승으로 인한 채권가격의 하락폭보다 적다.", "채권의 잔존기간이 길수록 채권가격의 변동은 체감적으로 증가한다.", "이자의 지급주기가 짧아지면 채권가격의 변동이 적어진다."], "answer": 2, "explain": "②에서 '수익률하락 시의 채권가격 상승폭이 수익률상승 시의 채권가격 하락폭보다 크다'가 옳다(이러한 성질은 채권가격의 볼록성에 기인함).\n※ 말킬의 채권가격 정리(Bond Price Theorem)\n(1) 1정리 : 채권가격은 채권수익률과 반대방향으로 움직인다.\n• 채권수익률이 하락하면 보유채권의 가격은 상승한다.\n(2) 2정리 : 채권의 잔존기간이 길수록 동일한 수익률변동에 대한 채권가격의 변동이 커진다.\n• 예를 들어 잔존기간이 길어질수록, 만기수익률이 4%일 때의 채권가격의 변동이 만기수익률이 6%일 때의 채권가격변동보다 크게 나타난다(→ 동일한 수익률변동 즉 만기수익률 4%와 6%의 동일한 변동을 가정했을 때 잔존기간이 길수록 그 변동폭의 차이가 더욱 확대되어 나타난다).\n(3) 3정리 : 채권수익률 변동으로 인한 채권가격 변동은 만기가 길수록 커지나 그 증가율은 체감한다.\n• 예를 들어 금리가 8%에서 6%로 하락할 경우 채권가격은 높아지지만 3년물과 6년물의 가격변동폭 차이보다, 6년물과 9년물의 가격변동폭 차이가 더 크다. 그러나 만기가 길어질수록 변동폭 차이는 점차 축소된다. 따라서 증감률이 만기에 정확히 비례하는 것이 아니라 체감적으로 반응한다.\n(4) 4정리 : 채권수익률 하락으로 인한 채권가격의 상승폭은 채권수익률 상승으로 인한 채권가격의 하락폭보다 크다.\n• 채권가격의 변동폭은 만기수익률 변동대비 동일하게 나타나지 않는데(채권가격의 상승폭이 더 크다), 이는 채권가격곡선이 원점에 대해 볼록한 성질을 보이기 때문이다.\n(5) 5정리 : 채권의 표면이자율이 높을수록 동일한 크기의 수익률변동에 대한 채권가격의 변동은 적어진다.\n• 추가로, 이자지급주기가 짧아지는 경우에도 채권가격의 변동은 적어진다. (∵ 동일한 표면금리에서 이자지급주기가 짧아지면 중도에 지급받는 가중현금흐름이 증가하여 가중평균회수기간이 짧아지게 된다. 따라서 듀레이션 축소로 채권가격의 변동이 적어진다.)\n► 이를 종합하면, \"채권가격의 변동성(듀레이션)↑ = f(표면이율↓, 잔존만기↑, 만기수익률↓)\"이다."}, {"no": 34, "subject": "증권분석 및 증권시장", "detail": "기타 증권시장", "stem": "코넥스 상장법인의 공시제도의 내용으로 옳지 않은 것은?", "extra": [], "choices": ["조회공시 요구시점이 오전인 경우에는 당일 오후까지, 요구시점이 오후인 경우에는 다음날 오전까지 답변하여야 한다.", "매매거래정지를 수반한 조회공시의 경우에는 요구시점과 관계없이 다음날 오전까지 답변할 수 있다.", "공시변경은 지정사유가 되지 않는다.", "공시내용 중 일부사항을 일정 범위 내에서 변경하여 공시하는 경우에는 공시변경이 아닌 공시번복으로 간주한다."], "answer": 2, "explain": "매매거래정지를 수반한 조회공시의 경우에는 요구시점과 관계없이 다음날 오후 6시까지 답변할 수 있다(코넥스상장기업의 조회공시는 유가증권시장과 코스닥시장의 조회공시의 요건과 동일하다). 코넥스 시장의 불성실공시 지정사유에는 '공시불이행', '공시번복'만 적용한다. '공시변경'은 적용하지 아니한다. 그러나 유가증권시장과 코스닥시장에서는 불공정공시의 유형에 '공시변경(기 공시한 내용의 중요한 사항을 변경하여 공시하는 경우)'을 따로 두고 있다."}, {"no": 35, "subject": "증권분석 및 증권시장", "detail": "기타 증권시장", "stem": "다음 중 K-OTC 시장의 특징이 아닌 것은?", "extra": [], "choices": ["신규등록 및 신규지정 시에는 최근사업연도 매출액이 5억원(크라우드펀딩기업은 3억원) 이상이어야 한다.", "등록법인의 공시에는 정기공시, 수시공시, 조회공시가 있지만 공정공시제도는 없다.", "예탁결제원이 매도자로부터 증권거래세를 징수하여 관할 세무서에 납부한다.", "최근 2년간 불성실공시법인으로 지정된 횟수가 6회 이상인 경우 등록해제, 지정해제 요건에 해당한다."], "answer": 4, "explain": "최근 2년간 불성실공시법인으로 지정된 횟수가 6회 이상인 경우 등록해제 요건에만 해당한다. 왜냐하면 지정법인은 K-OTC시장에서 공시의무가 없으므로 불성실공시법인 지정대상이 아니다. 다만, 지정법인이 사업보고서, 반기보고서를 법정제출기한까지 금융위원회에 제출하지 않은 경우 매매거래정지, 투자유의사항안내, 지정해제(일정한 요건 해당 시) 등의 조치를 하고 있다. 또한 지정법인은 기업의 신청절차 없이 협회가 그 발행주권을 K-OTC시장 거래종목으로 지정하므로 지정법인의 신청을 통한 해제절차는 없다.\n※ 참고로 K-OTC 관련 등록 및 지정해제 사유가 자주 출제되므로 아래 사항을 익힌다.\n• K-OTC 등록 또는 지정해제 사유\n1. 발행한 어음 또는 수표가 거래은행에 의하여 최종부도로 결정되거나 거래은행과의 거래가 정지된 경우\n2. 최근 사업연도말을 기준으로 자본전액잠식 상태인 경우. 다만, 결산기 정기공시서류의 제출기한까지 협회장이 정하는 바에 따라 자본전액잠식 상태를 해소하였음이 확인된 경우는 제외\n3. 최근 사업연도 매출액이 1억원 미만이거나 최근 2개 사업연도에 연속하여 매출액이 5억원(크라우드펀딩 특례 적용기업의 경우 3억원) 미만인 경우\n4. 최근 사업연도의 재무제표에 대한 감사인의 감사의견이 부적정, 의견거절이거나 최근 2개 사업연도에 연속하여 감사범위제한으로 인한 한정인 경우\n5. 주된 영업이 6개월 이상 정지되어 잔여사업 부문만으로는 실질적인 영업을 영위하기 어렵거나 영업의 전부가 양도되는 경우\n6. 「채무자 회생 및 파산에 관한 법률」에 따른 법원의 회생절차개시신청 기각, 회생절차개시결정 취소, 회생계획불인가 및 회생절차폐지 결정이 있는 경우. 다만, 「채무자 회생 및 파산에 관한 법률」 제287조에 따른 회생절차폐지의 경우에는 적용하지 않음\n7. 정기공시서류 제출과 관련하여 다음 각 목의 어느 하나에 해당하는 경우\n가. 결산기 정기공시서류를 제출기한까지 제출하지 아니한 후 제출기한의 다음 날부터 30일 이내에 제출하지 아니한 경우\n나. 반기 정기공시서류를 최근 4개 사업연도에 1회 이상 제출기한까지 제출하지 아니한 법인이 최근 반기에 반기 정기공시서류를 제출기한까지 제출하지 아니한 후 제출기한의 다음 날부터 15일 이내에 제출하지 아니한 경우\n8. 증권시장에 상장되는 경우"}, {"no": 36, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "다음 중 ISA에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["전 금융기관을 통틀어 1인 1계좌만 가입이 가능하며 중개형, 신탁형, 일임형 중 하나만 선택해야 한다.", "최소의무 가입기간은 3년이다.", "중개형의 경우 신탁, ELS, 리츠, 예금 등 각종 상품 및 국내상장주식까지 편입이 가능하다.", "당해연도에 납입한도를 채우지 못하는 경우 미불입한도는 다음 해로 이월된다."], "answer": 3, "explain": "중개형의 경우 증권회사가 취급하므로(은행이 아니므로) 예금상품은 불가능하다. 예금도 포함하려면 신탁형을 선택해야 한다."}, {"no": 37, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "다음 중 주가연계상품의 설명으로 옳지 않은 것은?", "extra": [], "choices": ["ELS는 중도상환이 가능하며 예금자보호법은 적용되지 않는다.", "ELD의 발행주체는 은행이며 만기 시 원금손실이 발생하지 않는다.", "ELF의 발행주체는 증권사로서 제시수익의 보장은 할 수 없다.", "ETF의 발행주체는 운용사로서 자산총액의 30%까지 동일종목의 증권에 투자할 수 있다."], "answer": 3, "explain": "ELF는 펀드이고 발행주체는 운용사이기 때문에 제시수익의 보장은 할 수 없다."}, {"no": 38, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "주식워런트증권(ELW)에 대한 설명이다. 다음 중 옳은 것은?", "extra": ["\u003c보기\u003e", "가. 5주 단위로 거래되며 지정가호가만을 사용하고 가격제한폭은 상하 10%이다.", "나. 기초자산 가격이 상승하면 콜ELW 가격은 상승하고 풋ELW 가격은 하락한다.", "다. 변동성이 커지면 콜ELW와 풋ELW 가격은 모두 상승한다.", "라. 상장요건으로서 주가지수ELW 상품의 기초자산은 국내지수인 KOSPI200지수만 가능하다."], "choices": ["가, 라", "가, 다", "나, 다", "나, 라"], "answer": 3, "explain": "옳은 내용은 '나, 다'이다.\n가. ELW는 매매수량 단위가 10주이며, 지정가호가만 사용하고, 가격제한폭이 없다(가격범위와 무관하게 5원 단위로 호가).\n라. 상장요건으로서 ELW의 기초자산은 개별종목과 그 바스켓, 그리고 지수도 가능하다. 해외지수인 일본 NIKKEI225지수, 홍콩항셍(HSI)지수도 가능하다.\n- 개별종목은 '코스피200 및 코스닥150 구성종목'을 말하고, 이들의 바스켓도 기초자산이 될 수 있다.\n※ ELW의 가격결정요인(S, X, σ, T-t, r, d)\n(1) 기초자산 가격(S) : 기초자산 가격이 상승할수록 콜↑, 풋↓\n콜 워런트의 내재가치는 'S - X'이다. 따라서 S가 높을수록, X는 낮을수록 콜가격이 상승한다(풋은 반대로 적용).\n► 콜ELW의 내재가치 = S - X, 풋ELW의 내재가치 = X - S\n(2) 행사가격(X) : 행사가격이 낮을수록 콜↑, 풋↓\n콜 워런트의 내재가치는 'S - X'이다. 따라서 S가 높을수록, X는 낮을수록 콜가격이 상승한다(풋은 반대로 적용).\n(3) 변동성(σ) : 변동성이 증가할 경우 콜↑, 풋↑ (둘 다 상승)\n변동성증가 시 그 변동성이 상승이나 하락 중 어디로 작용할지 모르므로 콜, 풋 모두 상승한다.\n(4) 잔존만기(T-t) : 잔존만기가 다가올수록 콜↓, 풋↓(둘 다 하락)\n콜이든 풋이든 잔존만기가 짧을수록 가격상승의 여지가 적으므로 둘 다 하락한다.\n(5) 금리(r) : 금리가 높아질수록 콜↑, 풋↓\n콜을 행사하면 기초자산을 매입하게 되는데, 금리가 올라가면 매입가격이 하락하므로 콜에 유리하다. 따라서 금리가 올라가면 콜 워런트 가격은 상승한다(풋은 반대). 금리가 상승하면 기초자산의 매입에 따른 자금부담이 커진다. 따라서 자금부담이 덜한 콜옵션을 매입하고자 하는 수요가 많아지므로 콜 워런트 가격이 상승(콜↑)한다.\n(6) 배당(d) : 배당을 하면 콜↓, 풋↑\n배당을 하면 배당락에 의해 주가가 낮아진다. 따라서 콜 워런트 가격이 하락하게 되고 풋 워런트 가격은 상승하게 된다.\n※ ELW(주식워런트증권)의 투자전략\n(1) 레버리지 전략 : 대상 자산에 대한 방향성(call/put)에 대한 투자상품으로서 상대적으로 많은 자금을 필요로 하는 현물에 투자하기보다는 레버리지가 높은 ELW를 이용한다.\n(2) 프로텍티브 풋(protective put) 전략 : 풋ELW는 공매도의 효과를 발휘한다. 보유주식에 대하여 풋ELW를 매입하여 주가의 하방위험을 회피할 수 있지만 풋ELW의 매입비용이 보험료의 역할을 한다.\n(3) 변동성 매수 전략 (straddle과 strangle 전략)\n• 스트래들(straddle) 매수는 동일한 행사가격(풋 = 콜)의 ELW콜옵션과 ELW풋옵션을 동시에 매수하는 포지션이다.\n• 스트랭글(strangle) 매수는 변동성 매수 전략을 취하되 스트래들 매수보다는 비용을 낮추고자 하는 포지션으로서, 서로 다른 행사가격(풋 \u003c 콜)의 콜ELW와 풋ELW를 매수함으로써 스트래들 매수보다 비용을 낮출 수 있다."}, {"no": 39, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "다음 중 ETF의 설명으로 옳지 않은 것은?", "extra": [], "choices": ["ETF는 수익증권 또는 투자회사 주식의 형태로만 가능하며 해당 투자신탁의 설정일 또는 투자회사의 설립일로부터 30일 이내에 증권시장에 상장되어야 한다.", "투자자는 거래소를 통한 매매 대신 ETF의 환매를 청구할 경우 판매업자에게 설정단위(CU)별로 환매를 요구할 수 있다.", "ETF의 설정이나 설립 시 금전납입 대신 여러 증권의 현물바스켓으로 납입이 가능하다.", "ETF의 상장이 폐지되는 경우 폐지일로부터 7일 이내에 ETF를 해지하거나 해산하여야 하며 그 해지일이나 해산일로부터 10일 이내에 금융위원회에 보고하여야 한다."], "answer": 4, "explain": "ETF의 상장이 폐지되는 경우, 폐지일로부터 10일 이내에 ETF를 해지하거나 해산하여야 하며 그 해지일이나 해산일로부터 7일 이내에 금융위원회에 보고하여야 한다."}, {"no": 40, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "종신보험의 성격에 대한 설명으로 옳은 것의 개수는?", "extra": ["[보기]", "가. 저축성 보험이다.", "나. 보장을 위한 일정한 계약기간을 정하여야 한다.", "다. 사망원인에 관계없이 사망보험금이 지급된다.", "라. 각종 특약을 조립함으로써 다양한 질병과 사고에 대해 보장을 받을 수 있다."], "choices": ["0개", "1개", "2개", "3개"], "answer": 3, "explain": "옳은 것은 '다', '라'의 2개이다.\n가. 보장성 보험이다.\n나. 보장기간은 평생(종신)이다."}, {"no": 41, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "ELW에 대한 설명으로 옳은 것은?", "extra": [], "choices": ["풋ELW의 손익분기점은 행사가격에서 ELW가격에 전환비율을 곱한 값을 더한 값이다[풋ELW의 손익분기점 = 행사가격 + (ELW가격 × 전환비율)].", "콜ELW의 패리티는 기초자산 가격을 행사가격으로 나눈 값이다.", "패리티가 0보다 크면 외가격(OTM)이다.", "ELW 2주가 기초자산 1주로 전환된다면 전환비율은 0.2이다."], "answer": 2, "explain": "②만 옳다.\n콜 ELW 패리티 = 기초자산 가격/행사가격\n풋 ELW 패리티 = 행사가격/기초자산 가격\n① 풋ELW의 손익분기점은 행사가격에서 ELW가격을 전환비율로 나눈 값을 차감한 값이다.\n풋ELW의 손익분기점 = 행사가격 - (ELW가격/전환비율)\n이와 반대로 콜ELW의 손익분기점은 행사가격에서 ELW가격을 전환비율로 나눈 값을 더한 값이다.\n콜ELW의 손익분기점 = 행사가격 + (ELW가격/전환비율)\n③ 패리티란 행사가격과 기초자산 가격의 상대적 크기를 나타내는 것으로 1을 중심으로 1이면 등가격(at-the-money), 1보다 크면 내가격(in-the-money), 1보다 작으면 외가격(out of-the-money)이 된다.\n④ ELW 2주가 기초자산 1주로 전환된다면 전환비율은 0.5이다. ELW의 전환비율(conversion ratio)은 만기에 ELW 1개 증권을 행사하여 얻을 수 있는 기초자산의 수이다. 예를 들어 전환비율이 0.2인 ELW 1개 증권으로는 해당 기초자산의 1/5에 대해서만 권리를 행사할 수 있다. 즉 ELW 5개가 있어야 권리행사 시 기초자산 1개를 살 rmula plan)에 대한 내용이다. 포뮬러 플랜의 기본원리는 그 유형에 따라 다소의 차이가 있지만 기본적으로 주가가 하락하면 일정한 기준에 따라 주식을 매입하고 반대로 주가가 상승하면 일정한 기준에 따라 주식을 매각함으로써 주가변동에서 차익의 일부를 얻는 것이다.\n첫째, 투자자금을 공격적 부분과 방어적 부분으로 나누고 공격적 부분의 투자자금은 주로 주식을 투자대상으로 삼아 투자하고 방어적 부분의 투자자금은 주로 채권을 투자대상으로 삼아 투자하는 것이다. 둘째, 증권의 자동적이고 기계적인 매매를 하기 위하여 일정한 규칙을 채택해야 한다. 즉 주가의 상승과 하락을 판단하는 일정한 기준치를 미리 결정하고 주가의 변동시세가 이 기준치에 이르면 매매행동을 결정한다. 셋째, 투자자금의 운용자는 어떠한 경우에도 미리 정하여진 매매행동 계획에 기준을 두고 투자행동을 한다."}, {"no": 49, "subject": "금융상품 및 직무윤리", "detail": "영업실무", "stem": "방문판매 등에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["일반금융소비자 대상으로 사전안내 시 안내가 불가능한 상품에는 장내파생상품도 포함된다.", "전문금융소비자의 요청이 없는 경우 장외파생상품을 사전안내할 수 없다.", "금융소비자가 방문판매를 스스로 요청하는 경우에도 개인정보 취득경로를 안내하여야 한다.", "방문판매 모범규준은 전문투자자에게도 적용된다."], "answer": 3, "explain": "금융소비자가 방문판매를 스스로 요청하는 경우에는 개인정보 취득경로를 안내하지 않아도 된다. 방문판매(전화판매 포함) 시 요청하지 아니한 상품에 대한 투자권유금지로서 장외파생상품은 일반 금융소비자는 물론 전문금융소비자에게도 장외파생상품은 투자권유할 수 없다.\n※ 금융소비자에게 전화 또는 자택이나 직장 등 방문판매 시 부당권유행위 금지\n투자성 상품에 대하여 금융상품판매업자등이 계약의 체결권유를 하기 전에 금융소비자의 연락처 등 개인정보의 취득경로, 권유하려는 금융상품의 종류·내용 등을 금융소비자에게 미리 안내하고 해당 금융소비자가 계약의 체결권유를 받을 의사를 표시한 경우에는 방문판매 등이 가능하다. 그러나 아래의 금융상품은 고객이 요청하지 않은 경우 사전안내할 수 없다.\n가. 전문금융소비자의 경우 : 장외파생상품을 투자권유(사전안내)할 수 없다.\n나. 일반금융소비자의 경우 : 장외파생상품, 장내파생상품, 일반 사모집합투자기구의 집합투자증권, 고난도금융투자상품, 고난도투자일임계약 및 고난도금전신탁계약을 투자권유(사전안내)할 수 없다.\n다만, 고객이 방문판매 금지상품을 원하는 경우에는 권유를 요청하였음을 '방문판매 요청확인서'에 표시하여 수령하는 방식 등으로 확인서를 받은 후 방문판매 등의 절차를 진행할 수 있다.\n※ 금융소비자보호법 제21조의2(방문판매 및 전화권유판매 관련 준수사항)\n① 금융상품판매업자등은 서면, 전자문서 또는 구두에 의한 방법으로 다음 각 호의 사항을 일반금융소비자에게 알려야 한다.\n1. 일반금융소비자가 금융상품판매업자등에 대하여 금융상품을 소개하거나 계약 체결을 권유할 목적으로 본인에게 연락하는 것을 금지하도록 요구할 수 있다는 사항\n2. 제1호에 따른 권리의 행사방법 및 절차\n② 금융상품판매업자등은 일반금융소비자가 제1항 제1호의 요구를 하면 즉시 이에 따라야 한다.\n③ 금융상품판매업자등은 금융상품을 소개하거나 계약 체결을 권유할 목적으로 야간(오후 9시 이후부터 다음 날 오전 8시까지를 말한다)에 금융소비자를 방문하거나 연락하여서는 아니 된다. 다만, 금융소비자가 요청하는 경우에는 제외한다."}, {"no": 50, "subject": "금융상품 및 직무윤리", "detail": "영업실무", "stem": "투자일임 및 금전신탁(투자자가 운용대상을 구체적으로 지정하는 특정금전신탁은 제외)에 대한 투자권유 유의사항 설명 중 옳지 않은 것은?", "extra": [], "choices": ["투자일임계약에 있어 투자자의 자산을 개별적으로 1:1로만 운영하는  대상 금융상품을 고르면 모두 몇 개인가?", "extra": ["\u003c보기\u003e", "가. 장내파생상품", "나. 인버스 ETF", "다. 조건부 자본증권", "라. 금적립계좌"], "choices": ["1개", "2개", "3개", "모두 해당한다."], "answer": 3, "explain": "3개(장내파생상품, 인버스 ETF, 조건부 자본증권)는 적정성 원칙 적용대상이다.\n※ 금융소비자보호법 시행령 제12조(적정성 원칙)\n① 법 제18조 제1항에 따라 금융상품판매업자가 일반금융소비자의 정보를 파악해야 하는 금융상품의 범위는 다음 각 호와 같다.\n2. 다음 각 목의 투자성 상품\n가. 「자본시장과 금융투자업에 관한 법률」에 따른 파생상품 및 파생결합증권(금 적립계좌는 제외한다)\n나. 사채(社債) 중 일정한 사유가 발생하는 경우 주식으로 전환되거나 원리금을 상환해야 할 의무가 감면될 수 있는 사채 (※ 조건부자본증권을 말함)\n다. 「자본시장과 금융투자업에 관한 법률 시행령」에 따른 고난도금융투자상품, 고난도투자일임계약 및 고난도금전신탁계약\n라. 파생형 집합투자증권(레버리지 ETF, 인버스 ETF 포함)\n마. 집합투자재산의 50%를 초과하여 파생결합증권에 운용하는 펀드의 집합투자증권\n바. 위 적정성의 원칙이 적용되는 상품을 취득 및 처분하는 금전신탁계약의 수익증권\n3. 다음 각 목의 대출성 상품\n가. 「주택법」 제2조 제1호에 따른 주택을 담보로 하는 대출\n나. 증권(증권시장에서 매도계약이 체결된 증권은 제외한다), 지식재산권 또는 금융위원회가 정하여 고시하는 재산을 담보로 계약을 체결하는 대출성 상품\n적정성의 원칙·적합성 원칙의 위반은 3천만원 이하의 과태료 부과 대상이다.\n※ 자본시장법 제72조(신용공여)\n① 투자매매업자 또는 투자중개업자는 증권과 관련하여 금전의 융자 또는 증권의 대여의 방법으로 투자자에게 신용을 공여할 수 있다. 다만, 투자매매업자는 증권의 인수일부터 3개월 이내에 투자자에게 그 증권을 매수하게 하기 위하여 그 투자자에게 금전의 융자, 그 밖의 신용공여를 하여서는 아니 된다.\n(상기 신용공여 중 신용거래융자, 신용거래대주, 증권담보융자 등 대출성 상품은 적정성의 원칙이 적용된다. 다만 증권시장에서 매도계약이 체결된 증권을 담보로 계약을 체결하는 대출성 상품은 제외한다.)"}, {"no": 79, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "투자권유를 희망하지 아니하는 투자자에 대한 금융상품 판매에 관한 설명 중 옳은 것은?", "extra": [], "choices": ["투자자가 임직원에게 상품의 설명을 요청하는 경우에는 투자권유를 희망하지 않으므로 설명할 수 없음을 안내하여야 한다.", "해당 투자자가 투자자문업자로부터 투자자문을 받고 금융상품의 구매를 요청하는 경우에는 판매회사는 별도의 제한 없이 설명서 교부를 생략할 수 있다.", "투자자가 구체적으로 운용대상을 지정하는 특정금전신탁의 경우 투자권유를 희망하지 않는다는 확인서를 수령하고 계약을 체결하는 것은 관련 규정의 위반에 해당한다.", "투자자가 판매직원의 투자권유 없이 특정상품에 대한 청약을 하는 경우 투자자로부터 '투자권유희망 및 투자자정보 제공 여부 확인서'를 수령하고 판매절차를 진행할 수 있으나 확인서의 취지와 유의사항을 설명하여야 한다."], "answer": 4, "explain": "① 투자자가 임직원에게 상품의 설명을 요청하는 경우에는 투자권유를 희망하지 않더라도 설명하여야 한다.\n② 해당 투자자가 투자자문업자로부터 투자자문을 받고 금융상품의 구매를 요청하는 경우에는 판매회사는 투자자문업자로부터 관련서류등을 사전 교부받았다는 증빙을 제출하는 등의 별도의 제한조건이 존재한다.\n③ 투자자가 구체적으로 운용대상을 지정하는 특정금전신탁의 경우 투자권유를 희망하지 않는다는 확인서를 수령하고 계약을 체결하는 것은 관련 규정의 위반이 아니다(지정 특정금전신탁은 투자자가 상품을 지정한다).\n※ 투자권유를 받지 않는 투자자에 대한 보호의무\n1) 임직원등은 투자자가 투자권유를 희망하지 않아 투자자정보를 제공하지 않는 경우에는 투자권유를 할 수 없음을 알려야 한다. 만일, 적정성 원칙 대상상품의 거래를 희망하는 투자자가 투자자정보를 제공하지 않는 경우에는 관련법령에 따라 거래가 제한된다는 사실을 알려야 한다.\n2) 투자자가 금융투자상품을 특정하여 청약하는 경우에는 \"투자권유 희망 및 투자자정보 제공 여부 확인\" 내용이 포함된 확인서를 받아 판매절차를 진행할 수 있으나 이 경우 투자자가 그 확인서의 취지와 유의사항을 충분히 이해할 수 있도록 설명하여야 한다.\n가. 확인서의 취지 : 투자자가 판매직원의 투자권유 없이 특정 상품에 대한 투자를 희망하는 경우 판매자는 금소법상 적합성 원칙이 적용되지 않는다는 사실을 고지하기 위해 사용\n나. 유의사항 : 투자권유를 희망하지 않는다는 확인서를 투자자가 작성하는 경우 판매자는 금소법상 적합성 원칙과 설명의무 적용대상에서 제외되며, 판매자의 관련 법 위반에 대해 소비자의 권리를 주장할 수 없음. 다만, 설명의무의 경우 소비자가 요청할 경우에는 판매자에게 설명의무가 적용됨\n따라서 이 경우 향후 판매회사와 체결한 계약내용 등에 대한 피해 발생으로 분쟁 또는 소송이 발생하는 경우 투자자가 작성한 확인서로 인해 불리하게 작용될 수 있으므로 그 확인서의 법적 의미와 그 위험 내용을 충분히 이해한 후 서명여부 등 확인서 작성을 신중하게 결정해야 한다."}, {"no": 80, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자보호를 위한 판매원칙 중에서 일반금융소비자와 전문금융소비자 모두를 대상으로 적용되는 것은?", "extra": [], "choices": ["적합성 원칙", "부당권유행위 금지의무", "설명의무상의 투자설명서 제공의무", "적정성 원칙"], "answer": 2, "explain": "'적합성 원칙, 적정성 원칙, 설명의무' 그리고 '청약철회권'은 일반금융소비자만을 대상으로 적용되지만, 부당권유행위 금지(금소법 제21조), 불공정영업행위의 금지, 위법계약해지권, 자료열람요구권 등은 전문금융소비자에게도 적용되는 공통사항이다.\n※ 법령 준수의 대상 : 일반금융소비자 VS 금융소비자\n(1) 적합성 원칙(금소법 제17조) : 금융상품판매업자등은 일반금융소비자에게 금융상품 계약 체결을 권유(금융상품자문업자가 자문에 응하는 경우를 포함)하는 경우에는 면담·질문 등을 통하여 고객 정보를 파악하고, 일반금융소비자로부터 서명(전자서명을 포함), 기명날인, 녹취 또는 그 밖에 대통령령으로 정하는 방법으로 확인을 받아 이를 유지·관리하여야 하며, 확인받은 내용을 일반금융소비자에게 지체 없이 제공하여야 한다.\n(2) 적정성 원칙(금소법 제18조) : 금융상품판매업자는 보장성 상품, 투자성 상품 및 대출성 상품에 대하여 일반금융소비자에게 계약 체결을 권유하지 아니하고 금융상품 판매 계약을 체결하려는 경우에는 미리 면담·질문 등을 통하여 고객 정보를 파악하여야 한다.\n(3) 설명의무(금소법 제19조) : 금융상품판매업자등은 일반금융소비자에게 계약 체결을 권유(금융상품자문업자가 자문에 응하는 것을 포함)하는 경우 및 일반금융소비자가 설명을 요청하는 경우에는 금융상품에 관한 중요한 사항(일반금융소비자가 특정 사항에 대한 설명만을 원하는 경우 해당 사항으로 한정한다)을 일반금융소비자가 이해할 수 있도록 설명하여야 한다.\n(4) 부당권유행위 금지의무(금소법 제21조)\n• 금융소비자로부터 계약의 체결권유를 요청받지 않고 방문·전화 등 실시간 대화의 방법을 이용한 행위는 원칙상 금지된다. (→ '요청하지 않은 투자권유의 금지')\n- 원칙상 금지의 뜻 : 현재 금융시장 판매상황을 감안하여 방문판매가 가능하도록 되어 있으므로 일정한 요건 하에서 방문(전화권유)이 가능하므로 '불초청권유 금지'의 예외가 있다.\n• 계약의 체결권유를 받은 금융소비자가 이를 거부하는 취지의 의사를 표시하였는데도 계약의 체결권유를 계속하는 행위(→ '재권유 금지')\n(보충)
