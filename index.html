<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<title>증권투자권유자문인력 모의고사</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 좌 문제 흐름 + 우 고정 응시 콘솔(타이머·OMR), 좁은 화면은 상단 바 + 시트 */
:root{
  --bg:#f6f7fa; --surface:#ffffff; --surface-2:#eef1f6;
  --ink:#171a21; --muted:#5d6675; --line:#dde2eb;
  --accent:#1e3a8a; --accent-soft:#e7edfb; --on-accent:#ffffff;
  --good:#136f45; --good-soft:#e2f3ea;
  --bad:#b0271c; --bad-soft:#fbe8e6;
  --warn:#9a6207; --warn-soft:#fdf0d9;
  --font-ui:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
  --font-mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b23; --surface-2:#1f242e;
  --ink:#e9ecf3; --muted:#98a2b3; --line:#2b313d;
  --accent:#8fb0ff; --accent-soft:#1c2740; --on-accent:#0f1218;
  --good:#5fd39b; --good-soft:#15291f;
  --bad:#ff8f84; --bad-soft:#2d1917;
  --warn:#e5b45c; --warn-soft:#2a2113;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --surface-2:#1f242e;
  --ink:#e9ecf3; --muted:#98a2b3; --line:#2b313d;
  --accent:#8fb0ff; --accent-soft:#1c2740; --on-accent:#0f1218;
  --good:#5fd39b; --good-soft:#15291f;
  --bad:#ff8f84; --bad-soft:#2d1917;
  --warn:#e5b45c; --warn-soft:#2a2113;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.62;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid transparent;border-radius:var(--r);padding:11px 16px;font-weight:600;font-size:14px;background:var(--accent);color:var(--on-accent);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}

/* ── 비밀번호 ── */
#gate{min-height:86vh;display:grid;place-items:center;padding-block:40px}
.gatecard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:14px}
.gatecard h1{font-size:19px}
.gatecard p{margin:0;color:var(--muted);font-size:13px}
#pw{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font-family:var(--font-mono);font-size:22px;letter-spacing:.5em;text-align:center}
.err{color:var(--bad);font-size:13px;min-height:19px;margin:0}

/* ── 홈 ── */
#home{padding-block:34px 70px;display:grid;gap:24px}
.home-head{display:grid;gap:8px}
.home-head h1{font-size:clamp(23px,4.4vw,31px)}
.home-head .sub{color:var(--muted);font-size:14px}
.specs{display:flex;flex-wrap:wrap;gap:8px}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12.5px;color:var(--muted)}
.spec b{color:var(--ink);font-weight:600}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;align-content:start}
.rcard .rtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rcard h2{font-size:17px}
.rbest{font-size:12px;color:var(--muted)}
.rbest b{font-family:var(--font-mono);color:var(--ink)}
.rmeta{font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:3px}
.stile .v{font-family:var(--font-mono);font-size:25px;font-weight:600;line-height:1.1}
.stile .k{font-size:12px;color:var(--muted)}

/* ── 시험 ── */
#exam{display:none} #exam.on{display:block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:26px;align-items:start;padding-block:18px 70px}
.qcol{min-width:0;display:grid;gap:14px}
.subjhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:14px 0 8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.subjhead h2{font-size:15px}
.subjhead span{font-size:12px;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:11px;scroll-margin-top:94px}
.q.flagged{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qno{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--accent);min-width:28px}
.qstem{font-size:14.5px;flex:1;min-width:0}
.qstem.askable{cursor:pointer;border-radius:7px;margin:-4px -7px;padding:4px 7px;transition:background .12s}
.qstem.askable:hover{background:var(--accent-soft)}
.qstem.askable .hintq{font-size:11px;color:var(--accent);opacity:0;transition:opacity .12s}
.qstem.askable:hover .hintq{opacity:1}
.qtools{display:flex;gap:6px;flex:none}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:7px;min-width:30px;height:30px;padding:0 7px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.iconbtn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.qdetail{font-size:11px;color:var(--muted)}
.box{background:var(--surface-2);border-radius:8px;padding:10px 13px;font-size:13.5px;display:grid;gap:5px}
.choices{display:grid;gap:6px}
.ch{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;line-height:1.55;transition:background .12s,border-color .12s}
button.ch:hover{background:var(--surface-2)}
.ch .num{font-family:var(--font-mono);flex:none;color:var(--muted)}
.ch.sel{background:var(--accent-soft);border-color:var(--accent)}
.ch.sel .num{color:var(--accent);font-weight:600}
.ch.correct{background:var(--good-soft);border-color:var(--good)}
.ch.correct .num{color:var(--good);font-weight:600}
.ch.wrong{background:var(--bad-soft);border-color:var(--bad)}
.ch.wrong .num{color:var(--bad);font-weight:600}
.expl{border-top:1px dashed var(--line);padding-top:10px;font-size:13.2px;color:var(--muted);display:grid;gap:7px;white-space:pre-wrap}
.expl .vr{font-weight:600;font-family:var(--font-mono)}
.expl .vr.o{color:var(--good)} .expl .vr.x{color:var(--bad)}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hit{font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}

.console{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.clock{display:grid;gap:6px;justify-items:center;padding:16px 14px}
.clock .t{font-family:var(--font-mono);font-size:38px;font-weight:600;line-height:1}
.clock.low .t{color:var(--bad)}
.clock .lab{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.clock.low .bar i{background:var(--bad)}
.cstats{display:grid;gap:7px;font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:10px}
.row span{color:var(--muted)} .row b{font-family:var(--font-mono);font-weight:600}
.pace.ahead b{color:var(--good)} .pace.behind b{color:var(--bad)}
.omr{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.omr button{aspect-ratio:1;border:1px solid var(--line);border-radius:5px;background:transparent;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);padding:0;display:grid;place-items:center}
.omr button.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.omr button.flag{border-color:var(--warn);color:var(--warn)}
.omr button.done.flag{background:var(--warn);border-color:var(--warn);color:var(--on-accent)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.ctrls{display:grid;gap:7px}
.mbar{display:none}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;gap:0}
  .console{display:none}
  .mbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
    padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));
    margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
    align-items:center;gap:10px}
  .mbar .t{font-family:var(--font-mono);font-size:21px;font-weight:600}
  .mbar.low .t{color:var(--bad)}
  .mbar .pr{font-size:12px;color:var(--muted);margin-left:auto}
  .subjhead{top:calc(env(safe-area-inset-top,0px) + 46px)}
  .q{scroll-margin-top:122px}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--surface)}

/* 모달 */
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(10,12,18,.55)}
.sheetcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:430px;max-height:84vh;overflow:auto;display:grid;gap:14px}
.sheetcard h3{font-size:16px}
.sheetcard p{margin:0;font-size:13.5px;color:var(--muted)}
.sheetbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* 결과·기록 */
#result,#stats{display:none;padding-block:30px 70px}
#result.on,#stats.on{display:block}
.score{display:grid;gap:18px;grid-template-columns:minmax(0,258px) minmax(0,1fr);align-items:start}
@media (max-width:760px){.score{grid-template-columns:1fr}}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:9px;justify-items:center;text-align:center}
.scorecard .big{font-family:var(--font-mono);font-size:50px;font-weight:600;line-height:1}
.scorecard.pass .big,.scorecard.pass .verdict{color:var(--good)}
.scorecard.fail .big,.scorecard.fail .verdict{color:var(--bad)}
.verdict{font-size:15px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.n,th.n{font-family:var(--font-mono);text-align:right}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.ng{background:var(--bad-soft);color:var(--bad)}
.dbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:68px;flex:1}
.dbar i{display:block;height:100%;background:var(--accent)}
.dbar i.low{background:var(--bad)}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
.secthead h2{font-size:17px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.footerbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}

/* 채팅 */
#chat{position:fixed;inset:0 0 0 auto;width:min(430px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);display:none;grid-template-rows:auto 1fr auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#chat.on{display:grid}
.chead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.chead h3{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.ctx{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.ctx b{color:var(--ink)}
.msg{display:grid;gap:4px;font-size:13.8px;line-height:1.62}
.msg .who{font-size:11px;color:var(--muted);font-weight:600}
.msg .bub{border-radius:11px;padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me .bub{background:var(--accent-soft);justify-self:end;max-width:90%}
.msg.me .who{justify-self:end}
.msg.ai .bub{background:var(--surface-2)}
.cfoot{border-top:1px solid var(--line);padding:11px 14px;display:grid;gap:8px}
.cin{display:flex;gap:8px;align-items:flex-end}
#chatinput{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit;font-size:14px;max-height:120px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script type="application/json" id="examdata">{"title": "증권투자권유자문인력 실제유형 모의고사", "minutes": 120, "rounds": [{"round": 1, "items": [{"no": 1, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "경기변동의 원인을 설명하는 실물적 경기순환이론(RBC, Real Business Cycle Theory)과 가장 밀접한 사항은?", "extra": [], "choices": ["통화정책", "재정정책", "기술혁신", "기업가의 동물적 감각"], "answer": 3, "explain": "실물적 경기순환이론(RBC, Real Business Cycle Theory)은 경기순환이 생산성의 임의적 변동(예를 들어 인공지능의 발전에 의한 기술혁신)에 의하여 야기된다는 이론이다. 경기순환에 대한 다른 주요 이론들과는 달리, 실물적 경기순환이론은 경기침체와 성장주기를 이해하는 데에 있어 외생변수의 변화(기술변화 등)에 대한 반응이 생산으로 나타나는 것으로 본다. 따라서 정부는 경기침체를 감쇄시키거나 과열을 진정시키기 위한 재정적·통화적 정책을 통한 시장개입을 삼가야 한다고 주장한다(따라서 케인즈의 '재정정책'이나 프리드만의 '통화정책'과는 차이가 있다). 이러한 점에서 실물적 경기순환이론은 경기후퇴를 일종의 시장청산(market clearing)의 실패로 이해하는 케인즈 경제학이나 통화주의와 구별된다.\n※ 시장청산(market clearing)의 실패(failure)\n시장청산의 실패로 인하여 아담 스미스의 보이지 않는 손(invisible hand)에 의한 자유시장만으로는 효율적인 자원 배분이 어려우므로 정부 개입의 정당성에 대한 이론적 근거가 제공된다. 애덤 스미스가 최초에 주장했던 \"개별 경제 주체들의 이기심으로 인해 사회는 발전하고 시장의 경제는 효율적으로 돌아간다\"라는 이론이 맞지 않는다는 것을 보여주는 사례였던 과거 미국과 전 세계에 몰아친 대공황(1929)의 원인이 이러한 시장청산의 실패에서 기원했다. 거시경제학자 케인스(J. Maynard Keynes)는 \"시장은 과잉 공급 상태에 빠져있으며 더 이상 공급은 그 만큼의 수요를 창출하지 못하니 인위적으로 정부가 개입하여 유효수요를 창출해야 한다\"는 이론을 제시하여 시장청산의 실패에 대한 해결책(재정정책)을 제시하였다."}, {"no": 2, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "한 국가의 실질GDP 증가율 = 5%, GDP디플레이터 상승률 = 4%, 화폐유통속도 증가율 = -2%인 경우, EC 방식에 의한 통화공급 증가율의 목표치는?", "extra": [], "choices": ["0%", "1%", "7%", "11%"], "answer": 4, "explain": "실질GDP 증가율(YG) = 5%, GDP디플레이터 상승률(PG) = 4%, 화폐유통속도 증가율(VG) = -2%가 주어진 경우, 통화공급 증가율(MV)을 구할 수 있다.\nEC(European Community)에서 각 회원국에 권고하는 방식인 MV = PY에서, M = PY/V이므로, 이를 MG(Monetary Growth : 통화증가율)로 미분하면, MG = PG + YG - VG이다.\n즉, MG = 4% + 5% - (-2%) = 11%이다.\n그러나 이 통화의 유통속도(V)는 사후적으로만 추계가 가능하므로 경기변화 및 인플레이션 압력 등을 예측하는 데에는 유용성이 높지 않다."}, {"no": 3, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 통화정책의 파급경로에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["중앙은행의 금리정책에 의한 금리경로를 통하여 은행의 여수신금리에 영향을 주어 소비와 투자에 영향을 준다.", "금리 하락과 통화량 증가는 자산가격경로를 통하여 부동산의 가격 상승을 가져올 수 있다.", "환율경로를 통하여 금리 변동은 환율에 영향을 준다.", "신용경로는 토빈의 q로 설명된다."], "answer": 4, "explain": "토빈의 q란 자산가격경로에 대한 설명이다. 주식시장에서 평가된 기업의 시장가치를 기업의 실물자본 대체비용으로 나눈 값을 말한다. 금리 인하로 주가가 상승하면(주가 상승 = 자산가격 상승) 기업의 시장가치가 커져 기계나 공장과 같은 실물자본을 대체하는 데 소요되는 비용을 상회함으로써 q값이 증가한다. 이는 기업들이 높은 가격으로 주식을 발행하고 상대적으로 저렴한 비용으로 투자함으로써 이윤을 늘릴 수 있기 때문이다.\n신용경로는 금리 변화와 관계없이 금융기관 고객(가계와 법인 등)의 자기신용이 취약할 경우 (가계와 기업의 대차대조표상의 재무상태가 악화되어) 금융기관이 대출을 줄여 전반적인 경제활동이 위축됨으로써 작동된다."}, {"no": 4, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 경기확산지수(DI)에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["경기변동의 진폭이나 속도는 측정하지 않고 변화 방향만을 파악하는 것이다.", "경기국면의 판단 및 예측과 경기의 전환점을 식별하기 위한 지표이다.", "DI가 50% 이상이면 경기상승 국면이다.", "경기확산지수가 60에서 100으로 상승한 경우 경기확장속도가 100/60 ≒ 1.7배 빠르다고 볼 수 있다."], "answer": 4, "explain": "경기확산지수(DI)는 경기변동의 심도를 나타내는 지표가 아니다. 따라서 DI가 60에서 100으로 상승한 경우 경기확장속도가 100/60 ≒ 1.7배 빠르다고 볼 수 없고, 반대로 40 이하일 때에 비해 20일 때의 수축속도가 2배 강하다고도 볼 수 없다."}, {"no": 5, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 전통적인 경기순환 4국면의 순서로 올바르게 연결된 것은?", "extra": [], "choices": ["후퇴 - 회복 - 불황 - 호황", "회복 - 후퇴 - 불황 - 호황", "호황 - 회복 - 불황 - 후퇴", "회복 - 호황 - 후퇴 - 불황"], "answer": 4, "explain": "회복(Recovery) - 호황(Boom) - 후퇴(Recession) - 불황(Depression)의 순서이다."}, {"no": 6, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 〈보기〉의 내용과 관련된 것은?", "extra": ["〈보 기〉", "한국은행에서 작성하는 것으로 기업과 소비자의 경기상황을 종합적으로 반영하며, 제조업의 가중치가 가장 높다."], "choices": ["기업경기실사지수", "소비자태도지수", "경제심리지수", "경기종합지수"], "answer": 3, "explain": "경제심리지수(ESI)의 내용이다.\n경제심리지수(ESI)는 기업과 소비자 모두를 포함한 민간의 경제상황에 대한 심리를 종합적으로 파악하기 위해 기업경기실사지수(BSI)와 소비자동향지수(CSI)를 합성한 지수이다. 이 지수는 장기평균 100을 중심으로 대칭적으로 분포하며 표준편차가 10이 되도록 작성하므로 100을 상회하면 기업과 소비자 모두를 포함한 민간의 경제심리가 과거 평균보다 나은 수준을 의미한다. 반대로 100을 하회하면 과거 평균보다 못한 수준인 것으로 해석할 수 있다."}, {"no": 7, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음은 기본적 분석에 대한 내용이다. 괄호 안에 들어갈 말이 순서대로 올바르게 연결된 것은?", "extra": ["대개 ( )을 통하여 경제의 흐름과 증권시장의 움직임에 대한 이해를 하고, ( )을 통하여 유망한 업종을 선택하게 되며, ( )을 통하여 유망한 종목을 선정하는데 이 순서대로의 분석을 ( )이라고 한다."], "choices": ["추세분석 - 산업분석 - 정밀분석 - Bottom-up방식", "산업분석 - 미세분석 - 기업분석 - Bottom-up방식", "경제분석 - 산업분석 - 기업분석 - Top-down방식", "거시분석 - 미시분석 - 종목분석 - Top-down방식"], "answer": 3, "explain": "차례대로 경제분석 - 산업분석 - 기업분석 - Top-down 방식 순이다."}, {"no": 8, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "아래 조건의 EV/EBITDA의 값은?", "extra": ["주가 30,000원, 발행주식수 100만주, 현금 및 투자유가증권 100억원, 총부채 200억원, EBITDA = 200억원"], "choices": ["2배", "3배", "4배", "5배"], "answer": 1, "explain": "EV = 시가총액 + 순차입금(총부채 - 현금 및 투자증권)이므로,\n30,000 × 100만주 + (200억 - 100억) = 400억원\n따라서, EV/EBITDA = 400억원/200억원 = 2(배)"}, {"no": 9, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "W주식회사의 현재 주식가격은 22,000원, 당기순이익은 5,000원이다. 만약 유보율 60%, 요구수익률 20%라면 항상성장모형(Gordon 모형)에 의한 이 회사의 성장률은?", "extra": [], "choices": ["5%", "10%", "15%", "20%"], "answer": 2, "explain": "당기순이익이 5,000원이므로 유보율 60%를 빼면 배당액은 2,000원이다. 항상성장모형 공식을 이용하면\n22,000 = 2,000(1 + g)/(0.2 - g)이고, g에 대하여 정리하면, g = 10%이다."}, {"no": 10, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음 중 재무비율의 수익성 지표에 해당하는 것은?", "extra": [], "choices": ["총자본이익률", "이자보상비율", "총자산회전율", "유동비율"], "answer": 1, "explain": "총자본이익률(ROI)은 당기순이익/총자본 이므로 수익성을 측정하는 비율이다."}, {"no": 11, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "재무제표의 성격에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["손익계산서는 수익과 비용 대응 원칙에 의거 직접 상계 계상함을 원칙으로 하고 있다.", "판매관리비에는 상품과 용역활동 비용으로 현금흐름이 수반되지 아니한 감가상각비도 포함된다.", "당해 기간 중 당기순손실의 발생에도 불구하고 배당금이 지급될 수 있는 이유 등을 현금흐름표를 통하여 알 수 있다.", "손익계산서는 기간 개념으로 동적(flow)인 개념인 데 비해 대차대조표는 회계기간 말의 특정 시점이므로 정적(stock)인 개념이다."], "answer": 1, "explain": "손익계산서에는 수익과 비용은 총액에 의하여 기재함을 원칙으로 하며, 수익항목과 비용항목을 직접 상계함으로써 그 전부 또는 일부를 손익계산서에서 제외하여서는 아니 된다."}, {"no": 12, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "다음의 캔들 유형 중에서 추세의 하락반전을 예고하는 신호는?", "extra": [], "choices": ["망치형", "관통형", "샛별형", "유성형"], "answer": 4, "explain": "유성형은 하락반전 신호에 해당한다(나머지는 상승반전 신호).\n| 구 분 | 상승반전 신호 | 하락반전 신호 |\n| 1개의 캔들차트 | 해머(망치)형, 상승 샅바형, 역전된 해머형 | 교수형, 하락 샅바형, 유성형 |\n| 2개의 캔들차트 | 상승 장악형, 관통형, 상승 잉태형, 상승 반격형 | 하락 장악형, 먹구름형, 하락 잉태형, 하락 반격형 |\n| 3개의 캔들차트 | 샛별형 | 석별형, 까마귀형 |\n► 직관적 이해 : 좋은 어감의 캔들(샛별형)은 상승반전 신호가 되고, 나쁜 어감의 캔들(교수형, 유성형, 먹구름형, 석별형)은 하락반전 신호가 된다.\n• 유성형(shooting star)은 한 개의 캔들차트로서 상승추세가 한계에 다다라 추세의 하락반전을 예고하는 신호이다. 유성형은 대개 갭(gap)을 동반하여 작은 몸체와 위로 몸체보다 2배 이상 되는 긴 꼬리를 갖춘 캔들차트의 모습을 하는데 양선보다 음선의 신뢰도가 높다.\n• 까마귀형(up side gap two crows)은 천장권에서 나타나는 하락전환 신호이다. 우선 상승추세에서 긴 양선이 출현한 후 둘째 날 갭(gap)이 발생하면서 음선이 나오고, 연이어 셋째 날 음선이 출현하면서 갭을 채우는 것이다(3마리(캔들이 3개 이상)의 까마귀가 전선줄에 걸터앉아서 기분 나쁘게 내려다보는(하락형) 형상이다)."}, {"no": 13, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "다음은 사케다 전법으로 주가의 움직임을 설명한 것이다. 다음 〈보기〉에 해당하는 것은?", "extra": ["〈보 기〉", "상승 시작의 신호로 오랫동안의 침체국면에서 평행으로 움직이던 주가가 단기간에 걸쳐 양선 3개가 연이어 형성되는 주가 패턴으로, 바닥권에 있는 주가가 서서히 상승 시세로 진입하는 첫 단계의 주가흐름이다."], "choices": ["삼 공", "적삼병", "흑삼병", "삼 법"], "answer": 2, "explain": "적삼병에 대한 설명이다. 적삼병은 고점을 높이는 연속된 3개의 강한 양봉이 발생하는 패턴으로, 이 패턴이 바닥권에서 발생한 경우 장기간의 하락 추세를 벗어나 상승으로 전환되는 신호로 해석한다.\n반면, 흑삼병은 높은 위치에서 저점을 낮추는 3개의 음봉이 연속적으로 발생하는 패턴이다. 이러한 패턴이 나타나면, 매수세에서 매도세로 돌아섬을 의미하여 순간적인 급락세로 돌아설 가능성이 높기 때문에 주의가 필요한 구간이다.\n사께다 전법은 삼산, 삼천, 삼병(적삼병, 흑삼병), 삼공, 삼법을 말한다. 이 중에서 삼산, 삼천, 삼병(적삼병, 흑삼병), 삼공은 주가 패턴의 해석에 대한 풀이에 해당하며, 삼법은 행동원리를 의미한다."}, {"no": 14, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "일정기간 동안의 주가 변동폭 중 금일 종가의 위치를 백분율로 나타낸 지표는 무엇인가?", "extra": [], "choices": ["스토캐스틱(stochastic)", "RSI", "OBV", "MAO"], "answer": 1, "explain": "스토캐스틱 지표이다. '스토캐스틱 지표는 일정기간 동안의 주가 변동폭 중 금일종가의 위치를 백분율로 나타낸 것이다.'\n스토캐스틱의 기본원리는 시장가격이 상승추세를 나타내고 있을 때에는 매일의 종가가격이 최근의 시장가격 변동폭 중 최고점 부근에서 형성되는 경향이 높고, 반대로 시장가격이 하락추세를 나타낼 때에는 매일의 종가가격은 최근의 시장 가격변동폭 중 최저점 부근에서 형성되는 경향이 높다는 과거의 경험에서 비롯한다. 다시 말하면, 최근 N일간의 최고가와 최저가의 범위 내에서 현재가격의 위치를 표시할 때, 매수세가 매도세보다 강할 때는 그 위치가 높게 형성되고, 매도세가 매수세보다 강할 때는 그 위치가 낮게 형성된다는 것을 이용한 것이다.\n예를 들어 최근 5일간 최고가가 16,000원이고 최저가가 10,000원인 주식이 있을 때, 현재가가 15,000원이라면 매수세가 강하여 오르는 추세임을 알 수 있다. 만일 현재가가 12,000원이라면 매도세가 강하여 내리는 추세임을 알 수 있다.\n스토캐스틱 값은 다음과 같이 계산되며, 보통 백분율로 표기한다.\n스토캐스틱 기법은 %K선과 %D선으로 구성되는데 %K선은 시장가격의 최근변동폭과 최근에 형성되는 종가와의 관계를 구하려는 것으로, 아래 내용으로 설명할 수 있다.\n%K = (C - L5)/(H5 - L5)\nC : 최근의 종가\nL5 : 과거5일간의 최저점\nH5 : 과거5일간의 최고점\n만약 %K의 값이 100이라면 그 의미는 종가가 이제까지 5일 동안 형성된 시장가격 중에서 가장 최고 수준임을 의미한다.\n%D선은 %K선의 움직임을 한 단계 완화한 것으로,\n%D = (%K1 + %K2 + %K3)/3 이다.\n상기 예와 같이 기간 N을 5로 하면, 스토캐스틱은 5일 중 최고가와 최저가를 이용하는 값이 된다. 예를 들어 최근 5일 중 최고가가 15,000원이고 최저가가 10,000원이며 현재가격이 14,000원이라면, 스토캐스틱 값은 80%가 된다. 고가가 15,000원이고 저가가 10,000원이며 현재가격이 11,000원이라면, 스토캐스틱 값은 20%가 된다.\n스토캐스틱 값의 범위는 항상 0~100% 사이가 된다. 100%라면 현재 가격이 N일간(5일간) 최고가이므로 매수세가 가장 강한 경우가 되며, 0%라면 현재 가격이 N일간(5일간) 최저가이므로 매도세가 가장 강한 경우가 된다.\n※ 추세반전형 VS 추세추종형\n(1) 추세반전형 지표 : Stochastic, RSI(Relative Strength Index)\n(2) 추세추종형 지표 : MACD(Moving Average Convergence \u0026 Divergence), MAO(Moving Average Oscillator)"}, {"no": 15, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "보기의 설명에 부합하는 갭(Gap)의 종류는?", "extra": ["• 주가가 거의 일직선으로 급상승하거나 급하락하는 도중에 주로 발생한다.", "• 다우이론의 추세추종 국면 또는 엘리어트 3번 파동에서 주로 발생한다.", "• 주가가 강화모형에서 완전히 벗어나서 예상했던 방향으로 급격한 변화를 보이는 과정에서 나타나는 경향이 있다."], "choices": ["계속갭(run away gap)", "보통갭(common gap)", "소멸갭(exhaustion gap)", "섬꼴반전(island reversal)"], "answer": 1, "explain": "계속갭(또는 급진갭 : run away gap)에 해당한다.\n※ 계속갭(run away gap)의 개념\n계속갭 또는 급진갭은 주가가 거의 일직선으로 급상승하거나 또는 급하락하는 도중에 주로 발생한다. 계속갭은 주가 움직임이 급속히 가열되거나 냉각되면서 이전의 추세가 더욱 가속되고 있음을 확인시켜주는 갭으로 볼 수 있다. 계속갭은 다우이론의 추세추종 국면이나 엘리어트파동이론의 3번 파동에서 주로 발생한다."}, {"no": 16, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 중 상장기업의 혜택에 대한 설명으로 적절한 것은?", "extra": [], "choices": ["이사회의 결의로 조건부자본증권의 발행이 가능하다.", "우리사주 조합원은 공모하는 주식 총수의 30% 범위 내에서 우선적으로 배정받을 권리가 있다.", "법원의 인가를 받아 주식의 액면미달 발행이 가능하다.", "주식배당은 이익배당총액의 1/2까지 가능하다."], "answer": 1, "explain": "② 우리사주 조합원은 공모하는 주식 총수의 20% 범위 내에서 우선적으로 배정받을 권리가 있다.\n③ 법원의 인가 없이 주식의 액면미달 발행이 가능하다.\n④ 주식배당은 이익배당총액에 상당하는 금액까지 가능하다.\n※ 자본시장법 제165조의11(조건부자본증권의 발행 등) 제항\n① 주권상장법인은 정관으로 정하는 바에 따라 이사회의 결의로 「상법」 제469조 제2항, 제513조 및 제516조의2에 따른 사채와 다른 종류의 사채로서 해당 사채의 발행 당시 객관적이고 합리적인 기준에 따라 미리 정하는 사유가 발생하는 경우 주식으로 전환되거나 그 사채의 상환과 이자지급 의무가 감면된다는 조건이 붙은 사채, 그 밖에 대통령령으로 정하는 사채를 발행할 수 있다.\n※ 상장기업의 특징으로서, 우리사주 조합원은 공모하는 주식 총수의 20% 범위 내에서 우선적으로 배정받을 권리가 있다. 법원의 인가 없이 주주총회의 특별결의로 주식의 액면미달 발행이 가능하다. 주식의 시가가 액면 이상인 경우 이익배당총액에 상당하는 금액까지 주식배당*을 할 수 있다.\n(*주식배당이란 금전 대신 주식으로 배당한다는 의미임)"}, {"no": 17, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 중 증권의 상장제도에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["공모상장의 경우 공모 절차 전에 상장예비심사를 거친다.", "당해 주권의 액면금액, 수량 등이 변경되는 경우 변경상장하여야 한다.", "상장폐지된 기업이 재상장하는 경우에는 상장예비심사를 생략할 수 있다.", "유가증권시장에서 상장폐지된 경우에는 상장폐지일로부터 5년 이내에 재상장을 신청할 수 있다."], "answer": 3, "explain": "상장폐지된 기업이 재상장하는 경우에도 상장예비심사를 거쳐야 한다.\n※ 상장의 종류\n(1) 신규상장 : 유가증권시장 또는 코스닥시장에 상장되지 않은 종목의 증권을 처음 상장하는 것\n(2) 재상장 : 유가증권시장에서 상장이 폐지된 보통주권 또는 채무증권을 다시 상장하거나 보통주권 상장법인의 분할, 분할합병, 합병으로 설립된 법인의 보통주권을 상장하는 것 / 코스닥시장 상장법인의 분할, 분할합병 또는 합병으로 설립된 법인이 발행한 주식을 코스닥시장에 상장하는 것\n(3) 우회상장 : 유가증권시장에서 합병, 주식의 포괄적 교환, 영업 또는 자산의 양수, 현물출자 등과 관련하여 주권상장법인의 경영권이 변동되고 주권비상장법인의 지분증권이 상장되는 효과가 있는 것 / 코스닥시장에서 합병, 주식의 포괄적 교환, 영업양수, 자산양수, 현물출자 등과 관련하여 코스닥시장 상장법인 또는 유가증권시장 주권상장법인이 아닌 법인의 지분증권이 코스닥시장에 상장되는 효과가 있는 것\n(4) 합병상장 : 유가증권시장에서 기업인수목적회사와 주권비상장법인의 합병에 따라 주권을 상장하는 것 / 코스닥시장에서 기업인수목적회사와 코스닥시장 상장법인이 아닌 법인의 합병에 따라 주식을 상장하는 것\n(5) 추가상장 : 상장법인이 자본금, 사채액, 신탁원본액 등의 증가에 따라 이미 상장되어 있는 증권과 같은 종목의 증권을 새로이 발행하여 이를 상장하는 것\n(6) 변경상장 : 상장증권의 종류, 종목명, 액면금액, 수량 등을 변경하여 상장하는 것"}, {"no": 18, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 중 우회상장(SPAC상장 포함)에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["상장기업과 기업결합, 경영권 변동을 통해 비상장기업이 실질적으로 상장되는 효과가 있다.", "SPAC상장은 우량 비상장기업의 건전한 우회상장을 위한 것이다.", "상장적격성을 충족하지 못하는 비상장기업의 우회상장 방지를 위하여 거래소는 신규상장 수준의 질적심사제도를 적용한다.", "SPAC상장을 통하여 비상장기업이 보유한 자금으로 공모자금조달 효과를 낼 수 있다."], "answer": 4, "explain": "SPAC회사는 기업공개(IPO)를 통해 자본을 모아서 주식시장에 먼저 상장한 후, 비상장 주식회사 중에서 유망한 기업을 합병하여 주식시장에 들어올 수 있게 하는 것이다. 결국 SPAC상장을 통하여 비상장기업은 SPAC이 보유한 자금으로 공모자금조달 효과를 낼 수 있다.\n※ 스팩주\nSpecial Purpose Acquisition Company의 약자로 오로지 기업 인수만을 목적으로 하는 페이퍼 컴퍼니의 주식을 뜻한다. SPAC은 투자자로부터 조달한 자금으로 다른 기업을 인수합병(M\u0026A)하여 비상장 주식회사가 주식시장에 상장되도록 만드는 것을 목표로 한다.\n※ 우회상장(Back-door Listing)\n비상장기업이 상장을 위한 심사나 공모주청약 등의 정식 절차를 거치지 않고 우회적인 방법을 통해 증권거래소나 코스닥시장 등 증권시장에 진입해 사실상 상장 효과를 누리는 행위를 말한다.\n우회상장은 크게 기업합병, 포괄적 주식교환, 영업양수도, 자산양수, 현물출자의 방법으로 이뤄진다. 이 가운데 증권시장에 상장되어 있는 기업과의 합병을 통한 우회상장이 대표적인 방법이다.\n기업합병에 의한 우회상장은 비상장기업이 상장기업의 최대주주 지분과 경영권을 넘겨받아 최대주주 지위를 확보하고, 합병을 결의한 후 상장기업이 합병의 대가로 비상장기업의 주주에게 상장주식을 발행하는 방식이다.\n포괄적 주식교환은 비상장기업 주주들이 상장기업에 그들의 지분을 모두 넘겨주고, 그 대가로 상장기업의 신주를 받음으로써 상장효과를 얻게 되는 방식이다. 비상장기업이 상장기업의 완전자회사가 되는 경우이다.\n영업양수도 방식은 비상장기업이 그들의 영업 및 관련 자산·부채를 모두 상장기업에 넘겨주고 영업양도 대가를 받은 후 해산했다가 이후에 상장기업의 신주발행에 참여해 상장기업의 주주가 되면서 우회상장이 이루어진다.\n우회상장은 상장요건을 충족시키기에는 미흡하지만 성장성이 높고 재무적으로 우량한 비상장기업에 자본조달의 기회를 주려는 취지로 도입된 제도이다. 그러나 우회상장에 대한 심사가 허술할 경우 자격미달의 부실기업이 쉽게 자본시장에 진입하여 투자자들이 피해를 보는 사례가 발생하기도 한다."}, {"no": 19, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 중 증권의 유통시장 공시가 아닌 것은?", "extra": [], "choices": ["증권발행실적보고서", "사업보고서", "반기보고서", "주요사항보고서"], "answer": 1, "explain": "사업보고서, 반기보고서, 분기보고서, 주요사항보고서는 유통시장 공시사항이다. 증권신고서, 투자설명서, 증권발행실적보고서는 발행시장 공시사항이다."}, {"no": 20, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 〈보기〉의 설명에 해당하는 것은?", "extra": ["〈보 기〉", "모든 단일가매매 시 가격결정을 위한 호가접수시간을 정규마감시간 이후 30초 이내에 임의로 시간을 연장하여 매매체결 시점이 임의적으로 결정되도록 하는 제도이다."], "choices": ["동적VI", "정적VI", "이연결제제도(CNS)", "랜덤엔드"], "answer": 4, "explain": "모든 단일가매매 시 가격결정을 위한 호가접수시간을 정규마감시간 이후 30초 이내에 임의시간을 연장하여 매매체결 시점이 임의적으로 결정되도록 하는 제도를 단일가매매 임의연장(Random End, 랜덤엔드)이라고 한다. 이는 단일가매매시간 중 허수성 호가에 의한 가격 왜곡문제를 방지하여 선의의 투자자 피해를 최소화하고 시장의 투명성 제고 및 균형가격 발견기능을 강화하기 위한 것이다.\n※ 변동성완화장치(VI : Volatility Interruption)\n기존의 가격제한폭만 운영하는 상황에서는 장중에 개별종목의 주가가 가격제한폭으로 변동할 때까지 순간적인 가격급변을 완화할 수 있는 장치가 미흡해 선의의 투자자 피해가 우려되었다. 따라서 종목별 변동성완화장치는 대부분의 해외거래소가 채택하고 있는 개별종목에 대한 가격안정화장치로서, 주문실수, 수급 불균형 등에 의한 일시적 주가급변 시 단기간의 냉각기간(2분의 단일가매매)을 부여하여 시장참가자로 하여금 주가급변 상황에 대해 주의를 환기시킴으로써 가격급변을 완화하도록 하기 위한 제도이다.\n(1) 변동성완화장치 유형\n• 동적VI : 특정 호가에 의한 순간적인 수급 불균형이나 주문착오 등으로 야기되는 일시적 변동성 완화\n• 정적VI : 특정 단일호가 또는 여러 호가로 야기되는 누적적이고, 보다 장기간의 가격변동 완화\n(2) 발동 시 처리 방법\n동적VI·정적VI가 동일하게 발동 시 2분간 단일가매매 호가접수 및 체결(접속매매는 단일가매매로 전환, 은 지정하지 않는 주문형태이다.", "조건부지정가주문은 시가결정 시에는 지정가주문이지만 정규시장에서는 시장가주문으로 전환되는 주문형태이다.", "최유리지정가주문은 주문시점에서 상대방 최우선호가의 가격으로 지정되는 주문형태이다."], "answer": 3, "explain": "조건부지정가주문은 접속매매 방식이 적용되는 정규시장에서의 매매시간에는 지정가주문으로 매매거래에 참여하지만, 당해 주문수량 중 매매체결이 되지 않은 잔여수량은 종가결정을 위한 매매거래(장종료 전 10분간) 시 자동으로 시장가주문으로 전환되는 주문이다.\n※ 호가(주문)의 종류\n(1) 지정가주문\n종목, 수량, 가격을 투자자가 지정하는 가장 일반적인 주문형태로서 투자자가 지정한 가격 또는 그 가격보다 유리한 가격으로 매매거래를 하고자 하는 주문이다. 따라서 지정된 가격은 매매거래가 가능한 가격의 한도를 의미하므로 매수주문의 경우 지정된 가격이나 그보다 낮은 가격, 매도주문의 경우 지정한 가격이나 그보다 높은 가격이면 체결이 가능하다.\n(2) 시장가주문\n종목과 수량은 지정하되 가격은 지정하지 않는 주문유형으로, 현 시점에서 가장 유리한 가격조건 또는 시장에서 형성되는 가격으로 즉시 매매거래를 하고자 하는 주문을 말한다. 따라서 일반적인 경우 시장가주문은 지정가주문에 우선하여 매매체결되고 주문수량 전량이 해소될 때까지 가장 우선하는 상대방 주문부터 순차적으로 체결이 이루어진다.\n(3) 조건부지정가주문\n매매거래시간 중에는 지정가주문으로 매매거래에 참여하지만 매매체결이 이루어지지 않은 잔여수량은 종가결정(장 종료 전 10분간 단일가매매) 시에 시장가주문으로 자동 전환되는 주문이다.\n(4) 최유리지정가주문\n상대방 최우선호가로 즉시 체결이 가능하도록 하기 위해 주문접수 시점의 상대방 최우선호가 가격으로 지정되는 주문형태이다. 즉, 매도의 경우 해당 주문의 접수시점에 가장 높은 매수주문의 가격, 매수의 경우 해당 주문의 접수시점에 가장 낮은 매도주문의 가격으로 지정한 것으로 보아 매매체결에 참여하는 주문이다.\n(5) 최우선지정가주문\n최우선지정가주문은 해당 주문의 접수시점에 자기 주문 방향의 최우선호가 가격으로 지정되어 주문이 제출된다. 매도의 경우 해당 주문의 접수시점에 가장 낮은 매도주문의 가격, 매수의 경우 당해 주문의 접수시점에 가장 높은 매수주문의 가격으로 지정한 것으로 보아 매매체결에 참여하는 주문이다.\n(6) 목표가주문\n투자자가 특정 지정가격이 아닌 당일의 거래량가중평균가격(VWAP) 등 향후에 결정될 가격 또는 그와 근접한 가격으로 매매체결을 원하는 경우, 회원이 재량으로 투자자가 목표로 하는 가격에 최대한 근접하여 체결될 수 있도록 하는 주문유형이다. 다만, 목표가주문과 관련된 호가유형은 별도로 존재하지 않기 때문에 회원사가 목표가 달성을 위해 투자자 주문을 지정가호가 또는 시장가호가 등의 형태로 분할하여 제출하여야 한다.\n(7) 경쟁대량매매주문\n투자자가 종목 및 수량은 지정하되 당일의 거래량가중평균가격(VWAP)으로 매매거래를 하고자 하는 주문유형이다. 이는 시장충격을 최소화하는 대량매매제도의 한 유형으로서 최소수량요건 등이 적용되며 정규시장과는 별도의 시장에서 비공개로 매매체결이 이루어진다."}, {"no": 25, "subject": "증권분석 및 증권시장", "detail": "코스닥시장", "stem": "유가증권시장의 서킷브레이커(CB)발동에 대한 설명이다. 괄호에 적절한 어휘가 순서적으로 옳은 것은?", "extra": ["서킷브레이커는 ( )가 기준가격 대비 8%, 15% 또는 20% 이상 ( )하여 ( )동안 지속될 경우 발동하며 그 효력은 주식시장 및 파생상품시장을 20분간 매매거래정지(20% 요건발동 시는 장 종료)하며 매매거래정지 해제 후 10분간 단일가매매를 한 후 접속매매로 전환된다."], "choices": ["코스피지수, 하락, 1분", "코스피200선물지수, 변동, 5분", "코스피200지수, 하락, 1분", "코스피지수, 변동, 5분"], "answer": 1, "explain": "한국종 권의 유통시장에 대한 설명이다. 옳은 것은?", "extra": [], "choices": ["장내시장에서 개설된 국채전문유통시장에서의 국고채전문딜러(PD) 중심으로 매매 가능하고 국고채의 매매수량 단위는 10억원이며 국채가 아닌 통안증권도 매매대상이다.", "채권 유통시장은 우리나라를 포함한 대부분의 나라에서 장내시장의 비중이 더 높은 것이 특징이다.", "채권은 장내시장, 장외시장 모두 상대매매 방식으로 거래된다.", "채권의 장외시장에서는 비상장채권만 거래된다."], "answer": 1, "explain": "① 국채전문유통시장에서 국고채의 호가수량단위는 액면 1만원이며, 매매수량 단위는 10억원의 정배수이다. 한국은행이 발행하는 통화안정증권은 국채가 아니지만 이 시장에서 거래되며 자격을 갖춘 기관투자자인 국고채전문딜러(PD : Primary Dealer)들 중심으로 거래한다.\n(오답풀이)\n② 채권은 주식과 달리 거래대상을 표준화하기 어렵고(이표채 발행금리와 만기가 발행 시마다 다르므로) 또 기관투자자 중심의 시장이므로 장외시장의 비중이 크다.\n③ 장내시장은 경쟁매매, 장외시장은 상대매매이다.\n④ 장내시장에서는 상장채권만 거래되지만, 장외시장은 매매대상을 제한하지 않으므로 상장채권과 비상장채권이 모두 거래대상이 된다."}, {"no": 30, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "듀레이션에 대한 설명이다. 옳은 항목으로 연결한 것은?", "extra": ["가. 복리채의 듀레이션은 복리채의 잔존만기와 같다.", "나. 이표채의 듀레이션은 잔존만기보다 항상 짧다.", "다. 표면이자율이 높을수록, 잔존만기가 짧을수록 채권가격의 변동성은 커진다."], "choices": ["다, 라", "가, 나", "가, 라", "나, 다"], "answer": 2, "explain": "옳은 항목은 '가, 나'이다.\n• 다 : 표면이자율이 낮을수록, 잔존기간이 길수록 채권가격의 변동성은 커진다.\n► 채권가격의 변동성(듀레이션)↑ = f(표면이율↓, 잔존만기↑, 만기수익률↓)\n(보충) 이표채는 만기 전에 수취하는 현금흐름이 있으므로 이표채의 듀레이션은 채권의 만기보다 항상 짧다. 반면, 중도에 현금흐름이 발생하지 않는 채권(만기일시상환채 : 복리채, 할인채)은 듀레이션이 채권의 잔존만기와 일치한다.\n※ 듀레이션(Duration)의 특징\n(1) 듀레이션이 클수록, 금리변동에 따른 채권의 가격변동폭은 증가한다.\n(2) 표면금리가 높을수록, 듀레이션은 짧아진다.\n(3) 만기수익률이 높을수록, 듀레이션은 짧아진다.\n(4) 잔존기간이 길수록, 듀레이션은 커진다.\n(5) 무이자할인채의 듀레이션은 만기와 동일하다."}, {"no": 31, "subject": "증권분석 및 증권시장", "detail": "채권시장", "stem": "이자율의 기간구조이론에 대한 설명이다. 틀린 내용의 항목의 개수는?", "extra": ["가. 불편기대가설은 다양한 형태의 수익률곡선을 설명할 수 있으나 현실적으로 수익률곡선이 우상향하는 현상은 설명하지 못한다.", "나. 유동성선호가설은 장기채권과 단기채권이 완전히 대체되는 것은 아니라고 본다.", "다. 시장분할가설은 채권의 잔존기간과 만기수익률의 관계인 수익률곡선의 형태를 잘 설명한다.", "라. 특정한 만기를 선호하는 투자자도 선호영역가설에 의하면 충분한 대가가 주어졌을 때 선호영역 외의 영역에 해당하는 채권에도 투자한다."], "choices": ["0개", "1개", "2개", "3개"], "answer": 2, "explain": "틀린 항목의 개수는 1개('다')이다. 시장분할가설은 법적·제도적 요인에 의해 구조적 경직성이 존재함으로써 채권시장이 몇 개의 하위시장(단기채, 중기채, 장기채 시장)으로 분할되어 채권수익률과 잔존기간 간에는 어떤 체계적 관계가 존재하지 아니한다는 이론으로 시장이 서로 단절되어 제각각 움직이므로 수익률곡선의 형태를 잘 설명하지 못한다(예를 들어 보험회사의 연금저축보험은 장기가입자를 대상으 근접할수록 시간가치하락현상(time decayed)이 커지므로, 만기가 가까워지면 콜ELW·풋ELW 모두 가격이 하락한다.\n④ 콜ELW는 금리가 올라갈 경우 지급금액이 적어지므로 가격이 상승하고, 풋ELW는 금리가 올라갈 경우 수령금액이 적어지므로 가격이 하락한다.\n| 가격결정요인 | Call ELW | Put ELW |\n| 기초자산시장가격↑ | ↑ | ↓ |\n| 행사가격↑ | ↓ | ↑ |\n| 변동성↑ | ↑ | ↑ |\n| 잔존만기기간↓ | ↓ | ↓ |\n| 배당수익률↑ | ↓ | ↑ |\n| 이자율↑ | ↑ | ↓ |\n※ ELW의 민감도지표(greeks)\n• 델타(delta)는 기초자산이 변화할 때 옵션가격이 얼마나 변하는가 하는 민감도를 보여주는 지표이다.\n• 감마(gamma)는 기초자산이 변화할 때 델타가 얼마나 변하는가 하는 민감도를 보여주는 지표이다.\n• 쎄타(theta)는 시간의 경과에 따라 옵션가격이 얼마나 변하는가 하는 민감도를 보여주는 지표이다.\n• 베가(vega)는 기초자산의 변동성 변화에 따라 옵션가격이 얼마나 변하는가 하는 민감도를 보여주는 지표이다."}, {"no": 42, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "다음 중 마코위츠의 평균－분산 모델에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["효율적 포트폴리오를 위하여 투자종목 수가 증가함에 따라 기업고유위험은 감소한다.", "분산투자의 종목 수 n이 무한대로 증가해도 체계적 위험은 감소하지 아니한다.", "투자위험의 관리는 시장 관련 위험이며 개별종목의 고유위험이 아니다.", "포트폴리오의 공통된 위험을 비체계적 위험이라고 한다."], "answer": 4, "explain": "포트폴리오의 공통된 위험을 체계적 위험(Systematic Risk)이라고 한다. 즉, 분산투자의 종목 수를 무한대로 늘려도 줄어들지 아니하는 시장고유의 위험을 말한다."}, {"no": 43, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "조직적으로 투자관리를 하는 통합적 투자관리(integrated investment management)의 순서로 옳은 것은?", "extra": [], "choices": ["투자전략적 관점의 자산배분 － 투자목표를 위한 투자전략의 수립 － 투자전술 관점의 개별종목 선택 － 포트폴리오의 수정과 사후조정", "투자목표를 위한 투자전략의 수립 － 투자전술 관점의 개별종목 선택 － 투자전략적 관점의 자산배분 － 포트폴리오의 수정과 사후조정", "투자목표를 위한 투자전략의 수립 － 투자전략적 관점의 자산배분 － 투자전술 관점의 개별종목 선택 － 포트폴리오의 수정과 사후조정", "투자전술 관점의 개별종목 선택 － 투자목표를 위한 투자전략의 수립 － 투자전략적 관점의 자산배분 － 포트폴리오의 수정과 사후조정"], "answer": 3, "explain": "통합적 투자관리는 하향식(top-down) 방법이다. 첫 번째 단계는 투자목표를 설정하고 투자전략수립에 필요한 사전 투자분석을 실시한다. 두 번째 단계는 투자관리의 본 단계로서 투자전략적(strategic) 관점에서 자산배분(asset allocation)을 실시하는 것이고, 세 번째 단계는 투자전술적(tactical) 관점에서 개별종목을 선택(securities-selection)하는 것이다. 그리고 마지막으로 포트폴리오의 수정과 투자성과의 사후통제단계이다."}, {"no": 44, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "다음 중 블랙리터만의 자산배분 모델에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["특정자산집단의 기대수익률과 위험을 몰라도 자산배분을 할 수 있다.", "투자자의 주관적인 장기전망을 배제하여 자산배분하므로 시장 전망치의 오류 가능성을 배제할 수 있다.", "평균분산모델의 문제점인 극단적인 자산배분비중의 문제를 해결할 수 있다.", "투자자가 특별한 시장전망을 가지지 않을 경우 균형 기대수익률로 자산배분을 실행한다."], "answer": 2, "explain": "투자자의 장기전망을 자산배분에 반영하여 자산배분의 비중을 조절할 수 있어 모델의 유연성을 가진다."}, {"no": 45, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "보기에서 전술적 자산배분의 실행도구에 해당하는 것으로 묶은 것은?", "extra": ["가. 가치평가모형", "나. 포뮬러 플랜(Formula Plan)", "다. 투자자별 특수상황을 고려하는 방법"], "choices": ["가, 나, 다", "나, 다", "가, 다", "가, 나"], "answer": 4, "explain": "'가, 나'는 전술적 자산배분의 실행도구, '다'는 전략적 자산배분의 실행방법이다.\n※ 자산배분의 실행방법 또는 실행도구\n| 전략적 자산배분의 실행방법 | 전술적 자산배분의 실행도구 |\n| (1) 시장가치 접근방법 | (5) 가치평가모형 |\n| (2) 위험수익 최적화 방법 | (6) 기술적 분석 |\n| (3) 투자자별 특수상황을 고려하는 방법 | (7) 포뮬러 플랜 |\n| (4) 다른 기관투자자의 자산배분을 모방하는 방법 | |\n(1) 시장가치 접근방법 : 시장지수의 시가총액 구성비율을 그대로 따라하는 전략으로서, 이는 '시장이 효율적'이라는 전제로 벤치마크수익률을 추구하는 장기적인 전략 즉 전략적 자산배분에 해당된다.\n(2) 위험수익 최적화 방법 : '기대수익률과 위험을 파악 → 지배원리를 통해 효율적 투자기회선 도출 → 최적 포트폴리오 투자'의 마코위츠의 포트폴리오 이론(평균분산모형)과 같다.\n• 마코위츠의 포트폴리오 이론은 전략적 자산배분의 이론적 토대가 된다.\n(3) 투자자별 특수상황을 고려하는 방법 : 전략적 자산배분의 토대 위에 운용기관별 요구수익률, 수용 위험수준 등을 고려하는 방법이다.\n(4) 다른 기관투자자의 자산배분을 모방하는 방법 : 연기금 등 시장을 주도하는 대형기관투자자의 자산배분전략을 모방하는 것으로서 보편화되어 있는 방법이다.\n(5) 가치평가모형 : 다양한 가치평가모형(현금흐름할인모형, 배당평가모형, CAPM, APT 등)을 통해 내재가치를 정확하게 평가하려 하는 방법이다.\n• 전술적 자산배분의 핵심은 내재가치평가를 통한 자산의 고평가·저평가 여부를 판단하는 것이다.\n(6) 기술적 분석 : 과거에 성공적이었던 기술적 분석의 경험을 이용하여 적정한 자산의 매매 타이밍을 찾고자 하는 방법이다.\n(7) 포뮬러 플랜(Formula Plan) : '주식 + 채권'으로 포트폴리오를 구성한 후, 주식가격이 사전에 정한 일정 범위에 도달할 경우 매매(상승 시 매도, 하락 시 매수)하여 안정적으로 초과수익을 달성하고자 하는 기법이다.\n• 포뮬러 플랜은 개별자산의 가치평가를 하지 않고 막연하게 시장과 역으로 투자하는 역투자전략에 해당한다. 이는 증권투자방법의 하나로 주가는 순환적으로 변동하기 때문에 그 변동을 예상하는 것은 불가능에 가깝다는 것을 전제로 일정한 규칙에 따라 기계적으로 매매함으로써 단순한 매입보유전략보다 높은 수익률을 올리고자 하는 투자전략이다. 정액법과 정률법이 있다."}, {"no": 46, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "A주식을 첫째 해 초 10,000원에 매입하여 연말에 400원의 배당금을 받았다. 둘째 해 초에 동일한 A주식을 10,600원에 추가 매입하여 그 해 말에 800원(한 주당 400원)의 배당금을 받고 21,600원(한 주당 10,800원)에 매각하였다. 산술평균수익률과 기하평균수익률을 순서대로 표시한 것은? (근사값)", "extra": [], "choices": ["6.00%, 4.00%", "7.12%, 5.66%", "7.83%, 7.78%", "12.00%, 8.50%"], "answer": 3, "explain": "순서대로 7.83%, 7.78%이다.\n• 산술평균(ARR) = (1/2){(400 + 600)/10,000 + (400 × 2 + 200 × 2)/(10,600 × 2)}\n= (1/2){10% + 5.66%} ≒ 7.83%\n• 기하평균(GRR) = 2제곱근√((1 + 0.1)(1 + 0.056)) - 1 ≒ 7.78%"}, {"no": 47, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "전략적 자산배분에 대한 설명이다. 가장 적절하지 않은 것은?", "extra": [], "choices": ["'시장은 단기적으로는 비효율적이지만 장기적으로는 효율적이다'는 평균반전현상을 이용하는 전략이다.", "장기적으로 자산집단별 투자비중을 결정하고 중기적으로 각 자산집단이 변화할 수 있는 투자비율의 한계를 결정하는 의사결정을 말한다.", "전략 수립에 사용된 각종 변수들에 대한 가정이 근본적으로 변화하지 않는 이상, 처음 구성하였던 자산배분을 변경하지 않고 계속해서 유지해 나간다.", "자산배분의 변경으로 인한 운용성과의 변화에 대해서는 투자자가 책임을 진다."], "answer": 1, "explain": "평균반전현상을 이용하는 것은 전술적 자산배분이다.\n① 평균반전현상(mean-reverting process)은 '시장가격은 단기적으로는 비효율적이어서 과잉반응이 나타나지만 장기적으로는 효율적이어서 결국 내재가치로 수렴한다'는 이론이다. 즉 단기적인 주가의 과잉반응 현상을 이용해서 '저가매수·고가매도'를 한다. 그리고 이후 장기적인 내재가치 수렴과정을 통해서 주가는 평균(균형가격 or 적정가치)으로 수렴(복귀)하므로 이 과정에서 초과수익이 발생한다는 논리이다. 즉 평균반전현상은 전술적 자산배분의 이론적 배경에 해당한다.\n► 전술적 자산배분의 이론적 배경 : 평균반전현상·가격착오(mis-pricing)현상·증권시장의 과잉반응현상\ncf 전략적 자산배분의 이론적 배경 : 마코위츠의 효율적 투자이론\n④ 펀드의 경우 전략적 자산배분의 결과에 대해서는 투자자가, 전술적 자산배분의 결과에 대해서는 운용자(의사결정자)가 책임(의사결정에 대한 책임)을 진다.\n• 펀드의 경우 투자자가 주식형 펀드 또는 채권형 펀드를 선택하여 투자하는 것 자체가 전략적 자산배분의 수행이라고 할 수 있으므로, 그 결과에 대한 책임도 투자자가 진다고 볼 수 있다."}, {"no": 48, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "수익률의 측정과 관련하여 빈칸에 알맞은 것은?", "extra": ["( )은 서로 상이한 시점에서 발생하는 현금흐름의 크기와 화폐의 시간적 가치가 고려된 평균수익률 개념으로서, 현금유출액의 현재가치와 현금유입액의 현재가치를 일치시켜주는 할인율로 계산된다."], "choices": ["산술평균수익률", "기하평균수익률", "내부수익률", "시간가중수익률"], "answer": 3, "explain": "내부수익률(IRR : Internal Rate of Return)이다. 다기간수익률(연평균수익률)에는 '산술평균수익률·기하평균수익률(시간가중수익률)·내부수익률(금액가중수익률)'이 있다.\n※ 성과평가를 위한 수익률의 종류\n[표] 단일기간수익률(보유기간수익률) / 다기간수익률 : 산술평균수익률, 기하평균수익률(시간가중수익률), 내부수익률(금액가중수익률)\n(1) 투자기간 중 투입자금(Input)의 변화가 없으면 전체기간(매수~매도)이 하나의 단일기간이 되며, 투입자금의 변화가 있다면 투자기간은 여러 개의 단일기간으로 구성된다.\n(2) 단일기간수익률은 각 펀드마다 투자기간이 다르기 때문에 수익률비교가 불가하다. 따라서 펀드 간 수익률비교를 위해서 연평균수익률을 산출한 것이 '다기간수익률'이며, 다기간수익률의 종류로는 '산술평균수익률(ARR)·기하평균수익률(GRR)·내부수익률(IRR)'의 3가지가 있다."}, {"no": 49, "subject": "금융상품 및 직무윤리", "detail : 74, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 〈보기〉 중 공개매수에 대한 설명으로 옳은 항목으로만 나열된 것은?", "extra": ["〈보 기〉", "가. \"공개매수\"란 불특정 다수인에 대하여 의결권 있는 주식의 매수의 청약을 하거나 매도의 청약을 권유하고 증권시장 밖에서 그 주식등을 매수하는 것을 말한다.", "나. 적용대상증권인 \"주식등\"에는 주권, 신주인수권증권, 신주인수권부사채 등이 포함되나, 전환사채 및 교환사채는 포함되지 않는다.", "다. 공개매수에 응모한 주주는 공개매수기간 중 언제든지 응모를 취소할 수 있다.", "라. 공개매수자는 공개매수 대상의 주가가 공개매수가격 이상으로 상승할 경우 공개매수를 철회할 수 있다."], "choices": ["가, 다, 라", "가, 다", "나, 다", "나, 라"], "answer": 2, "explain": "옳은 항목은 '가', '다' 2개이다.\n나. 적용대상증권에는 전환사채권과 교환사채권도 포함된다.\n라. 공개매수 대상의 주가가 공개매수가격 이상으로 상승하여도 이는 공개매수를 철회할 수 있는 사유가 되지 못한다.\n※ 자본시장법 제133조(공개매수의 적용대상) 제1항, 제3항\n① '공개매수'란 불특정 다수인에 대하여 의결권 있는 주식등의 매수(다른 증권과의 교환을 포함)의 청약을 하거나 매도(다른 증권과의 교환을 포함)의 청약을 권유하고 증권시장 및 다자간매매체결회사(이와 유사한 시장으로서 해외에 있는 시장을 포함) 밖에서 그 주식등을 매수하는 것을 말한다.\n③ 주식등을 6개월 동안 증권시장 밖에서 10인 이상의 자로부터 매수등을 하고자 하는 자는 그 매수등을 한 후에 본인과 그 특별관계자가 보유하게 되는 주식등의 수의 합계가 그 주식등의 총수의 100분의 5 이상이 되는 경우에는 공개매수를 하여야 한다. 다만, 매수등의 목적, 유형, 그 밖에 다른 주주의 권익침해 가능성 등을 고려하여 대통령령으로 정하는 매수등(→ 예를 들어, 소각을 목적으로 하는 주식등의 매수인 경우 등)의 경우에는 공개매수 외의 방법으로 매수등을 할 수 있다."}, {"no": 75, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 「자본시장조사 업무규정」상 금융위원회의 조사대상이 아닌 것은?", "extra": [], "choices": ["한국거래소로부터 위법행위의 혐의사실을 이첩받은 경우", "위법행위에 관한 제보를 받거나 조사를 의뢰하는 민원을 접수한 경우", "상장사의 자기자본 5% 이상의 횡령·배임 등이 발생한 경우", "각 행정기관으로부터 위법행위의 혐의사실을 통보받은 경우"], "answer": 3, "explain": "상장사의 횡령 및 배임은 상장적격성 심사대상 등에 해당하며 금융위의 직접적인 조사대상은 아니다.\n※ 조사의 주요대상\n(1) 미공개정보 이용행위\n(2) 시세조종 등 불공정행위\n(3) 내부자의 단기매매차익 취득\n(4) 상장법인의 공시의무 위반\n(5) 상장법인 임원 등의 특정증권 및 변동상황 보고의무 위반 등\n(6) 주식의 대량보유등의 보고(5% Rule)\n※ 자본시장조사 업무규정 제6조(조사의 실시 등) 제1항, 제2항\n① 금융위는 다음 각 호의 어느 하나에 해당하는 경우에는 조사를 실시할 수 있다.\n1. 금융위 및 금융감독원의 업무와 관련하여 위법행위의 혐의사실을 발견한 경우\n2. 한국거래소로부터 위법행위의 혐의사실을 이첩받은 경우\n3. 각 급 검찰청의 장으로부터 위법행위에 대한 조사를 요청받거나 그 밖의 행정기관으로부터 위법행위의 혐의사실을 통보받은 경우\n4. 위법행위에 관한 정보를 받거나 조사를 의뢰하는 민원을 접수한 경우\n5. 기타 공익 또는 투자자보호를 위하여 조사의 필요성이 있다고 인정하는 경우\n② 제1항의 규정에 불구하고 다음 각 호의 1에 해당하는 경우에는 조사를 실시하지 아니할 수 있다.\n1. 당해 위법행위에 대한 충분한 증거가 확보되어 있고 다른 위법행위의 혐의가 발견되지 않는 경우\n2. 당해 위법행위와 함께 다른 위법행위의 혐의가 있으나 그 혐의내용이 경미하여 조사의 실익이 없다고 판단되는 경우\n3. 공시자료, 언론보도 등에 의하여 널리 알려진 사실이나 풍문만을 근거로 조사를 의뢰하는 경우\n4. 민원인의 사적인 이해관계에서 당해 민원이 제기된 것으로 판단되는 등 공익 및 투자자 보호와 직접적인 관련성이 적은 경우\n5. 당해 위법행위에 대한 제보가 익명 또는 가공인 명의의 진정·탄원·투서 등에 의해 이루어지거나 그 내용이 조사단서로서의 가치가 없다고 판단되는 경우\n6. 당해 위법행위와 동일한 사안에 대하여 검찰이 수사를 개시한 사실이 확인된 경우"}, {"no": 76, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "자본시장법상의 공공적 법인에 대한 내용이다. 옳은 것으로 묶은 것은?", "extra": ["가. 주주별 소유한도는 발행주식총수의 100분의 3을 원칙으로 한다.", "나. 공공적 법인의 상장당시 발행주식총수의 100분의 10 이상을 소유한 주주는 그 소유비율까지 소유할 수 있다.", "다. 의결권이 없는 주식은 발행주식총수에 포함되지 않는다."], "choices": ["가, 나", "나, 다", "가, 다", "가, 나, 다"], "answer": 4, "explain": "모두 옳은 내용이다.\n※ 공공적 법인의 주식 소유제한\n(1) 누구든지 공공적 법인이 발행한 주식을 누구의 명의로 하든지 자기의 계산으로 '발행주식총수의 100분의 3'을 초과하여 소유할 수 없다. 단, 그 주식이 상장될 당시에 발행주식총수의 100분의 10 이상을 소유한 주주는 그 소유비율까지 소유할 수 있다. 이때 '의결권이 없는 주식'은 발행주식총수에 포함되지 않는다.\n(2) 소유비율 한도를 초과하여 주식을 소유한 자에 대하여 금융위는 6개월 이내의 기간을 정하여 그 기준을 충족시키기 위한 시정조치를 명할 수 있다.\n(참고) 자본시장법상의 공공적 법인은 '한국전력'을 말한다.\n※ 자본시장법 제167조(공공적 법인이 발행한 주식의 소유제한)\n① 누구든지 공공적 법인이 발행한 주식을 누구의 명의로 하든지 자기의 계산으로 다음 각 호의 기준을 초과하여 소유할 수 없다. 이 경우 의결권 없는 주식은 발행주식총수에 포함되지 아니하며, 그 특수관계인의 명의로 소유하는 때에는 자기의 계산으로 취득한 것으로 본다.\n1. 그 주식이 상장된 당시에 발행주식총수의 100분의 10 이상을 소유한 주주는 그 소유비율\n2. 제1호에 따른 주주 외의 자는 발행주식총수의 100분의 3 이내에서 정관이 정하는 비율\n② 제1항에 불구하고 소유비율 한도에 관하여 금융위원회의 승인을 받은 경우에는 그 소유비율 한도까지 공공적 법인이 발행한 주식을 소유할 수 있다.\n③ 제1항 및 제2항에서 규정하는 기준을 초과하여 사실상 주식을 소유하는 자는 그 초과분에 대하여는 의결권을 행사할 수 없으며, 금융위원회는 그 기준을 초과하여 사실상 주식을 소유하고 있는 자에 대하여 6개월 이내의 기간을 정하여 그 기준을 충족하도록 시정할 것을 명할 수 있다."}, {"no": 77, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 금융소비자보호법에서 정하고 있는 내용으로 적절하지 않은 것은?", "extra": [], "choices": ["투자성 상품에 대한 일반금융소비자는 계약체결일로부터 7일 이내에 청약의 철회를 할 수 있으며 금융회사가 청약철회권을 배제할 경우에는 약관 등이 아닌 개별약정방식으로 진행하여야 한다.", "대출성 상품에 대한 일반금융소비자의 청약철회권은 계약체결일로부터 14일 이내이다.", "금융상품판매업자등은 금융소비자로부터 자료열람을 요구받은 날로부터 7일 이내에 금융소비자가 해당 자료를 열람하도록 해야 하며, 실비를 기준으로 수수료 또는 우송료를 금융소비자에게 청구할 수 있다.", "금융소비자의 위법계약해지권에 의하여 해지될 경우 금융상품판매업자등의 원상회복의무는 없다."], "answer": 3, "explain": "금융상품판매업자등은 금융소비자로부터 자료열람을 요구받은 날로부터 6영업일 이내에 금융소비자가 해당 자료를 열람하도록 해야 하며 실비를 기준으로 수수료 또는 우송료를 금융소비자에게 청구할 수 있다.\n※ (일반 및 전문) 금융소비자의 위법계약해지권에 의하여 해지될 경우 금융상품판매업자등은 원상회복의무는 없다. 즉 해당계약은 소급하지 아니하고 장래에 대하여 계약의 효력이 상실된다. 금융소비자의 해지요구권 등에 따라 해당 계약이 종료된 경우 금융상품판매업자등은 금융소비자에게 해지관련 비용(수수료, 위약금 등)을 요구할 수 없다."}, {"no": 78, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자보호법상 과징금 부과대상이 아닌 것은?", "extra": [], "choices": ["적정성의 원칙 위반", "설명의무 위반", "불공정영업행위금지 위반", "광고규제 위반"], "answer": 1, "explain": "적정성의 원칙·적합성의 원칙 위반은 3천만원 이하의 과태료 부과 대상이다. 즉, 두 개 원칙에 대한 위반은 과징금 부과 대상이 될 수 없다. 다만, 설명의무 위반, 불공정영업행위금지 위반, 부당권유행위금지 위반, 광고규제 위반 등은 사안의 경중에 따라 과징금 또는 과태료가 부과될 수 있다."}, {"no": 79, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자보호법상 전문금융소비자에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["투자권유대행인은 투자성 상품과 관련하여 전문금융소비자이다.", "상시 근로자 5인 이상의 법인·단체·조합은 대출성 상품의 경우 전문금융소비자이다.", "대부업자는 투자성 상품과 관련하여 전문금융소비자이다.", "법인 등 단체는 예금성 상품과 관련하여 전문금융소비자이지만 보장성 상품에는 일반금융소비자이다."], "answer": 3, "explain": "대부업자는 투자성 상품, 대출성 상품, 보장성 상품과 관련하여 전문금융소비자이다.\n※ 금융소비자보호법 제2조(정의) 제9호, 제10호\n9. \"전문금융소비자\"란 금융상품에 관한 전문성 또는 소유자산 규모 등에 비추어 금융상품 계약에 따른 위험감수능력이 있는 금융소비자로서 다음 각 목의 어느 하나에 해당하는 자를 말한다. 다만, 전문금융소비자 중 대통령령으로 정하는 자가 일반금융소비자와 같은 대우를 받겠다는 의사를 금융상품판매업자 또는 금융상품자문업자(\"금융상품판매업자등\"이라 한다)에게 서면으로 통지하는 경우 금융상품판매업자등은 정당한 사유가 있는 경우를 제외하고는 이에 동의하여야 하며, 금융상품판매업자등이 동의한 경우에는 해당 금융소비자는 일반금융소비자로 본다.\n가. 국가\n나. 「한국은행법」에 따른 한국은행\n다. 대통령령으로 정하는 금융회사\n라. 주권상장법인(투자성 상품 중 장외파생상품을 거래할 때에는 전문금융소비자와 같은 대우를 받겠다는 의사를 금융상품판매업자등에게 서면으로 통지하는 경우만 해당한다)\n10. \"일반금융소비자\"란 전문금융소비자가 아닌 금융소비자를 말한다."}, {"no": 80, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자보호법상 광고규제에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["광고대상은 금융상품뿐만 아니라 금융상품판매업자등이 제공하는 각종 서비스도 포함한다.", "금융지주회사, 금융협회와 집합투자업자도 광고의 주체가 될 수 있다.", "광고주체가 금융상품 등에 대한 광고를 하는 경우 준법감시인의 심의를 받아야 한다.", "투자성 상품의 경우 금융상품판매대리·중개업자의 광고는 금융투자협회가 심사한다."], "answer": 4, "explain": "투자성 상품의 경우 금융상품판매대리·중개업자는 자본시장법상 투자권유대행인에 해당하는데 이들은 금융상품직접판매업자에 1사 전속으로 소속 , "집합투자증권(ETF는 제외) : 당일에 고시된 기준가격", "상장주권 또는 상장지수집합투자기구의 집합투자증권(ETF) : 당일종가"], "answer": 1, "explain": "상장채권 및 공모파생결합증권(주가연계증권만을 말함) : 2 이상의 채권평가회사가 제공하는 가격정보를 기초로 투자매매업자 또는 투자중개업자가 산정한 가격으로 한다."}, {"no": 90, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 상대적 기재사항이 아닌 것은?", "extra": [], "choices": ["현물출자를 하는 자에게 부여할 주식의 종류와 수", "회사 성립 후에 양수할 재산의 종류와 그 양도인의 성명", "회사가 설립 시에 발행하는 주식의 총수", "회사가 부담할 설립비용이나 발기인이 받을 보수액"], "answer": 3, "explain": "상법 제289조(주식회사 정관의 작성, 절대적 기재사항) 제1항\n① 발기인은 정관을 작성하여 다음의 사항을 적고 각 발기인이 기명날인 또는 서명하여야 한다.\n1. 목적\n2. 상호\n3. 회사가 발행할 주식의 총수\n4. 액면주식을 발행하는 경우 1주의 금액(100원 이상이어야 함. 그러나 무액면주식일 경우에는 1주의 금액이 있을 수 없으므로 1주의 금액은 액면주식을 발행하는 경우에만 이를 절대적 기재사항으로 하고 있음) (빈출문항)\n5. 회사의 설립 시에 발행하는 주식의 총수\n6. 본점의 소재지\n7. 회사가 공고를 하는 방법\n8. 발기인의 성명·주민등록번호 및 주소\n※ 상법 제290조(변태설립사항 : 상대적 기재사항)\n다음의 사항은 정관에 기재함으로써 그 효력이 있다.\n1. 발기인이 받을 특별이익과 이를 받을 자의 성명\n2. 현물출자를 하는 자의 성명과 그 목적인 재산의 종류, 수량, 가격과 이에 대하여 부여할 주식의 종류와 수\n3. 회사 성립 후에 양수할 것을 약정한 재산의 종류, 수량, 가격과 그 양도인의 성명\n4. 회사가 부담할 설립비용과 발기인이 받을 보수액\n'상대적 기재사항(변태설립사항)'이란 기재하지 않더라도 정관 자체의 효력에는 영향을 미치지 않지만 해당사항이 정관에 기재되어야만 비로소 회사와의 관계에서 그 효력이 발생되는 사항이며, 상법의 규정 중에 산재(散在)되어 있다.\n• 변태설립사항(變態設立事項)\n회사설립과 관련된 사항들 가운데 회사의 자본적 기초를 약화시킬 우려가 있는 것을 말한다. 상법은 회사의 자본을 충실하게 하기 위해 변태설립사항의 정관 기재를 강행규정으로 하고 있으며, 이를 위반한 경우 원칙적으로 무효이다. 변태설립사항에는 발기인의 특별이익, 현물출자, 재산인수, 설립비용과 발기인의 보수 등이 있다."}, {"no": 91, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 상법상 감사가 가지는 권한의 개수는?", "extra": ["가. 자회사 감사권", "나. 이사회 참석권", "다. 이사회 의결권", "라. 이사에 대한 유지청구권", "마. 이사회 소집 청구권", "바. 이사·회사 간 소송의 회사대표권"], "choices": ["5개", "4개", "3개", "2개"], "answer": 1, "explain": "보기 중에서 감사는 '의결권'을 제외한 5가지 권한을 모두 가진다. 감사는 이사회에 출석하여 의견은 진술할 수 있지만 의안에 대한 찬반을 나타내는 의결권은 없다. 감사의 이사회 참석권은 단순한 권한을 넘어 감사의 의무이기도 하다.\n※ 관련 상법 조문\n제412조의5(자회사의 조사권)\n① 모회사의 감사는 그 직무를 수행하기 위하여 필요한 때에는 자회사에 대하여 영업의 보고를 요구할 수 있다.\n② 모회사의 감사는 제1항의 경우에 자회사가 지체없이 보고를 하지 아니할 때 또는 그 보고의 내용을 확인할 필요가 있는 때에는 자회사의 업무와 재산상태를 조사할 수 있다.\n③ 자회사는 정당한 이유가 없는 한 제1항의 규정에 의한 보고 또는 제2항의 규정에 의한 조사를 거부하지 못한다.\n제391조의2(감사의 이사회출석 · 의견진술권)\n① 감사는 이사회에 출석하여 의견을 진술할 수 있다.\n② 감사는 이사가 법령 또는 정관에 위반한 행위를 하거나 그 행위를 할 염려가 있다고 인정한 때에는 이사회에 이를 보고하여야 한다.\n제402조(유지청구권)\n이사가 법령 또는 정관에 위반한 행위를 하여 이로 인하여 회사에 회복할 수 없는 손해가 생길 염려가 있는 경우에는 감사 또는 발행주식의 총수의 100분의 1 이상에 해당하는 주식을 가진 주주는 회사를 위하여 이사에 대하여 그 행위를 유지할 것을 청구할 수 있다.\n제412조의4(감사의 이사회 소집 청구)\n① 감사는 필요하면 회의의 목적사항과 소집이유를 서면에 적어 이사(소집권자가 있는 경우에는 소집권자를 말한다)에게 제출하여 이사회 소집을 청구할 수 있다.\n② 제1항의 청구를 하였는데도 이사가 지체 없이 이사회를 소집하지 아니하면 그 청구한 감사가 이사회를 소집할 수 있다.\n제394조(이사와 회사간의 소에 관한 대표)\n① 회사가 이사에 대하여 또는 이사가 회사에 대하여 소를 제기하는 경우에 감사는 그 소에 관하여 회사를 대표한다."}, {"no": 92, "subject": "법규 및 세제", "detail": "회사법", "stem": "다음 중 주주의 의결권에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["의결권 행사를 위해서는 주주명부에 명의개서가 되어야 한다.", "모든 주주는 1주마다 1개의 의결권을 갖는다.", "주주 의결권의 대리행사를 금지할 경우 정관에 기재되어 있어야 한다.", "주주가 2개 이상의 의결권을 가지고 있는 경우 이를 통일하지 아니하고 행사할 수 있다."], "answer": 3, "explain": "주주는 대리인으로 하여금 그 의결권을 행사하게 할 수 있다. 이 경우에는 그 대리인은 대리권을 증명하는 서면을 총회에 제출하여야 한다. 즉, 주주 의결권의 대리행사는 정관으로도 금지할 수 없다.\n※ 의결권의 불통일행사\n주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이 경우 주주총회일의 3일 전에 회사에 대하여 서면 또는 전자문서로 그 뜻과 이유를 통지하여야 한다. 또한 회사는 주주의 의결권 불통일 행사를 거부할 수 있으나 주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우에는 거부할 수 없다.\n※ 상법 제368조의2(의결권의 불통일행사)\n① 주주가 2 이상의 의결권을 가지고 있는 때에는 이를 통일하지 아니하고 행사할 수 있다. 이 경우 주주총회일의 3일전에 회사에 대하여 서면 또는 전자문서로 그 뜻과 이유를 통지하여야 한다.\n② 주주가 주식의 신탁을 인수하였거나 기타 타인을 위하여 주식을 가지고 있는 경우 외에는 회사는 주주의 의결권의 불통일행사를 거부할 수 있다."}, {"no": 93, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주주명부에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["회사는 1개월을 초과하지 않는 기간을 정하여 주주명부의 기재변경을 정지시킬 수 있다.", "주식의 이전은 취득자의 성명과 주소를 주주명부에 기재하지 아니하면 회사에 대항하지 못한다.", "주주명부 폐쇄개시 직전일 주주명부상의 주주가 권리 행사자로 확정된다.", "회사의 통지 및 최고는 주주명부에 기재한 주소 또는 그 자로부터 회사에 통지한 주소로 하면 된다."], "answer": 1, "explain": "회사는 3개월을 초과하지 않는 기간을 정하여 주주명부의 기재변경을 정지시킬 수 있다.\n※ 상법 제353조(주주명부의 효력) 제1항\n① 주주 또는 질권자에 대한 회사의 통지 또는 최고는 주주명부에 기재한 주소 또는 그 자로부터 회사에 통지한 주소로 하면 된다.\n※ 상법 제354조(주주명부의 폐쇄, 기준일)\n① 회사는 의결권을 행사하거나 배당을 받을 자 기타 주주 또는 질권자로서 권리를 행사할 자를 정하기 위하여 일정한 기간을 정하여 주주명부의 기재변경을 정지하거나 일정한 날에 주주명부에 기재된 주주 또는 질권자를 그 권리를 행사할 주주 또는 질권자로 볼 수 있다.\n② 제1항의 기간은 3월을 초과하지 못한다.\n③ 제1항의 날은 주주 또는 질권자로서 권리를 행사할 날에 앞선 3월 내의 날로 정하여야 한다.\n④ 회사가 제1항의 기간 또는 날을 정한 때에는 그 기간 또는 날의 2주간 전에 이를 공고하여야 한다. 그러나 정관으로 그 기간 또는 날을 지정한 때에는 그러하지 아니하다."}, {"no": 94, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 합병에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["합병에 반대한 주주라도 주식의 매수를 청구하지 않는 한 존속회사의 주주가 될 수 있다.", "존속회사 또는 신설회사는 소멸회사의 권리의무를 승계하지 않는다.", "합병으로 소멸하는 회사는 청산절차를 거치지 아니하고 소멸한다.", "합병결의가 있는 날로부터 1개월 이상의 기간 안에 채권자의 이의권이 인정되며 회사가 이 이의권을 묵살하면 합병무효의 원인이 된다."], "answer": 2, "explain": "합병의 효과로서 존속회사 또는 신설회사는 소멸회사의 권리의무를 포괄적으로 승계한다. 따라서 소멸회사의 사원도 당연히 포괄적으로 수용된다. 그러므로 소멸회사의 권리 의무를 승계하기 위한 별도의 행위가 필요 없고, 또 특약으로 그 일부의 승계를 제한할 수 없는 점에서 영업양도와 다르다.\n※ 상법 제235조(합병의 효과)\n합병 후 존속한 회사 또는 합병으로 인하여 설립된 회사는 합병으로 인하여 소멸된 회사의 권리의무를 승계한다."}, {"no": 95, "subject": "법규 및 세제", "detail": "회사법", "stem": "상법상 주식회사의 이사에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["이사는 주주총회에서 선임하며 또한 주주총회는 언제든지 특별결의로 임기만료 전에 이사를 해임할 수 있다.", "이사의 임기는 3년을 초과하지 못하지만 연임에 대한 제한은 없다.", "이사는 3인 이상이어야 한다. 다만 자본금 5억원 미만의 회사는 1인 또는 2인의 이사만 두더라도 무방하다.", "이사는 감사의 지위를 겸하지 못한다."], "answer": 3, "explain": "이사는 3인 이상이어야 한다. 다만 자본금 10억원 미만의 회사는 1인 또는 2인의 이사만 두더라도 무방하다.\n※ 상법 제383조(이사의 원수, 임기) 제1항, 제2항, 제3항\n① 이사는 3명 이상이어야 한다. 다만, 자본금 총액이 10억원 미만인 회사는 1명 또는 2명으로 할 수 있다. (∴ 빈출문항)\n② 이사의 임기는 3년을 초과하지 못한다. (그러나 연임에 대한 제한은 없음)\n③ 제2항의 임기는 정관으로 그 임기 중의 최종의 결산기에 관한 정기주주총회의 종결에 이르기까지 연장할 수 있다.\n※ 상법 제385조(해임) 제1항\n① 이사는 언제든지 주주총회의 결의로 이를 해임할 수 있다. 그러나 이사의 임기를 정한 경우에 정당한 이유 없이 그 임기 만료 전에 이를 해임한 때에는 그 이사는 회사에 대하여 해임으로 인한 손해의 배상을 청구할 수 있다."}, {"no": 96, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 우리나라 조세체계에서 국세에 해당하는 것은?", "extra": [], "choices": ["교육세", "취득세", "재산세", "주민세"], "answer": 1, "explain": "교육세는 국세로서 목적세에 해당한다. 나머지 보기는 모두 지방세로서 보통세에 해당한다.\n※ 우리나라 조세체계 (∴ 빈출문항)\n(1) 국세(14개)\n개인이 얻은 소득에 부과하는 소득세, 법인에게 부과하는 법인세, 무상으로 이전되는 상속세, 재산이 무상으로 이전되는 증여세, 부동산에 대한 종합부동산세, 생산 · 유통과정에 대한 부가가치세, 특정한 물품에 대한 개별소비세, 주류에 대하여 부과되는 주세, 재산권리 변동 증서에 대한 인지세, 주권 및 지분 양도에 대한 증권거래세, 교육재정 확충에 필요한 교육세, 사회간접자본투자를 위한 교통에너지환경세, 농어촌특별세, 외국물품 반입 및 물품에 대한 관세\n(2) 지방세(11개)\n일정한 자산의 취득에 대한 취득세, 재산권 · 권리에 대한 등록면허세, 경륜 · 경정 · 경마 등에 대한 레저세, 담배에 과세되는 세금인 담배소비세, 지역경제 활성화를 위한 지방소비세, 거주하는 개인 · 법인에 대한 주민세, 납세자의 소득에 따른 지방소득세, 일정한 재산에 대하여 부과되는 재산세, 자동차 소유에 대한 자동차세, 지역균형개발 · 수질개선에 대한 지역자원시설세, 교육질적 향상에 대한 지방교육세"}, {"no": 97, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 중 상증세에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["상속세의 신고·납부기한은 국내 거주 시 상속개시일이 속하는 달의 말일로부터 6월 이내이다.", "증여세 신고·납부기한은 증여개시일이 속하는 달의 말일로부터 3월 이내이다.", "상속세와 증여세는 물납이 허용된다.", "상속세와 증여세액이 2천만원을 초과하는 경우 세무서의 허락을 얻어 연부연납할 수 있다."], "answer": 3, "explain": "증여세는 2016년부터 물납이 허용되지 않는다."}, {"no": 98, "subject": "법규 및 세제", "detail": "증권세제", "stem": "다음 〈보기〉 중 소득세법상 이자소득에 해당하는 것만으로 모두 고른 것은?", "extra": ["〈보 기〉", "ⓐ 직장공제회 초과반환금", "ⓑ 비영업대금의 이익", "ⓒ 환매조건부 채권의 매매차익", "ⓓ 법인으로 보는 단체로부터 받는 분배금"], "choices": ["ⓐ, ⓑ", "ⓐ, ⓑ, ⓒ", "ⓐ, ⓒ, ⓓ", "ⓐ, ⓑ, ⓒ, ⓓ"], "answer": 2, "explain": "법인으로 보는 단체로부터 받는 배당 또는 분배금은 배당소득에 속한다.\n※ '배당소득'이란 당해연도에 발생한 다음의 소득을 말한다(소득세법 제17조 참고).\n(1) 내국법인으로부터 받는 이익이나 잉여금의 배당 또는 분배금\n(2) 법인으로 보는 단체로부터 받는 배당 또는 분배금 : 국세기본법에 의하여 법인으로 보는 법인격 없는 사단 · 재단 등의 단체로부터 받은 배당 또는 분배금을 말한다.\n(3) 공동출자사업자의 손익분배금 : 공동사업자이더라도 공동사업의 경영에 참여하지 아니하고 출자만 하는 자('출자공동사업자')가 분배받은 금액은 배당소득에 해당된다.\n(4) 의제배당 : 형식상으로는 배당이 아니라도 사실상 회사의 이익이 주주 등에게 귀속되는 경우에 이를 배당으로 간주하는 경우를 말한다.\n(5) 인정배당 : 법인세법에 의하여 배당으로 처분된 금액을 말한다.\n(6) 국내 또는 국외에서 받은 집합투자기구(펀드)로부터의 이익\n(7) 외국법인으로부터의 배당 : 외국법인으로부터 받는 이익이나 잉여금의 배당 또는 분배금\n(8) 「국제조세조정에 관한 법률」의 조세피난방지세제 규정에 따라 특정외국법인의 배당 가능한 유보소득에 대한 간주배당\n그 외에도 상기 열거한 소득과 유사한 소득으로서 수익분배의 성격이 있는 것(유사 배당소득)과 배당소득상품과 결합된 파생결합상품의 이익이 있다."}, {"no": 99, "subject": "법규 및 세제", "detail": "증권세제", "stem": "소득세법상 거주자의 소득구분 중 종합소득에 해당하지 않는 것은?", "extra": [], "choices": ["배당소득", "기타소득", "퇴직소득", "근로소득"], "answer": 3, "explain": "종합소득 대상은 이자소득, 배당소득, 사업소득, 근로소득, 연금소득, 기타소득이다. (← '이 · 배 · 사 · 근 · 연 · 기'로 암기) 퇴직소득과 양도소득은 '분류과세'로서 종합소득에 합산하지 않는다.\n※ 종합소득세 신고와 납부\n소득 납세의무의 성립 후 다음 연도의 5월 1일부터 31일까지 주소지 관할세무서에 종합소득 신고 및 납부를 하여야 한다. 다만, 다음에 해당하는 거주자는 신고를 하지 않아도 된다(종합소득신고대상이 아님).\n❶ 근로소득만 있는 거주자 (← 이미 매 지급 시 원천징수되기 때문)\n❷ 퇴직소득만 있는 거주자 (← 지급 시 분류과세로 종결되기 때문)\n❸ 공적연금소득만 있는 자 (← 이미 매 지급 시 원천징수되기 때문)\n❹ 원천징수 연말정산하는 사업소득만 있는 자 (← 이미 매 지급 시 원천징수되기 때문이다. 예로, 특정회사 소속의 야쿠르트를 판매하시는 분들은 사실상 자영업자로서 사업소득 대상이지만 소속회사에서 수당 지급 시 연말정산을 함)\n❹의2. 원천징수되는 기타소득으로 종교인소득만 있는 자\n❺ 위 ❶, ❷ 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❻ 위 ❷, ❸ 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❼ 위 ❷, ❹ 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❼의2. ❷, ❹의2 소득만 있는 자 (← 퇴직소득은 분류과세로서 종합소득에 합산되지 않음)\n❽ 분리과세이자 · 배당 · 연금 · 기타소득만 있는 자 (← 예를 들어 타 소득이 없고, 이자와 배당소득의 합계가 2천만원 이하일 경우 15.4%의 원천징수로 종결됨. 그러나 2천만원이 초과할 경우 다음 해 5월 중 종합소득대상임)\n❾ 위 ❶~❼의2에 해당하는 자로서 분리과세이자 · 배당 · 연금 · 기타소득이 있는 자 (← 타 소득이 있더라도 이자와 배당소득의 합계가 2천만원 이하일 경우 이를 타 소득과 합산하지 아니함)"}, {"no": 100, "subject": "법규 및 세제", "detail": "증권세제", "stem": "조세의 분류와 관련하여 빈칸에 들어갈 말로 옳은 것은?", "extra": ["과세표준과 관계없이 일정률의 세율이 적용되는 조세는 ( ), 과세표준의 크기에 따라 세율에 차이가 있는 조세는 ( )이다."], "choices": ["비례세, 누진세", "국세, 지방세", "직접세, 간접세", "보통세, 목적세"], "answer": 1, "explain": "비례세, 누진세이다.\n• 과세주체\n국세 : 과세권자가 국가인 조세\n지방세 : 과세권자가 지방자치단체인 조세\n• 조세의 전가성\n직접세 : 조세부담의 전가가 예상되지 않는 조세\n간접세 : 조세부담의 전가가 예상되는 조세\n• 지출의 목적성\n보통세 : 세수의 용도가 불특정한 조세(일반적인 지출 충당)\n목적세 : 세수의 용도가 특정된 조세(특정 목적 지출 충당)\n• 과세표준단위\n종가세 : 가격을 과세표준으로 하는 조세\n종량세 : 양(量)을 과세표준으로 하는 조세\n• 세율의 구조\n비례세 : 과세표준과 관계없이 일정률의 세율이 적용되는 조세\n누진세 : 과세표준의 크기에 따라 세율의 차이가 있는 조세"}]}, {"round": 2, "items": [{"no": 1, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 경기순환과정에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["경기순환은 반복적이고 지속적이며, 비주기적이고 비대칭적이며, 경제의 장기적 성장추세를 중심으로 상승과 하강을 반복하는 현상을 말한다.", "전통적인 방법은 경기순환을 회복(Recovery), 호황(Boom), 후퇴(Recession), 불황(Depression)의 네 국면으로 나누는데, 현실적으로 호황(Boom)과 후퇴(Recession)의 이분법을 더 많이 사용한다.", "경기의 정점 또는 저점이 발생한 구체적인 시점을 기준순환일(Reference Date)이라 한다.", "경기정점과 다음 정점 혹은 경기저점과 다음 저점까지의 기간을 순환주기(Cycle)라 하고, 정점과 저점 간의 차이를 순환진폭이라고 한다."], "answer": 2, "explain": "경기순환은 전통적으로 회복(Recovery), 호황(Boom), 후퇴(Recession), 불황(Depression)으로 나누는 4분법이 이용되었으나 그 구분을 명확히 하기 어렵기 때문에 최근에는 경기저점(Trough)에서 정점(Peak)까지 경제활동이 활발한 확장국면(Expansion)과 경기정점에서 저점까지 경제활동이 위축된 수축국면(Contraction)으로 나누는 2분법이 주로 이용된다."}, {"no": 2, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 우리나라 금리에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["중앙은행이 공개시장조작 등으로 통화공급을 확대하여 장기금리를 낮추면 단기금리와 은행금리가 함께 하락하여 기업투자와 가계소비가 늘어날 수 있다.", "국고채 유통수익률은 장기금융시장의 자금상황을 반영한다.", "양도성예금증서(CD)는 단기금융시장의 자금상황을 반영한다.", "한국은행은 7일물 RP매각에 적용되는 RP금리를 기준금리로 선택하고 이를 운용목표로 삼고 있다."], "answer": 1, "explain": "(금융당국 또는 통화당국인) 중앙은행이 공개시장조작 등으로 통화공급을 확대하여 단기금리를 낮추면 장기금리와 은행금리가 함께 하락하여 기업투자와 가계소비가 늘어날 수 있다."}, {"no": 3, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 경기변동이론에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["케인즈학파들은 경기순환의 원인으로 기업가의 동물적 감각이 독립투자와 내구소비재에 대한 지출을 변동시킴으로써 경기변동이 발생한다고 보았다.", "통화주의자들은 통화정책이 내부시차가 긴 경향이 있기 때문에 통화정책을 재량적으로 사용하는 것을 반대하였다.", "새고전학파인 루카스(Lucas)는 소비함수, 투자함수의 계수를 임의적으로 설정해서는 안 된다고 주장하여 케인즈의 소비함수와 투자함수 모형을 비판하였는데 이를 루카스 비판(Lucas Critique)이라고 한다.", "새케인즈학파는 새고전학파의 방법론은 받아들이되, 케인즈학파의 임금·가격의 경직성과 승수효과의 아이디어를 계승하였다."], "answer": 2, "explain": "통화주의자들은 통화정책이 단기적으로 경제에 영향을 미칠 수 있지만, 길고 가변적인 외부시차 문제가 있기 때문에 통화정책을 재량적으로 사용하는 것은 반대하였다.\n※ 통화주의자의 경기변동이론\n(1) 경제의 적정 성장속도를 무시한 통화당국의 자의적인 조절(불안정한 통화공급)로 인해 경기변동이 발생함\n(2) 케인즈학파와 통화주의학파는 총수요변동이 경기변동을 일으킨다는 측면에서는 동일하나, 케인즈는 재량적(Discretion) 재정정책을, 통화주의자는 준칙(Rule)에 입각한 통화정책을 주장한 점에서 차이가 있음\n• 통화량 증가(M↑) → 이자율 하락 → 투자 증가 → 총수요(C + I + G) 변동"}, {"no": 4, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 경기종합지수(CI)에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["DI가 각 개별 시계열의 변화방향만을 감안하여 작성하는 데 비하여 CI는 각 지표의 전월대비 변화율을 통계적으로 종합·가공하여 산출한다.", "예를 들어, 선행지표 7개 중 2개가 큰 폭으로 (+)이고, 나머지 5개가 (−)이어서 전체적으로 (+)로 나타날 경우에는 외형상 경기상승이지만 실질적으로는 경기하강일 수 있다.", "CI는 경기변동의 방향, 국면 및 전환점은 물론 변동속도까지 동시에 분석할 수 있으며 경기조정정책 수립에 필요한 기초자료로 제공된다.", "CI는 기준순환일에 대한 시차(Time Lag) 정도에 따라 선행·동행·후행종합지수의 3개군으로 구분되며 이 중 취업지수와 CP유통수익률은 선행지표에 해당된다."], "answer": 4, "explain": "CI는 기준순환일에 대한 시차(Time Lag) 정도에 따라 선행 · 동행 · 후행종합지수의 3개군으로 구분되며 이 중 취업자수와 CP유통수익률은 후행지표에 해당된다.\n※ 경기종합지수(CI)의 구성지표\n선행종합지수 : 재고순환지표, 경제심리지수, 기계류내수출하지수, 건설수주액(실질), 수출입물가비율, 코스피, 장단기금리차\n동행종합지수 : 건설기성액, 서비스업생산지수, 소매판매액지수, 내수출하지수, 수입액, 비농림어업취업자수, 광공업생산지수\n후행종합지수 : 생산자제품재고지수, 소비자물가지수변화율, 소비재수입액, 취업자수, CP유통수익률\n(1) 경기동향지수(DI : Diffusion Index)\n경기동향지수(경기확산지수)는 경기종합지수와는 달리 경기변동의 진폭이나 속도는 측정하지 않고 변화방향만을 파악하는 것으로서 경기의 국면 및 전환점을 식별하기 위한 지표로서 경기확산지수(diffusion index)라고도 한다. 경기동향지수는 경기변동이 경제의 특정부문으로부터 전체 경제로 확산, 파급되는 과정을 경제부문을 대표하는 각 지표들을 통하여 파악하기 위한 지표이다. 이때 경제지표 간의 연관관계는 고려하지 않고 변동 방향만을 종합하여 지수로 만든다. 경기종합지수와 같이 선행 · 동행 · 후행지수로 작성되며, 계절변동과 불규칙 요인이 제거된 전체 계열\n중에서 전월에 비해 증가한 지표수가 차지하는 비중으로 나타낸다. 예컨대 10개의 대표 계열 중 7개의 지표가 증가하는 방향으로 움직였다면 경기확산지수는 70%로 나타낸다. 만약 경기동향지수가 기준선인 50보다 크면 경기는 확장국면에, 50보다 작으면 수축국면에 있는 것으로 판단한다.\n(2) 경기종합지수(CI : Composite Index)\n경기종합지수는 줄여서 CI라는 용어를 사용한다. 이 지수가 어떻게 변하는지에 따라 경기의 흐름을 읽을 수 있게 되는데, CI는 선행, 동행, 후행 3가지로 분류가 되고 여러 가지 경제지표들 중에서 경기와 가장 밀접한 관계가 있는 것들을 모아 지수로 종합한 것이다. CI는 매월 발표되는데, 이 지수가 전월보다 상승하면 경기가 확장되고 있는 것이고 반대로 전월보다 하락하면 경기가 축소되고 있다고 생각할 수 있다."}, {"no": 5, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 통화지표별 포괄범위로 잘못 연결된 것은?", "extra": [], "choices": ["요구불예금, MMDA = M1", "CD, RP, CMA, 금융채 = M2", "만기 2년 이상 금융채 및 예적금, 표지어음, 기업어음 = Lf", "Lf + 정부 및 기업 등이 발행한 유동성 상품 = L"], "answer": 3, "explain": "기업어음은 L에 속한다. 그리고 표지어음은 M2에 속하며, 예금자보호대상이다.\n• 기업어음(CP)이란 신용상태가 양호한 기업이 상거래와 관계없이 단기자금을 조달하기 위하여 자기신용을 바탕으로 발행하는 만기가 1년 이내인 융통어음이다. 표지어음은 무역거래 등의 기초자산을 재원으로 발행하지만 융통어음은 기초자산 없이 발행자의 신용으로만 발행한다.\n• 표지어음이란 은행이 기업으로부터 상업어음이나 무역어음을 할인 · 매입한 뒤 이 어음들을 재원으로(← 이를 기초자산으로 하여) 은행 등 발행금융회사의 명의로 약속어음을 발행하여 고객에게 매출하는 어음상품이다.\n※ 통화지표별 포괄범위\nM1 : 현금통화 + 요구불예금 + 수시입출식 저축성예금\nM2 : M1 + 기간물 정기예금 + 시장형 상품(CD, RP, CMA, 표지어음 등) + 실적배당형 상품 + 금융채 + 기타(투신증권저축 및 종금금융회사 발행어음) / 단, 유동성이 낮은 만기 2년 이상의 금융상품 제외\nLf : M2 + M2 포함 금융상품 중 만기 2년 이상 정기예금 및 금융채 + 한국증권금융 예수금 + 생명보험회사의 보험계약준비금 등\nL : Lf + 정부 및 기업 등이 발행한 유동성 시장금융상품(국채, 지방채, 회사채, 기업어음, 자산유동화증권 등)"}, {"no": 6, "subject": "증권분석 및 증권시장", "detail": "경기분석", "stem": "다음 중 기업경기실사지수(BSI)에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["경기에 대한 기업가들의 판단, 예측 및 계획 등이 단기적인 경기변동에 중요한 영향을 미친다는 경험적인 사실에 바탕을 두고 설문지를 통해 조사하여 지수화한 것이다.", "전체응답자 100명, 긍정적 응답자 70명, 부정적 응답자 30명일 경우 BSI 지수는 140이다.", "BSI 지수가 100을 초과하면 경기확장국면을 의미한다.", "BSI 지수가 전월 40에서 금월 90으로 상승하였다면 경기가 하강국면에 있지만 그 에너지가 좋아져서 조만간 경기가 상승 전환할 것으로 예상된다."], "answer": 4, "explain": "BSI 지수는 경기진폭의 속도(에너지)를 측정할 수 없다. 즉 40이든 90이든 100 미만이므로 경기하강국면(또는 수축국면)에 있다는 의미는 동일하다.\nBSI는 (0 ≤ BSI ≤ 200)이며, BSI가 100을 초과하여야만 경기상승(확장)국면으로 해석한다."}, {"no": 7, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "재무비율 중 기업의 안정성을 나타내는 부채비율로 올바른 것은?", "extra": [], "choices": ["타인자본/자기자본 × 100", "고정부채/총자본 × 100", "유동부채/유동자산 × 100", "타인자본/총자본 × 100"], "answer": 1, "explain": "부채비율은 타인자본을 자기자본으로 나눈 값이다. 이 비율을 통해서 기업의 자본구성이 얼마나 건전한지를 파악할 수 있다. 그러나 타인자본의 사용을 늘리면 재무레버리지 효과로 인하여 이득을 볼 수도 있기 때문에 자기자본보다는 타인자본을 더 많이 조달하여 사용하는 경우가 대부분이다.\n(참고) 연중 시험 차시에 따라서는 '이자보상비율'로 교체되어 출제되기도 하므로 기업의 안정성 요소인 이자보상비율 공식 자체를 암기하여야 한다. 이자보상비율(Interest Coverage Ratio)은 기업의 '안정성' 측정을 위한 것으로, 그 공식은 '영업이익/이자비용 × 100'이다. 기업의 영업이익이 지급해야 할 이자비용의 몇 배에 해당하는가를 나타내는 비율로서 이 비율은 높을수록 좋다(공식의 분자는 '당기순이익'이 아님에 유의)."}, {"no": 8, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음 중 PER의 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["PER 계산식에서 분자의 주가자료로 회계연도 마지막 날의 종가를 사용하거나 이익발표 직전 일정기간의 주가평균을 사용하는 방법이 있는데, 후자의 방법이 분모인 주당순이익의 정보내용을 좀 더 적절히 반영시킨다고 할 수 있다.", "주가수익비율이 높다면 주당순이익은 평균수준인데 주가가 높아서인 경우와, 주가는 평균수준인데 주당순이익이 너무 낮은 경우의 두 가지로 볼 수 있다.", "PER은 기업 수익력의 성장성, 위험, 회계처리방법 등 질적인 측면이 총체적으로 반영된 지표이다.", "산업평균 PER을 계산할 때 부(−)의 PER은 사실상 주가손실비율이므로 시장의 기대로서 정보가치가 없어 제외시킨다."], "answer": 4, "explain": "산업평균 PER을 계산할 때 부(-)의 PER 기업도 포함시키는 것이 미래이익에 대한 시장의 기대로서 정보가치가 있다.\n※ PER이 높은 두 가지 경우\n(1) EPS가 평균인데 주가가 높을 경우 → 성장성이 높아서 고PER로 평가받음\n(2) 주가가 평균인데 EPS가 낮을 경우 → 내재가치가 낮으므로 바람직하지 못함"}, {"no": 9, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "A주식회사가 지난 해 500원의 배당을 하였다. 향후에도 이익의 30%를 배당으로 지급할 예정이다. 이 기업의 자기자본이익률이 10%이고 요구수익률이 13%라면 이 기업의 주식가치는? (근사값)", "extra": [], "choices": ["8,916원", "17,166원", "17,833원", "18,833원"], "answer": 1, "explain": "주가(P) = D(1+g)/(k-g) (D : 배당액, g : 배당성장률, k : 요구수익률)\n에서 g = 유보율* × ROE = 0.7 × 0.1 = 0.07\n따라서 (500 × 1.07)/(0.13 - 0.07) ≒ 8,916원\n(*유보율 = 1 - 배당률)"}, {"no": 10, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "다음 중 주가현금흐름비율(PCR)에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["주가를 1주당 현금흐름으로 나눈 것을 말한다.", "현금흐름은 당기순이익에 현금지출을 수반하지 않는 감가상각비, 외환 및 유가증권 평가차손 등을 가산해야 한다.", "PER이 높은 경우에 PCR이 낮으면 현재 주가는 고평가되어 있다고 볼 수 있다.", "PER이 낮은 경우에 PCR이 높으면 현재 주가는 저평가되었다고 볼 수 없다."], "answer": 3, "explain": "PER이 높은 경우에도 PCR이 낮으면 현재 주가는 저평가되어 있다고 볼 수 있다. 왜냐하면, 재무제표의 손익계산서상 당기순이익은 발생주의 회계상 명목 순이익이기 때문에 현금흐름이 좋은 경우 실제 현금유입액은 당기순이익보다 더 클 수 있다(즉 PCR비율이 낮아진다). 이 경우 회사의 주가는 적어도 고평가라고는 볼 수 없다."}, {"no": 11, "subject": "증권분석 및 증권시장", "detail": "기본적 분석", "stem": "투자자의 요구수익률이 10%, 자기자본이익률(ROE)이 10%일 때, 고든의 PER모형에 의한 PER은 얼마인가?", "extra": [], "choices": ["10배", "15배", "20배", "30배"], "answer": 1, "explain": "고든의 PER모형상 PER은 (1-f)/(k-g)이므로\n(f : 유보율, k : 요구수익률, g : 배당성장률), 이해와 같이 풀이한다\n('(1-f)'는 분자, 분모에 공통으로 존재하므로 약분 가능).\n→ PER = (1-f)/(k-g) = (1-f)/(k - f × ROE)\n(∵ g = f × ROE)\n→ PER = (1-f)/(0.10 - f × 0.10)\n= (1-f)/(0.10(1-f)) = 1/0.10\n∴ PER = 10배"}, {"no": 12, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "다음 중 엘리어트 파동에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["상승 5파동 중에서 3번 파동이 가장 길다.", "일반적으로 거래량이 가장 많이 나타나는 것은 5번 파동이다.", "4번 파동의 저점은 1번 파동의 고점보다 낮을 수 없다.", "b파동은 상승국면에서 가지고 있던 매수 포지션을 정리할 마지막 단계이다."], "answer": 2, "explain": "일반적으로 거래량이 가장 많이 나타나는 것은 3번 파동이다.\n• 하나의 파동은 상승 5파와 하락 3파로 구성되어 있으며, 충격파동(1-3-5-a-c)과 조정파동(2-4-b)으로 구분된다. 충격파동(조정파동)은 다시 5개(3개)의 소파동으로 구성된다. 이 중에서 일반적으로 거래량이 가장 많이 나타나는 것은 3번 파동이다.\n• 3번 파동은 5개의 파동 중에서 가장 강력하고 가장 변동도 활발하게 일어나는 파동으로 5개의 파동 중 가장 긴 것이 일반적(보통 1번 파동 × 1.618)이며 돌파갭이나 계속갭이 가능하다."}, {"no": 13, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "다음은 사케다 전법으로 주가의 움직임을 설명한 것이다. 다음 〈보기〉에 해당하는 것은?", "extra": ["〈보 기〉", "매수, 매도하는 과정에서 휴식을 강조한다. 휴식 행동지시는 상승 시와 하락 시에 각각 나타나는데 휴식기간에 무조건 쉬는 것이 아니고 매도 시점이나 매수 시점을 포착하기 위한 관망자세의 개념이다. 즉, 매매 시점 포착을 의식하면서 적극적인 휴식기간을 갖는 것이다."], "choices": ["삼 공", "적삼병", "섬꼴반전", "삼 법"], "answer": 4, "explain": "삼법에 대한 설명이다.\n사케다 전법은 삼산, 삼천, 삼병(적삼병, 흑삼병), 삼공, 삼법을 말한다. 이 중에서 삼산, 삼천, 삼병(적삼병, 흑삼병), 삼공은 주가 패턴의 해석에 대한 풀이에 해당하며, 삼법은 행동원리를 의미한다.\n② 적삼병은 고점을 높이는 연속적 3개의 강한 양봉이 발생하는 패턴으로, 이 패턴이 바닥권에서 발생한 경우 장기간의 하락추세를 벗어나 상승으로 전환되는 신호로 해석한다. 반면, 흑삼병은 높은 위치에서 저점을 낮추는 3개의 음봉이 연속적으로 발생하는 패턴이다. 이러한 패턴이 나타나면, 매수세에서 매도세로 돌아섬을 의미하여 순간적인 급락세로 돌아설 가능성이 높기 때문에 주의가 필요한 구간이다.\n③ 섬꼴반전(Island Reversal)은 주가가 장기적으로 형성하고 있던 추세 다음에 소멸갭(Exhaustion Gap)이 나타나 횡보 국면이 진행되다가 돌파갭(Break-away Gap)에 의해 상승 또는 하락할 때 나타나는 것을 말한다. 즉, 주가의 추세가 급격히 반전될 때 나타나는 형태로 소멸갭에 이어 돌파갭이 나타나면서 차트상에 섬과 같은 모습이 연출된다. 섬꼴반전이 나타날 경우 추세의 대반전은 거의 확실하다고 볼 수 있을 정도로 강력한 신호가 된다. 돌파갭이 오기 전인 횡보 국면에서 주가들이 마치 육지에서 떨어진 섬 모양 같다고 해서 섬꼴반전이라고 부른다. 이는 매우 신뢰할 수 있는 추세 전환 패턴이다."}, {"no": 14, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "기술적 분석의 보조지표와 관련하여 빈칸에 알맞은 것은?", "extra": ["( )는 단기 이동평균값에서 장기 이동평균값을 뺀 차이를 막대그래프(히스토그램)형태로 나타내어 현재 주가의 움직임이 어떻게 진행되고 있는가를 판단하기 위한 추세분석기법이다."], "choices": ["MAO(Moving Average Oscillator)", "RSI(Relative Strength Index)", "Stochastics", "VR(Volume Ratio)"], "answer": 1, "explain": "MAO(Moving Average Oscillator : 이동평균오실레이터)를 말한다. 오실레이터란 기술적 분석에서 '괴리 또는 차이'를 의미한다. 오실레이터기법은 다양하게 사용되지만 여기서는 장 · 단기 이동평균선의 괴리를 나타내는 MAO를 의미한다.\n(1) 정의 : 단기 이동평균값에서 장기 이동평균값을 뺀 차이를 막대그래프상에 나타내어 현재 주가의 움직임이 어떻게 진행되고 있는가를 판단하기 위한 추세분석기법이다.\n(2) 계산\nMAO = 단기 이동평균값(6일) - 장기 이동평균값(25일)을 주로 사용한다.\n(비교) '단기 이동평균선 - 장기 이동평균선' 값을 막대그래프(histogram)로 표시한 것이 MAO이며 선(Line)으로 표시한 것이 MACD이다. MAO는 막대의 움직임 자체로 매매신호를 얻으며, MACD는 MACD의 이동평균선인 시그널(signal)과의 교차를 통해 매매신호를 얻는다.\n(3) MAO의 설명\n㉠ 일반적으로 상승추세에서는 이동평균선이 정배열되어 주가 \u003e 단기 이동평균선 \u003e 장기 이동평균선의 상태가 되므로 오실레이터는 (+)값을 가지며, 하락추세에서는 이동평균선이 역배열되어 주가 \u003c 단기 이동평균선 \u003c 장기 이동평균선의 상태가 되므로 오실레이터 값은 (-)값을 가질 것이다. MAO의 값이 (+)이면 현재 주가가 상승추세에 있고, (-)이면 하락추세에 있음을 나타낸다.\n㉡ 양전환 시 매수신호, 음전환 시 매도신호가 된다.\n• 양전환 : MAO가 (-)에서 0선(기준선)을 상향돌파(골든크로스)하여 (+)로 전환하는 것을 말함\n• 음전환 : MAO가 (+)에서 0선(기준선)을 하향돌파(데드크로스)하여 (-)로 전환하는 것을 말함"}, {"no": 15, "subject": "증권분석 및 증권시장", "detail": "기술적 분석", "stem": "기술적 분석의 패턴분석 중 반전형에 속하는 것은?", "extra": [], "choices": ["깃대형", "다이아몬드형", "V자 모형", "쐐기형"], "answer": 3, "explain": "V자 모형은 반전형이며, 나머지(깃대형, 다이아몬드형, 쐐기형)는 모두 지속형에 속한다.\n반전형 패턴\n• 헤드 앤 쇼울더형(H\u0026S형)\n• 역 헤드 앤 쇼울더형(Reverse H\u0026S형)\n• 원형천정형 / 원형바닥형\n• V자형(바닥 V자, 천정 V자)\n• 확대형\n지속형 패턴\n• 삼각형(대칭, 직각)\n• 직사각형\n• 깃대형\n• 쐐기형\n• 다이아몬드형\n[주: p28(문항 16~19)은 이 사진 묶음에 포함되어 있지 않음]"}, {"no": 16, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 중 주권상장법인에 대한 자본시장법 특례에 관한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["주권상장법인은 유상증자 시 반드시 수요예측 과정을 거쳐야 한다.", "비상장법인은 주식배당을 할 때 이익배당총액의 1/2을 초과하지 못하나, 상장법인은 이익배당총액에 상당하는 금액까지 할 수 있다.", "상장주식은 대주주 등을 제외하고 주식양도에 따른 양도소득세를 부과하지 않고 있기 때문에 상장을 위해 모집하거나 유가증권시장을 통해 양도하는 경우에는 양도소득세가 면제된다.", "비상장법인의 주주총회 소집통지는 주주총회일 2주 전에 각 주주에게 서면으로 하게 되어 있으나, 상장법인의 주주총회 소집통지는 의결권 있는 발행주식총수의 1% 이하를 소유하는 주주에 대해 정관이 정하는 바에 따라 주주총회일 2주 전에 2개 이상의 일간신문에 각각 2회 이상 공고하거나 금융감독원 또는 한국거래소가 운용하는 전자공시시스템을 통해 공고함으로써 이를 갈음할 수 있다."], "answer": 1, "explain": "상장법인은 정관이 정하는 바에 따라 이사회의 결의로서 다양한 방식으로 유상증자가 가능하다.\n※ 자본시장법 제165조의6(주식의 발행 및 배정 등에 관한 특례) 제4항\n④ 신주를 배정하는 경우에는 정관으로 정하는 바에 따라(주주배정방식, 제3자배정방식, 일반공모방식 등) 이사회의 결의로 다음 각 호의 어느 하나에 해당하는 방식으로 신주를 배정하여야 한다.\n1. 신주인수의 청약을 할 기회를 부여하는 자의 유형을 분류하지 아니하고 불특정 다수의 청약자에게 신주를 배정하는 방식\n2. 우리사주조합원에 대하여 신주를 배정하고(20%를 우선적으로 배정) 청약되지 아니한 주식까지 포함하여 불특정 다수인에게 신주인수의 청약을 할 기회를 부여하는 방식\n3. 주주에 대하여 우선적으로 신주인수의 청약을 할 수 있는 기회를 부여하고 청약되지 아니한 주식이 있는 경우 이를 불특정 다수인에게 신주를 배정받을 기회를 부여하는 방식\n4. 투자매매업자 또는 투자중개업자가 인수인 또는 주선인으로서 마련한 수요예측 등 대통령령으로 정하는 합리적인 기준에 따라 특정한 유형의 자에게 신주인수의 청약을 할 수 있는 기회를 부여하는 경우로서 금융위원회가 인정하는 방식"}, {"no": 17, "subject": "증권분석 및 증권시장", "detail": "유가증권시장", "stem": "다음 중 유상증자 공모 발행가격의 할인율 결정방식으로 옳은 것은?", "extra": [], "choices": ["제3자배정증자방식 : 기준주가의 90% 이상", "일반공모방식 : 기준주가의 100%", "주주우선공모방식 : 기준주가의 80% 이상", "정부, 정책금융공사 등의 공모방식 : 기준주가의 70% 이상"], "answer": 1, "explain": es": ["전략적 중장기 전술적 단기", "전략적 단기 전술적 중장기", "전술적 단기 전략적 중장기", "전술적 중장기 전략적 단기"], "answer": 3, "explain": "적극적 투자관리방법을 (전술적) 자산배분전략이라고 하며, 증시가 비효율적인 것을 전제로 하여 과소 또는 과대평가된 증권에 투자하여 일정한 위험 수준에 상응하는 투자수익 이상의 초과수익을 추구하는 (단기)적인 투자관리를 말한다. 반면에 소극적 투자관리방법을 (전략적) 자산배분전략이라고 하며, 증시가 효율적인 것을 전제로 하여 시장평균수준의 투자수익을 얻거나 투자위험을 최소화하려는 (중장기) 투자관리방법이다."}, {"no": 43, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "아래 펀드의 2기간 동안의 산술평균수익률과 기하평균수익률은 각각 얼마인가? (근사값)", "extra": ["\u003c표\u003e", "시점(기간 말) | 펀드자금 증감(원) | 1주당 시장가격(원) | 주당 배당금(원) | 총배당금(원) | 펀드 내 주식 수", "0 | +50,000 | 50,000 | 0 | 0 | 1", "1 | +60,000 | 60,000 | 1,000 | 1,000 | 2", "2 | -160,000 | 80,000 | 750 | 1,500 | 0", "산술평균수익률 기하평균수익률"], "choices": ["22.00% 34.58%", "34.58% 22.00%", "22.00% 28.29%", "28.29% 28.14%"], "answer": 4, "explain": "1기의 수익률 : (1,000 + 60,000)/50,000 - 1 = 22.00%\n2기의 수익률 : (1,500 + 160,000)/120,000 - 1 = 34.58%\n따라서 산술평균수익률은 1/2 × (22.00% + 34.58%) = 28.29%\n기하평균수익률은 √{(1 + 0.22)(1 + 0.3458)} - 1 = 28.14%"}, {"no": 44, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "금액가중수익률과 시간가중수익률에 대한 내용이다. 보기의 내용을 옳게 분류한 것은?", "extra": ["\u003c보기\u003e", "가. 투자자가 실제로 획득한 수익을 투자기간을 고려하여 측정함에 있어 가장 정확하다.", "나. 펀드에 투자한 현금흐름의 현재가치와 펀드에서 발생하는 수익의 현재가치를 일치시키는 할인율이다.", "다. 운용기간 중 각 시점별로 펀드성과와 시장수익률을 비교하기가 용이하다.", "금액가중수익률 시간가중수익률"], "choices": ["가, 나 다", "가 나, 다", "가, 다 나", "나 가, 다"], "answer": 1, "explain": "'가, 나'는 금액가중수익률, '다'는 시간가중수익률이다. 그리고 '나'는 내부수익률(IRR)을 의미하는데 금액가중수익률은 산출방식에서 내부수익률과 같다(이 금액가중수익률은 투자자가 시장상황을 예측하면서 펀드의 매입과 환매를 적절히 반복하면서 본인 스스로 펀드매니저 행동을 하는 것으로 보면 된다).\n※ 시간가중수익률\n(1) 시간가중수익률은 펀드매니저가 통제할 수 없는 투자자금의 (투자자에 의한) 유출입에 따른 수익률 왜곡현상을 해결함으로써 펀드매니저만의 운용능력을 측정할 수 있다. 따라서, 시간가중수익률은 펀드매니저만의 성과측정을 통해 펀드 간 성과비교가 가능하게 한다. 시간가중수익률은 세부기간별 수익률을 기하적으로 연결하는 Daily Valuation Method를 통해 투자자로 인한 중도 현금흐름의 반영을 제거하는데, 이때 계산의 단위기간이 되는 세부기간은 그 기간이 짧을수록 투자자금의 입출금에 따른 수익률 왜곡현상이 감소한다.\n(2) 펀드수익률은 시간가중수익률로 산출한다(← 결론적으로 펀드의 '기준가격'은 '시간가중수익률'을 지수화한 것으로 볼 수 있다)."}, {"no": 45, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "기대수익률 측정 방법을 펀더멘털 분석법에 의할 경우 괄호 안에 들어갈 적절한 용어는?", "extra": ["\u003c보기\u003e", "주식의 기대수익률 = ( ) + 주식시장 위험 프리미엄"], "choices": ["무위험 이자율", "배당수익률", "평균기대수익률", "10년 만기 국고채 수익률"], "answer": 1, "explain": "무위험 이자율이다.\n펀더멘탈 분석법은 과거의 시계열 자료를 토대로 각 자산별 리스크 프리미엄 구조를 반영하는 기법이다. '주식의 기대수익률 = 무위험 이자율 + 주식시장 위험 프리미엄'으로 표시될 수 있다. 예를 들어, 무위험 이자율이 5%이고, 주식시장 위험 프리미엄이 3%라면 주식의 기대수익률은 8%이다. 과거 시계열자료를 이용한다는 점은 추세분석법과 펀더멘탈 분석법이 동일하지만, 추세분석법은 기대수익률 자체를 추정하며, 펀더멘탈 분석법은 '위험 프리미엄만'을 구한다는 점에서 차이가 있다."}, {"no": 46, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "기준지표(벤치마크)의 바람직한 속성이다. 옳은 것으로 연결한 것은?", "extra": ["\u003c보기\u003e", "가. 벤치마크는 평가기간이 시작되기 전에 미리 정해져야 한다.", "나. 실행가능한 투자대안이어야 하며, 적극적인 운용을 하지 않는 경우에 기준지표의 구성종목에 투자하여 보유할 수 있어야 한다.", "다. 일반에게 공개된 정보로부터 계산할 수 있어야 하며, 원하는 기간마다 기준지표 자체의 수익률을 계산할 수 있어야 한다."], "choices": ["가, 나, 다", "나, 다", "가, 다", "가, 나"], "answer": 1, "explain": "모두 옳은 내용이다. '가'는 사전적으로 결정(specified in advance), '나'는 투자가능성(investable)', '다'는 '측정가능성(measurable)'에 해당한다.\n※ 기준지표(Benchmark) 개요\n(1) 기준지표는 사전적으로 정해져야 하며, 사후적으로는 평가의 잣대가 된다.\n(2) 기준지표(벤치마크)의 6가지 속성 : 명확성·투자가능성·측정가능성·적합성·투자의견의 반영·사전적인 결정"}, {"no": 47, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "전략적 자산배분의 실행단계를 옳게 연결한 것은?", "extra": ["\u003c보기\u003e", "가. 자산집단의 선택", "나. 최적자산배분의 구성", "다. 투자자의 투자목적 및 투자제약조건 파악", "라. 자산종류별 기대수익, 위험, 상관관계의 추정"], "choices": ["가 → 나 → 다 → 라", "다 → 라 → 가 → 나", "라 → 다 → 가 → 나", "다 → 가 → 라 → 나"], "answer": 4, "explain": "'다 → 가 → 라 → 나'이다. '투자자성향 파악(다) → 성향에 맞는 자산집단을 선택(가) → 선택한 자산집단에 대한 기대수익률과 위험을 추정(라) → 최적자산배분 구성(나)'이다."}, {"no": 48, "subject": "금융상품 및 직무윤리", "detail": "금융상품분석·투자전략", "stem": "전략적 자산배분을 위한 채권투자 포트폴리오 구성과 거리가 먼 것은?", "extra": [], "choices": ["특수채", "회사채", "정크본드(junk bond)", "콜론(call loan)"], "answer": 4, "explain": "콜론은 채권이 아니다. 정크본드(junk bond)도 수익률이 높으므로 투자자의 성향(high risk, high return)에 따라서 장기적으로 전략적 자산배분에서 일정부분 포함할 수 있다."}, {"no": 49, "subject": "금융상품 및 직무윤리", "detail": "영업실무", "stem": "채권운용전략에 대한 내용이다. 가장 적절하지 않은 것은?", "extra": [], "choices": ["시장이 효율적일 경우는 채권교체전략을 통해 초과수익을 얻을 수 없다.", "채권인덱싱전략은 채권시장 전체의 흐름을 그대로 따르는 포트폴리오를 구성하여 채권시장의 전체 수익률을 달성하려는 전략이며, 채권시장이 효율적이라고 전제한다.", "채권별 보유량을 각 잔존기간마다 동일하게 유지함으로써 시세변동위험을 평준화시키고 수익성도 적정수준을 확보하려는 전략은 사다리형 만기전략이다.", "매수한 장기채를 단기에 매도 후 또다시 장기채 매수를 반복해 나가면서 금리수준이 일정하더라도 이자소득 이외에 매매차익도 동시에 취하는 전략을 숄더효과 전략이라고 한다."], "answer": 4, "explain": "④는 롤링효과(rolling effect)를 말한다.\n※ 채권운용전략(액티브 운용)\n(1) 금리예측전략(듀레이션조절전략)\n· 시장수익률 하락 예상(채권가격 상승 예상)\n→ 수익률극대화전략 → 듀레이션이 큰 채권매수\n· 시장수익률 상승 예상(채권가격 하락 예상)\n→ 손실최소화전략 → 듀레이션이 작은 채권매수\n(2) 채권교체전략 : 시장의 일시적 불균형상태를 이용하여 초과수익을 내고자 하는 전략(시장이 효율적일 때는 불균형상태가 발생하지 않으므로 사용할 수 없는 전략)\n㉠ 시장불균형을 이용한 동종채권 간 교체전략\n㉡ 스프레드를 이용한 이종채권 간 교체전략\n(3) 수익률곡선타기전략\n㉠ 롤링효과(rolling effect) : 금리수준이 일정하더라도 잔존기간이 짧아지면 그만큼 수익률이 하락하여 채권가격이 상승하는데(장기채에서 나타나는 효과), 이를 통해 매매차익을 얻고자 하는 전략이다.\n㉡ 숄더효과 : 수익률하락이 급격한 구간에 있는 채권(중·단기채)에 투자하면 동일기간 동안 장기채에 투자하는 경우보다 수익률하락으로 인한 채권가격상승폭이 더 크게 나타나는 것을 이용하여 매매차익을 얻고자 하는 전략이다.\n(4) 수익률곡선의 형태를 이용한 전략\n㉠ 단기채와 장기채에 비해 '중기채의 수익률이 상대적으로 장·단기채에 비해 더 오를 것으로 예상'될 경우(중기채권가격의 하락) → 나비형 투자전략 or Barbell형 포트폴리오전략(단기채매수·중기채매도·장기채매수)\n㉡ 단기채와 장기채에 비해 '중기채의 수익률이 상대적으로 더 하락할 것으로 예상'될 경우 → '역나비형 투자전략' or Bullet형 포트폴리오전략(단기채매도·중기채매수·장기채매도)\n※ 채권운용전략(패시브 운용)\n(1) 만기보유전략 : 채권을 매입하여 만기까지 보유함으로써 투자시점에서 미리 투자수익을 확정하는 전략\n(2) 사다리형만기전략 : 채권별 보유량을 각 잔존기간마다 동일하게 유지함으로써 시세변동위험을 평준화시키고 수익성도 적정수준을 확보하려는 전략\n(3) 채권면역전략 : 이표채의 경우 투자기간 동안 여러 번의 현금흐름이 발생하여 재투자 시에는 시장금리변동으로 인하여 재투자위험이 발생한다. 따라서 수익률 변동위험을 제거하고 투자목표를 달성하기 위하여 투자기간과 채권포트폴리오의 듀레이션을 일치시킴으로써 수익률상승 시 채권가격하락분과 표면이자에 대한 재투자수익의 증대분을 상호 상쇄시켜 채권투자 종료 시 실현수익률을 목표수익률과 일치시키는 전략이다(수익률변동위험을 완전히 제거할 수는 없다).\n(4) 현금흐름일치전략 : 채권포트폴리오로부터 발생되는 현금유입액이 향후 예상되는 현금유출액을 상회하도록 적절히 채권포트폴리오를 구성함으로써, 부채상환을 보장하고 이자율변동위험을 제거함과 동시에 이를 위한 자금조달비용을 최소화하는 전략이다.\n(5) 채권인덱싱전략 : 채권시장 전체의 흐름을 그대로 따르는 포트폴리오를 구성하여 채권시장 전체의 수익률을 달성하려는 전략이다."}, {"no": 50, "subject": "금융상품 및 직무윤리", "detail": "영업실무", "stem": "다음 중 금융투자회사의 투자권유와 설명의무에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["투자자의 투자경험과 금융투자상품에 대한 지식수준 등 투자자의 이해수준을 고려하여 설명의 정도를 달리할 여 적정한 회수예상가액을 산정하여야 한다.", "금융투자업자가 영위하는 인가업무 또는 등록업무 단위별로 요구되는 자기자본의 합계액을 '필요유지자기자본'이라고 한다.", "신용위험액은 순자본비율을 산출하기 위한 시장위험액의 종류에 속한다.", "순자본비율이 100%에 미달하게 되면 긴급조치가 발동된다."], "answer": 2, "explain": "① 금융투자업자는 매 분기 말 현재 '고정' 이하로 분류된 채권에 대하여 적정한 회수예상가액을 산정하여야 한다.\n③ 신용위험액은 시장위험액과 다른 별도의 위험이다(시장위험·신용위험·운영위험).\n④ 순자본비율이 100%에 미달하게 되면 적기시정조치가 발동된다('순자본비율'요건은 긴급조치사유가 아니다)."}, {"no": 67, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 금융투자업자의 공통영업행위규칙에 대한 설명으로 옳은 것의 개수는?", "extra": ["\u003c보기\u003e", "가. 금융투자업자는 고객과의 이해상충이 발생할 가능성을 낮추는 것이 곤란한 경우에는 준법감시인의 승인을 받고 거래하여야 한다.", "나. 상호규제로서, 증권대상 투자매매업자 및 투자중개업자가 아닌 자는 상호에 한글로 '증권'이란 용어는 사용할 수 없지만 'securities'라는 영어는 상호에 사용할 수 있다.", "다. 준법감시인 및 위험관리책임자의 업무 등 내부통제업무는 제3자가 인가받은 금융투자업자일 경우에도 업무위탁이 금지된다.", "라. 금융투자업자의 외국환업무는 부수업무에 해당한다."], "choices": ["0개", "1개", "2개", "3개"], "answer": 2, "explain": "옳은 것은 1개('다')이다. 준법감시인 및 위험관리책임자(CRO)의 업무 등 내부통제(internal control)업무는 외부에 업무위탁이 금지된다.\n가. 금융투자업자는 고객과 이해상충이 발생할 가능성을 낮추는 것이 곤란한 경우에는 거래를 할 수 없다.\n나. 상호규제로서, 증권대상 투자매매업자 및 투자중개업자가 아닌 자는 상호에 '증권'이란 용어는 물론 'securities'라는 영어도 상호에 사용할 수 없다.\n라. 금융투자업자의 외국환업무는 부수업무가 아닌 '겸영업무'이다. 즉 타법('외국환거래법'이 존재함)에 정하는 것이 있는 업무를 겸할 경우에는 겸영업무이다. 그러나, 예를 들어 집합투자업자(자산운용사)가 전국민을 대상으로 금융지식을 높이기 위해 '금융교육업무'를 영위한다면 '부수업무'에 해당한다."}, {"no": 68, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 금융투자업에 대한 자산건전성 분류에 관한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["대손충당금 적립액이 '정상' 분류자산은 0.5%, '요주의' 분류자산은 2%, '고정' 분류자산은 20%, '회수의문' 분류자산은 75%, '추정손실' 분류자산은 100%의 합계액에 미달되는 경우에는 그 미달액을 대손준비금으로 적립해야 한다.", "정상자산에 속하는 대출채권 중 한국채택국제회계기준(K-IFRS)에 따라 당기손익인식금융자산이나 매도가능금융자산으로 지정하여 공정가치로 평가한 금융자산에 대하여는 대손충당금을 쌓지 않아도 된다.", "금융투자업자는 회수의문과 추정손실로 분류된 채권에 대해서는 조기에 상각을 해야 한다.", "매 분기 말 현재 '요주의' 이하로 분류된 채권에 대해 적정한 회수예상가액을 산정해야 한다."], "answer": 4, "explain": "매 분기 말 현재 '고정' 이하로 분류된 채권에 대해 적정한 회수예상가액을 산정해야 한다.\n· 매 분기마다 보유자산에 대해 '정상-요주의-고정-회수의문-추정손실'의 5단계로 분류해야 하며, 매 분기 말 '고정 이하'로 분류된 채권에 대해 적정한 회수예상가액을 산정해야 한다. 그리고 '회수의문'과 '추정손실'로 분류된 자산은 조기에 상각하여 자산의 건전성을 확보해야 한다."}, {"no": 행사할 수 없다."], "answer": 4, "explain": "5% 보고제도는 장내시장에서의 주식 대량취득에 관한 정보를 신속하게 공시하도록 하여, 기업지배권 시장의 공정경쟁을 유도하는 데 그 목적이 있다. 이 때 보고의무자는 본인과 특별관계자를 합하여 주권상장법인의 주식 등을 5% 이상 보유하게 된 자 또는 보유하고 있는 자를 말한다. 따라서 주식등의 보유 목적을 발행인의 경영권에 영향을 주기 위한 것으로 보고하는 자는 그 보고하여야 할 사유가 발생한 날부터 보고한 날 이후 5일까지 그 발행인의 주식등을 추가로 취득하거나 보유 주식등에 대하여 그 의결권을 행사할 수 없다(냉각기간, Cooling off Period). 이를 위반하여 주식등을 추가로 취득한 자는 그 추가 취득분에 대하여 그 의결권을 행사할 수 없으며, 금융위원회는 6개월 이내의 기간을 정하여 그 추가 취득분의 처분을 명할 수 있다."}, {"no": 74, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 시장질서교란행위에 대한 설명으로 적절하지 않은 것은?", "extra": [], "choices": ["정보이용교란행위와 시세관여교란행위로 나누어진다.", "정보이용교란행위는 2차 이상의 다차 정보수령자의 미공개정보이용, 외부정보이용, 해킹 등 부정한 방법으로 지득한 정보이용 등을 규제한다.", "시세관여교란행위는 매매유인이나 부당이득을 얻을 목적성을 가진 허수성주문 등도 그 대상이 되므로 종전의 시세조종행위 규제보다 그 규제범위가 넓어졌다.", "시장질서교란행위 규제에서는 징역형이 없고, 과징금 부과는 5억원을 한도로 하는 것이 원칙이나, 위반으로 얻은 이익 등의 1.5배가 5억원을 초과하는 경우에는 그 금액 이하의 과징금을 부과할 수 있다."], "answer": 3, "explain": "시세관여교란행위는 비록 매매유인이나 부당이득을 얻을 목적성이 없다고 하더라도 허수성주문도 그 대상이 되므로 종전의 시세조종행위 규제보다 그 규제범위가 넓어졌다.\n1) 정보이용형 교란행위\n가. 내부자 등으로부터 나온 미공개중요정보 또는 미공개정보인 점을 알면서 이를 받거나 전득(轉得)한 자\n나. 자신의 직무와 관련하여 미공개정보를 생산하거나 알게 된 자\n다. 해킹, 절취(竊取), 기망(欺罔), 협박, 그 밖의 부정한 방법으로 정보를 알게 된 자\n라. 나목 또는 다목의 어느 하나에 해당하는 자로부터 나온 정보인 점을 알면서 이를 받거나 전득한 자\n2) 시세관여형 교란행위\n1. 거래 성립 가능성이 희박한 호가를 대량으로 제출하거나 호가를 제출한 후 해당 호가를 반복적으로 정정·취소하여 시세에 부당한 영향을 주거나 줄 우려가 있는 행위\n2. 권리의 이전을 목적으로 하지 아니함에도 불구하고 거짓으로 꾸민 매매를 하여 시세에 부당한 영향을 주거나 줄 우려가 있는 행위\n3. 손익이전 또는 조세회피 목적으로 자기가 매매하는 것과 같은 시기에 그와 같은 가격 또는 약정수치로 타인이 그 상장증권 또는 장내파생상품을 매수할 것을 사전에 그 자와 서로 짠 후 매매를 하여 시세에 부당한 영향을 주거나 영향을 줄 우려가 있는 행위\n4. 풍문을 유포하거나 거짓으로 계책을 꾸미는 등으로 상장증권 또는 장내파생상품의 수요·공급 상황이나 그 가격에 대하여 타인에게 잘못된 판단이나 오해를 유발하거나 상장증권 또는 장내파생상품의 가격을 왜곡할 우려가 있는 행위"}, {"no": 75, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "보기에서 당해 법인의 '미공개 중요정보 이용(내부자거래)의 금지' 규정의 대상이 될 수 있는 자를 모두 묶은 것은?", "extra": ["\u003c보기\u003e", "가. 당해 법인에 대한 법령이나 정책입안자", "나. 당해 법인의 회계감사 업무를 수행하는 회계사", "다. 거래소 상장을 위하여 당해 법인과 계약체결을 교섭 중인 투자매매 및 중개업자"], "choices": ["가, 나", "가, 나, 다", "가, 다", "나, 다"], "answer": 2, "explain": "모두 '준내부자'로서 내부자거래의 규제대상이 될 수 있다. '가(정책입안자)'와 '나(회계사)'는 아래 '준내부자 정의 (1)'에 해당되고, '다(투자매매 및 중개업자)'는 '준내부자 정의 (2)'에 해당된다고 할 수 있다.\n▶ 법령입안자 : 당해 법인과 관련한 법령이나 정책의 수립으로 당해 법인의 증권가격에 영향을 줄 수 있는 법령입안자가 해당 증권을 거래하는 것은 미공개정보 이용(내부자거래)행위로 간주된다.\n※ 준내부자의 정의\n(1) 그 법인에 대하여 법령에 따른 허가·인가·지도·감독, 그 밖의 권한을 가지는 자로서 그 권한을 행사하는 과정에서 미공개중요정보를 알게 된 자\n(2) 그 법인과 계약을 체결하고 있거나 체결을 교섭하고 있는 자로서 그 계약을 체결·교섭 또는 이행하는 과정에서 미공개 중요정보를 알게 된 자"}, {"no": 76, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "증권신고서의 효력발생 등에 대한 설명으로 옳지 않은 것은?", "extra": [], "choices": ["사소한 문구 수정 등의 경미한 사항은 당초의 효력발생일에 영향을 미치지 아니한다.", "효력이 발생한 증권의 발행인은 발행실적 보고서를 금융위에 제출하여야 한다.", "증권신고를 철회하고자 하는 경우 해당 증권의 취득 또는 매수의 청약일 전일까지 철회신고서를 금융위에 제출할 수 있다.", "일괄신고서의 정정신고서는 수리된 날로부터 7일을 경과한 날에 효력이 발생한다."], "answer": 4, "explain": "일괄신고서의 정정신고서는 수리된 날부터 3일이 경과한 날에 그 효력이 발생한다. 다만, 일괄신고서의 정정신고서가 수리된 날부터 3일이 경과한 날이 당초의 일괄신고서의 효력이 발생하는 날보다 먼저 도래하는 경우에는 당초의 일괄신고서의 효력이 발생하는 날에 그 효력이 발생한다. 또한 증권신고의 효력발생은 정부가 그 증권의 가치를 보증하는 효력을 가지지 아니한다."}, {"no": 77, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "금융소비자의 위법계약해지권과 관련하여 빈칸을 옳게 연결한 것은?", "extra": ["\u003c보기\u003e", "금융소비자는 금융소비자보호법 시행령 제38조 제2항에 따라 금융상품의 계약체결일로부터 ( ) 이내이고 위법계약 사실을 안 날로부터 ( ) 이내인 경우에는 해당 위법계약에 대한 해지를 요구할 수 있다. 이 경우 금융상품판매업자는 해지를 요구받은 날로부터 ( ) 이내에 금융소비자에게 수락여부를 통지하여야 한다."], "choices": ["3년, 6개월, 7일", "3년, 1년, 10일", "5년, 6개월, 7일", "5년, 1년, 10일"], "answer": 4, "explain": "'5년, 1년, 10일'이다.\n(1) 동시 충족 요건 : '안 날로부터 1년 \u0026 체결일로부터 5년'의 두 가지 요건을 동시에 충족해야 한다. 즉 해당 계약이 금융상품판매업자의 위법으로 인해 체결된 것을 안 날이 계약체결일로부터 5년이 지난 경우라면 위법계약에 대한 해지권이 인정되지 않는다.\n(2) 금융소비자의 해지를 요구받은 날로부터 10일 이내에 수락여부를 통지하여야 하며, 일정한 경우에는 금융소비자의 요구를 거절할 수 있고 거절의 통지를 한 경우에는 거절사유를 함께 통지하여야 한다.\n· (일반 및 전문)금융소비자의 위법계약해지권에 의해 해지될 경우 금융상품판매업자 등은 원상회복의무는 없다. 즉 해당 계약은 소급하지 아니하고 장래에 대해 계약의 효력이 상실된다. 금융소비자의 해지요구권 등에 따라 해당 계약이 종료된 경우 금융상품판매업자 등은 금융소비자에게 해지 관련 비용(수수료, 위약금 등)을 요구할 수 없다."}, {"no": 78, "subject": "법규 및 세제", "detail": "자본시장 관련 법규", "stem": "다음 중 금융투자업자의 '이해상충의 관리'에 대한 설명으로 옳지 않은 것은?"
